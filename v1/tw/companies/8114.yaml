summary_short: 以POS、自助服務機、嵌入式工業電腦及相關週邊產品取得收入。
summary_long: 振樺電以產業電腦系統及週邊產品為主要收入來源，2025年系統產品占營收84.11%，週邊產品占10.08%，其他業務占5.81%。產品涵蓋無風扇POS、自助服務機，以及單板式與嵌入式電腦機板及系統。集團旗下包括瑞傳科技與KIOSK Information Systems；瑞傳供應輝達GPU加速卡測試設備，集團亦提供亞馬遜線上購物線下退貨相關設備與維運服務。宏碁對振樺電具有經營控制力。近年投資包括瑞傳取得中美萬泰41%股權，以及振樺電公告投資誠拓興業、參與其公開收購科誠案。
