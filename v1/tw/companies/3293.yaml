summary_short: 以網路遊戲授權為主要收入，另經營遊戲APP及商用電子遊戲機。
summary_long: 鈊象主要經營網路遊戲授權、網路遊戲APP及商用電子遊戲機，2026年前八月營收占比分別為74%、24%及2%。公司與Gameloft合作開發狂野飆車－閃電摩托DX，亦與廣州華立科技建立商用遊戲設備合作關係。年報列示宜鼎與群聯供應記憶體，技嘉供應主機板。2024年公司以法拍方式取得五股土地及建物，交易金額為新台幣2,326,000,168元；2026年董事會通過新加坡子公司FALA PTE. LTD提高資本額增資案。
