summary_short: 開發高雄住宅大樓、別墅與店舖，主要靠房地銷售取得營收。
summary_long: 永信建主要開發住宅大樓、別墅與店舖，透過委託營造廠興建及廣告公司銷售，並於交屋後提供保固維修。2025年營收全數來自國內住宅及店舖的出售、出租，其中出售業務接近全部營收。開發區域以高雄為主，住宅產品涵蓋中價位首購及中高價位換屋需求。公司亦有綠建築住宅產品，「澄光」與「水律」獲2024年第十三屆高雄厝綠建築大獎優選。中大開發企業為其持股100%的子公司。
