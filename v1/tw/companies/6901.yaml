summary_short: 從事生技醫療創業投資與企業育成，營收包含投資評價損益。
summary_long: 鑽石投資以生技醫療創業投資及企業育成為主要業務，投資領域涵蓋新藥研發、高階醫療器材、創新醫療服務、醫療通路與農業生技。公司協助被投資企業處理公司治理、技術研發、臨床執行、商業發展及資本市場接軌。營業收入包含已實現與未實現的投資標的評價損益，2026年第二季收入主要來自未實現評價利益。旗下另有鑽石一號投資及鑽石高新投資兩家子公司。
