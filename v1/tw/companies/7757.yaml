summary_short: 以連鎖餐廳經營為主要收入，並經營精釀啤酒與甜點銷售。
summary_long: 金色三麥以連鎖餐廳經營與啤酒製造銷售為主要業務，旗下金色三麥餐廳結合啤酒與創意料理。2026年上半年，餐飲部門外部收入為新台幣1,013,625仟元，啤酒銷售部門為128,201仟元，餐飲為主要營收來源。集團另以微兜提供瓦帕鬆餅與地中海料理，BAC供應蛋糕、餅乾及伴手禮，並於2026年推出三麥茶樓品牌。合併子公司包括全資持有的龍昇釀造，以及持股各55%的睿欣餐飲與柏睿餐飲。
