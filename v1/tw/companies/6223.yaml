summary_short: 主要靠晶圓探針卡及半導體測試設備銷售賺取營收。
summary_long: 旺矽主要銷售晶圓探針卡與半導體測試設備；2025年營收比重分別為72.22%與26.11%。探針卡涵蓋懸臂式、垂直式及MEMS，設備包括光電晶圓與晶粒點測、分選、矽光子晶圓測試及溫度循環測試。2025年法說會客戶頁列有TSMC、NVIDIA、AMD、MediaTek及Broadcom。公司與Lightium及AxiomaticAI合作開發光子元件自動化測試方案。2025年完成ATV收購，2026年完成Focus Microwaves收購，並公告向聯城工業購入湖口土地與廠房。
