summary_short: 經營不動產開發，合併營收以環境工程及污水處理為主，另有旅館業務。
summary_long: 力麒建設從事住宅與商用不動產開發，並推動都市更新，合併業務另涵蓋環境工程、污水處理及觀光旅館。2025年前三季環境工程及污水處理部門對外收入為36.04億元，高於觀光旅館的7.13億元與建設部門的5.93億元。山林水環境工程列入其合併子公司，承擔環工相關業務；旅館相關合併子公司包括力麗酒店及力麗觀光開發，兩者為不同法人，其中股票代號5364對應力麗觀光開發。
