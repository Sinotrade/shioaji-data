summary_short: 以困難學名藥及腫瘤用藥的研發、製造與銷售為核心。
summary_long: 美時以高門檻腫瘤用藥及困難學名藥的開發、製造與商業化為核心，產品組合亦涵蓋品牌藥及生物相似藥。2026年上半年，學名藥占營收76%，品牌藥占20%，生物相似藥占4%。主要藥品包括Lenalidomide、Suboxone、Nintedanib及Enzalutamide學名藥。集團透過韓國子公司Alvogen Korea及美國間接子公司Alvogen, Inc.與Norwich Pharmaceuticals, Inc.拓展藥品業務。
