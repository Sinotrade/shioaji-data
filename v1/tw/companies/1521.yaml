summary_short: 以汽機車燈具製造銷售為主，另有模具、航太與軌道照明產品。
summary_long: 大億主要製造及銷售汽機車燈具與模具，2025年營收中，車燈占89.42%、模具占1.54%、其他占9.04%。汽車燈具包括前燈、後燈與霧燈，技術涵蓋ADB自適應遠光燈，可獨立控制多光束照明；機車燈具則包括前燈及後燈。產品另延伸至航太與軌道領域，航太產品包含搜索燈及夜視改裝套件，軌道產品包括車廂照明與LED顯示器。原全資子公司大億國際投資公司已於2025年9月完成清算。
