summary_short: 透過本公司晶圓代工及子公司嘉晶磊晶材料業務取得營收。
summary_long: 漢磊以半導體製造服務為業務，2025年前三季合併營收分為磊晶晶片、積體電路及其他，其中磊晶晶片金額最大。主要營運子公司嘉晶電子製造及銷售Si、SiC與GaN磊晶材料，本公司則提供雙載子積體電路、高功率場效電晶體、高壓CMOS與功率元件製造。化合物半導體製程涵蓋碳化矽與氮化鎵，碳化矽產品包含第四代平面型MOSFET技術平台，氮化鎵則提供六吋晶圓代工服務。公司另在2024年沿革中揭露氮化鎵產品進入輝達AI供應鏈。
