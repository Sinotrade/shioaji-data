summary_short: 經營功率半導體晶圓代工，並透過子公司嘉晶銷售磊晶晶片。
summary_long: 漢磊以晶圓代工及集團磊晶業務取得營收，2025年合併營收中，磊晶晶片占61.52%、元件及積體電路占36.35%，其他占2.13%。漢磊本體製造功率與類比半導體，提供SiC及GaN晶圓代工，GaN產品亦用於AI伺服器電源與直流轉換。世界先進於2024年認購漢磊24.8億元私募股，雙方合作開發8吋SiC製程與產能。子公司嘉晶於2024年向台灣高技買廠；漢磊於2026年出售部分嘉晶持股後，公告持股為52.8%，嘉晶仍為子公司。公開文件另證實WeEn的SiC代工關係，以及英飛凌部分MOSFET的歷史代工關係。
