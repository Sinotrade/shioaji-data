summary_short: 以鋼板、鋼捲等鋼材銷售、裁剪供料及鋼構加工賺取收入。
summary_long: 新光鋼主要從事鋼材銷售、裁剪加工與供料服務，也提供BOX、BH鋼構及結構鋼管製造與工程承攬。2025年合併產品收入以鋼板45.7%最大，熱軋及鍍鋅鋼板30.3%次之，其餘為不鏽鋼9.4%、特殊鋼板7.2%、型鋼1.6%及加工與其他5.8%。中鋼與中龍是具名鋼材供應來源，世紀鋼官網則將新光鋼列為鋼板供應商。子公司包括前端離岸風電設備製造、新源投資及新澄物流。2025年增購新威光電41%股權後，持股達90%並取得控制力。2026年公告調整彰濱擴廠土地承購價款，該案原於2022年決議。
