summary_short: 群聯銷售NAND Flash控制晶片與儲存模組，營收以快閃記憶體模組為主。
summary_long: 群聯研發及銷售NAND Flash控制晶片與儲存模組，產品涵蓋SSD、eMMC、UFS、SD及USB介面，並提供Pascari企業級SSD與aiDAPTIV+邊緣AI方案。2025年營收以快閃記憶體模組產品為主，占72.41%，控制晶片占19.26%，其餘為積體電路及其他業務。Kioxia與Micron既供應快閃記憶體，也向群聯購買控制晶片；Kingston為控制晶片客戶。群聯與研華整合地端生成式AI平台，並與長佳智能合資設立長聯科技。2025及2026年，群聯另向台英帝國菸草購入竹南土地及不動產，供營運擴充規劃使用。
