summary_short: 開發及銷售電腦周邊、智慧生活產品、風尚配件與智慧移動產品。
summary_long: 倚天酷碁為宏碁旗下子公司，主要開發及銷售電腦周邊與智慧生活產品。2025年智慧裝置產品占營收79.17%，風尚產品占12.36%，智慧移動產品占6.65%，其他占1.82%。電腦周邊包含鍵鼠、耳機及電競桌椅，另有宏碁譯秒聽AI翻譯耳機與智慧戒指。旗下宏碁風尚從事風格時尚產品設計及銷售，產品涵蓋包袋、行李箱與穿戴配件；智慧移動產品則包括ebii電動輔助自行車及電動滑板車。上海與美國子公司從事科技周邊及配件銷售。
