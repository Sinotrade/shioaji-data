summary_short: 以半導體用光罩研發、製造與銷售為本業，另透過子公司經營電子零組件及醫療器材。
summary_long: 台灣光罩主要從事半導體用光罩的研發、製造與銷售，2026年2月公司說明光罩本業約占總營收六成。中階光罩產品已完成客戶驗證，先進封裝領域則已導入核心生產設備，擴充大尺寸光罩產能。依2025年度財報，光聚晶電聯合股份有限公司為最終母公司；子公司包括美祿科技、光鉅控股及昱嘉科技。美祿經營電子零組件與功率元件相關業務，昱嘉從事醫療器材設備製造與銷售。
