summary_short: 以半導體光罩製造銷售為核心，另有晶圓代工服務及其他轉投資事業。
summary_long: 台灣光罩以半導體光罩研發、製造與銷售為核心，2026年2月公司說明光罩本業約占集團營收六成。產品涵蓋55／65奈米製程光罩，並擴充用於2.5D與3D封裝矽中介層的14吋光罩產線。公開具名客戶包括台積電、聯電、世界先進及穩懋；集團另透過美祿提供晶圓代工服務。近三年交易包括認購光環私募股、引進光揚曜投資、以設備投資台灣雷銲，以及出售竹南廠予矽品精密。2026年10月董事會另決議以7.5億日圓內取得TCK全部股權，公告階段為擬收購。
