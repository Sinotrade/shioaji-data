summary_short: 透過子公司製造家飾五金，產品涵蓋櫥櫃、衛浴、窗簾配件與水龍頭。
summary_long: 泰金投資控股透過旗下公司經營家居裝飾五金製造，主要產品包括櫥櫃五金、衛浴掛件、水龍頭及窗簾五金。集團具備模具開發、壓鑄成型與表面處理能力，提供一站式製造服務，並與客戶共同投入產品設計及研發。2025年前三季合併財報將主要產品與服務列為傢俱裝飾五金。集團直接持有製造、銷售及控股子公司，並透過Royal Finishing持有Mira Home，後者屬間接子公司。
