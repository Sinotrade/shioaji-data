summary_short: 以半導體測試設備、客製化產品、工程服務及探針卡與清潔材料取得收入。
summary_long: 漢測以半導體設備與客製化產品、測試設備工程服務，以及探針卡與清潔材料三項業務營運；2026年上半年營收占比分別約52%、25%與23%。公司提供客製化探針卡及製程服務，並供應EasyCool氣冷溫控設備與Laser Cleaner非接觸式清針設備。自主研發的薄膜式探針卡已於2026年進入小量交付，SYMPHONY回焊設備則布局CoWoS相關製程。公司與MJC合作探針卡技術，並與ficonTEC合作CPO晶圓級光電測試設備的製造、系統整合及在地工程服務。
