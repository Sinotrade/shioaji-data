summary_short: 研發、製造及銷售寬頻通訊設備，主要產品為用戶端設備與寬頻中繼設備。
summary_long: 康全電訊主要從事寬頻通訊設備的研發、製造與銷售，產品涵蓋寬頻用戶端設備及寬頻中繼設備。依2026年9月法說會揭露，2026年上半年寬頻用戶端設備占營收58%，寬頻中繼設備占16%，其他產品占26%。主要產品包含GPON與XGS-PON光纖接取方案、具Wi-Fi 6功能的VDSL閘道器、5G固定無線接取設備，以及G.hn電力線與同軸轉接器。依2025年第三季合併財報，母公司為訊舟科技，並在美國、荷蘭及印度設有從事寬頻通訊產品銷售與服務的直接子公司。
