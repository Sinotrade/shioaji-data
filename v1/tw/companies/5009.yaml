summary_short: 製造與銷售特殊合金鋼材，供應航太、能源、軍工及機械模具等用途。
summary_long: 榮剛製造與銷售特殊合金鋼材，產品涵蓋功能型不鏽鋼、工具鋼、高清淨鋼及塑膠模具鋼，具有煉鋼、鍛造、輥軋、熱處理與精整能力。公司於2026年10月表示，航太、能源及軍工業務合計約占營收六成；另供應AI伺服器CDU/CDM液冷模組使用的高清淨不鏽鋼材料。具名報導將波音、空中巴士、賽峰、西門子與GE列為客戶，各關係依來源日期記錄。近年資本交易包括出售VIM廠土地、廠房及設備予精剛、與智冠交換股份，以及認購牧東私募股；牧東更名後為子公司金耘國際。另有柳營精整加工廠、油壓鍛機、熱處理廠及50噸煉鋼爐相關投資決議。
