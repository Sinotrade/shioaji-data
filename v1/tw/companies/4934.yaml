summary_short: 透過子公司銷售隱形眼鏡與碳化矽，並經營太陽能產品及售電。
summary_long: 太極集團營收來自隱形眼鏡、碳化矽、太陽能電池與模組及售電等業務。2025年隱形眼鏡占28.71%，碳化矽占24.17%，售電占17.66%；太陽能電池與模組分別占7.74%及3.23%。隱形眼鏡由子公司永暘光學採購產品並以自有品牌銷售；盛新材料提供碳化矽基板，霆光科技從事電動車充電樁及其模組的設計與製造。太極官網列有PERC與TOPCon太陽能電池及太陽能模組。廣運機械工程為其控制公司。
