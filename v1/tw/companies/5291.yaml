summary_short: 以印刷電路板製造為主，另經營DOSUN自行車燈與電動輔助自行車。
summary_long: 邑昇從事印刷電路板開發與製造，產品包括雙層、多層、HDI及厚銅板，應用於工業電腦、網通、車載、電腦週邊與消費性電子等領域。公司提供量產及小量多樣化生產，並發展符合航太衛星規格的高階PCB，展示應用涵蓋無人機、地面站及用戶終端設備。光電業務生產自行車燈與電動輔助自行車，並經營自有DOSUN品牌。另有子公司邑城建設，從事危老及都市更新重建案開發。
