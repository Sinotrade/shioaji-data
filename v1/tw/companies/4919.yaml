summary_short: 以微控制器、伺服器管理及電池監控等IC銷售為主，兼營晶圓代工。
summary_long: 新唐主要從事積體電路研發、設計與銷售，2025年一般IC、晶圓代工及其他業務分別占營收93%、5%與2%。產品涵蓋微控制器、音訊、BMC、電池監控、MOSFET及影像感測，並以自有六吋晶圓廠提供代工服務。BMC應用於AI伺服器，日本子公司的電池監控晶片亦導入電動車平台。華邦電子為母公司，日本新唐及以色列新唐為旗下子公司。2026年公告日本新唐與Tower重組TPSCo，規劃由日本新唐取得八吋事業完整控制權並支付2,500萬美元，預計2027年交割。
