summary_short: 新唐主要銷售微控制器、伺服器管理與音訊等IC，集團另提供晶圓代工。
summary_long: 新唐科技以半導體IC產品及晶圓代工取得營收，2025年一般IC占93%、晶圓代工占5%、其他占2%。產品涵蓋NuMicro微控制器、Arbel BMC系統級封裝及多麥克風音訊ADC，應用包含機器人控制與AI伺服器管理。集團透過日本子公司提供BBU用電池監控IC、電動車BMIC，以及GaN功率元件的磊晶與全製程製造服務。華邦電子為其母公司，新唐直接及間接控制日本子公司。
