summary_short: 以FILA、Reebok等運動休閒品牌服飾銷售為主，另經營百貨商場。
summary_long: 台南-KY以運動休閒品牌經營為主要業務，並透過集團子公司銷售成衣、鞋類及配件，另經營百貨商場。2025年運動休閒占合併營收97.29%，百貨商場占2.71%。品牌業務方面，子公司斐樂負責FILA品牌設計開發、行銷及銷售，銳步運動代理Reebok，本公司則代理Eddie Bauer品牌設計開發、行銷及銷售。集團子公司另包括台南生活開發、高青時尚、鴻延及高青創意。
