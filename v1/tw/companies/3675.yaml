summary_short: 以二極體、電晶體及功率元件晶圓的製造與銷售為主。
summary_long: 德微以分離式功率半導體為主業，提供整流、蕭特基、TVS、穩壓與橋式二極體，並有MOSFET、電晶體及保護陣列產品。2025年營收中，二極體及電晶體占64.12%，晶圓占33.65%，其他占2.23%。晶圓產品包括閘流體、FRED、蕭特基、TVS與Zener，晶圓廠產品已應用於AI伺服器。公司亦列有碳化矽二極體及GaN HEMT產品。母公司為Diodes Holdings UK Limited，最終母公司為Diodes Incorporated；子公司包括亞昕科技、喜可士與德昕半導體。
