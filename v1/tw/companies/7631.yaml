summary_short: 主要承作高科技廠房廠務供應系統與二次配工程，另提供設備及零組件服務。
summary_long: 聚賢研發主要承作高科技廠房廠務供應系統工程，提供氣體、化學、水、電力與真空等系統二次配管路的規劃、施工、監造及品質檢測。2024年營收中，廠務供應系統工程占97.31%，設備服務占2.69%。設備相關業務包含製程零組件、耗材與輔治具設計開發，並研發大尺寸管路雷射焊接機。公司在日本、新加坡、德國與美國設有子公司，2026年第三季法說會仍列示這四個海外服務據點。
