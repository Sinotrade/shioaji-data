summary_short: 設計與銷售顯示器驅動、電源管理及電子紙等半導體晶片。
summary_long: 天鈺為專業IC設計公司，以顯示器驅動IC為主要營收來源，2024年占營收66.61%；電源管理IC及其他相關半導體分別占11.21%與22.18%。顯示產品包含液晶電視、顯示器及筆電使用的源極、閘極驅動器與時序控制器。電源管理產品涵蓋切換式及線性穩壓、馬達驅動、面板與電子書電源管理IC；其他半導體包括時序控制、電子書顯示驅動及感應器IC。2025年第三季合併法說的Mobile IC產品分類亦包含AMOLED智慧手機相關晶片。重要子公司包括深圳天德鈺；2026年公司宣布馬來西亞子公司辦公室啟用，擴展海外研發據點。
