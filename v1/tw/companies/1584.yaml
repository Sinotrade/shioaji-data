summary_short: 製造與銷售鈦合金、鎳基合金及特殊鋼等合金材料。
summary_long: 精剛主要製造與銷售鈦合金、鎳基合金及特殊型鋼等特殊合金材料，產品應用涵蓋化工、航太、油氣、生醫與能源產業。鈦系列產品包括純鈦及Ti-6Al-4V等材料，供應形式涵蓋鑄錠、圓棒與板材。鎳基系列包括718、625、C276及80A等牌號，提供鑄錠與圓棒，並採用VIM與VAR雙重真空熔煉製程。公司具備鈦合金素材轉質製造、精整處理及成品零件加工能力。台鋼航太科技股份有限公司為其子公司。
