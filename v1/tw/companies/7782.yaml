summary_short: 以香水、香氛洗沐及擴香等品牌商品銷售為主，另提供電商平台與行銷服務。
summary_long: 光速火箭以品牌商品批發零售為主要收入來源，2025年營收占比81.26%，另有電子商務平台服務11.62%、整體網路廣告行銷策略規劃6.60%及其他0.52%。主要產品包括SHARECO香水與香氛洗沐，以及KP記憶香氛的居家擴香。軟體產品包含整合訂單、金物流與客戶管理的一頁商店，以及處理收寄件、印單出貨與簡訊追單的火箭快遞。另持有蘊陽國際37.50%股權，因掌握過半董事席次而將其納入合併子公司。
