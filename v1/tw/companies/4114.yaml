summary_short: 以自製與外購藥品銷售為主，核心技術涵蓋吸入劑、鼻噴劑與特殊劑型。
summary_long: 健喬以自製產品與外購產品銷售為主要收入來源。2025年合併營收中，自製產品占69.52%、外購產品占27.79%，其他占2.69%。集團核心技術平台涵蓋氫氟烷定量噴霧吸入劑、鼻噴劑、發泡錠、性荷爾蒙及顆粒劑。主要子公司包括優良化學製藥、七星化學製藥、瑞安大藥廠、益得生物科技及優良生技醫藥；2026年第二季合併財報亦將人人化學製藥與韓國公司Synmosa Biopharma Korea Limited列為子公司。
