summary_short: 以自製藥品為主，兼營國際藥品代理、經銷及保健產品。
summary_long: 健喬從事利基學名藥、特色品牌藥及新藥之研發、製造與銷售，產品涵蓋呼吸道、心血管與泌尿道。2025年合併營收中，自製產品占69.52%、外購產品占27.79%，其餘占2.69%。集團發展鼻噴劑、發泡製劑、定量噴霧吸入劑、性荷爾蒙與顆粒劑五大製造平台。國際合作包括HP Bidco 2的藥品供應、再鼎台灣六項療法代理，以及Nxera失眠藥八市場授權與供應。2026年取得人人化學99.83%股權，收購範圍包含中壢GMP廠房及軟膏產品藥證。
