summary_short: 以餐飲宴會、飯店客房及經營管理服務取得收入。
summary_long: 雲品國際酒店主要提供國際觀光旅館住宿、餐飲及宴會服務，並有經營管理與技術服務收入。2024年營收以餐飲占49.51%為最大項目，客房占42.34%，經營管理及技術服務占4.76%，其他收入占3.39%。母公司為雲朗觀光股份有限公司；海外直接子公司為FDC Italian Hotels S.R.L.，再透過其持有杭州酒店及餐飲管理公司與義大利不動產管理公司，兩者均為間接子公司。
