summary_short: 以不動產開發及營建業務為主，另有POS與電腦週邊商品銷售。
summary_long: 台鋼建設以不動產開發及營建相關業務為主要營收來源。2025年合併營收中，營建收入占94%，商品銷貨收入占6%，另有少量租賃收入。建設業務涵蓋土地開發、建築規劃、營造、銷售及交屋後服務，公司於2026年度營業計畫中仍以營建事業為主要發展方向。年報列示的電子產品包括POS主機、BOX PC，以及印表機、條碼掃描器、錢櫃等POS週邊設備與替換零件。此外，公司持有宏潤興業100%股權，該子公司的主要營業項目為不動產買賣。
