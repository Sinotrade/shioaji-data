summary_short: 以CAESAR品牌銷售馬桶、面盆、水龍頭等衛浴設備，瓷器類為最大營收來源。
summary_long: 凱撒衛以CAESAR品牌銷售衛浴設備，主要產品涵蓋馬桶、面盆、水龍頭、溫水洗淨便座、浴鏡櫃及浴缸。2025年合併營收以瓷器類45.35%為最大來源，其次為出水類21.55%及電子自動化類12.21%；廚浴櫃類占6.03%、浴缸類占2.16%，其他類占12.70%。旗下越南凱撒衛浴從事衛浴設備與給水銅器製造及銷售，凱昇衛浴從事相關設備銷售，另有子公司POLARC經營油漆產品。
