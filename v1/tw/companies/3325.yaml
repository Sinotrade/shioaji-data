summary_short: 以OEM/ODM製造電腦機殼、水冷散熱模組及飲水淨水設備。
summary_long: 旭品科技以OEM/ODM方式提供電腦機殼、電競機箱、水冷散熱模組與淨水處理設備的生產製造服務。機殼產品包括電腦與伺服器外殼，並提供依客戶需求設計的生產及品質控管服務。水冷產品涵蓋一體式水冷、客製化水冷套件與工業級散熱模組，應用於個人電腦、伺服器、高效能工作站及工業設備。環境淨化產品則包括櫥下飲水機、UV滅菌濾水壺與UV滅菌濾水杯，亦提供OEM/ODM代工服務。
