summary_short: 以成衣貿易、託工製衣及加工服務取得營收。
summary_long: 飛寶企業主要從事成衣貿易與託工製衣，並有加工收入，營運以成衣相關業務為主。2025年度營收組成為託工製衣收入93.60%及加工收入6.40%，其中託工製衣為最大收入來源。公司官網列示的產品包括流行服飾、功能性服飾、無縫服飾及居家服飾，涵蓋不同服飾產品類別。集團另持有史瓦帝尼子公司EST GLOBAL APPAREL ESWATINI (PROPRIETARY) LIMITED全部股權，該子公司從事成衣加工，並納入合併財務報表。
