summary_short: 以醋酸纖維絲束為主，並生產醋酸纖維素、醋酸酐與長絲。
summary_long: 材料-KY以醋酸纖維絲束為主要營收來源，產品大部分用於菸用過濾嘴；2024年絲束占營收90.00%，二醋酸纖維素占9.96%，醋酸酐占0.04%。集團亦製造紡絲級與塑膠級醋酸纖維素，前者可用於紡絲，後者用於眼鏡鏡框及工具手柄。孟玄新材料負責醋酸酐生產，中峰化學生產醋酸纖維素；阿斯泰克（山東）環保纖維生產醋酸纖維長絲，長絲可製成服飾面料。
