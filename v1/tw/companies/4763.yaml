summary_short: 製造銷售濾嘴用醋酸纖維絲束、醋片及相關纖維素材料。
summary_long: 材料-KY主要研發、製造及銷售醋酸纖維素材料，2025年二醋酸纖維絲束與二醋酸纖維素分別占營收86.39%及13.61%。絲束用於香菸濾嘴等過濾材料，醋片可用於眼鏡鏡框與工具手柄。集團透過濟南大自然、中峰化學、孟玄及阿斯泰克等子公司經營絲束、醋片、醋酐與長絲業務。年報列有具名菸草客戶及木漿、醋片供應商。2024年子公司與創耀塑料簽訂合資備忘錄；2026年董事會另通過以現金及新股取得Cerdia上層控股公司全部股權的交易，仍待核准與交割。
