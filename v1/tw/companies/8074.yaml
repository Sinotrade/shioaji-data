summary_short: 製造PCB鑽孔用蓋墊板、電木絕緣板及美耐裝飾板。
summary_long: 鉅橡以PCB鑽孔製程用蓋墊板為主要業務，並供應電木板及美耐板。2026年第二季合併營收中，PCB墊板占59%、電木板占16%、美耐板占20%，其他產品占5%。蓋墊板為電路板加工輔助耗材，亦供應ABF等高階載板鑽孔應用；電木板產品可用於檢驗治具與電氣絕緣。公司直接控制鉅橡維京控股有限公司及鉅莊企業股份有限公司，並透過鉅橡維京控股間接控制昆山鉅橡複合材料有限公司。
