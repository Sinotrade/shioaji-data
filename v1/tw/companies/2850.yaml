summary_short: 經營財產保險，以汽車險為主要保費來源，另提供火災、工程、責任及運輸保險。
summary_long: 新光產物保險以財產保險為主要業務，2025年度簽單保費組成以車險45.50%最高，其次為火險18.88%及工程險16.24%；責任險、水險與傷健險分別占8.60%、5.18%及5.59%。汽車保險涵蓋任意車體、竊盜與責任保障，以及強制汽車責任險。住宅商品提供火災及基本地震保障；工程商品涵蓋營造與安裝工程綜合保險、營建機具及電子設備險。另提供僱主意外責任保險與貨物運輸險，貨物保障涵蓋海上、航空、內陸運輸及郵寄。
