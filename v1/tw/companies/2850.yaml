summary_short: 經營車險、火險、工程險等產物保險，以承保業務收取保費。
summary_long: 新產經營產物保險，業務涵蓋車險、火險、水險、工程險、責任險及傷健險。2025年承保及再保分入保費中，車險占46.32%，為最大險別，火險及工程險分別占18.76%與15.89%。具名再保險往來包括Swiss Re Asia香港分公司與Starr新加坡公司。企業承保案例包括台中新光三越商業火險及公共意外責任險，另承保台新銀行信用卡持卡人的海外旅遊保障。2026年董事會決議以27.6億元向新光人壽處分台北市不動產及相關都更權益，第二季財報仍記載為預計簽約。
