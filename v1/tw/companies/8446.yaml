summary_short: 以流行音樂著作權授權、演藝經紀及音樂產品發行取得收入。
summary_long: 華研國際音樂從事流行音樂錄製與發行、著作權授權，以及藝人、文創圖文作家與專業職人經紀。2025年合併營收中，授權收入占58.3%，為最大收入來源；演藝經紀占41.1%，實體產品占0.6%。其合併子公司包括華研音樂經紀股份有限公司、洗耳恭聽股份有限公司，以及HIM International Music PTE. LTD.與HIM International SDN.BHD.。
