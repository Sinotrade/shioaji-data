summary_short: 製造光碟與電子儲存媒體，並經營顯示器、太陽能及儲能業務。
summary_long: 錸德製造光碟與電子儲存媒體，產品涵蓋CD、DVD、藍光碟片、記憶卡、隨身碟及SSD固態硬碟。2025年報按產品別揭露，光學產品營收占86.77%，其他業務占13.23%。集團旗下錸寶科技研發製造OLED顯示器，安可光電經營PSS圖案化藍寶石基板。能源業務包括太陽能模組及EPC系統建置；集團亦布局大型儲能系統與UPS電池模組，將資料中心電力備援列為產品應用方向。
