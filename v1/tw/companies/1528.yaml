summary_short: 以CNC加工中心、PCB加工設備與板材銷售為主要業務。
summary_long: 恩德以CNC精密加工機械為主要業務，產品涵蓋三軸、四軸與五軸加工中心，應用於木工、金屬與複合材料加工。2025年合併營收中，機械占73.15%，板材占26.85%。電子機械事業部供應PCB成型機與鑽孔機，集團另有內藏式高速主軸、線性馬達及UV數位噴繪機械。智慧化板材生產中心整合自動化加工設備與機械手臂，可執行下料堆棧作業。海外子公司包括恩德德國、恩德美國及澳洲公司。
