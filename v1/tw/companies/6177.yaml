summary_short: 以住宅開發銷售為主，另透過子公司經營營造工程、商場及海外不動產。
summary_long: 達麗主要從事住宅及不動產投資開發，2026年上半年以不動產開發為最大外部營收部門。公司旗下寶信營造承作營建工程，達麗米樂開發則參與商場開發，另有全資子公司定城營造。具名供應實績包括海悅提供建案代銷，以及國產供應達麗建案混凝土，但後者未揭露直接採購方。近三年事件包括共同取得台北市大安區土地及合作興建權利、取得台南歸仁土地，以及與華友聯、海悅共同成立公司參與衛武營捷運聯開。2026年海外子公司DA LI Corridors LLC另向PR CORRIDORS, LLC取得美國亞利桑那州商辦。
