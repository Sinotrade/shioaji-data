summary_short: 主要製造連接器與家電端子，並生產特殊銅材及開發液冷散熱銅材。
summary_long: 建通主要製造連接器、家電插頭端子與特殊新型銅材。2026年上半年，連接器收入約17.34億元，特殊新型銅材製品約6.36億元，連接器為最大收入來源。產品另包括線束連接器與自行開發的環保微無鉛銅材料。特殊銅材涵蓋高導電匯流銅排及異型導體銅材，後者已應用於電子及新能源車市場。公司亦開發AI液冷微通道散熱銅材，於2026年5月產出樣品並陸續送樣。主要間接子公司包括蘇州建通、東莞建通及越南建通。
