summary_short: 承攬機電與環保工程，並提供資源回收廠代營運及機電維護服務。
summary_long: 中宇以機電工程、環保工程，以及資源回收廠代營運與機電維護為主要業務，母公司為中國鋼鐵。2025年機電工程占營收53.04%，環保工程占17.09%，資源回收廠代營運及機電維護占28.48%，其他業務占1.39%。環保工程技術涵蓋水處理與回收，以及煙氣脫硫、脫硝。海外營運透過子公司架構進行，包括越南與印度的營造工程，以及廈門的設備材料進出口業務。
