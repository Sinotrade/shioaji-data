summary_short: 以電源管理用功率MOSFET及功率模組的設計與銷售為主要業務。
summary_long: 尼克森從事電源管理用功率半導體元件與功率模組設計，主要銷售產品為Power MOSFET。2024年度功率金氧半場效電晶體占營業比重99.85%，其他產品占0.15%。官網產品線另涵蓋SiC MOSFET、GaN HEMT及DrMOS，並提供SiC功率模組，涉及碳化矽與氮化鎵功率元件領域。公司亦提出AI資料中心機櫃電源液冷方案，相關文件列有半橋SiC功率模組及其樣品狀態。
