summary_short: 以抗體委託技術服務及藥物授權取得營收，並研發ADC與生物相似藥。
summary_long: 醣聯提供抗體委託開發與製造服務，並研發醣抗原標靶抗體藥物複合體及生物相似藥。2025年營收包含委託技術服務2,736.6萬元與授權收入1,049.5萬元；2026年上半年營收1,395.4萬元全數來自委託技術服務。其CDMO涵蓋細胞株、製程開發及GMP製造。研發管線中，GNX1021處於第一期臨床，GNX201-ADC與GNX203處於臨床前；SPD8為denosumab生物相似藥，第三期試驗已達主要終點。旗下另有全資子公司醣聯投資股份有限公司，從事一般投資。
