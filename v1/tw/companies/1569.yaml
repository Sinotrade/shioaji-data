summary_short: 以筆電、平板電腦金屬機殼及鍵盤金屬支架為主要營收來源。
summary_long: 濱川以金屬沖壓及CNC加工製造資訊與消費性電子產品的機構、外觀零件，並自行開發模具。2025年度營收以筆電及平板電腦金屬機殼為主，占77%；筆電鍵盤金屬支架占15%，其他占8%。既有業務亦包括外科醫療器材與手術器械。2026年度營業計畫列入AI伺服器水冷散熱相關產品，包括分歧管及快接頭，屬公司揭露的產品發展與營運規劃。集團直接或間接持有泰國、馬來西亞、蘇州及重慶等地子公司。
