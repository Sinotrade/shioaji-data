summary_short: 設計製造光纖跳接線、連接器及光通訊元件，並開發矽光子與CPO封裝技術。
summary_long: 上詮從事光纖元件設計、製造及OEM／ODM，產品涵蓋光纖跳接線、連接器、分光器與波長多工元件，並提供光纖元件整合模組。公司開發用於矽光子與CPO的光纖陣列連接器ReLFACon，並投入光纖耦合封裝及封測平台技術，應用於資料中心與AI伺服器高速光互連。上詮與奇景合作開發CPO方案，並與緯穎建立CPO策略合作；中華電信已認定上詮為供應商。2024年上詮引進奇景參與5.22億元私募，2025年董事會另通過於400萬美元額度內設立泰國子公司。
