summary_short: 以證券經紀、自營與承銷為主要收入來源，另提供股務代理服務。
summary_long: 群益金鼎證券以證券經紀、自營與承銷為主要業務，2025年度個體營收比重依序為53%、44%及3%，其中經紀業務占比最高。公司亦提供股務代理服務，大聯大與仲琦科技官網均列其為股務代理或股票過戶機構。2025年與精誠資訊合作，在群益贏家Pro導入AI問問個股分析，並透過群益享樂宇宙與KKBOX、全盈支付、漢堡王、World Gym及燦星旅遊合作提供客戶優惠。主要子公司包括群益期貨、群益國際控股及群益私募股權，香港證券公司則由國際控股持有。2025年董事會通過認購群益期貨現金增資，2026年另公告向富泰建設取得辦公室使用權資產。
