summary_short: 製造銷售PU合成皮與PVC塑膠皮，合併業務另含榔皮產品。
summary_long: 信立主要製造銷售合成皮與塑膠皮，2025年乾式PU合成皮占合併營收52%，榔皮占43%，另有租賃、售電及其他收入。產品包括PVC塑膠皮、防水透濕PU膜及TPU鞋材，其中防水透濕膜具防水透濕與保暖功能，TPU產品應用於運動鞋加工。子公司普大應用材料生產PU合成皮革與真皮貼合產品，其PU皮採天然皮革為基材貼合PU膜。2026年官網另列邁達康網路事業為重要子公司。2025年度合併財報列永捷創新科技為母公司，上曜建設開發為所屬集團的最終控制者。
