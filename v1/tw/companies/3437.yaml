summary_short: 以LED封裝及背光光源產品為主，另有感測元件與車用照明。
summary_long: 榮創能源科技主要從事LED封裝，核心產品為表面黏著型發光二極體，另有Mini LED燈板、感測元件及車用照明。2025年法說會揭露筆電與顯示器、電視、Mini產品營收比重分別為35%、34%、23%，但圖表未標示統計期間。技術路線圖亦列有VCSEL應用，應視為產品開發布局。集團直接持有海外投資控股公司全部股權，並將持股47.33%的榮諭科技納入合併；展晶科技（深圳）則透過海外控股架構間接持有。
