summary_short: 以微生物醱酵技術研製保健食品、機能原料及原料藥，提供客製代工。
summary_long: 生展以菌種與微生物醱酵技術從事保健食品及原料藥研發製造，提供配方設計、打樣、試製及生產的OEM／ODM服務，劑型涵蓋粉劑、顆粒劑、錠劑、膠囊與飲品。2024年合併營收以保健食品81.22%為主，另有寵物保健8.07%、原料藥5.69%、預防醫學2.39%及其他2.63%。產品包含GUARDSPO BC198芽孢乳酸菌、莫匹羅星及Bacosphere藥品級芽孢乳酸菌。依2025年第三季財報，生達化學製藥為最終母公司。
