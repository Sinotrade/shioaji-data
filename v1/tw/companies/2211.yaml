summary_short: 以鋼構製造與吊裝為主，兼營貨櫃修洗及子公司廢棄物處理業務。
summary_long: 長榮鋼主要從事廠房、大樓及橋樑鋼結構製造與吊裝，並提供各式貨櫃修理及清洗服務。鋼構製造據點為新營廠與新竹廠，貨櫃修洗據點為高雄港第七貨櫃中心。2026年上半年，鋼構部門對外收入約57.01億元，高於其他各部門；其餘應報導部門包括欣榮、水美、榮鼎及其他。公司透過欣榮企業、水美工程與榮鼎綠能三家子公司經營廢棄物處理相關業務，其中欣榮與榮鼎亦從事汽電共生，另有從事一般投資業務的子公司明昱投資。
