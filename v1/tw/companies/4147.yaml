summary_short: 開發HIV抗體新藥，透過Trogarzo供貨與授權及生物製劑CDMO服務取得收入。
summary_long: 中裕開發HIV抗體藥物，已商業化產品Trogarzo為CD4標靶HIV-1抑制劑，透過Theratechnologies進行美國及加拿大市場商業化，並由Samsung Biologics提供委託製造。公司另開發長效雙抗體組合TMB-365/380，用於HIV維持治療，以及仍處臨床前研究階段的CD4標靶ADC平台。除自有新藥外，中裕亦提供生物製劑CDMO服務，涵蓋製程開發、分析方法、劑型及cGMP製造。區域通路合作包括友華、五洲藥物、AcedrA及Slim Pharmaceuticals。2025年公司公告董事會通過投資Marigold Therapeutics，擴展ADC開發布局。
