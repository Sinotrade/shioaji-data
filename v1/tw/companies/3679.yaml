summary_short: 以精密塑膠模具、單雙料塑膠射出零組件及加工組裝為主要業務。
summary_long: 新至陞從事精密塑膠模具設計開發與單雙料塑膠射出零組件製造，並提供表面處理及加工組裝。零組件應用涵蓋耳機、音響、穿戴式裝置、平板電腦相關產品，以及汽車內裝外觀件與通訊產品。依2025年度年報，2026年第一季3C塑膠零組件占營收84.08%，其他塑膠零組件占6.63%，模具占9.29%。主要海外生產子公司包括越南新至陞及昆山新至升，從事模具與塑膠製品生產；集團另透過SUN NICE及香港新至陞控股公司持有海外事業。
