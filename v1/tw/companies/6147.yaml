summary_short: 以驅動IC封裝測試、晶圓凸塊製作及捲帶電路基板賺取營收。
summary_long: 頎邦以半導體凸塊製作及封裝測試代工為主要業務；2024年封裝及測試營收比重74.86%，凸塊25.14%。服務涵蓋COF、COG、WLCSP與CP／FT測試，並製造連接顯示面板與驅動晶片的柔性捲帶電路基板。公司提供GaN、SiC相關凸塊製程，2024年報亦列有矽光子封裝凸塊技術研發計畫。奇景公開年報列頎邦為封裝測試服務商，瑞鼎則揭露向頎邦採購Tape。馬來西亞子公司於2025年公告收購Power Portal並簽訂建廠工程契約，頎邦於2026年再核准對該子公司增資。
