summary_short: 以慢性病處方藥銷售為主，合併業務另含疫苗、保健食品與檢測。
summary_long: 東生華的處方藥產品涵蓋心血管、腸胃及中樞神經用藥，包括諾壓、脂瑞妥、諾瑞心寧、摩舒胃清及阿雷彼阿慶，亦有乾眼症藥品Tyrvaya及精準醫療檢測服務。2025年合併營收中，藥品及保健食品占73.79%、疫苗占20.80%、檢測占4.45%、勞務收入占0.96%，以藥品及保健食品為最大收入來源。截至2026年6月底，台灣東洋為其母公司；東生華持有創益生技51.60%及高峰藥品51.00%股權，兩者均納入合併財報。
