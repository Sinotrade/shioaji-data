summary_short: 以鍍鋅、烤漆鋼捲製造銷售為主，另經營鋼結構與天車設備。
summary_long: 燁輝主要生產與銷售鍍鋅及烤漆鋼捲，2026年上半年兩者分別占合併營收40.77%與27.98%，另經營鋼結構與天車設備。具名原料供應商包括中鋼、中鴻、中龍及燁聯，其中燁聯供應電爐煉鋼低碳原料。主要子公司包括燁輝（中國）、鑫陽鋼鐵與燁興。公司於2025年及2026年公告認購燁聯私募，並公告投資義享樂國際、向燁興取得朕豪與朕華股權；2024年與燁聯共同申報的唐榮結合案遭公平會禁止。Panasonic供貨證據為2013年歷史揭露，不能據此認定目前仍持續供貨。
