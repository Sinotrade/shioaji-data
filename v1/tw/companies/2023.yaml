summary_short: 以鍍面及烤漆鋼捲製造銷售為主，兼營鋼結構與天車設備。
summary_long: 燁輝以鍍面及烤漆鋼捲製造與銷售為主要業務。2024年個體營收中，鍍面鋼捲占55.26%、烤漆鋼捲占37.18%；鋼構工程、天車工程與其他收入分別占2.35%、1.05%及4.16%。鍍面產品包括熱浸鍍鋅、鋁鋅及鋅鋁鎂鋼捲，工程事業提供鋼結構與運搬機械、天車設備。主要投資事業包括全資子公司鑫陽鋼鐵及燁輝（中國）；前者經營鋼管製造與銷售，後者為熱浸鍍鋅與烤漆鋼捲生產中心。
