summary_short: 製造石英振盪子與各類石英振盪器，提供頻率控制元件。
summary_long: 泰藝電子製造石英頻率控制元件，產品包括石英振盪子、石英振盪器、壓控石英振盪器（VCXO）、溫度補償石英振盪器（TCXO）及恆溫控制石英振盪器（OCXO）。2024年度合併營收中，石英振盪器占63.47%、石英振盪子占29.65%、其他占6.88%。公司提供資料中心與網路同步所需的高精度晶振，亦有適用5G無線電信設備及無人飛行載具的產品。主要營運子公司涵蓋美國的電子零件製造與銷售，以及南京、深圳的石英相關產品與設備製造。
