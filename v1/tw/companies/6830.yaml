summary_short: 以半導體材料分析、故障分析及矽光子量測服務取得收入。
summary_long: 汎銓主要提供半導體材料分析（MA）與故障分析（FA）服務，材料分析支援晶圓代工、設備與材料業者的先進製程研發。2026年第二季材料分析營收占比為85%至90%，故障分析為10%至15%。公司自行開發MSS HG矽光子量測設備，具備光損量測與漏光定位功能，並可涵蓋CPO測試需求；截至2026年10月，設備已進入客戶試用與驗證階段。主要海外營運子公司包括MSS JAPAN、MSS USA及間接持有的南京泛銓。2024年公告由美國子公司購置加州廠房及土地，2025年至2026年亦有母公司出售設備予海外子公司的集團內交易。
