summary_short: 設計、製造與銷售伺服器機箱、系統平台及儲存設備。
summary_long: 營邦以伺服器機箱、系統平台與儲存設備的設計、製造及銷售為主要業務。2025年營收以伺服器機箱占35.61%最多，系統平台占32.36%，儲存系統占4.33%。主要產品涵蓋伺服器主機板、GPU伺服器、JBOD與JBOF儲存設備，並提供採無泵液冷設計的1U伺服器。公司亦提供AI訓練、推論與資料中心使用的運算及儲存平台，並具備NVIDIA STX架構硬體平台的設計與系統整合能力。年報列示的三家主要子公司中，兩家持股100%，另一家持股51%。
