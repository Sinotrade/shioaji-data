summary_short: 以美式木製寢室家具研發、製造與銷售為主，另經營板材及橡膠木加工。
summary_long: 特昇國際以美式木製寢室家具的研發、製造與銷售為核心，主要由馬來西亞子公司TC營運，產品以五件式寢室家具為主。集團另透過ESK Wood Products經營板材及橡膠木的採購與加工，涵蓋家具成品及原材料業務。2025年度木製家具占營收91.05%，其他業務占8.95%。依2026年4月30日集團組織圖，公司直接持有TC、EHL與Thinker Craft，並間接持有ESK Biomass、ESK Wood Products及TC Home Corporation。
