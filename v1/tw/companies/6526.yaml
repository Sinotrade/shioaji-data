summary_short: 設計與銷售藍牙音訊、衛星定位、固網寬頻及乙太網晶片。
summary_long: 達發為聯發科技子公司，主要透過設計與銷售通訊晶片取得收入；2025年無線及寬頻通訊晶片等占營收99.95%。產品涵蓋AB1595藍牙音訊SoC、GNSS衛星定位、光纖寬頻、乙太網交換器，以及用於資料中心光模組的PAM4 DSP與LDD／TIA方案。公司與聯發科技整合Wi-Fi及XGS-PON平台，也與元太科技合作電子貨架標籤應用。已揭露聯發科技為商品客戶，台積電提供12奈米晶片製造，京元電子提供測試與加工服務。2024年參與九暘私募並取得控制權，另向文生開發取得辦公不動產；2025年投資Gear Radio Limited可轉債並轉換為股權。
