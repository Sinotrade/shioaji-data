summary_short: 主要製造汽車傳動零組件，產品涵蓋變速箱組件、減速齒輪與差速器。
summary_long: 和大工業以車輛傳動零組件為主要業務，產品包含變速箱零組件與總成、電動車減速箱齒輪組、差速器，以及電機與馬達軸。2026年7月法說會列示的產品營收組成為汽車85%、機車4%、其他11%，該圖表未註明統計期間。公司另展示電輔車變速齒輪組與ODM中置電機，以及人形機器人相關的諧波減速器、行星減速器與複合材料，產品範圍涵蓋汽車、電輔車及機器人傳動應用。
