summary_short: 以微控制器IC研發與銷售為主，產品涵蓋I/O、A/D及無刷馬達控制。
summary_long: 應廣科技以微控制器IC為研發核心，產品涵蓋I/O型、A/D型與BLDC型微處理器。依2026年8月法說簡報，2026年第二季A/D型微處理器營收占50%，I/O型占33%，BLDC型占17%，以A/D型為最大來源。公司另設鋰電池充電與觸控微控制器產品線，並自行研發IP、IDE／ICE開發系統與燒錄器。法說簡報列示的產品應用領域亦包括無人機。
