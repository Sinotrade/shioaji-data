summary_short: 設計銷售電源管理、快充與馬達控制IC，並代理電子零組件。
summary_long: 偉詮電為無晶圓廠IC設計公司，業務包含自有晶片研發銷售及電子零組件代理。2025年智慧應用IC占營收34%，電源管理與類比IC及電子元件代銷各占33%。產品包括USB PD快充控制晶片，以及用於伺服器散熱風扇的無刷直流馬達控制方案；液冷相關方案涵蓋水泵、漏液偵測及閥門控制。公司將晶圓製造委由台積電、世界先進生產，並委外進行部分封裝測試。代理業務包含ROHM品牌，另與Transphorm合作推出整合PWM控制器與GaN功率元件的系統級封裝產品。2025年9月完成陞達科技股份轉換，使其成為全資子公司。
