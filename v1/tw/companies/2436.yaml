summary_short: 設計電源管理、USB PD及馬達控制晶片，兼營電子零組件代理。
summary_long: 偉詮電以無晶圓廠模式從事混合訊號IC設計，業務涵蓋電源管理晶片、智慧應用IC及電子零組件代理。USB PD控制器用於充電器、車充、行動電源及手機、筆電等裝置。馬達控制產品包含支援AI伺服器散熱的48V無刷直流馬達控制器，亦提供資料中心伺服器風扇控制方案。其他產品包括環車影像與ADAS處理晶片，以及整合PWM控制器的GaN系統級封裝晶片。公司於2025年完全收購陞達科技，該子公司主要從事馬達驅動與控制晶片。
