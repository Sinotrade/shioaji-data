summary_short: 透過富采光電經營LED磊晶、晶粒、封裝與模組，涵蓋顯示、車用及感測。
summary_long: 富采控股透過旗下富采光電經營LED磊晶、晶粒、封裝與模組，應用涵蓋車用、顯示及感測。晶元光電於2025年10月更名為富采光電，隆達電子於2026年1月併入。2026年第二季營收組成為車用20%、感測13%、專業照明12%、電視背光16%、筆電／顯示器／手機背光14%、顯示看板17%及其他9%。產品包括Mini LED背光、Micro LED晶片，並開發VCSEL、CW-DFB雷射與Micro LED光通訊光源。
