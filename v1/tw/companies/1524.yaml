summary_short: 製造及銷售汽車售後維修用車身零件，另提供零件與模具加工。
summary_long: 耿鼎以汽車售後維修市場的車身零件製造與銷售為主要業務，產品以金屬碰撞件為主，並提供汽車零件及模具加工。2025年度汽車零件收入占98.92%，加工收入占1.08%。主要產品包括葉子板、引擎蓋、車門，以及保險桿、水箱架等零件；葉子板用於保護側面車身，引擎蓋用於保護引擎並吸收撞擊能量，車門則保護車身內機件。依產品及業務性質，屬售後市場零件製造業者，位於汽車產業鏈的零組件中游。
