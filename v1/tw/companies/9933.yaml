summary_short: 以煉油石化、電力、天然氣及高科技設施統包工程服務賺取收入。
summary_long: 中鼎提供工程設計、採購、建造施工、試車及專案管理等統包服務，2025年工程服務占合併營收88.58%。按業主產業區分，煉油石化占47%，高科技、電力及天然氣分別占15%、12%及6%。具名工程客戶包括台塑石化、中油、台電與Vantage Data Centers，並與川崎重工、三菱電力共同承攬工程。台積電南科再生水廠原由中鼎承接投資、設計、興建及營運，相關營業與資產負債於2025年分割至全資子公司源鼎。新鼎及崑鼎亦列入合併子公司。2026年中鼎將開發國際投資全部持股出售予緯來電視網。
