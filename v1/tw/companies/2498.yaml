summary_short: 銷售智慧型手機、VIVE頭戴裝置與AI眼鏡，並提供沉浸式平台及5G專網。
summary_long: 宏達電提供智慧型手機、VIVE虛擬實境頭戴裝置及AI智慧眼鏡，並經營VIVERSE沉浸式內容平台。VIVE Focus Vision可獨立運作或連接電腦；VIVE Eagle整合語音助理、拍攝與翻譯功能；HTC U24 pro則支援5G行動通訊。VIVERSE提供跨裝置虛擬世界的託管、探索與創作功能，並支援WebXR開發。集團另透過子公司REIGN Technology Corporation（G REIGNS）提供REIGN CORE系列5G專網設備，供企業快速部署網路。
