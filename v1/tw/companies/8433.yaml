summary_short: 以流行髮飾、梳子、珠寶與手袋等商品進出口為主，集團亦製造電器用品。
summary_long: 弘帆主要經營流行髮飾、梳子、珠寶及手袋等進出口業務，營收以飾品流行配件為主。年報轉載表列示，2025年飾品流行配件占營收84.53%，租金收入占3.17%，其他占12.30%。集團除商品買賣外，亦透過間接子公司東莞美麗之星電子科技有限公司製造及買賣髮飾與電器用品，越南子公司則從事裝飾品、手工藝品、髮飾及電器電子相關產品製造與買賣。直接子公司包含裝飾品貿易公司及投資控股公司。
