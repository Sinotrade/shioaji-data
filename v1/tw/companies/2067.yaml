summary_short: 以鑄鐵鑄件與加工為主，供應液壓、農業、營建機械及汽車零件。
summary_long: 嘉鋼精密以鑄鐵零件鑄造與加工為主要業務，採OEM方式供應液壓閥、農業機械及營建機械零件，官網亦列有汽車零件產品。製程技術包括砂芯與模具的3D列印，用於縮短開發與模具製作時間。集團子公司包括太倉中佑機械工業、中佑鑄造（唐山）及嘉鋼精密工業（鹽城）；公告另揭露持有中佑精密材料61%與WISHING POND INTERNATION LIMITED全部股權。
