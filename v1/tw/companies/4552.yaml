summary_short: 設計、製造及銷售自有品牌空壓機，以螺桿式產品為主要營收來源。
summary_long: 力達-KY集團從事空氣壓縮機的設計、製造與銷售，產品包括螺桿式、活塞式及渦旋式空壓機，以羅威及力達品牌行銷中國與世界各地。2025年度營收以螺桿式空壓機為主，占59.45%，活塞式占28.45%，渦旋式占3.67%，其他類占8.42%。集團於2025年亦完成單極壓縮永磁變頻螺桿機、高速離心磁懸浮鼓風機及螺桿真空泵等產品研發。
