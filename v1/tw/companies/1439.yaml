summary_short: 以土地開發、廠辦及住宅建築產品為主要業務。
summary_long: 雋揚國際以土地開發建設為主要業務，建築產品涵蓋廠辦與住宅。官網列示的廠辦個案包括新北市中和區「雋揚元創」及臺北市內湖區「國揚洲際」，兩案均列於熱銷鑑賞。住宅作品包括臺南市安南區「翡翠森林」、高雄市前鎮區「微笑時代」及新北市汐止區「忠孝大院」，官網將其列為經典個案。公司架構方面，官網明列漢霖開發實業股份有限公司為雋揚的子公司。
