summary_short: 以貴稀金屬回收精煉、濺鍍靶材及電子材料加工取得收入。
summary_long: 光洋科提供金、銀、鉑、鈀等元素的回收精煉服務，並製造應用於儲存媒體、半導體及顯示器的濺鍍靶材。公司將營收區分為銷售產品所含的貴金屬原料收入，以及扣除貴金屬原料後的VAS加值收入；2026年第一季前者金額高於後者。其他產品包括IC與LED封裝用銲線、晶圓與封裝測試用探針材料，以及半導體設備製程耗材。半導體事業於2025年10月分割予創鉅先進材料；依創鉅2026年6月8日股東資料，光洋科持有其66.84%股權。
