summary_short: 提供基因定序、臨床檢測及合成服務，並銷售生技儀器與試劑耗材。
summary_long: 基龍米克斯提供基因定序、臨床基因檢測及生技儀器與試劑耗材銷售服務。定序業務涵蓋一代、二代與三代平台，提供實驗至生物資訊分析的服務；合成業務包含引子、RNA、全基因與多肽，並延伸至核酸及胜肽的委託開發製造。公司另提供蛋白質體檢測，以及孕前、產前與癌症基因檢測。2025年度合併財報中，基因檢測部門外部收入為5億1,976.9萬元，高於儀器銷售部門的1億8,860.6萬元，新藥研發部門尚無外部收入。
