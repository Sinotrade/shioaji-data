summary_short: 以高科技廠房無塵室及機電空調統包工程賺取工程收入。
summary_long: 巨漢以無塵室及機電空調統包工程為主要收入來源，2025年該項業務占營收100%。服務涵蓋無塵室空調、製程管路、高低壓輸配電、給排水與消防等系統的規劃、設計及施工。已揭露的半導體工程實績包括力積電、京元電子、力成科技與日月光半導體製造；2026年10月簡報另列緯創竹北AI園區及鴻佰自貿園區在建工程。公共工程客戶交通部鐵道局占2025年營收14.70%，法說逐字稿並揭露合晶科技為該年最大客戶。公司也揭露CoPoS建廠專案與資料中心相關廠務需求，所提供的是工程整合服務。
