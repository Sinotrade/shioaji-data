summary_short: 以記憶體IC封裝、測試及模組代工為主要收入來源。
summary_long: 福懋科提供記憶體IC封裝、測試與模組代工，另有LED晶粒代工服務。可核對的2024年產品營收結構為IC封裝測試84%、模組16%，主要收入來自封測。具名客戶包括南亞科、威剛與晶豪科；福懋興業則供應製程及民生用水。公司於2025年說明第五廠先進封裝布局晶圓凸塊與重布線層製程，相關應用包含AI伺服器記憶體模組。2025年至2026年間，公司公告向百總工程、南亞塑膠及愛德萬測試取得廠務或機器設備。
