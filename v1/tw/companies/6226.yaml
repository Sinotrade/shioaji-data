summary_short: 以LED封裝元件、顯示器及光模組銷售為主，另提供功率半導體產品。
summary_long: 光鼎以LED封裝元件及模組的製造、加工與銷售為主，2025年報列示LED元器件及模組產品營收約新臺幣6.09億元，占全年營收100%。主要產品涵蓋LED指示燈、表面黏著型元件、數位顯示器與光模組，位於LED產業的下游封裝階段。公司另布局功率半導體，提供離散式IGBT及IGBT功率模組，並依官網公司簡介於2026年第一季推出SiC MOSFET產品。
