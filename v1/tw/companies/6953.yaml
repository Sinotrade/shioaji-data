summary_short: 製造半導體EUV與高階光罩傳載、清洗、檢查及儲存自動化設備。
summary_long: 家碩科技以半導體微影製程的光罩傳載自動化設備為主要業務，提供EUV與高階光罩的交換、儲存、清洗及檢查方案。產品包括EUV光罩交換儲存設備、光罩清洗機、智慧倉儲系統，以及EUV POD表面與光罩側邊檢查機，另投入PVD真空鍍膜相關設備研發。2025年營收組成為機器設備88.42%、其他11.58%。家登精密工業為其母公司，昇和精技為全資子公司；另設有投資業務子公司Gdauto Equipment Capital Ltd.，截至2025年底尚未完成注資。
