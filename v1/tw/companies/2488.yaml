summary_short: 以OEM／ODM模式設計製造消費性及專業音響，產品包括黑膠唱盤與DJ設備。
summary_long: 漢平以OEM／ODM模式製造一般消費性與專業音響。2025年音訊產品營業比重為98.08%，其他原料、商品雜項等占1.92%。主要產品包括黑膠唱盤音響器材、DJ專業混音器、DJ數位控制器及USB MIDI高解析音頻介面。截至2026年3月底，直接子公司包括漢平(BVI)國際與漢池開發；漢池電子(香港)及漢平電子(深圳)由BVI子公司持有，漢池電子(深圳)則由香港子公司持有。
