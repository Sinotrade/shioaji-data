summary_short: 透過子公司經營連接器、光通訊、天線及電動車充電服務。
summary_long: 連展投控透過旗下連展科技、連訊通信與連騰科技經營連接器、光通訊及無線通訊業務，連接器為集團營收占比最大的業務。連展科技研發、製造連接器與極細同軸纜線；連訊通信開發CPO連接器、MT插芯及高密度光纖陣列，應用涵蓋AI資料中心。連騰科技從事無線通訊與天線研發，曾發表金屬殼5G多天線系統。另透過連展電能經營電動車充電站與停車場建置、營運，集團亦展示低軌衛星通訊、感測及導航定位方案。
