summary_short: 經營眼鏡連鎖通路，銷售鏡架、鏡片、隱形眼鏡及藥水，提供驗光配鏡服務。
summary_long: 寶島科主要經營眼鏡通路，提供鏡架、鏡片、隱形眼鏡及護理藥水銷售與驗光配鏡服務。2025年年報將集團營收全數歸入眼鏡業務，合計新台幣41.29億元，占比100%。截至2026年3月底，直接子公司包括米蘭眼鏡精品企業、寶崴光學、寶安視科技與NEW PATH INTERNATIONAL CO., LTD.，四家均為全資子公司。其中寶安視從事醫療耗材買賣，NEW PATH則為一般投資公司，兩項業務分別由該子公司經營。
