summary_short: 以香水、保養品與專業髮品等美妝生活商品代理銷售為主。
summary_long: 志旭國際以美妝生活商品代理銷售為主要業務，產品涵蓋香水香氛、保養品、髮品及生活用品。2025年度個體營收組成以美妝商品占95.64%為主，其次為儲存媒體2.14%、家電生活週邊1.42%、資訊產業工業材產品0.48%及多媒體商品0.32%。其他產品包括隨身碟、記憶卡、光碟片、SSD硬碟、耳機、行動電源、線材、小家電及背光模組用銀反射板。直接全資子公司包括志旭日本株式會社、冠誌國際有限公司及志旭投資有限公司，並透過冠誌持有上海子公司。
