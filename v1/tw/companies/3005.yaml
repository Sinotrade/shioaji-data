summary_short: 透過子公司銷售Getac強固型電腦、機電產品、汽車機構件及航太扣件。
summary_long: 神基透過子公司經營強固型電腦、機電與能源、綜合機構、汽車機構件及航太扣件。神基科技以Getac品牌提供強固型筆電與平板；漢通科技提供電源及工業顯示器；漢達精密電子（昆山）製造複合材料機殼，汽車事業子公司製造輕金屬壓鑄件，豐達科技生產航太及高階工業扣件。2026年上半年，電子件占合併營收52%、綜合與汽車機構件合計36%、航太扣件12%。神基科技另推出CommandCore無人機地面控制方案。
