summary_short: 以分子束磊晶技術製造磷化銦、砷化鎵等化合物半導體磊晶片。
summary_long: 英特磊透過美國營運子公司，以分子束磊晶技術提供化合物半導體磊晶片製造服務。主要產品包含磷化銦、砷化鎵、銻化鎵、VCSEL及氮化鎵磊晶片，應用涵蓋光通訊、射頻與紅外線偵測。2026年第二季磷化銦營收占48.7%、砷化鎵占24.0%、銻化鎵及勞務占27.0%，其他占0.3%。集團持有美國營運子公司全部股權，並透過該公司持有日本子公司51%及IET-IR子公司40%股權。
