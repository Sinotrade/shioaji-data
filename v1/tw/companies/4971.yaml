summary_short: 透過美國子公司製造化合物半導體磊晶片，以磷化銦產品為最大收入來源。
summary_long: 英特磊透過美國子公司製造及銷售化合物半導體磊晶片，採用分子束磊晶技術提供代工服務。2025年磷化銦磊晶片占營收49.56%，砷化鎵占26.55%，銻化鎵占6.09%，另有其他產品及勞務收入。產品涵蓋光通訊與資料傳輸用VCSEL、PIN、APD磊晶片，以及紅外線感測材料，並提供氮化鎵二次磊晶與MBE機台。基板供應商包括Sumitomo Semiconductor及Freiberger。公司與光紅建聖進行股份交換，雙方技術合作範圍包括雷射磊晶與矽光子CPO方案。
