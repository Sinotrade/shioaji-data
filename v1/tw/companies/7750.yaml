summary_short: 以CNC控制器、伺服驅動器及電機銷售為主，並提供機器人與智慧製造方案。
summary_long: 新代以CNC控制器及伺服產品為主要收入來源，2025年合併營收占比分別為48.45%與46.50%，另有智慧製造產品3.14%。控制器涵蓋車床與車銑複合機應用，伺服產品包含驅動器、電機與編碼器；81RA控制器可控制六關節及SCARA機器人。集團透過聯達智能提供工業機器人、機床聯網及自動化系統整合，正鉑雷射亦為全資子公司。2026年與程泰、亞崴簽署智慧製造合作備忘錄，蘇州子公司則參與華沿機器人的三方合作。近三年另有馬來西亞設廠、土地購置與印度廠辦購置決議，以及蘇州子公司的少數股權投資。
