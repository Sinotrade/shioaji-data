summary_short: 以全戶濾淨設備與濾芯銷售為主，另提供節能照明服務及專業音響產品。
summary_long: 全域以環境淨化系列產品為主要收入來源，2025年營收占99.8%，專業音響系列占0.2%。官網列示的淨水產品包含全戶濾淨設備與專用替換濾芯，音響設備則涵蓋混音器、擴大機及音箱。公司另提供LED照明節能服務，由全域出資協助停車場、社區及廠辦建置節能照明設備，並收取服務費。依2026年第二季財報，康健投資股份有限公司為直接母公司，台耀科技股份有限公司為最終母公司及最終控制者。
