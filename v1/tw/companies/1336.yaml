summary_short: 以精密模具、塑膠射出成型及二次加工，供應電子產品外殼與機構件。
summary_long: 台翰以精密模具設計製造、塑膠零組件射出成型及二次加工為主要業務，供應多功能事務機、印表機與電腦周邊產品所需的塑膠外殼及機構件。加工服務包括噴塗、部品組立、雷雕及超音波熔合。2026年上半年塑膠成型收入為新台幣12億771萬5千元，模具收入為3,989萬2千元。集團透過東莞、越南及菲律賓的間接子公司生產精密模具與塑膠製品；宣德科技為母公司，立訊精密工業為最終母公司。
