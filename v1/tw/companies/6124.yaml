summary_short: 以熱導管、均熱板等散熱元件為主，另經營LED照明。
summary_long: 業強以熱導元件研發製造為主，2025年熱導管業務含熱導板，占合併營收87.29%，LED照明占12.71%。產品涵蓋熱導管、VC熱導板、超薄熱導管與超薄熱導板；VC應用包括伺服器、顯示卡、筆電及手機。公司亦提供用於新能源汽車電池包的四季均溫板，並將AI伺服器熱板列入持續推廣項目。集團透過越南業強、中山偉強、葉縣偉強及平頂山業強等子公司經營熱導元件，另由台灣新照明及晶亮電工經營照明相關產品。
