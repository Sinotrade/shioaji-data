summary_short: 製造PET瓶、瓶蓋等飲料包材，並提供飲料充填代工。
summary_long: 宏全經營飲料食品包材製造及飲料充填代工，產品包括PET瓶、瓶胚、塑蓋、鋁蓋、爪蓋與標籤，並提供OEM及ODM服務。2025年PET瓶、飲料充填與塑蓋分別占合併營收38.29%、28.67%及22.82%。公司取得台灣菸酒公司十年米酒PET瓶整組供應案，公告自2026年起供應瓶身、瓶標及瓶蓋。海外投資方面，2024年透過宏全亞洲控股收購緬甸包裝公司股權；2025年子公司宏全控股決議買回中國控股剩餘3.61%股權，另決議新設全資宏正莫三比克有限公司投資包材生產線。
