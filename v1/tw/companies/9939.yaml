summary_short: 製造飲料包材，提供PET瓶、瓶蓋、標籤及飲料充填代工。
summary_long: 宏全以飲料與食品包裝材料及飲料代工服務為主要業務，產品包括PET寶特瓶與瓶胚、塑蓋、鋁蓋、爪蓋、標籤及熱收縮膜。2025年合併營收組成為包材67.16%、飲料含充填代工28.67%、其他4.17%，以包材為最大來源。飲料服務涵蓋OEM／ODM與貼標商品，另提供HPP冷高壓加工，可生產果汁、思慕昔及茶飲。宏全控股與馬來西亞宏全為直接子公司，泰國宏全及印尼宏全則透過宏全亞洲控股持有。
