summary_short: 以家電零售為主要收入，兼營資通訊商品、修繕與裝置服務。
summary_long: 全國電子以家電與電子商品銷售為主要業務，結合實體通路與自建線上購物，提供安裝、配送及相關服務。2025年度家電類商品占營收90.53%，為最大收入來源；資通訊類及其他商品占8.97%，修繕及裝置收入等占0.50%。公司以會員APP連結線上購物、會員點數、折價券兌換、售後線上報修、保固申請及商品使用說明書等功能，將商品銷售與後續服務整合於線上線下通路。
