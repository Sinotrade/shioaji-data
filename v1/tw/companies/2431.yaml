summary_short: 以電源供應器及顯示器銷售為主，另提供馬達驅動控制產品。
summary_long: 聯昌主要提供交換式電源供應器、顯示器與馬達驅動控制產品。2025年營收中，電源供應器占64.31%、顯示器占27.75%，其他占7.94%。驅動控制產品涵蓋直流無刷馬達、變頻壓縮機及風機應用，並開發供資料中心等場域使用的EC風機與風牆方案。公司另已研發無人機ESC電調，氫能轉換用DC-DC電源已完成驗證並開始量產。旗下子公司包括根茂國際投資、根茂新加坡及間接控制的根茂電子（蘇州）；蘇州子公司已停止工廠生產，改為外包生產管理。
