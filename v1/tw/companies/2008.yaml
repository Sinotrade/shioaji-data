summary_short: 以鍍鋅鋼管、API鋼管等鋼管製造與銷售為主要收入來源。
summary_long: 高興昌以鋼管製造及銷售為主要業務，114年度鋼管占營收91%，產品包括鍍鋅鋼管、黑鋼管、API鋼管、PE包覆管及潛弧焊直縫鋼管。鍍鋅鋼管與黑鋼管用於建築、消防、工程及水利，API鋼管與PE包覆管用於高壓輸油、石化輸送等領域。其餘營收來自物流及流通產品5%，商品為冷軋、熱軋與鍍鋅鋼捲，以及鋅品、膠片等其他產品4%。
