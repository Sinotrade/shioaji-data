summary_short: 設計與銷售專精型DRAM、裸晶記憶體及整合式晶片方案。
summary_long: 鈺創是以記憶體與邏輯晶片設計為核心的無晶圓廠公司，提供專精型DRAM、KGD裸晶及RPC DRAM，產品應用涵蓋消費性電子、網通與微型邊緣裝置。其MemorAiLink平台整合記憶體、控制器與異質整合技術，提供晶片次系統開發服務。集團另透過間接子公司鈺群科技發展USB Type-C高速傳輸方案，並與間接子公司鈺立微電子提供3D感測晶片及機器視覺模組。2025年，鈺創與南亞科技宣布成立AI記憶體設計服務合資公司；後續財報確認集團投資智憶科技新台幣1億元。
