summary_short: 以電子資料交換、資訊專案承包與平台維運提供資訊服務。
summary_long: 關貿網路的主要業務包括電子資料交換、專案承包及設備設施管理，並為財政部提供報稅系統客服。零售資訊服務方面，官方手冊記載全聯電子發票平台及家樂福E-hub流通網的歷史服務案例。通關服務包含自行建置的EZ Way線上委任應用，另曾承作關務署物聯網全時監控建置案。公司也推出AI Family產品系列，涵蓋單據辨識、文件助手、智慧客服與生成式AI，並提供SOC、MDR及端點防護等資安服務。雲端服務已啟用板橋綠能機房，提供桌面雲、儲存雲與微服務解決方案。
