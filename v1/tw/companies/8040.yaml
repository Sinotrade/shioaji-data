summary_short: 研發、設計及銷售乙太網路收發器、交換器與PoE供電控制晶片。
summary_long: 九暘電子以乙太網路通訊IC的研發、設計與銷售為主要業務，產品採委外生產模式。主要產品包括10/100Mbps與Gigabit乙太網路實體層收發器、乙太網路交換器晶片，以及PoE供電端控制器。官網產品涵蓋單埠收發器、多埠交換器及不同埠數的PoE控制器，交換器系列包含結合FE與Gigabit埠的配置。公司官網將達發科技列為母公司；聯發科技財報另揭露，集團已取得九暘控制力，並將其納入合併報表。
