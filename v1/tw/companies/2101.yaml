summary_short: 以輪胎製造與銷售為主，另透過子公司經營世界明珠不動產開發。
summary_long: 南港輪胎以輪胎製造與銷售為主，2025年輪胎業務占合併營收98.11%，營建業務占1.89%。產品包含AS-3EV電動車專用胎，可歸入電動車零組件題材。原料供應方面，年報列出台橡供應人造膠，林園先進材料科技供應碳煙。公司透過全資子公司南榮開發建築推動世界明珠不動產開發；2026年並向南榮租賃取得該案辦公室及停車位使用權。另於2023年與紐柏林建立賽道廣告合作，公開資料記載初始合約至2025年底。
