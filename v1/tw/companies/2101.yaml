summary_short: 製造銷售汽機車輪胎，並由子公司經營不動產開發。
summary_long: 南港輪胎主要製造與銷售汽車、機車輪胎，2025年汽車輪胎占合併營收97.10%，機車輪胎占0.99%，其他輪胎占0.02%，營建業務占1.89%。公司開發AS-3EV電動車專用胎，採高強度胎面設計增加輪胎剛性並降低滾動阻力，可歸入電動車零組件題材。營建業務由全資子公司南榮開發建築經營，其投資興建的世界明珠包括住宅、辦公及商場。
