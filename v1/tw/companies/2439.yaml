summary_short: 以耳機及揚聲器為主要營收來源，另提供麥克風與電池模組。
summary_long: 美律提供耳機、揚聲器與麥克風等電聲產品，耳機涵蓋有線、無線、主動降噪、真無線、頸掛式與遊戲耳機，揚聲器系統包括藍牙、WiFi、攜帶式及派對揚聲器。2026年第二季營收以耳機為主，占69%，揚聲器占23%，其他產品占8%。公司另提供類比與數位MEMS麥克風，並研發電池模組，應用於家庭備援及商用儲能。重要子公司包括美特科技(香港)有限公司、MERRY ELECTRONICS (SINGAPORE) PTE LTD.及Indigo Enterprises Inc.。
