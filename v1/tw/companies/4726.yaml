summary_short: 以生物藥委託開發暨製造服務為主，提供製程開發、GMP生產與無菌充填。
summary_long: 永昕以生物藥委託開發暨製造服務（CDMO）為主，提供可開發性評估、細胞株與製程開發及GMP生產。2025年技術服務收入為新台幣736,962仟元，其他收入3,276仟元。製劑服務包含無菌充填；抗體藥物複合體服務涵蓋抗體、連接子與藥物及偶聯製程的開發製造。技術平台包括NaxLEAP轉座子系統與ExoMX外泌體平台。2025年底合併範圍包含美國子公司Mycenax Biotech USA, LLC。
