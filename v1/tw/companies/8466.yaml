summary_short: 製造與銷售石塑地板，具OEM/ODM代工經驗。
summary_long: 美吉吉-KY以石塑地板製造與銷售為主，具OEM/ODM代工經驗，2025年度石塑地板占營收100%。產品為家用或商用建築及裝潢使用的片狀鋪地材料，採PVC粉與石粉製作基材，再經貼合、PU淋膜及裁切。研發成功紀錄包括SPC地磚與輕量化SPC鎖扣地磚。子公司美喆國際企業股份有限公司從事台灣銷售及SPC地板生產；集團另透過普隆國際(香港)有限公司間接持有東莞美哲塑膠製品有限公司。
