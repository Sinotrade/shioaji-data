summary_short: 以行動與固定通信、手機銷售及企業資通訊整合服務取得收入。
summary_long: 遠傳電信提供行動語音、上網及企業資通訊服務，2025年年報列示電信服務收入占合併營收52%，其他營業收入占48%。公司提供5G企業專網與物聯網連線管理，並與Amazon合作提供AWS雲託管服務，具備微軟CSP及LSP資格，可協助客戶取得Azure等授權。網路設備向Ericsson Taiwan採購，iPhone向Apple Asia採購，聯光通供應光纜，台電採用其智慧電表通訊服務。新世紀資通及全虹為旗下子公司；2026年取得遠通電收控制權，並透過新世紀資通取得思納捷控制權。
