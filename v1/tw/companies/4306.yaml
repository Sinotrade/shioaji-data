summary_short: 以膠帶製造為主要收入來源，另經營包裝材料通路、房產、特用化學及新能源。
summary_long: 炎洲以膠帶製造為主要收入來源，2025年度占合併營收70.5%；其他部門包括包裝材料通路14.4%、房產事業7.9%、特用化學4.2%及新能源3.0%。官網產品涵蓋BOPP包裝膠帶、PVC電工絕緣膠帶與BOPP一般膜，分別用於包裝封箱、配線絕緣及膠帶與包裝薄膜等用途。子公司萬洲化學生產牛皮紙膠帶；年報另列炎洲營建及炎洲旅館為全資持有的轉投資公司。
