summary_short: 製造與銷售鉛酸蓄電池，以不斷電系統用電池為主要收入來源。
summary_long: 廣隆以鉛酸蓄電池的製造與銷售為主要業務，產品涵蓋閥控式密閉鉛酸電池，以及不斷電系統、電動代步車、機車與汽車啟動用電池。2024年銷售組成以不斷電系統用電池65.58%為主，電動代步車14.33%、機車啟動12.05%、汽車啟動2.07%，其他5.97%。公司另提供資料中心與不斷電系統備援用的超高率電池，屬電力備援設備應用。2025年永續報告揭露，利隆(越南)責任有限公司與廣泰(越南)責任有限公司為集團子公司。
