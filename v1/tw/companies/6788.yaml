summary_short: 提供半導體製程微汙染防治設備、氮氣充填設備及RFID物料追蹤系統。
summary_long: 華景電通提供半導體製程用的微汙染防治與物料追蹤設備。產品包括整合Loadport、充氣模組及層流裝置的防治系統，以及結合RFID電子貨架與無人搬運派工的追蹤管理系統。先進材料傳載產品另有用於製程後段與封裝的FOSB氮氣充填設備。公司於2024年法說簡報揭露，配合CoWoS先進封裝開發微汙染防治設備，並具EUV等製程設備安裝經驗。2026年第二季合併財報另列有一般投資、電子通訊零組件及餐飲零售相關子公司。
