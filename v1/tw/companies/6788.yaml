summary_short: 以晶圓製程AMC微污染防治設備為主，另提供RFID整合派工系統。
summary_long: 華景電通以晶圓製程AMC微污染防治設備為主要營收來源，2025年占營收90.63%，RFID整合派工系統占7.83%，其他業務占1.54%。AMC產品整合晶圓卸載、充氣淨化與層流氣簾等模組，協助控制晶圓載具內的濕度與污染；RFID系統則用於物料識別、儲存管理及搬運派工。公司自行刊載的簡介列示台積電、聯電、台灣美光及中芯為客戶，旺宏客戶關係另有具名媒體報導。公司亦揭露配合SoIC、CoWoS先進封裝客戶開發載具微污染防治設備。集團直接或間接持有昆山芯物聯及美國子公司，另持有樂玩實業60%股權。
