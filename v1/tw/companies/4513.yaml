summary_short: 經營房地產開發銷售與CHEVALIER品牌磨床、車床及加工中心機。
summary_long: 福裕同時經營工具機與房地產開發銷售，工具機以CHEVALIER品牌行銷，產品包含一般與CNC磨床、龍門磨床、五軸加工中心機及立式車床。2026年上半年合併房地產收入為774,897仟元，高於商品銷售的546,161仟元，因此依最新營收結構歸類為建設開發。主要子公司CHEVALIER MACHINERY, INC.從事工具機銷售；麟裕國際實業負責不動產代銷，上逸建設從事住宅及大樓開發租售。
