summary_short: 製造銷售內建視覺的協作機器人，提供控制軟體及自動化整合方案。
summary_long: 達明提供內建視覺的協作型機器人、智慧工廠管理軟體與自動化應用解決方案。2024年機器手臂及相關零組件銷售占營收95%，自動化整合方案占5%。TM AI Cobot S系列結合AI視覺，應用涵蓋組裝、檢測、包裝及機台上下料。TMflow提供人工智慧視覺節點，支援手臂應用開發；AI視覺產品提供來料定位、條碼讀取、尺寸量測及視覺檢測。母公司為廣明光電，旗下有香港子公司，以及透過香港公司持有的上海子公司。
