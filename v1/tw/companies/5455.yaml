summary_short: 以新竹縣市住宅及大樓開發銷售為主，另有租賃收入。
summary_long: 昇益開發以住宅及大樓開發租售為主要業務，營運重心位於新竹縣、市。2025年營建房屋收入占營收99.87%，租賃收入占0.13%，收入結構以房屋銷售為主。公司開發的合建分售建案包括新竹縣竹東鎮的星都滙D區與森蘊、新竹市的翡麗琚，以及新竹縣竹北市的御邸。依2026年9月法說資料，星都滙D區已取得使用執照，翡麗琚結構體完成；御邸與森蘊分別完成十二樓及六樓頂板。
