summary_short: 集團以電子零組件加值通路、智慧門鎖與建築系統銷售為主。
summary_long: 華豫寧集團經營電子零組件加值通路及智慧產品，2026年10月改制為維夫拉克控股，台灣零件事業由全資子公司華豫寧科技承接。2025年營收組成為MCU占31.98%、IoT智慧產品28.19%、類比元件17.53%、其他22.30%。零件產品涵蓋微控制器、MPU與FPGA，並提供硬體及韌體設計支援。智慧產品包括WAFERLOCK電子鎖、智慧家庭與建築門禁整合，以及社區、飯店用WAFERGO服務機器人。主要全資子公司另有華砡國際及維夫拉克股份有限公司。
