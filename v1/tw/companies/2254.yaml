summary_short: 以售後改裝用LED車燈為主要收入，另銷售水箱護罩及汽車零組件。
summary_long: 巨鎧精密以汽車售後改裝市場為主要定位，主要產品包括全LED汽車車燈、LED水箱護罩、商用型卡車燈及汽車零組件。車燈產品涵蓋頭燈與尾燈，官網亦販售可搭配的水箱護罩。2025年合併產品收入中，車燈為431,886千元、汽車零組件為43,609千元、水箱護罩為2,262千元，以車燈為最大收入來源。集團另有JBT Inc.、Takomore Inc.、Inetwork Inc.及Moso View Inc.四家全資子公司。
