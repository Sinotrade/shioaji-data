summary_short: 提供汽車分期、企業與消費金融，並透過子公司經營租車及充電服務。
summary_long: 裕融主要提供新車與中古車分期、中古車貸款仲介及租賃金融服務。企業金融由新鑫等子公司承作商用車、設備分期與企業周轉金；裕富數位提供機車及消費性商品分期。格上汽車租賃提供長短期租車、附駕及共享車服務，行將企業為其持股的間接子公司。2026年上半年營收中，營業租賃占30.5%、應收帳款收買利息占19.5%、分期付款銷貨利息占13.7%。裕融的母公司為裕隆汽車製造股份有限公司，並透過子公司裕電俥電提供電動車充電服務。
