summary_short: 以台灣及美國飯店客房住宿為主要收入，另提供餐飲服務。
summary_long: 華園飯店以旅館客房出租為主要業務，另有餐飲及其他收入。2025年度客房收入占99.02%，餐飲收入占0.63%，其他收入占0.35%，營收結構以住宿為核心。集團官網列示台灣華園大飯店草衙館，以及美國北加州與南加州共五間國際品牌飯店；草衙館提供機場、港灣、捷運與賽車等親子主題套房。公司另持有HOLIDAY GARDEN INTERNATIONAL LTD.全部股權，該公司為華園飯店的子公司。
