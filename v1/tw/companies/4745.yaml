summary_short: 透過集團銷售體外診斷試劑耗材，提供供應鏈管理與醫療設備服務。
summary_long: 合富-KY以醫療通路及服務為核心，集團提供體外診斷試劑與耗材的集約化銷售、統一採購、配送及管理服務。旗下合富香港及合富中國為重要子公司，2026年7月公告載明合富中國為持股54%的轉投資公司。醫療設備業務包含引進MRIdian-Linac磁共振引導放射治療系統。子公司合富中國另推出ACME極致賦能方案，整合臨床診療AI輔助、Compass Tower醫院決策分析、邁塔威手術科教研及兩岸醫療互動平台，提供醫院管理與臨床相關服務。
