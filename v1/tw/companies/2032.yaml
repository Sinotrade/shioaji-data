summary_short: 以不鏽鋼板銷售及裁切、分條、表面加工為主要業務。
summary_long: 新鋼主要從事不鏽鋼板、捲的裁剪加工與銷售，並提供鋼捲分條及表面處理服務。2025年度不鏽鋼板占總銷售額99.93%，其他不鏽鋼產品及加工收入占0.07%，營收集中於不鏽鋼板。主要產品及服務也包含花紋止滑板與不鏽鋼鏡面板。公司提供的不鏽鋼材二次加工涵蓋表面加工、分條、切板及裁剪，依官網說明位於不鏽鋼產業中游，業務內容以鋼材加工及供應為核心。
