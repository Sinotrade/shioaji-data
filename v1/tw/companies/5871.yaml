summary_short: 透過子公司經營融資租賃、分期付款及放款，另提供太陽能電廠投資與管理服務。
summary_long: 中租控股透過子公司提供設備融資租賃、分期付款、放款及應收帳款受讓管理服務。2025年融資租賃利息、分期付款銷貨利息及放款利息分別占營收30.0%、22.7%及13.7%。台灣重要子公司為中租迪和，中國大陸重要子公司為仲利國際；仲信資融經營zingala銀角零卡無卡分期服務，旗下品牌並與綠界科技合作支付服務。集團另透過子公司經營太陽能電廠投資與管理，全民電廠所管理的電廠與台電簽訂售電合約。近三年子公司亦公告電業股權投資、處分及商務機購置。
