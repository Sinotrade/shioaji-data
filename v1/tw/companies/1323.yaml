summary_short: 製造塑膠瓶、射出容器與軟管等包材，並提供加工及充填服務。
summary_long: 永裕以塑膠包材製造與銷售為主，產品包括塑膠瓶、射出成形容器及軟管，用於化妝品、清潔用品與藥品包裝。公司另有色母、模具與束帶產品，並提供模具開發、塑膠成形、裝飾加工、包材組裝及內容物充填服務。2025年度合併財報將產品收入分為塑膠製品及其他兩類。集團直接子公司包括YONYU Co., Ltd.、新永裕應用科技材料及威瑪精密化學科技；上海永裕塑膠有限公司與永裕塑膠有限公司則由YONYU Co., Ltd.持有。
