summary_short: 主要製造銷售不銹鋼、電線電纜及鎳原料，並經營鋼材代理。
summary_long: 華新麗華主要製造與銷售不銹鋼材、電線電纜及鎳原料；2025年不銹鋼、電線電纜與資源事業分別占合併營收52%、27.4%及18%。不銹鋼產品包括盤元、冷精棒、鋼捲與無縫鋼管，冷精棒亦供液冷伺服器快接頭材料應用。線纜業務涵蓋電力、通信與產業電纜，台電為具名客戶。資源事業由印尼華新鎳業及旭日金屬布局鎳生鐵、冰鎳生產，並代理進口印尼青山不銹鋼產品。海纜業務透過華新能源電纜系統子公司與NKT合作建置。近年海外投資包括CAS收購Inox及MST，以及Europe與SMP共同投資AML的控股公司。
