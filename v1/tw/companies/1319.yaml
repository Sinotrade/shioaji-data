summary_short: 以汽車售後碰撞維修塑膠件、鈑金件為主，兼營原廠零組件與模具。
summary_long: 東陽主要經營汽車售後維修市場（AM）碰撞零件及原廠委託製造（OEM）業務，2025年兩者約占合併營收75%與25%。產品涵蓋保險桿、水箱護罩、葉子板、引擎蓋、儀表板及模具。AM具名供應關係包括向LKQ供應葉子板；OEM客戶包括台灣裕隆，以及由中國子公司供應的奇瑞汽車、長安福特、廣汽豐田與一汽大眾。Tesla供貨則涉及持股49%、未納入合併報表的長春富維東陽上海分廠。近年交易包括2024年購入七股土地、承租新市土地，以及子公司出售大協西川東陽45%股權。上述供貨關係均依實際營運公司區分。
