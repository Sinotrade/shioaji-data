summary_short: 以鹽產品與包裝水為主要收入，兼售保健食品、保養及清潔產品。
summary_long: 臺鹽主要銷售鹽產品、包裝水、美容保養品、清潔產品與保健食品。2025年鹽產品占合併營收48%，包裝水占33%，兩者合計81%；保健食品、清潔產品及美容保養品分別占6%、5%及4%。其餘營收來自工程及勞務收入與其他產品，各占2%。臺鹽直接持有臺鹽綠能及臺鹽生技薩摩亞兩家子公司全部股權，並透過薩摩亞、香港公司持有廈門進出口公司；後兩家公司屬間接持有的關係企業。
