summary_short: 銷售含金屬廢水電解設備與耗材，並提供再生金屬回收及營運服務。
summary_long: 衛司特銷售含金屬廢水電解設備與耗材，並提供再生金屬回收服務。2025年電解設備與耗材占營收53.24%，再生金屬服務占46.10%。RecoCell系統可將電子製造業含銅廢水回收為純度逾99%的金屬銅，並透過BOO模式提供設備營運服務。其他產品包括PCB電鍍不溶性陽極、萃取前處理及酸性與鹼性蝕刻液循環再生系統；不溶性陽極的應用涵蓋ABF載板。2026年第二季合併子公司包括城鋒科技，其業務為鉛酸電池回收及再生鉛資源化。
