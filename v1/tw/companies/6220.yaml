summary_short: 製造銷售電源線、網路線及連接線組，並經營品牌通路與電子商務。
summary_long: 岳豐科技主要製造銷售電源線、網路線及連接線組。2024年合併營收中，電源線占52.68%、網路線占28.08%、消費性電子產品占15.19%，其他產品占4.05%。集團旗下Monoprice經營品牌電子商務，Prime則經營品牌批發通路，業務涵蓋線材產品與終端銷售。官網產品亦包括機器人及機械手使用的耐彎曲、耐扭轉電纜，以及車載高壓電源線束與訊號線束，應用範圍涵蓋工業自動化及車載設備。
