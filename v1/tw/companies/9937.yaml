summary_short: 以連鎖加油站零售汽柴油，兼營洗車、潤滑油及電動車充電服務。
summary_long: 全國的主要業務為汽柴油零售，2025年95無鉛汽油占營收48.69%，超級柴油占31.92%，92與98無鉛汽油分別占11.81%及5.92%。台塑石化為其油品供應商，2025年占進貨淨額98.97%。油品以外，公司提供洗車及汽機車潤滑油脂零售，並自營全國特急電充電服務，以APP辦理營運、交易結算與行銷。旗下埔祥開發及上員均為經營加油站的子公司。公司於2024年11月核准向全資子公司埔祥開發續租加油站不動產，租期為2025年至2027年，使用權資產金額為新台幣11,707,985元。
