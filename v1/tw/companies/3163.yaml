summary_short: 設計、生產及銷售光通訊元件、光纖連接產品與模組。
summary_long: 波若威從事光通訊元件與模組的設計、生產及銷售，產品分為光波長分合、光能量分合、光能量放大與光纖連接四類。2024年光纖連接產品占營收35.99%，光能量分合占29.70%，光波長分合占28.68%，光能量放大占5.13%。公司另開發CPO用可插拔光纖陣列套件與光纖配線盒，並提供應用於AI資料中心的800G／1.6T光纖跳線與纜線。公司與NVIDIA建立矽光子生態系合作關係，參與光連接器與光纖組件領域。集團包含Browave Holding Inc.、菲律賓子公司及透過控股公司持有的中山子公司。
