summary_short: 生產及代工矽、碳化矽與氮化鎵磊晶晶圓。
summary_long: 嘉晶以磊晶晶片生產與代工為主要業務，2025年磊晶晶片占合併營收100%。產品包括100至200毫米矽磊晶、600至1200V碳化矽磊晶，以及矽基板上的100至600V氮化鎵磊晶。公司亦提供鍺矽光電探測器磊晶代工，應用於矽光子。漢磊科技為其最終母公司，2026年6月底持股52.5%；日本嘉晶電子為全資子公司，從事磊晶矽晶圓買賣。2026年上半年，嘉晶集團對世界先進及漢磊科技均有商品銷售，並向漢磊科技採購商品及勞務。
