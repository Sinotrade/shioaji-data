summary_short: 研發、製造與銷售通訊天線、電感、濾波器及靜電保護元件。
summary_long: 佳邦研發、製造與銷售天線及電子元件，主要產品包括射頻天線、靜電保護元件、射頻電感、電磁干擾濾波器與功率電感。2024年度合併營收中，天線占57.01%、元件占42.99%，以天線為最大收入來源。公司開發5G陣列天線模組，並投入低軌衛星與非地面網路相關天線及射頻技術研發。一體成型功率電感列有AI伺服器、高速運算平台及高速網通等應用。依2024年底財報，華新科技為其最終母公司，Inpaq (BVI) Ltd.及禾邦電子中國、蘇州公司為直接或間接子公司。
