summary_short: 立積以設計及銷售Wi-Fi、行動通訊等射頻前端晶片為主要業務。
summary_long: 立積從事射頻前端晶片的開發、設計與銷售，Wi-Fi產品涵蓋前端模組、功率放大器、低雜訊放大器及開關，應用包括網通設備與手機。2024年合併營收中，Wi-Fi產品占76.72%、無線影音產品占14.43%，其他產品占8.85%。行動通訊產品提供4G／5G手機使用的射頻元件，物聯網產品涵蓋BLE、Zigbee等應用。公司另有無線影音收發晶片及雷達感測產品；2026年第二季法說揭露5.8GHz雷達持續量產出貨，8GHz與10GHz雷達方案已進入量產階段。
