summary_short: 以SYM機車製造銷售、海外品牌代工及現代汽車產銷為主。
summary_long: 三陽工業經營汽機車製造與銷售，機車包含自有SYM品牌及海外品牌代工。2025年集團產品組合中，機車占61.76%、汽車占35.02%，零組件及其他占3.22%。Peugeot與Lambretta為機車代工客戶；汽車業務由現代供應汽車及零件，南陽實業為主要客戶及子公司。海外機車事業包含廈杏摩托與越南製造加工出口控股體系，產品另涵蓋E-Woo電動機車，並與台灣中油合作發展電動機車。近三年重大事件包括亞福增資、五鼎股權投資、合建房地處分及關係人停車位購入；台灣農林則自2025年6月取得控制力後納入合併報表。
