summary_short: 製造與銷售TPU機能性布料、薄膜及醫療、戶外用充氣成品。
summary_long: 八貫企業主要生產TPU機能性布料、薄膜及充氣式成品，產品涵蓋材料與成品組件。皮布料事業群生產機能性皮布料及TPU薄膜，部分貼合布料用於航空逃生滑梯與救生筏；成品組件產品包括醫療等級氣墊床及充氣露營睡墊。依2024年度年報，戶外應用占營收55.96%，為最大來源；救生與醫療分別占16.74%及16.53%，軍事工業占10.77%。上述營收組成按產品應用領域劃分，涵蓋戶外、醫療、救生與軍事工業四類。這些產品包括供後續加工使用的機能性材料，以及醫療與露營用充氣產品。
