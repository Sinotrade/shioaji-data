summary_short: 以工業電腦、嵌入式系統及網通、醫療運算設備為主要業務。
summary_long: 威強電提供工業電腦解決方案，涵蓋網通、邊緣運算與醫療應用。2026年上半年，產業電腦產品占合併營收72%，產業電腦週邊產品及組件占23%，其他占5%。網通產品包括支援AMD EPYC處理器與DDR5記憶體的PUZZLE-7050；醫療應用方面，LPIXEL選用其HTB-210-Q470作為AI內視鏡影像診斷的運算設備。公司亦與Intel聯合展示AMR安全防護方案，並與友上科技合作，將NANO-X100整合至移動式協作機器人。近三年重大投資包括楊梅土地購入，以及桃園新廠營造、機電與消防工程發包。
