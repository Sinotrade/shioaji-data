summary_short: 以記憶體元件為主的電子零件通路商，另有中藥調理飲品業務。
summary_long: 方土昶主要從事電子零件買賣，年報轉載內容將公司定位為電子零件通路商，產品組合以記憶體元件為主。二○二五年度產品組合表列示，記憶體元件占營收98.62%，其他中成藥健康調理飲品占1.38%。依此營收結構，主要業務歸入IC通路，位於半導體產業鏈的通路階段。除電子零件業務外，年報另列仙桃牌品牌經營，發展方向包含恢復中成藥生產及銷售，以及持續研發中藥功能性調理飲品。
