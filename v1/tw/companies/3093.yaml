summary_short: 代理銷售電子製造設備、零件及材料，並提供技術與維修服務。
summary_long: 台灣港建主要代理電子製造設備，業務以印刷電路板為主軸，並涵蓋半導體、SMT電子組裝及光電通訊。2024年電子零件、設備及材料占營收87.92%，勞務與維修占5.12%，佣金占6.96%。主要產品包括高密度飛針測試機、晶圓塗佈與迴焊設備、貼片與光學檢測設備，以及光纖陣列主動式耦合貼裝設備。公司亦提供適用ABF膜加工的載板真空壓膜機，屬於ABF載板設備環節。
