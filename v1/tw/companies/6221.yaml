summary_short: 提供企業網路、系統平台、儲存與資安整合，以及顧問維護服務。
summary_long: 晉泰提供企業資訊系統整合，主要業務涵蓋企業網路整合及資訊管理方案、儲存設備、系統平台、專業顧問及維護服務，以及電子商務安全產品。2025年上述業務營收占比分別為36.44%、23.55%、22.29%、12.75%及4.70%。其服務包括網路與資訊管理整合、資料備份與儲存管理，以及軟硬體建置、維護和資安規劃。公司亦提供雲端資料中心方案。集團直接持有薩摩亞控股、美國及日本子公司，並透過海外控股架構間接持有上海子公司。
