summary_short: 以鞋用及工業接著劑為主要收入，另生產塗料、建材化學品與碳纖維複合材料。
summary_long: 南寶以接著劑為主要營收來源，2026年第一季接著劑占營收68%，塗料與建材占26%，其他占6%。主要產品包括用於運動鞋、休閒鞋及皮鞋的鞋膠，以及封箱包裝與木工封邊用熱熔膠；塗料產品涵蓋建築防水及室內外粉體塗料。電子材料包括紫外線照射前後可改變黏著力的UV解黏膠帶用黏著劑，另有碳纖維預浸布與編織板材。集團子公司包括Nan Pao Overseas Holdings Ltd.、台灣艾富克公司及Nan Pao Materials Vietnam Co., Ltd.。
