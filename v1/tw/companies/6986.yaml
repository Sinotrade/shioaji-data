summary_short: 以細胞委託生產、開發製造及技術授權取得收入，並研發幹細胞新藥。
summary_long: 和迅以細胞與細胞衍生物的委託生產及委託開發製造服務為主要業務。2025年營收中，CMO占58.05%、CDMO占33.71%，技術授權占6.99%，其他占1.25%。公司運用自有產能提供細胞培養、處理及製劑生產，另提供無菌、黴漿菌與內毒素等委託檢驗，以及無菌充填服務。研發產品HeXell-2020為異體臍帶間質幹細胞製劑，用於心血管疾病治療臨床試驗；RegenExo則為臍帶間質幹細胞衍生的純化外泌體。
