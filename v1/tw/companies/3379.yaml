summary_short: 以食品飲料設備銷售及整廠系統工程為主要收入來源。
summary_long: 彬台主要提供食品飲料生產設備及整廠系統工程，產品涵蓋充填、包裝、超高溫殺菌、機器手疊棧與自動開袋設備。2025年合併營收中，銷貨收入占73%、工程收入占26%、勞務收入占1%，以設備銷售為主。公司將自製自動化設備與工程整合結合，並以自行研發的多功能夾具搭配機械手臂，提供機器人疊棧及卸棧設備。集團直接持有薩摩亞子公司，再透過該公司持有蘇州設備子公司；印尼子公司則由彬台與薩摩亞子公司分別持有。
