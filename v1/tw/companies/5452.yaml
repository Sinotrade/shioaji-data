summary_short: 銷售塑膠原料、工程塑膠與環保材料，並提供染色及混鍊造粒加工。
summary_long: 佶優以塑膠材料銷售與加工為主要業務，產品涵蓋ABS、HIPS、工程塑膠、PCR回收材料及PLA生物可分解材料。2025年合併營收中，塑膠粒占70.47%、工程塑膠粒占17.97%、環保材料占10.95%，其他占0.61%。公司提供PC／ABS等工程塑膠及UNIPOLYMER PCR ABS回收材料，另銷售適用於伺服器的單相浸沒式介電冷卻液。集團透過香港、越南、泰國及馬來西亞等子公司經營塑膠原料買賣、製造與染色加工。
