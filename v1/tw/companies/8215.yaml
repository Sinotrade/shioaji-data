summary_short: 以偏光片與機能膜為主要業務，另銷售電池隔離膜及醫療產品。
summary_long: 明基材以偏光片及機能膜的製造與銷售為主要業務，2025年前九月機能膜營收高於醫療產品。顯示器產品包含偏光片與智慧調光膜，後者可藉通電、斷電切換透明及霧面效果。電池材料方面提供耐高溫隔離膜，應用涵蓋電動車及儲能。醫療產品以安適康品牌提供止血、負壓治療、傷口照護與疤痕護理。佳世達為其母公司，2025年年報另列衛普、碩晨與勁捷為子公司。
