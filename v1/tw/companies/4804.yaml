summary_short: 由中國連鎖旅館轉型，透過台灣子公司經營太陽能電站。
summary_long: 大略-KY原以中國大陸連鎖旅館營運為主，2026年9月公告主營業務轉向再生能源。公司持有台灣子公司廣益國際股份有限公司70%股權，並於2026年8月公告，廣益截至同年7月已持有約2MW太陽能電站。原全資子公司上海水蓮天企業發展有限公司於2026年2月6日發生股東異動，公司因而喪失控制力及主要營收來源。原中國旅館業務因此僅列為歷史業務，太陽能電站業務則明確歸屬廣益，不將子公司資產直接表述為母公司持有。
