summary_short: 以行星式減速機研發、製造及銷售為主，另透過全資子公司經營酒店。
summary_long: 台灣精銳主要研發、製造及銷售減速機等機械傳動零組件，減速機以行星式為主，2025年占合併營收74.08%。產品包括適用AGV自動導引車的GV／GVR系列減速機及伺服用零背隙彈性聯軸器，亦具有微型行星減速機技術與客製化量產能力。年報具名客戶上海精銳廣用動力科技有限公司占2025年合併銷貨9.79%；媒體另具名報導亞馬遜物流協作機器人供應鏈關係，但直接採購主體未揭露。公司持有日月千禧酒店全部股權，透過該子公司經營住宿及餐飲，客房及餐飲服務占2025年合併營收18.78%。
