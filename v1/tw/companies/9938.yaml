summary_short: 製造銷售織帶、鞋帶、黏扣帶、鬆緊帶、射出勾與緹花面料。
summary_long: 百和以織帶、鞋帶、黏扣帶、鬆緊帶、射出勾與緹花面料的製造銷售為主要經營業務。2025年度合併財報的產品營收項目包括織帶、經編緹花網布、黏扣帶、鬆緊帶、射出帶、房地產及其他。官網並介紹數位梭織緹花布，於台灣與越南工廠開發量產。百和興業為透過百和國際公司持有的間接子公司；印尼百和與越南百和亦納入合併報表。
