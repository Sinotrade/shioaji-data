summary_short: 研製高速電／光傳輸線與連接器，營收以高速電傳輸線為主。
summary_long: 嘉基主要研發、製造與銷售高速電／光傳輸線及連接器，2025年高速電傳輸線占營收86.06%。產品涵蓋Thunderbolt線材、800G主動式光纖纜線、Slimluster與MCIO機箱內互連，以及光引擎。公司另推出NPC與NPO共用插槽的近封裝互連方案；NPO方案已推進至單通道200G並完成階段性驗證，另有CPO插槽研發布局。嘉澤端子工業為其最終母公司。
