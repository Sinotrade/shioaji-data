summary_short: 以Thunderbolt、USB等高速電傳輸線為主，另供應光纖線材與光學電子零件。
summary_long: 嘉基以高速電傳輸線為主要營收來源，2025年占合併營收86.06%，產品涵蓋Thunderbolt與USB系列；高速光纖通訊傳輸線、光學電子零件及其他收入分別占2.30%、9.81%及1.83%。公司與Intel合作推出Thunderbolt 5主動式高速線，亦提供AI伺服器內部互連線材，並於2026年公告NPC與NPO共用插槽方案。2023年具名報導列Dell、HP及Lenovo為其Thunderbolt線材客戶。2025年底嘉澤為其母公司，子公司包含均英精密、泰國嘉基及間接持有的蘇州嘉基；另於2024年簽約向瑞統科技購入中壢不動產。
