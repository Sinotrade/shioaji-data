summary_short: 銷售半導體與環境氣體監測設備，並提供維運及數據服務。
summary_long: 創控科技以氣體檢測設備銷售與後續維運服務為主要收入來源，2025年兩者分別占營收60.04%及39.96%。核心MiTAP為可攜式微型氣相層析儀，可在現地連續自動監測揮發性有機物。產品另涵蓋FOUP微環境監測系統FMS 2000、酸鹼氣體分析儀MiTAP M3、多點採樣分析系統及室外採樣監測站，應用於半導體污染控管與環境監測。維運業務提供耗材更換、設備保養維修及監測數據品質服務。
