summary_short: 以機能成衣代工為主，另加工羽絨原料及製造家居紡織品。
summary_long: 光隆以戶外機能成衣代工、羽絨原料加工及家居紡織品製造為主要業務，其中成衣為最大營收來源。成衣產品涵蓋滑雪衣、登山外套、無縫防風防雨外套及運動套裝，提供委託製造服務。羽絨業務從事原料精洗生產；家紡業務製造羽絨與羽毛寢具，也涵蓋非羽絨寢具及適用不同氣候溫度的睡袋。公司業務橫跨羽絨原料加工與下游成衣、寢具製造，在紡織產業鏈以成衣製造為主要定位。
