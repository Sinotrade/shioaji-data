summary_short: 以手機相機鏡頭為主，研發、製造及銷售光學元件。
summary_long: 大立光以光學元件研發、製造與銷售為核心，手機相機鏡頭是產銷主力；2025年光學元件占合併營收99.48%。Apple官方名單列其為供應商，LG Innotek的2025年度採購表亦列大立光為鏡頭採購來源。車用與ADAS鏡頭產品由子公司大根光學工業提供。公司官網列有CPO用稜鏡微透鏡陣列及光纖陣列，2026年10月法說會確認FA已通過客戶認證。2026年公告與大陽科技進行股份轉換，規劃納為全資子公司，並向多家企業購置台中土地及廠房；另透過八方國際投資取得Halo Industries股份。
