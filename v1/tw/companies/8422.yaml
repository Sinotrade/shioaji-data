summary_short: 以事業廢棄物固化、掩埋、清運及污染整治為主要收入，兼營發電與再生材料。
summary_long: 可寧衛主要提供事業廢棄物固化、掩埋、清運及污染場址整治服務。依2026年法說會媒體報導，2025年廢棄物處理約占營收58%、開挖專案15%，其餘包括發電12%、造紙9%及混凝土5%。官網固化處理實績列有台積電、中油與台電，另揭露曾承作中油污染場址整治。集團透過上評資源循環經營再生紙、吉鼎材料製造預拌混凝土，大創綠能布局漁電共生太陽能。可寧衛另與台灣人壽合資成立吉信，參與高雄市焚化爐BOT案，並於2026年決議再增資吉信5.5億元。
