summary_short: 以透濕防水布塗佈貼合、PU樹脂、硬化劑及TPU產品取得營收。
summary_long: 雙邦以機能布料塗佈貼合及高分子材料為主要業務，自行生產樹脂供貼合加工使用。2025年塗佈貼合占營收51.27%，硬化劑占20.80%，TPU占12.60%，樹脂占11.03%，光啟始劑占4.30%。主要產品包含透濕防水布、PU樹脂、硬化劑、TPU膜與粒，以及光啟始劑；其中光啟始劑產品明列可用於PCB乾膜與光阻。合併報表另納入從事塗佈製造的才豐科技興業股份有限公司，2026年6月底直接持股44.50%。
