summary_short: 主要從事筆記型電腦設計製造，另經營百腦匯商場租賃業務。
summary_long: 藍天以筆記型電腦研發、設計、生產與銷售為主要業務，產品包括高階電競、商務及創作者應用機種，另開發迷你電腦。2025年度電腦部門銷貨收入占合併營收85%，百腦匯商場租賃及其他營業收入占15%。商務與創作者產品包含V550ENx/KNx/-D系列，迷你電腦包含R100系列。海外子公司分別承接製造基地與商場轉投資業務，其中昆山筆電生產基地透過薩摩亞子公司投資，新加坡子公司則轉投資百腦匯商場。
