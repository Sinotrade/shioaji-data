summary_short: 以客製化筆電設計製造為主，另經營百腦匯商場租賃。
summary_long: 藍天主要從事筆記型電腦設計與製造，聚焦白牌市場，以少量多樣方式提供客製化中高階及電競產品，由台北研發接單、昆山工廠製造出貨。2025年電腦部門占合併營收85%，百腦匯商場租賃及其他收入占15%。旗艦X580／X585系列採用Intel Arrow Lake-HX處理器及NVIDIA GeForce RTX 50系列筆電GPU，記憶體最高可擴充至192GB。生產基地包含子公司凱博電腦（昆山）。除筆電與商場業務外，2025年取得宏匯思源辦公室使用權資產；2026年董事會核准對台北雙星分批增資，上限新台幣50億元。
