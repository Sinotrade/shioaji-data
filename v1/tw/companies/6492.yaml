summary_short: 以小分子抗癌新藥研發為核心，已揭露營收來自技術諮詢勞務。
summary_long: 生華科主要開發小分子抗癌新藥，兩項核心候選藥物為Pidnarulex（CX-5461）與Silmitasertib（CX-4945），前者為G-四鏈體穩定劑，後者為蛋白激酶CK2抑制劑。依2024年度年報，新藥仍在研發階段，尚無商業化生產銷售；當年度營收主要來自提供技術建議及諮詢服務，勞務收入為新台幣100萬元。截至該年報刊印日，公司持有Senhwa Biosciences Corporation百分之百股份。
