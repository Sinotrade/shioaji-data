summary_short: 以畜禽、水產飼料為主，並銷售肉品、加工食品及大宗物資。
summary_long: 大成主要銷售畜禽與水產飼料、肉品、加工食品及大宗物資，其中加工食品包括雞肉與豬肉加工產品。2025年營收比重依序為飼料51.81%、食品21.26%、肉品19.70%及大宗物資7.23%。年報列示的雞肉客戶包括麥當勞、肯德基、21世紀，以及好市多、家樂福、愛買與大潤發。集團於2024年7月收購美國Amy Food的51.5%股權，同年10月再由子公司增資，將持股提高至80%。重要子公司中一食品於2026年9月通過投入20.8億元新建蛋品加工廠的計畫。
