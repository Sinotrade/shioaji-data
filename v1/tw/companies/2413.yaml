summary_short: 製造電源供應器、資通產品與磁性元件，並提供客製化電子設計及生產服務。
summary_long: 環科以電源供應器、資通產品與電磁元件為主要業務，並提供電子產品客製化設計及生產服務。2025年電源供應器占營收46.56%，資通產品占42.71%，電磁零件占9.95%，其他占0.78%。電源產品包含DC/DC轉換器、開放式電源與電源轉接器，磁性元件涵蓋變壓器及電感；另有毫米波雷達與電動車、電池用充電器。公司文件揭露電感應用於AI伺服器，並列有無人機與低軌衛星電源應用。
