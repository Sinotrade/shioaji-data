summary_short: 承攬工業用水與廢水處理統包工程，提供處理設備及技術支援。
summary_long: 萬年清以工業用水與廢水處理統包工程、技術設備及技術支援為主要業務，服務涵蓋流程評估、規劃設計、系統建造及試車。2025年度統包工程占營收83.29%，技術設備工程占8.38%，其他業務占8.33%。主要處理技術包括上流式厭氧污泥床、電解還原Fenton與流體化床Fenton。2026年第二季財報列世紀民生科技為母公司，上曜建設開發為集團最終控制者，並列示持有越南子公司90.46%及印度子公司99.99%權益。
