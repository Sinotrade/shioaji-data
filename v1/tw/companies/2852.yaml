summary_short: 經營產物保險，以汽車保險為主要保費來源。
summary_long: 第一保以財產保險為主要業務，承作汽車、火災、海上、工程與責任，以及傷害與健康保險。依2025年度直接簽單保費收入，汽車保險占57.79%，火災保險占15.20%，傷害與健康保險占9.49%，工程與責任保險占6.33%，海上保險占5.83%。汽車保險商品包括強制汽車責任及汽車第三人責任保險，住宅商品則包括住宅火災及地震基本保險。
