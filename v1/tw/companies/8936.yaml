summary_short: 承攬水資源及管道工程、銷售管材，並提供水處理設施建置與營運服務。
summary_long: 國統以水資源工程承攬與管件銷售為主要業務，2025年公共工程建設收入占73.66%，管件占16.09%。產品包括延性鑄鐵管及管件、鋼管與推進鋼管，並承作潛盾推進及原水、自來水送水管道工程。公司亦提供海水淡化廠的設計、製造、興建與營運，以及淨水廠、水資源回收中心與污水處理相關服務。2025年水處理操作維護收入占4.57%，水處理工程承攬服務特許權協議占2.61%，另有服務特許權利息及其他收入。
