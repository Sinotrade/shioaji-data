summary_short: 製造與銷售MAXXIS等品牌輪胎，產品涵蓋汽車、卡車、機車及自行車胎。
summary_long: 正新經營輪胎製造與銷售，擁有MAXXIS品牌，主要產品包括輻射層汽車外胎、卡車外胎、機車外胎及自行車外胎。2024年合併產品銷售金額占比分別為39.2%、13.6%、19.4%及11.8%。官方資料揭露的原廠配胎供應對象包括BMW、Ford、Toyota、Nissan、Volkswagen、Honda及GM，另有VICTRA SPORT EV電動轎車輪胎。國際中橡供應循環碳黑供正新製造環保自行車胎；RAZR RAID+則用於2026年達卡拉力賽。正新於2024年兩度公告增資印度子公司，2026年另公告增資印度及印尼子公司。
