summary_short: 經營知本溫泉度假飯店，以客房出租及餐飲服務為主要收入來源。
summary_long: 知本老爺大酒店在臺東知本溫泉區經營度假飯店，主要提供客房出租、餐飲及溫泉休閒服務。官網介紹客房共183間，飯店另設室內外溫泉浴場、SPA服務與會議設備。2025年度營收以客房收入為主，占60.77%；餐飲收入占31.17%，其他營業收入占8.06%。住宿與餐飲構成主要收入來源，飯店服務內容同時涵蓋住宿、用餐、溫泉休閒及會議空間。
