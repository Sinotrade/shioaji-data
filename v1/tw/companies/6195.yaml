summary_short: 經營家具連鎖直營零售，銷售柚木家具、牛皮沙發與床墊。
summary_long: 詩肯主要經營家具連鎖直營零售通路，以詩肯柚木品牌為主，銷售客廳、房間、餐廳家具與床墊。2025年度營收中，客廳組占64.81%，房間組占15.69%，餐廳組占9.92%，床墊占9.36%，其他占0.22%。詩肯居家產品另包括手動與電動全牛皮沙發。依2025年第三季合併財報，詩肯全資持有Nova Furnishing Holdings，並透過該公司全資持有Nova Furnishing Centre。
