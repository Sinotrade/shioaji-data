summary_short: 製造半導體潔淨級管配件、閥件及化工級不鏽鋼管件，並提供廠務服務。
summary_long: 大甲永和以潔淨級與化工級管配件製造為核心，2025年潔淨級管配件占合併營收39.21%，廠務服務占34.23%，不鏽鋼焊接管配件占25.41%，其他占1.15%。潔淨級產品包括半導體廠務氣體與化學品供應系統零組件、膜片閥及球閥，另製作VMB／VMP。化工級產品包括彎頭、三通、漸縮管、管帽與管節。主要子公司包括持股66.68%的大川研科技，以及持股100%的安徽大甲管材。
