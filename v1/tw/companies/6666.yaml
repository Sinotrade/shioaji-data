summary_short: 透過專業美容院線及護膚品牌銷售美容保養品。
summary_long: 羅麗芬-KY以美容保養品為主要收入來源，2025年美容保養品營收占91.42%，其他收入占8.58%。集團的面部護膚產品包含葛林若、聖迪妮爾、黛昂絲等專業美容院線品牌，另經營莫克麗膚高訂養護品牌。集團採控股架構，羅麗芬控股全資持有香港的羅麗芬集團有限公司，再由香港子公司全資持有嘉文麗（福建）化妝品有限公司。
