summary_short: 經營半導體元件與資訊通訊產品通路，提供商用產品及代理服務。
summary_long: 聯強經營半導體、商用加值、資訊消費與通訊產品通路。2026年第三季半導體業務營收1,421億元，商用加值641億元、資訊消費388億元、通訊72億元，半導體為當季最大業務。銷售品牌包括Intel、AMD、HP、Lenovo、Apple及Samsung，另代理Microsoft、Kingston、Seagate與WD產品。公司代理NVIDIA Jetson Thor機器人運算模組及開發套件；旗下群環科技經營商用加值通路，提供Dell及Cisco品牌產品。近三年具名事件包括澳洲子公司公告處分墨爾本不動產，以及Peer Developments投資與處分Concentrix、處分TD SYNNEX股票。
