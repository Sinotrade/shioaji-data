summary_short: 製造光通訊薄膜濾光片，並提供精密光學鍍膜加工服務。
summary_long: 統新光訊主要製造光纖通訊與精密光學用薄膜濾光片，並提供光學與功能性薄膜加工。主動元件用濾光片應用於光纖到府、資料中心及基地台，被動元件用濾光片則應用於WDM模組。依2025年度年報公開轉錄，光學鍍膜元件占營收99.98%，其他收入占0.02%。公司揭露雲端資料中心800G、1.6T濾光片製程研發，以及矽光子波導、CPO保護膜層與邊緣耦合器抗反射鍍膜等研發方向。另依公司公告，福富祿為其直接及間接持有百分之百表決權之子公司。
