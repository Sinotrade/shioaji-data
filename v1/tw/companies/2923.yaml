summary_short: 以住宅開發銷售、商場與辦公室租賃及物業管理取得收入。
summary_long: 鼎固控股以房地產開發銷售、商場與辦公室租賃及物業管理為主要業務。2025年房地產銷售收入約32.97億元，占營收57%；商辦租賃約18.07億元，占31%；物業管理占8%，其他收入占4%。上海日月光中心為其結合商場與商辦的商業不動產項目。工程供應商宏潤建設承攬子公司上海鼎霖建案，2025年占集團進貨35%。子公司Wealthy Joy透過台灣分公司參與台中北屯住宅共同開發及委建，與宏璟各負擔半數工程款；2024年另由子公司泰安投資購入上海鼎霖剩餘1%股權。
