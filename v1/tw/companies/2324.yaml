summary_short: 以筆電設計製造代工為主，兼營AI伺服器與液冷系統。
summary_long: 仁寶以筆記型與桌上型電腦設計製造為主要業務，2026年第二季筆電占營收66%，非PC占34%。具名製造採購契約客戶包括Dell Products L.P.與宏碁；年報列Intel、AMD、NVIDIA等為主要原料供應來源。公司亦提供AI伺服器與液冷系統，並與HUMAIN合作開發及製造AI運算平台。2026年公告向精浚科技購置大溪不動產，並簽約收購Semtech蜂巢式通訊模組業務；9月另公告以現金股份轉換取得鋐寶全部股權，仍待程序完成。
