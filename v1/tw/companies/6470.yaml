summary_short: 設計與製造無線寬頻網通設備，主要營收來自無線寬頻網路應用設備。
summary_long: 宇智以無線寬頻網路設備的設計與製造為主，2025年該類產品占營收98.2%，其他業務占1.8%。產品包括內建5G數據機的路由器、戶外5G橋接設備，以及Wi-Fi 6／6E路由器；移動通訊產品則以車載路由器提供LTE、5G與乙太網路連線。聯網設備另有串流音樂盒，具即時串流、離線播放與頻道選擇等功能。公司全資持有美國子公司U-MEDIA,Inc.，由該子公司負責市場開發及業務支援。
