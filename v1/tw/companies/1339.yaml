summary_short: 製造汽車AM碰撞替換零件，主要產品為保險桿與水箱護罩。
summary_long: 昭輝主要製造汽車售後維修市場（AM）碰撞替換零件，產品包括前後保險桿、水箱護罩、下飾板與大燈支架。2025年度汽車零件占合併營收98.74%，其他業務占1.26%。公司另提供保健食品配方研發及OEM／ODM代工，涵蓋軟膠囊等劑型。集團內遼寧和泰從事原廠配套（OE）內飾件製造，與昭輝本體的AM產品有所區別。年報列示的子公司另包括騰輝控股、華元控股、常熟富特、長頡科技、優能富創及賀得嘉生醫。
