summary_short: 以半導體與電子零組件代理、通路銷售及技術服務為主。
summary_long: 尚立以半導體與電子零組件代理及技術服務為主要營業項目，代理品項包含CCD、CMOS影像感測器與TFT液晶模組。依2024年度年報，零件通路事業占營收99.02%，智慧平台事業占0.67%，生活服務事業占0.31%，收入主要來自零件通路。公司2024年8月公告列示的轉投資子公司包括尚立(香港)股份有限公司、尚茂智能科技股份有限公司及尚碩生活科技股份有限公司。
