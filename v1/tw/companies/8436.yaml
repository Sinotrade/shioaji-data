summary_short: 以保健食品及美容保養品的研發、製造與銷售為主要收入來源。
summary_long: 大江生醫主要從事保健食品及美容保養品的研究開發、製造與銷售，採CDMO服務模式，為品牌設計配方並生產產品。產品涵蓋保健食品、機能性飲料、膠原蛋白、面膜及護膚品。依2024年報，保健食品占營收86.5%，美容保養品占9.8%，其他占3.7%。2025年底主要子公司包括台灣第一新藥、大江基因醫學、和康生物科技、大江生醫生物技術(上海)及TCI BIOTECH LLC；其中大江基因與和康雖持股未達半數，財報仍列為具實質控制力的子公司。
