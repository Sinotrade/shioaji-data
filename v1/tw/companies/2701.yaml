summary_short: 以商業大樓出租為主要收入，另經營電影院與遊樂場。
summary_long: 萬華企業以商業大樓出租為主要收入來源，同時經營電影與遊樂業務。2025年租賃收入為新台幣2億2,135.7萬元，占全年營收87%；育樂收入為3,264.6萬元，占13%。租賃服務提供商場空間，供百貨公司、書局、餐廳、超商及商務旅館使用。育樂業務包含電影院與遊樂場，影院設於峨嵋街育樂大廈四樓、六樓及八樓，遊樂場另設有棒球練習場及射擊練習場。
