summary_short: 主要銷售光纖交換器、光電轉換器與語音閘道器等網路設備。
summary_long: 康聯訊主要銷售光纖接取網路設備，產品包括光纖交換器、光電轉換器與語音閘道器。2025年度營收以光纖交換器為主，占53.84%，光纖轉換器占31.07%，語音閘道器占5.17%，其他占9.92%。交換器涵蓋FTTX接取設備，光電轉換器提供100Mbps至10Gbps光纖乙太網路產品，閘道器則整合資料、電視與語音服務。公司另有工業級交換器及轉換器，涵蓋PoE供電產品，並透過瑞典、日本等子公司經營網路設備買賣。
