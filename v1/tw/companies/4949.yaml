summary_short: 製造半導體設備耗材、經營WINAICO太陽能模組，提供能源整合服務。
summary_long: 有成精密主要經營半導體設備耗材及WINAICO品牌太陽能模組。半導體產品採用鎢、鉬、陶瓷與石墨等材料，應用於離子植入、薄膜沉積與擴散製程，並提供維修翻新及機台保養。太陽能產品包括NLX四分片模組；另提供太陽能建置、儲能與智慧微電網整合服務。2025年半導體部門收入為新台幣12.96億元，高於太陽能部門的11.01億元。主要子公司包括德國WINAICO Deutschland GmbH、澳洲WINAICO Australia PTY Ltd.及南京有成精密科技有限公司。
