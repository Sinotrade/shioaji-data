summary_short: 研發製造微波功率放大器、射頻元件及收發次系統，以放大器與模組銷售為主。
summary_long: 全訊以砷化鎵與氮化鎵技術研發、製造微波射頻元件、放大器及次系統，具備晶圓設計、製造與封裝組裝能力。2025年微波放大器占營收59.27%，微波次系統占36.54%，其他產品占4.19%。主要產品包括固態功率放大器、低雜訊放大器、單晶微波積體電路、場效電晶體及射頻收發模組。公司亦提供標示用於5G及低軌衛星的毫米波MMIC，以及無人機通訊與反制用途的氮化鎵功率放大模組。
