summary_short: 以金融事業投資收益為主，旗下經營證券、銀行、保險、基金及期貨服務。
summary_long: 元大金控以投資及管理金融事業為本業，2025年母公司營業收入中，採權益法認列之投資收益占99.75%。主要子公司包括元大證券、元大銀行、元大人壽、元大投信與元大期貨。集團透過子公司提供證券經紀與投資銀行服務、企業融資、保險及期貨經紀服務，元大投信管理0050與0056等ETF。2025年元大金控向元大銀行承購韓國儲蓄銀行全數股權，11月完成交割。2026年元大投信股份轉換案已獲核准，訂12月4日為基準日，完成後將成為百分之百持股子公司。另有元大國際資產管理處分不動產，以及元大人壽取得臺北市土地地上權的交易。
