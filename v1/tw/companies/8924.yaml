summary_short: 主要提供高爾夫球頭、球桿與球具設計製造服務，另經營自行車業務。
summary_long: 大田以高爾夫球桿頭、球桿及球具的設計製造服務為主，產品包括鐵桿頭、木桿頭、推桿頭與碳纖維球桿，並提供球具組立。2025年鐵頭與木桿頭營收比重分別為49.60%及28.48%，組桿與製桿分別為7.11%及3.43%。另經營自行車成車與車架銷售，自行車營收占6.77%。集團直接持有O-TA GOLF GROUP及越南大田全部股權，並透過前者間接持有豐太、江西大田及領航全部股權。
