summary_short: 以MOSFET、IGBT及二極體等功率元件晶圓代工為主。
summary_long: 茂矽以功率半導體晶圓代工為主要業務，製程涵蓋MOSFET、IGBT、蕭特基二極體及高壓CMOS類比IC。2025年產品銷售組成為MOSFET／IGBT56%、Diode／MCD25%、Analog10%、其他8%，比例依原簡報列示。公司布局電動車相關功率元件，並開發SiC MOSFET／JFET製程，2026年4月法說揭露當時即將送樣。依2025年第三季財報，朋程為母公司，敦茂科技及Giant Haven Investments為合併子公司。
