summary_short: 經營麥味登等餐飲品牌，主要收入來自商品買賣，另有門市餐飲與加盟專案。
summary_long: 揚秦經營連鎖餐飲品牌，營收以商品買賣為主，並涵蓋門市餐飲、加盟專案及海外授權金。2026年上半年，商品買賣占營收73.8%、餐飲收入占19.1%、加盟專案占6.9%，其他海外授權金占0.2%。旗下品牌包括麥味登、提供臺式炸雞的炸鷄大獅、手作烘焙品牌REAL真‧CAFÉ‧BREAD，以及以黃金雞湯為主題的日式火鍋品牌涮金鍋。依2026年第一季合併財報，公司全資持有Super Qin Private Limited，並透過該公司全資持有上海佐秦餐飲管理有限公司及A Qin, LLC。
