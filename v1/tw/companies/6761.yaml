summary_short: 銷售電磁相容與線路保護元件，並提供測試認證與設計諮詢服務。
summary_long: 穩得以電磁相容與線路保護元件銷售為核心，結合設計諮詢、前測及認證服務。產品包括電磁干擾抑制元件、TVS與ESD防護元件，以及PoE與電源防雷模組。2025年元件銷售收入約18.05億元，測試認證收入約1.70億元，後者占營收8.59%。整合服務涵蓋前期線路規劃、中期零件測試除錯與後期產品認證，測試領域包括電磁相容、無線射頻及安全規範。公司亦揭露AI伺服器周邊研發與電動車相關元件應用，旗下子公司包含穩得電性檢測及深圳千虹電子。
