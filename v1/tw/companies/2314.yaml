summary_short: 以衛星通訊設備為主要營收來源，並製造5G開放式基地台射頻設備。
summary_long: 台揚主要經營衛星通訊與行動通訊設備，衛星產品為主要營收來源。衛星業務涵蓋高軌與低軌應用，包括家戶及中小企業地面終端、航空寬頻終端、海事通訊設備與衛星地面射頻模組；低軌產品則包括Ku與Ka頻段收發機及相控陣列天線用戶終端。行動通訊業務提供5G開放式無線接取網路的無線射頻單元，產品涵蓋4T4R、2T4R與8T8R配置。集團在丹麥設有RadioComp、美國設有MTI Lab研發子公司。
