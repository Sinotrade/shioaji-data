summary_short: 以製造及銷售各類光學應用鏡頭為主，涵蓋車載、安控、視訊與投影用途。
summary_long: 佳凌以各類光學應用鏡頭的製造與銷售為主要收入來源，2025年度財報另列其他收入及不動產租金收入。產品涵蓋車載鏡頭、消費型鏡頭、玻璃研磨鏡片及非球面模造玻璃；車載應用包括倒車、環景及ADAS前視，消費型應用包括視訊、安控與投影。公司亦提供LiDAR雷射接收鏡頭組與反射鏡元件，以及客製化光通訊光學元件。2025年法說簡報並將無人機鏡頭與低軌衛星元件列入應用產品。
