summary_short: 以土地開發、房屋興建與不動產租售為主，兼營紡織加工。
summary_long: 怡華實業主要從事土地開發、房屋興建及不動產開發租售，另經營長短纖平織物、染整與代工業務。2026年上半年房地銷售收入約2.61億元、租賃收入約7,371萬元、紡織加工收入約3,274萬元，房地銷售為最大營收來源。公司持有卡布可網路科技及城市發展綠能投資企業兩家子公司各100%股權；前者主要經營一般廣告服務與電子商務，後者主要從事綠能電業發展事業投資。
