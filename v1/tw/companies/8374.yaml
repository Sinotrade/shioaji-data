summary_short: 銷售自動化機電零組件與捆包設備，提供機器人整合及能源相關產品。
summary_long: 羅昇經營自動化控制、工業傳動及捆包設備業務，提供零組件銷售與整合方案。2025年合併營收以設備及耗材類金額最大，該部門從事捆包設備製造與買賣，其他收入包括自動化控制、工業傳動、能源管理及半導體設備材料銷售服務。產品涵蓋PLC運動平台、傳動零組件、機器手臂、充電設備及捆包機，並提供機器視覺與機器人整合服務。資騰科技、怡進工業及達昇能源均為子公司；友通資訊為母公司，佳世達為最終控制者。
