summary_short: 設計與銷售工業、USB及嵌入式乙太網路、I/O橋接與UART晶片。
summary_long: 亞信電子以工業與嵌入式網路、介面橋接晶片設計為主要業務。產品涵蓋USB轉乙太網路控制晶片、EtherCAT控制晶片與微控制器、TSN網路卡、Non-PCI／SPI嵌入式乙太網路晶片，以及PCIe／USB介面橋接器與UART收發器。AX88279A提供USB 3.2轉2.5G乙太網路連接；AX58400則結合EtherCAT通訊與雙核心控制，公司明列其人形機器人及靈巧手應用。2024年高速網路及輸出入控制晶片占營收100%，年報未進一步拆分各產品線占比。
