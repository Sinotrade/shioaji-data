summary_short: 以不動產出租、百貨專櫃抽成及管理費取得收入，租賃為最大來源。
summary_long: 統領百貨以不動產出租、百貨專櫃抽成及商場管理服務取得收入。2025年合併營業收入為新臺幣5億1,834.8萬元，其中租賃收入2億9,238.4萬元，為最大來源；百貨專櫃抽成收入1億7,301.2萬元。租賃業務包含投資性不動產出租及賣場分租，其他營業收入主要為管理費。旗下全資子公司德宏建設從事住宅及大樓開發租售；2025年合併報表未認列營建工程收入。
