summary_short: 銷售PCB、IC載板及半導體自動化設備，提供智慧倉儲與物料搬運系統。
summary_long: 迅得以銷售產業自動化設備及整合服務為主要業務，應用涵蓋PCB、IC載板、晶圓製造與封裝。依2025年度年報產品分類，載板與PCB自動化設備占營收55.94%，晶圓廠與半導體自動化設備占43.59%，其餘封測與平面顯示器設備占0.47%。產品包括AMHS、智慧倉儲、移動式機器人，以及適用於CoWoS與FOPLP的晶圓機器人傳輸技術；亦與家登合作開發EUV光罩載具倉儲方案。具名客戶包括台積電、欣興、南電，以及日月光投控旗下的日月光半導體製造公司。2024年董事會決議向聯琦金屬出售楊梅廠土地及廠房，2026年另公告博世科、濾能及友上科技投資案件。
