summary_short: 以記憶體模組與SSD等快閃儲存產品為主要營收來源。
summary_long: 宇瞻以記憶體模組與快閃儲存產品為主要業務，涵蓋工業級記憶體、SSD及消費性數位儲存裝置。2025年營收中，記憶體模組占50.48%，快閃記憶體占48.14%，其他占1.38%。記憶體產品包含適用企業伺服器與雲端資料中心的DDR5 RDIMM，以及針對AI伺服器推出的DDR5 MRDIMM。另提供AIoT規劃、AI+AOI光學檢測與智動化設備建置服務。
