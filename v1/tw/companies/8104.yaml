summary_short: 透過子公司製造電池模組與儲能系統，並經營PMOLED及其他顯示器產品。
summary_long: 錸寶科技經營顯示器及電池相關業務，2024年合併營收以電池模組為主，占72.81%；PMOLED模組及玻璃分別占24.07%及1.88%，其他業務占1.24%。顯示器業務包含PMOLED研發製造，並代理銷售TFT LCD、AMOLED與電子紙。子公司來穎科技提供鋰電池模組、電池儲能系統、能源管理系統及UPS電池模組；間接子公司達振能源則經營電池模組OEM與ODM。依2025年4月持股資料，錸寶另全資持有新寶資產及瀚泰能源。
