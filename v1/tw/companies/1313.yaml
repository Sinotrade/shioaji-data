summary_short: 主要產銷可塑劑、苯酐及塑膠樹脂，另有運輸與倉儲物流收入。
summary_long: 聯成主要產銷苯酐、可塑劑等石化產品，合併收入分為產品銷售及運輸與倉儲物流兩類。官網產品包括泛用可塑劑、特殊可塑劑、聚氯乙烯、酸酐與酸，以及不飽和聚酯樹脂。泛用可塑劑用於PVC加工；特殊可塑劑包含UniHydro UN899。聚氯乙烯產品採乙烯法生產懸浮粉；酸酐與酸可供可塑劑及樹脂等化學品合成；不飽和聚酯樹脂用於玻璃纖維增強複合材料。集團透過中山、珠海、鎮江、泰州、盤錦、南充及馬來西亞子公司經營可塑劑與苯酐產銷。
