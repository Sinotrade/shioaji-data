summary_short: 以LTCC技術製造無線通訊用高頻整合元件與射頻模組。
summary_long: 璟德以高頻整合型元件及模組為主要業務，2025年此類產品占營收100%。公司運用低溫共燒陶瓷（LTCC）技術製作無線通訊用射頻前端元件與模組，產品包括帶通濾波器、雙工器、三工器、天線及射頻前端模組。2025年研發成果包含5G N77通訊系統用高抑制帶通濾波器，以及Ka頻段低軌衛星通訊系統用雙圓極化發射天線陣列，分別對應5G通訊與低軌衛星的射頻零組件環節。
