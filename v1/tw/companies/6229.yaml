summary_short: 經營IC通路，提供韌體、軟硬體整合及模組化設計服務。
summary_long: 研通經營IC通路與應用方案，提供硬體、軟體、韌體及模組化設計生產服務。2025年集團營業比重以影像視訊控制IC應用產品37.50%為最大宗，其次為微處理器IC應用產品21.20%及液晶驅動器16.62%。產品組合另含記憶IC、電腦週邊控制IC與語音控制IC應用產品。集團直接持有HIGHFLYERS TRADING LTD.，並透過其間接持有弘崴企業國際有限公司。公司亦已開發電動機車及電動助力自行車的ECU智慧顯示儀表系統。
