summary_short: 設計、製造工業用液晶與觸控顯示模組，以 TFT 產品為主要營收來源。
summary_long: 晶采主要從事工業應用中小尺寸液晶顯示模組的設計與製造，提供客製化顯示方案，產品包含 TFT 彩色與 TN、STN、FSTN 顯示模組，並整合電容式觸控。依 2024 年度營業比重，TFT 占 82.76%，TN、STN、FSTN 占 16.52%，其他占 0.72%。官網另列有 AMOLED 顯示器，並揭露採用分區背光控制的 Mini LED 技術。公司透過 AMPIRE CO.,LTD(B.V.I.) 與 SINO ADVANCE INC. 間接持有棠裕電子(東莞)有限公司。
