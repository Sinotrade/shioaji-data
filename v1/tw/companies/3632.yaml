summary_short: 經營導航、行車記錄器、人臉辨識、廣告機及精釀啤酒餐飲。
summary_long: 研勤經營PAPAGO!導航與行車記錄器、FACE8人臉辨識，以及廣告機和精釀啤酒餐飲業務。FACE8為自主研發的人臉辨識引擎，應用於考勤、門禁、健身房與工地管理；導航App採訂閱制，車載產品包括電子後視鏡。2025年營收以廣告機30.85%最多，其次為人臉辨識25.34%、行車紀錄器及導航機17.90%，掌門精釀啤酒及餐飲占13.60%。最新半年報列掌門事業與研亞投資為直接子公司，研亞投資另持有發霸股份有限公司。
