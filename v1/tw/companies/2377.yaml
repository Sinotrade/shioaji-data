summary_short: 主要銷售電競板卡、筆電、桌機及顯示器，另有AI伺服器與智慧設備。
summary_long: 微星以板卡、桌機、筆電與顯示器等電腦硬體為主要業務，2025年零組件占營收50%、系統產品占42%、其他產品占8%。公司採用Intel、AMD與NVIDIA平台，並揭露與上述晶片業者建立供應合作及長期供貨安排。企業產品包括NVIDIA MGX架構AI伺服器、液冷平台與DGX Station工作站，另提供自主移動機器人及Eco系列電動車充電樁。微星與Viettel Group合作涵蓋伺服器技術移轉、設計及系統建置。2024至2026年公告事件包括龜山土地取得、廠辦及機電工程，以及對美國、荷蘭子公司增資；美國子公司的加州購廠與荷蘭子公司的建廠、集團內土地移轉均為各子公司行為。
