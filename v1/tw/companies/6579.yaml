summary_short: 研發、製造及銷售工業電腦、嵌入式板卡與邊緣AI運算系統。
summary_long: 研揚從事工業電腦產品設計與製造，產品涵蓋單板電腦、周邊裝置及工業系統，可應用於自動化控制等場域。2026年上半年合併收入區分為工業電腦及醫療電腦，工業電腦收入較高。其產品包括採用NVIDIA Jetson Thor的BOXER-8741AI，以及搭載MediaTek Genio的SMARC模組，並與NVIDIA、Intel及AMD建立技術合作關係。華碩為最終母公司，也是財報列示的進貨對象；醫揚與捷波則為子公司。研揚於2026年4月完成日本AJP股權收購，持股增至100%，並將其納入合併。
