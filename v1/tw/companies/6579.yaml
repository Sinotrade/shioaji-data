summary_short: 以工業電腦、單板電腦及嵌入式系統產品為主要營收來源。
summary_long: 研揚以工業電腦與嵌入式運算平台為主業，2025年合併營收中，單板電腦及周邊裝置占49.54%，工業用系統產品占45.34%，其他占5.12%。主要產品包括嵌入式單板電腦、BOXER無風扇電腦、強固型平板、邊緣AI系統與工業級伺服器。邊緣AI系統採用NVIDIA Jetson平台，PICO-MTU4-SEMI可整合於工業機器人與自動導引車。華碩電腦為其最終母公司，醫揚科技與捷波資訊為納入合併的子公司。
