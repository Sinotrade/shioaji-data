summary_short: 以蛋雞飼育、洗選鮮蛋銷售及蛋品加工為主要業務。
summary_long: 大武山主要從事中雞與蛋雞飼育，生產及銷售洗選鮮蛋，並經營蛋加工品。2025年合併營收中，鮮蛋占45%、蛋加工品占39%、調理食品占14%，其他占2%，鮮蛋為最大單一產品類別。產品包含生食級幸せ鮮蛋、全蛋液、蛋捲與布丁，集團產品另涵蓋溏心蛋、茶葉蛋、滷蛋及豆干、湯品等調理食品。年報列示台達蛋品科技、武勢食品與福記冷凍食品為子公司，國興畜產為母公司。
