summary_short: 經營健身工廠等運動場館，主要收取會籍使用費及私人教練課程費。
summary_long: 柏文以健身工廠經營會員制連鎖健身中心及休閒運動場館，主要收入來自會籍使用費及私人教練課程。2026年第一季，健身及娛樂服務占營收64%、私人教練課程占33%，入會費與其他服務分別占2%及1%。健身工廠採用LifeFitness品牌器材，並曾取得SGS QUALICERT國際服務驗證標章。柏文持有柏鑫健康事業60%股權並納入合併報表；海外股權投資包括美國TAROKO US CORPORATION及西班牙FORMOSA TROPICAL,S.L.。近三年亦公告多筆租賃取得場館使用權資產交易。
