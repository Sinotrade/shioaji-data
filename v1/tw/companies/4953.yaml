summary_short: 緯致科技以軟體開發、數位轉型、營運委外與產品工程服務取得收入。
summary_long: 緯致科技以資訊服務為主要收入來源，2025年營收全數列為技術服務收入。公司提供軟體研發、開發、測試與系統維運，並以數位轉型顧問、資料分析、人工智慧及雲端技術協助企業整合流程。數位化營運服務涵蓋客服、資料處理與資料標註；產品工程服務則包含多語翻譯、在地化工程及全球化測試。此外，公司提供半導體設計後段外包，範圍包括全客製化佈局、自動佈局繞線與設計驗證。
