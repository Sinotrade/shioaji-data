summary_short: 以電力電纜製造與銷售為主，兼營通信、光纖及特殊用途線纜。
summary_long: 億泰主要從事電線電纜製造、加工及銷售，產品包含交連聚乙烯高低壓電力電纜、通信電纜與光纖光纜。2025年營收組成為電力電纜88%、通信電纜5%、光纖電纜3%、橡膠電纜1%及其他3%。特殊用途產品包括太陽能電纜、電動車電源線及ROV水下電纜，另有5G混合電纜及無人機電纜。主要直接子公司包括億泰(英屬維京)公司、億泰高科技(越南)責任有限公司及億福投資股份有限公司。
