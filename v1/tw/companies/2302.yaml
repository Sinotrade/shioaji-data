summary_short: 以整流二極體製造與銷售為主，提供橋式整流器、MOSFET及碳化矽元件。
summary_long: 麗正以整流二極體製造與銷售為主要業務，產品包括橋式整流器、TVS 瞬態電壓抑制二極體及 MOSFET，另提供碳化矽蕭特基二極體。2025年度營業比重以半導體業95.63%為主，醫療器材業0.98%，其他業務3.39%。集團直接子公司包括麗正電子（中國）、美國銷售公司、聚鼎興業與上海麗正達，並透過麗正電子（中國）持有浙江麗正電子。碳化矽產品已公布具體型號與規格，可歸入碳化矽元件題材。
