summary_short: 製造與銷售機車、自行車及農工業用輪胎，並經營DURO品牌。
summary_long: 華豐主要製造與銷售各類輪胎，並以DURO品牌行銷。2025年營收以機車胎為主，占55.06%；自行車胎占22.23%，農工業用胎占20.75%，三者構成主要收入來源。其他收入包括卡汽車胎、輻射層外胎及其他產品，占比分別為1.40%、0.39%及0.17%。集團子公司包括從事製造及銷售的華豐橡膠（泰國）大眾股份有限公司、華豐橡膠（蘇州）有限公司，以及從事銷售買賣的華豐橡膠（美國）有限公司。
