summary_short: 製造精密沖壓與射出零組件，並銷售模具、治具。
summary_long: 鉅祥以精密金屬沖壓與塑膠射出零組件製造為主，2025年部品占營收95.03%，另有模具3.32%、治具0.63%及商品1.02%。公司整合機械加工、電鍍、塑膠射出、雷射銲接及自動組裝製程，產品包含連接器端子、機構件、彈片、鐵殼與車用零件。AI相關產品包括伺服器BBU機構件，年報亦列有5G網通伺服器應用。2021年具名媒體報導其取得大立光用於iPhone音圈馬達的金屬機殼訂單。海外子公司包括上海鉅祥、鉅祥日本及鉅祥菲律賓，並於2025年增購日本子公司股權。
