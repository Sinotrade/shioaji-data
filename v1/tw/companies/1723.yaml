summary_short: 生產銷售煤焦油、輕油加工產品及鋰電池負極等精碳材料。
summary_long: 中碳生產、加工及銷售煤化學產品與精碳材料，產品涵蓋軟瀝青、雜酚油、精萘、苯、甲苯及焦碳系列。2024年煤焦油及化學品系列占合併營收53.20%，輕油及油品系列占29.03%，精碳材料系列占9.72%。精碳材料包括介相石墨碳微球、先進碳材料與等方性石墨，應用涵蓋鋰電池負極等領域。公司公開說明其碳材應用於電動車動力電池及AI伺服器電力備援系統。
