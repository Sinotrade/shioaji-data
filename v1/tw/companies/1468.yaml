summary_short: 主要製造及銷售成衣用布、氣撚紗與極細纖維相關紡織品。
summary_long: 昶和經營纖維絲與布料的織造、染色整理、加工及銷售，產品涵蓋極細與超極細纖維。2025年度營收組成以成衣用布占67.24%最大，氣撚紗占19.29%，其他產品占13.47%，收入主要來自紡織產品。公司直接持有Holy Finance Group Limited 83.26%股權，並有間接子公司昶和纖維（紹興）有限公司；另直接持有富昶建設股份有限公司100%股權。
