summary_short: 製造及銷售雙面、多層PCB，產品包括AI伺服器與網通用板。
summary_long: 金像電子以製造及銷售雙面、多層印刷電路板為主要業務，2025年合併營收全部來自印刷電路板。產品包括AI與雲端伺服器用板及網通用板，製造原料包含基板、膠片與銅箔。亞馬遜是具名客戶，尖點則為鑽針供應商。2026年公司決議由亞馬遜認購私募普通股，並擬投資尖點私募可轉債。擴產交易包括2025年向中環購買中壢土地建物，以及2026年由蘇州金像電子向名碩電腦購買蘇州土地建物；另持續決議增資泰國子公司。
