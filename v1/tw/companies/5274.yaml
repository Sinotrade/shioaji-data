summary_short: 設計與銷售伺服器遠端管理晶片，另提供影音傳輸與全景影像方案。
summary_long: 信驊以無晶圓廠模式設計與銷售伺服器管理晶片，2025年多媒體積體電路占營收96.32%，電腦周邊積體電路占2.85%。其BMC用於遠端監控與管理主機，AST2700為第八代產品，CAN介面可用於高功率AI伺服器電源管理；AST1700則提供I/O擴充。智慧影音產品包括AST1530／1535 AV-over-IP晶片，並與Audinate合作整合Dante AV。2025年底，實境遠端管理事業分割移轉至子公司酷博樂，由該公司發展全景影像與遠端管理方案。2026年信驊與Lattice合作推出整合FPGA的AST1840，並投資円星科技，深化AI伺服器與高速介面IP合作。
