summary_short: 製造及銷售洗衣劑、家庭清潔與個人防護用品。
summary_long: 毛寶的營收產品分為洗衣劑、家庭清潔及其他三類，2025年占比分別為42.08%、53.53%及4.39%，以家庭清潔系列為最大收入來源。衣物清潔產品包括冷洗精；家庭清潔則涵蓋廚房清潔劑、馬桶清潔劑與洗衣槽去污劑，對應不同居家清潔用途。其他產品包含小鹿山丘防蚊液等個人防護用品。集團另有Pacific Worldwide Holdings Ltd.、Mao Bao Vietnam Inc.、Pacific Trading Group Co.,Ltd及毛寶(上海)商貿有限公司四家子公司。
