summary_short: 以健康媒體廣告為最大營收來源，另提供健康資訊平台與運動賽事服務。
summary_long: 永悅健康以健康媒體廣告、健康資訊平台、運動賽事、健康商品銷售與電商代營運及公部門專案取得收入。公司於2026年6月說明的營收組合中，健康媒體廣告占32%，為最大項目；健康資訊平台與運動賽事各占19%。旗下H2U eXamine提供健檢資訊管理，H2U pano整合員工健康資料、健檢管理與福利，H2U eXpert提供職場健康服務。早安健康提供健康內容及媒體服務，運動筆記結合運動社群、計時晶片技術與馬拉松等賽事營運。
