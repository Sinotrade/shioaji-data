summary_short: 以SMD LED設計、製造與封裝為主要營收來源。
summary_long: 宏齊以表面黏著型發光二極體為主要產品，從事設計、製造與封裝，應用於背光、指示、電競、照明及感測。2025年度營收中，SMD LED占99.51%，工程收入占0.49%。官網另列有紅外線LED、COB顯示方案、光耦合器與CSP LED等產品。公司設有Mini LED與Micro LED新創開發部，負責產品開發及生產製程，相關封裝業務歸入Mini／Micro LED題材。旗下子公司包括宏鉑科技、宏興光電與星彩顯示。
