summary_short: 印製表面裝飾用薄膜，供筆電機殼、家電、汽機車飾板及日用品使用。
summary_long: 森田印刷以表面裝飾用薄膜的印刷與製造為主要業務，2024年熱轉印膜占營收99.19%，其他業務占0.81%。主要產品包括模內轉印膜（IMR）、熱轉印膜（HTF）、模內射出膜（IML）及模內嵌片成型膜（INS）。IMR應用於筆記型電腦機殼及其他電子產品外殼；HTF以熱壓方式將油墨轉印至塑膠、玻璃及金屬表面；IML用於塑膠餐盤、杯子等家用品；INS膜片則可用於汽機車飾板及家電產品。模內裝飾（IMD）是涵蓋模內轉印、模內貼標等工法的技術統稱。
