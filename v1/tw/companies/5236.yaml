summary_short: 設計與銷售攝影機影像處理、電腦周邊及物聯網微控制晶片。
summary_long: 凌陽創新以影像處理與微控制晶片為主要產品，2025年IC產品占營收99.75%，其他占0.25%。產品涵蓋筆電嵌入式ISP、USB外接網路攝影機控制晶片，以及個人電腦周邊與低功耗IoT影像微控制晶片。智慧視覺方案支援Windows Hello身分驗證與人員感知，另提供紅外線熱成像ISP及感測器融合技術，應用於安全監控、工業檢測與無人機感測。公司亦提供手勢與語音辨識智慧人機介面方案，母公司為凌陽科技。
