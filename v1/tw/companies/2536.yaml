summary_short: 以住宅開發銷售、出租為主，另開發商場、廠辦等不動產。
summary_long: 宏普建設及子公司主要從事不動產開發，以委託營造廠興建住宅大樓後出售、出租為主要業務。住宅產品多為小、中坪數，另涵蓋集合住宅、別墅、店舖、商場、廠辦與停車位。開發策略以台北市、新北市為重心，並選擇其他縣市具發展潛力、交通與生活機能完備的地區，採自建、合建或都市更新方式開發建案。旗下子公司包括川悅建設與三橋建設，兩者均納入公司2025年永續報告書的合併揭露範圍。
