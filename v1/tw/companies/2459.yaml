summary_short: 以電子零組件製造為主，兼營零組件通路及產品測試驗證。
summary_long: 敦吉科技的營運分為製造、通路與驗證三個事業群。2026年第一季，製造事業群營收6.71億元，通路3.94億元，驗證1.81億元，製造是最大營收來源。主要產品線包括音圈馬達、連接器及變壓器，當季營收占比分別為30.53%、7.45%及6.13%。驗證事業群提供電磁相容測試，並揭露持續擴充5G與Wi-Fi無線量測及AI伺服器檢測能力。
