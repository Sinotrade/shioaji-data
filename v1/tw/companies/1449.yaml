summary_short: 主要生產先染與長纖織物、機能性羊毛及紗線，另有營建收入。
summary_long: 佳和以先染及長纖織物為主要營收來源，2025年占營收73%，紡紗占6.21%，營建占20.20%。紡織生產涵蓋紡紗、織布、染整及後加工，機能性羊毛以NwoolTec品牌應用於運動、戶外、休閒與時尚市場。產品亦涵蓋車用內裝布，並布局電動車材料；航空用產品以飛機座椅布為主，涵蓋客艙及機組訓練座椅，目前仍須經客戶測試程序。猛揮營造為其子公司，營建收入與紡織本業分列。
