summary_short: 製造薄膜精密電阻、厚膜電阻與高頻及功率電感，以精密電阻為主要營收來源。
summary_long: 光頡主要製造薄膜精密電阻、厚膜電阻、高頻電感與功率電感，另提供符合AEC-Q200要求的車用電阻。2026年第一季產品銷售比重為精密電阻57%、一般電阻36%、高頻電感5%、其他2%，以精密電阻為最大營收來源。高頻電感採用薄膜、繞線及積層製程；功率電感包含屏蔽型產品。公司公開列示電阻適用於油電混合車與電動車的電池組、逆變器及充電器，法說簡報亦列出AI伺服器、GPU、交換器與資料中心電源等應用。
