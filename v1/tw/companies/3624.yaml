summary_short: 製造與銷售精密電阻、一般電阻及高頻與功率電感。
summary_long: 光頡主要經營電阻與電感等被動元件，2024年精密電阻占營收51.78%、一般電阻39.22%、高頻電感5.68%，其他產品占3.32%。產品涵蓋薄膜精密電阻、厚膜功能電阻及功率電感，官網並揭露車用產品符合AEC-Q200，電阻應用包含電動車電源轉換與充電控制。公司法說會亦列示AI伺服器、GPU及資料中心等應用。2026年第一季合併財報揭露，集團與廣東風華高新科技股份有限公司有雙向商品交易。海外組織包含歐洲直接子公司，以及透過投資公司持有的無錫與美國子公司；2024年1月曾向歐洲子公司增資。
