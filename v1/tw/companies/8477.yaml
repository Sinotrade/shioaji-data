summary_short: 以生活市集網路零售為主，並經營企業採購及子公司自動化設備業務。
summary_long: 創業家數位主要經營「生活市集」B2C電商平台，銷售日用消費品、生活家電、居家用品與食品，並提供封閉式B2B企業採購服務。2025年合併營收組成以無店面網路零售為主，占92.85%；網路交易平台經營占2.27%，其他業務占4.88%。公司直接母公司為森啟股份有限公司，最終母公司為森鉅科技材料股份有限公司。截至2026年6月底，公司持有松果購物全部股權，另持有從事機械設備製造的漢錸科技60%股權。
