summary_short: 以熱軋鋼捲為主要收入來源，另銷售冷軋鋼捲、鋼管及鍍鋅產品。
summary_long: 中鴻以扁鋼胚為主要原料，製造與銷售熱軋鋼捲、冷軋鋼捲及鋼管，另銷售委外託工生產的鍍鋅產品。2025年熱軋產品收入為新臺幣152.81億元，是最大收入來源；冷軋、鋼管與鍍鋅產品收入分別為17.49億元、13.88億元及3.21億元。扁鋼胚供應來源包括中鋼、中龍、日本製鐵及台塑河靜，具名鋼品客戶包括燁輝與盛餘。中鋼為母公司，中鴻另全資持有從事一般投資業務的鴻高投資開發。鋼管產品包括石油用管、流氣體輸送用管、結構用管及配管用管。
