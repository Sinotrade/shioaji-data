summary_short: 以熱軋、冷軋、酸洗鋼捲及鋼管的加工與銷售為主。
summary_long: 中鴻鋼鐵主要加工及銷售熱軋鋼捲、冷軋鋼捲、熱軋酸洗塗油鋼捲與鋼管，並提供委外託工生產的鍍鋅產品。熱軋產品可作為冷軋、鍍鋅與鋼管原料，亦用於五金、汽車及家電零件；冷軋產品包含全硬鋼捲與調質精整鋼捲。鋼管產品涵蓋石油用管、流氣體輸送管、結構用管、配管及打樁鋼管。中國鋼鐵為母公司，鴻高投資開發公司則為全資子公司，從事一般投資業務。
