summary_short: 透過子公司製造印刷電路板，另經營模型加工業務。
summary_long: 定穎投控透過子公司經營印刷電路板與模型加工，2025年印刷電路板占合併營收99.7%，其他業務占0.3%。PCB產品包含高多層板、HDI、彎折板、高頻板與厚銅板，應用涵蓋汽車電子、伺服器、網路通訊及消費性電子。2026年第二季技術別營收中，多層板占55%、HDI占45%。定穎電子為全資子公司，嘉南模型與丞創科技則各持股70%；超穎電子為間接子公司。集團已布局GPU、ASIC及交換器用PCB，並從事電動車及5G通訊相關電路板業務。
