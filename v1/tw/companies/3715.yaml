summary_short: 透過旗下子公司製造印刷電路板，供應車用電子、伺服器與網通等應用。
summary_long: 定穎投控透過定穎電子及超穎電子等子公司經營印刷電路板業務，2025年PCB占合併營收99.7%。旗下產品應用於汽車電子、伺服器與網通及消費性電子。集團已布局GPU、ASIC與交換器用AI電路板，並有電動車用板業務。超穎電子揭露的車用客戶包括大陸汽車、博世與法雷奧；特斯拉相關產品部分由捷普電子採購後進行組裝。原料供應關係包括台光電子材料昆山公司的銅箔基板，以及山東金都電子材料公司的銅箔。2026年泰國子公司另公告向多家設備商採購生產設備。
