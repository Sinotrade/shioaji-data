summary_short: 以邏輯、記憶體晶圓代工及先進封裝服務為主要業務。
summary_long: 力積電以邏輯與記憶體晶圓代工為主要業務，2025年邏輯代工、記憶體代工與先進封裝營收貢獻分別為61%、37%與2%。公司展示3D WoW DRAM堆疊、矽中介層與矽電容等先進封裝技術及零組件。奇景光電揭露曾向力積電採購晶圓代工服務；海外則與Tata Electronics合作提供印度晶圓廠建廠、技術授權及人才培訓服務。2026年3月完成以18億美元出售銅鑼廠予美光的交易，另簽有後段晶圓製造代工及記憶體製程合作。公司亦與Navitas合作開發200mm GaN-on-Si製造技術。
