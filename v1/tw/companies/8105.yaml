summary_short: 以中小尺寸液晶顯示模組為主要營收，產品涵蓋工控、車載與消費性應用。
summary_long: 凌巨主要產品為中小尺寸 TFT-LCD 液晶顯示模組，應用涵蓋工控、車載及消費性電子。2025年液晶顯示模組占合併營收87.71%，液晶顯示面板占4.60%，大對組合品占5.89%，其他占1.80%。車載產品提供中控顯示、觸控與防窺方案；工控產品具備寬溫技術，並提供客製化貼合與觸控方案。消費性產品涵蓋相機、印表機等應用面板，另提供電容式觸控面板，以及客製化 Mini LED 背光區域控光解決方案。
