summary_short: 以自製休閒遊戲營運、區網遊戲系統授權及手機遊戲代理發行取得收入。
summary_long: 隆中以遊戲研發、營運及授權為主要業務，產品涵蓋自製發行的線上休閒遊戲平台、黃金777區網遊戲系統及手機遊戲代理發行。2025年前三季產品營收中，遊戲授權占45%、休閒手遊占42%、手遊代理占12%，其他占1%。區網系統提供帳務、人員與遊戲組合管理，支援機台、電腦及手機。子公司銀河網絡遊戲從事遊戲研發設計及銷售，隆中持股60%；公司亦揭露Vivid Gaming為旗下子公司。
