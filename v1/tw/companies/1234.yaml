summary_short: 以飲料製造銷售為主，另經營酒類代理與保健產品。
summary_long: 黑松以飲料產品銷售為主要營收來源，並經營酒類代理與保健產品。2025年母公司個體揭露的飲料、酒類及保健產品營業比重分別為54.3%、47.9%及0.4%，另列銷貨退回及折讓2.6%。飲料品牌包含黑松沙士，酒類產品包含代理金門高粱酒，保健產品以黑松生技H+為品牌。主要全資子公司包括從事資產管理的松新、黑松資產管理，以及從事食品買賣的客集。
