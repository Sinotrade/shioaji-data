summary_short: 以手機、平板及周邊商品通路銷售為主，兼營電信代理與維修服務。
summary_long: 神腦以行動電話、平板電腦及周邊配件通路銷售為核心，另經營家電與資訊商品、生活保健商品銷售，並提供電信服務代理申辦及通訊商品維修。2025年銷貨收入占93.97%、勞務收入占4.58%、維修收入占1.45%。公司亦推廣5G智慧型手機與生活家電組合銷售，屬終端通路。中華電信為其最終母公司；截至2026年6月底，直接子公司包括優仕、暐固科技、神揚保險代理人及Sakuyo Health Science 株式會社。
