summary_short: 以專業運動鞋及高功能戶外鞋製造為主，另生產防水鞋與功能工作鞋。
summary_long: 鈺齊國際以集團製造專業運動鞋及高功能戶外鞋為主要業務，產品涵蓋慢跑、健行、登山及一般休閒運動用途。2025年度營收組成中，鞋類占99.69%，其他項目占0.31%，其他項目包括半成品與鞋材。功能鞋產品包含GORE-TEX防水鞋，以及導電工作鞋、蓄熱鞋與鐵頭鐵底工作鞋，產品範圍涵蓋運動、戶外與工作用途。公司官網董事會決議另明確列示加和企業有限公司為子公司。
