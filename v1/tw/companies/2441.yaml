summary_short: 提供積體電路封裝及晶圓、成品測試代工，以封裝收入為主。
summary_long: 超豐以積體電路封裝及測試代工為主要收入來源，2025年封裝占83.8%、測試占16.2%。封裝服務涵蓋QFN、BGA及覆晶封裝，測試分為晶圓測試與成品測試。力成科技為其母公司，2026年6月底持股42.91%；超豐另持有得群科技97.46%股權，該子公司從事半導體導線架金屬表面加工。具名交易文件可確認瑞昱、聯陽及盛群的客戶關係。2026年7月董事會通過以不超過4,500萬美元收購安森美菲律賓封測公司全部股權；公告仍附核准及交割條件。
