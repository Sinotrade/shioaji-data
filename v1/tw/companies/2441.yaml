summary_short: 以積體電路封裝、晶圓凸塊及測試服務取得營收。
summary_long: 超豐主要提供積體電路封裝與測試服務，封裝產品包含QFP、LQFP、TQFP及Flip Chip CSP，另有晶圓凸塊與WLCSP服務。測試涵蓋晶圓測試及成品測試；WLCSP整合bumping、wafer probe與DPS。2026年上半年合併營收中，Packaging占76.9%、Bumping & DPS占6.7%、Testing占16.4%。力成科技為其母公司；超豐持有得群科技97.46%股權，得群從事半導體導線架金屬表面加工處理。
