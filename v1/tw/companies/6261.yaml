summary_short: 提供半導體測試、研磨切割與挑檢代工，並製造銷售自有設備。
summary_long: 久元電子經營半導體後段代工及自製設備銷售。2025年合併營收中，測試代工約占51%、自有設備銷售約39%、切割挑檢約11%。代工服務涵蓋晶圓測試、晶片研磨切割與晶粒挑檢、IC成品測試及測試程式開發。自製設備包括IC測試機、分選機、分類機、固晶機、WLCSP晶粒分類包裝機及光學自動檢測機。其他業務包括LED與VCSEL檢測挑檢、RFID標籤代工，以及Mini LED固晶設備。集團另有美國、蘇州、深圳及揚州等營運子公司。
