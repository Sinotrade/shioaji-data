summary_short: 研發製造蜂鳴器、喇叭、麥克風等電聲元件及耳機等音頻成品。
summary_long: 志豐電子主要研發、設計及製造電聲零組件與音頻成品，包括蜂鳴器、喇叭、受話器及電容式麥克風。模組產品涵蓋箱型與防水箱型揚聲器，以及數位、類比、A2B和陣列麥克風模組。音頻成品提供OEM／ODM／JDM開發設計、技術支援及生產服務，涵蓋有線與藍牙耳機、真無線耳機、無線喇叭及輔聽器。2026年上半年營收分類以聲學元件金額最高，其次為音頻成品，另有無線通訊、家用保全及其他收入。
