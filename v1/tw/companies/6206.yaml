summary_short: 設計製造POS、自助服務終端及工業電腦，並整合子公司軟體服務。
summary_long: 飛捷從事產業電腦及相關週邊的設計、製造與銷售，產品包括POS、Panel PC、Mobile POS、KIOSK及Box PC，並提供零售、餐飲、醫療與工業自動化場域的客製化方案。2025年個體營收中，產業電腦占89.8%、週邊占7.7%，委託開發設計等其他收入占2.5%。集團透過華捷智能發展餐飲AI影像辨識、英諾菲提供雲端SaaS管理服務，並於2024年成立英捷智能，開發零售AI影像辨識軟體。供應鏈方面，聯強供應IC類電子材料，2025年占個體進貨淨額14.23%。
