summary_short: 以黃色小鴨嬰童用品銷售為主，另經營越南工程承攬及台灣不動產開發。
summary_long: 宏太-KY的集團業務涵蓋黃色小鴨Piyo Piyo嬰幼兒用品與服飾，以及越南工程承攬；品牌產品主要面向0至4歲嬰幼兒。2025年度，嬰童用品銷售占營收56%，越南工程營造業務承攬占44%，嬰童用品仍是最大收入來源。集團旗下有志竤建設與勞德建設，其中勞德建設經營越南工程業務。公司亦列出台灣住宅及大樓開發租售為主要服務，形成嬰童用品、工程與不動產並行的業務組合。
