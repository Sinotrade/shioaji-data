summary_short: 銷售國內外旅遊及郵輪行程，以歐洲線為最大營收來源。
summary_long: 鳳凰國際旅行社以國內外旅遊產品及郵輪行程銷售為主要業務。2025年營收組成以歐洲線51%為最大宗，其次為郵輪線11%、大陸線8%及東北亞線7%；亞洲線與紐澳線各6%、美洲線4%、國民旅遊1%，其他業務6%。公司直接持有雍利企業、鳳凰旅遊出版社、柏悅、柏邑及菲尼克斯健身股權，並直接及透過雍利企業持有貴賓通運。
