summary_short: 以高壓電纜附屬器材為主要營收，另製造觸控面板並提供顯示貼合與組裝。
summary_long: 洋華經營機電與光電兩類業務，公司發言人揭露2025年兩者營收約為八比二，機電為主要收入來源。機電產品包含高壓電纜接續匣、終端匣與保護裝置，應用於電纜連接、防護及電力傳輸。光電產品包括電容式觸控面板、保護玻璃與表面處理，並提供電子紙前導光開發、顯示器全貼合及整機組裝服務。電容式產品涵蓋G/F/F、GF1與G/G結構。官網2025年溫室氣體盤查資料列示的子公司包括洋華光電（越南）責任有限公司與台灣適而優股份有限公司。
