summary_short: 以預拌混凝土製造與銷售為主，集團另經營防火建材、港埠及不動產業務。
summary_long: 國產建材實業主要經營預拌混凝土製造與銷售，2025年度預拌混凝土占合併營收88.95%，防火建材占5.57%，其餘包括水泥、港埠收入及其他業務。公司開發特殊性混凝土，涵蓋高彈性模數、超高性能、透水、高強度輕質及巨積混凝土。集團透過子公司惠普經營矽酸鈣板等建材業務，國宇建材經營建材批發、零售及水泥銷售，台北港埠通商經營國際貿易及倉儲，睿信建設經營不動產出租、買賣及開發；重置資源科技與國晟建材則經營預拌混凝土製造及銷售。
