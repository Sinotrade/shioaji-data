summary_short: 設計與銷售網通、音訊、顯示及電腦周邊晶片。
summary_long: 瑞昱以積體電路設計與銷售為主要業務，2025年積體電路產品占營收99.76%。產品涵蓋10GbE乙太網路控制器、Wi-Fi與藍牙整合晶片、PC高傳真音訊方案、智慧顯示晶片及USB4集線器控制晶片。官方年報列出台積電與聯電為晶圓供應商，博世亦將瑞昱列入其全球最佳供應商名單。瑞昱的10GbE產品已進入地端AI伺服器平台，另推出面向資料中心與邊緣伺服器的100G光通訊晶片。機器人產品包括單對線乙太網PHY、控制器及EtherCAT MCU。2024年及2026年董事會分別決議向忠泰建設購置台北自用辦公室。
