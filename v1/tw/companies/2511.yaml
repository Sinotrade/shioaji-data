summary_short: 以集團營造工程與飯店收入為主，兼營房地產開發、BOT及物業服務。
summary_long: 太子建設集團經營營造工程、房地產開發、飯店、BOT與物業服務。2026上半年依公司法說會沖銷前部門收入計，營造占55.26%、飯店占32.6%，為主要營收來源。營造業務包含間接子公司大成工程，本業則開發銷售住宅與商辦。飯店事業包含間接子公司時代國際飯店及子公司日華金典國際酒店，公司亦參與台大、成大學生宿舍BOT。2025年1月，公司向寶慶國際及萬世成世界購入統一國際大樓27樓與六個車位，交易總額為新台幣768,880,000元。
