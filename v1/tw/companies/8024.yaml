summary_short: 設計與銷售消費性IC，產品包括語音、微控制器及錄音晶片。
summary_long: 佑華微電子以消費性積體電路的設計研發與銷售為主，2025年度消費性IC占營業收入100%。主要產品包括語音控制IC、微控制器、32位元高階應用IC及錄音IC。語音產品提供單聲道與雙聲道選擇；8位元微控制器整合GPIO、PWM及ADC，部分型號具LCD功能。32位元語音微控制器支援音訊編解碼與MIDI，錄音IC則有SRAM與Flash記憶體方案。海外架構包含直接與間接子公司，業務涵蓋投資、市場開發與業務支援及貿易。
