summary_short: 代理銷售血液透析等醫療設備、耗材與藥品，並提供醫務管理服務。
summary_long: 杏昌以醫療設備、耗材與藥品的代理銷售及醫務管理為主要營業領域。2025年合併營收中，透析機與透析耗材占35.01%，紅血球生成素與藥水類占29.52%，呼吸及麻醉占7.69%，其他業務占27.78%。產品涵蓋洗腎設備與耗材、牙科植體及導航設備、呼吸器與急救器材、醫用導管，以及脊椎微創手術設備。公司亦直接持有宏醫實業、杏華生技與杏昌健康服務全部股權。
