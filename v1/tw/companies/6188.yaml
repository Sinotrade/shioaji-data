summary_short: 以SSD、硬碟及擴充基座代工為主，並透過子公司達明製造協作機器人。
summary_long: 廣明提供儲存裝置與電腦週邊的設計及製造服務，產品包括SSD、外接式硬碟與擴充基座，服務模式涵蓋CM、ODM、EMS及JDM。2026年第一季營收組合為SSD占32%、硬碟占20%、擴充基座占21%、機器人占22%，其餘占5%。機器人業務由子公司達明經營，包含協作機器人及採用NVIDIA Jetson Thor模組的TM Xplore I人型機器人平台。廣達同時為母公司與有銷售往來的客戶。重大投資包括2024年總部大樓土建工程，以及2026年對馬來西亞子公司的現金增資。
