summary_short: 製造CNC車床、車銑複合工具機及配套自動化系統。
summary_long: 程泰從事CNC工具機及配套自動化系統業務，產品涵蓋臥式、立式、走心式車銑複合機與GMT-2000銑車複合加工中心。GMT-2000提供九軸控制、五軸同動加工。自動化系統可整合門型及關節型機械手臂，串聯加工設備形成生產線。依2024年度年報，集團合併營收中，加工機占50.56%，CNC車床占49.44%。2025年度合併財報列亞崴機電與TAITEC為子公司，YAMA SEIKI USA則屬透過海外子公司持有的間接子公司。
