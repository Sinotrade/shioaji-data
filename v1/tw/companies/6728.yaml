summary_short: 以空調家電銷售、商用洗烘衣設備及設備維運服務為主要業務。
summary_long: 上洋主要經營空調家電銷售、商用洗烘衣設備與設備維運服務。2026年第一季法說資料顯示，空調家電為最大營收事業，另有商用洗衣、新發事業及其他收入。公司銷售三菱重工家用空調，並提供商用洗烘衣設備；直營服務涵蓋設備提供、水電工程、安裝與維運。公司另經營生活及廚房家電自有品牌one-meter，並開展三菱重工燃氣發電機業務。集團架構方面，東洋洗濯與寶毓投資為直接子公司，日智家電則由寶毓投資持有，屬間接子公司。
