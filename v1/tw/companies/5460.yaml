summary_short: 製造精密金屬沖壓電子零組件及沖壓模具。
summary_long: 同協電子以精密金屬沖壓零組件及沖壓模具為主要業務，2025年沖壓電子零組件營業比重約98%，模具製作及其他相關業務約2%。產品涵蓋鐵框、金屬蓋、支架、彈片、框架、外殼及散熱相關零件，應用於通訊、資訊、車用、醫療與消費性電子。公司並開發5G、WiFi及DOCSIS 4.0金屬屏蔽零組件，以及低軌衛星地面接收設備的精密機構件。集團透過全資子公司Next & New Technology Ltd.持有蘇州新新電子科技有限公司全部股權。
