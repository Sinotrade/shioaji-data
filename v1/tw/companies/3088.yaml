summary_short: 以工業主機板、嵌入式系統及醫療、博弈與機器人運算平台為主要產品。
summary_long: 艾訊以工業電腦及嵌入式運算產品為主要業務，產品涵蓋無風扇嵌入式系統、工業主機板、醫療級嵌入式系統與觸控電腦，以及博弈主機板與客製化平台。2026年第一季依應用別區分，自動化占營收42%、基礎設施14%、商業應用32%、其他12%，自動化為最大類別。公司另提供ROBOX300自主移動機器人控制器，供倉儲機器人、工廠物流與空間受限的移動機器人設計使用，對應機器人題材的控制器與模組階段。
