summary_short: 製造液晶顯示模組、電容式觸控面板及嵌入式人機介面。
summary_long: 全台晶像以液晶顯示模組、電容式觸控面板與整合式觸控顯示器為主要產品。2025年電容式觸控面板及其模組銷售比重約56%，液晶顯示模組約42%。觸控顯示產品應用於工業控制、醫療設備與車載相關裝置，另提供結合處理器及工業通訊介面的Smart Embedded嵌入式人機介面。海外布局包括美國銷售子公司、丹麥服務子公司及東莞製造子公司；印度子公司持股81%，截至2026年6月底尚未正式營運。
