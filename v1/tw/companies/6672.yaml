summary_short: 研發、生產及銷售銅箔基板、散熱鋁基板與黏合片等電子材料。
summary_long: 騰輝電子-KY主要銷售銅箔基板、鋁基板及黏合片，2025年營收占比分別為37.66%、27.48%及19.22%。特殊材料應用涵蓋電動車散熱及低軌衛星通訊，另推出用於半導體封裝與晶片測試的chiplam材料組合。公司亦開發AI伺服器電源材料，2026年9月揭露規劃於第四季量產。具名客戶資料包括XReal與Teltonika；Koito及Valeo則為年報記載的歷史出貨對象。近年重大事件包括Pexus Industry股權投資、泰國子公司委建廠房，以及2026年核准承租昆山廠房擴產。
