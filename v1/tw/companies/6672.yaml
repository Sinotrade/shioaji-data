summary_short: 生產與銷售PCB用銅箔基板、黏合片及散熱金屬基板。
summary_long: 騰輝電子-KY透過集團生產與銷售印刷電路板用銅箔基板、黏合片及散熱金屬基板。tec-thermal系列提供熱管理材料，聚醯亞胺板材用於衛星、航太、軍事及高溫車用環境；tec-speed系列涵蓋高速低損耗與高頻PTFE材料。pro-bond與thermal-bond提供樹脂塗佈銅箔及薄膜介電材料，應用包括AI運算、伺服器背板與5G基礎設施。2026年上半年財報以亞洲及歐美為報導分部，未分列各產品營收占比。
