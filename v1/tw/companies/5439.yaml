summary_short: 以多層印刷電路板製造銷售為主，產品涵蓋厚銅、盲埋孔及高頻高速板。
summary_long: 高技以印刷電路板製造與銷售為主，產品涵蓋一至四十六層板。2025年度多層印刷電路板占營收98.82%，單、雙層板占1.12%，其他占0.06%。主要產品包括厚銅板、盲埋孔板、高頻高速板及散熱鋁基板，應用涉及網通、工業電腦、電源供應器及汽車。年報另揭露AI伺服器板、5G應用及汽車與電動機車充電模組，並列示低軌衛星產品研發成果。年報亦列有泰國轉投資子公司。
