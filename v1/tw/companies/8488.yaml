summary_short: 透過集團製造及銷售馬口鐵罐、鋁罐、底蓋，並提供印刷加工。
summary_long: 吉源-KY透過集團經營金屬包裝業務，主要產品為三片式馬口鐵罐、兩片式鋁罐與馬口鐵底蓋，並提供印刷及塗黃加工服務。馬口鐵罐應用於粥品、咖啡及食品罐頭，鋁罐應用於涼性飲料。依2024年12月公司簡報，2024年前三季鋁罐占營收54%、馬口鐵罐45%、加工收入1%，鋁罐為最大收入來源。公司集團投資架構列有Fareast Vantage Holdings Limited及Green Leaf Holdings Limited兩家直接子公司。
