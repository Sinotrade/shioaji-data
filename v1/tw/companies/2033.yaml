summary_short: 製造、加工及銷售一般鋼線、鍍鋅鋼線、預力鋼線與鋼纜。
summary_long: 佳大世界主要從事鋼線、鍍鋅鋼線、預力鋼線、預力鋼絞線及鋼纜等產品的製造、加工與銷售。2025年營收以一般鋼線為主，占65.94%，其次為鋼纜26.38%、鍍鋅鋼線7.66%，其他占0.03%。一般鋼線及鋅鋼線應用於電纜心線、電信架空線、彈簧床、運動器材與機械五金彈簧。預力鋼線、預力鋼棒及預力鋼絞線用於基樁、電線桿、高壓水管及預力橋樑；鍍鋅與不鍍鋅鋼索、鋼纜則用於漁業、商船、林業及吊索。
