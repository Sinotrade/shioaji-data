summary_short: 以金融事業投資及管理為業，主要獲利來自票券與證券子公司。
summary_long: 國票金控本身經營金融事業投資及管理，主要獲利來自票券與證券子公司。國際票券經營短期票券簽證、承銷、經紀、自營及保證；國票證券提供經紀、承銷、自營與融資融券服務。集團另透過全資國票創投提供投資資本，並於2024年投資設立全資國票金租賃，經營分期付款及資金貸與。國票金持有樂天國際商業銀行49%股權，該投資採權益法認列，未納入合併財報。2026年董事會通過以新台幣1,361,679,620元認購樂天銀行私募普通股，並與日方合資夥伴簽署合資參加合約書。
