summary_short: 以茶葉商品、現製茶飲及茶餐飲取得收入，餐飲為最大營收來源。
summary_long: 天仁以茶葉商品、現製茶飲及茶餐飲為主要業務。2025年合併營收以餐飲占54.10%最高，茶葉占41.57%，茶具及其他占4.33%。茶葉商品涵蓋特色茶、袋茶、冷泡茶與茶葉禮盒，另銷售茶具、茶食及綠茶粉。餐飲商品包括喫茶趣餐食與飲品、天仁釀茶所茶飲，以及CHAFFEE茶飲、輕食與茶甜點。子公司涵蓋天仁實業及香港、日本、澳門、新加坡與馬來西亞公司，並透過天仁實業持有華喬物產。
