summary_short: 以學名藥等西藥製劑及保健食品的製造銷售為主。
summary_long: 生達以西藥製劑研發、製造及銷售為核心，產品涵蓋高血壓、糖尿病、精神科及胃腸科用藥，並開發特殊學名藥。依2025年年報營運概況，合併營收中人用藥品占45.8%、保健食品占31.4%，其他產品占22.8%。保健食品同時包含自有品牌與ODM，品項涵蓋納豆紅麴及乳酸菌；集團產品也包含原料藥。截至2026年6月底，生展生物科技與生泰合成工業均為納入合併財報的子公司。
