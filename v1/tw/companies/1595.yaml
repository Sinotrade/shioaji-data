summary_short: 集團主要經營半導體設備再生、零組件及PCB曝光設備。
summary_long: 川寶集團以半導體設備再生與PCB曝光設備為主要業務。2025年半導體部門占營收68.97%，PCB部門占31.03%。PCB產品包括UV-LED防焊曝光機，以及適用內外層乾膜製程的LDI直接成像曝光機。子公司寶虹科技從事半導體設備再生，並提供自行開發的ALD／PEALD系統；寶驊科技亦為集團子公司。川寶另已完成TGV玻璃基板金屬化產線試產，拓展玻璃基板金屬化加工技術。
