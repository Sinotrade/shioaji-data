summary_short: 研發、生產及銷售石英諧振器、振盪器等頻率控制元件。
summary_long: 晶技主要從事石英諧振器、石英振盪器等頻率元件的研發、設計、生產與銷售。2026年3月法說揭露，2025年應用別營收整數占比為行動通訊29%、車用26%、連結應用19%、AI與運算各10%、網通6%。產品應用包括5G基礎網路、ADAS、電動車及AI伺服器，另已部署Wi-Fi 7相關產品。Apple將晶技列入FY2023供應商名單。2024年華新科與佳邦認購晶技私募並建立策略合作；2026年晶技董事會通過向頤盛投資處分台興持股，另規劃參與頤盛投資增資、取得5%股權。
