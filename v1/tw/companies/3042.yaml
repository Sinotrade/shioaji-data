summary_short: 研發、製造與銷售石英諧振器及各類振盪器等頻率控制元件。
summary_long: 晶技以石英頻率控制元件的研發、設計、生產與銷售為主要業務，產品包括石英諧振器、MHz石英振盪器、TCXO、OCXO及VCXO。其車規頻率元件涵蓋電動車及先進輔助駕駛系統應用，並開發符合5G Advanced需求的振盪器；頻率元件方案亦涵蓋AI伺服器、交換器與光通訊模組等雲端設備。官網2025年度資訊揭露車用營收占比25.9%、AI營收占比10.2%。主要子公司包括台晶科技國際開發、台晶（寧波）、台晶（重慶）、寧波晶創及印尼台晶科技。
