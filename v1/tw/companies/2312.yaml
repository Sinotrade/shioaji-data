summary_short: 以電子製造與設計代工賺取營收，涵蓋消費電子、儲存、列印及網通產品。
summary_long: 金寶從事電子產品製造與設計代工，產品涵蓋電子計算器、家用電器、印表機與多功能事務機、網路通訊設備及儲存產品。2025年全年營收組合中，消費性電子占43.43%、儲存裝置23.78%、影像產品21.37%、網路通訊10.18%、其他1.24%。公司亦列有充電樁研發、製造與銷售業務，並將AI伺服器電源及HVDC電源機櫃列為計畫開發產品。持股子公司包括凱碩科技與Kinpo International Ltd.。
