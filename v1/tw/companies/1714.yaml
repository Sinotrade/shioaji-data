summary_short: 以正烷屬烴、烷基苯及界面活性劑等清潔劑原料產銷為主。
summary_long: 和桐以清潔劑原料產銷及化學品貿易為主要業務，2025年化學品占合併營收94.23%，水泥與油品分別占5.13%及0.64%。產品涵蓋正烷屬烴、直鏈烷基苯、直鏈烷基苯磺酸及醇醚類界面活性劑，供下游清潔用品製造使用，另供應輕質環保溶劑。2025年年報具名列出P&G與UNILEVER為集團供貨對象。子公司中華全球石油經營油品與化學品儲槽及碼頭服務，和桐水泥從事水泥原料製造與買賣。2024年廈門金桐與南京和盛寶進行辦公室及車位的集團內部移轉；2025年子公司Hsin Tay取得Ally Solution與Big Success股權，屬投資架構調整。
