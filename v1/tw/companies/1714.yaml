summary_short: 以正烷屬烴、烷基苯等清潔劑相關化學原料製造與銷售為主。
summary_long: 和桐的主要化學產品包括正烷屬烴、直鏈烷基苯及直鏈烷基苯磺酸。公司在台灣高雄設有正烷屬烴生產基地，官網將正烷屬烴列為石化中間原料；直鏈烷基苯磺酸則可用於洗衣粉及洗衣精。依嘉實投顧整理的2025年營收組成，化學品約占94%，水泥約占5%，化學品為主要營收來源。2025年12月公告另確認，江蘇金桐化學工業有限公司為和桐的重要子公司。
