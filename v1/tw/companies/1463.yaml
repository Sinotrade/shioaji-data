summary_short: 透過子公司經營住商大樓開發與染整加工，2025年營收以營建為主。
summary_long: 強盛新透過子公司經營營建開發、紡織染整與不動產管理等業務。依2025年度年報，營建業務占合併營收75.08%，染整業務占24.75%，其他占0.17%。保強建設開發經營營建業務，內容包括委託營造廠商興建國民住宅及商業大樓，並辦理租售。強盛染整經營印花及染整事業，集團染整服務包括纖維製品的漂白、染色及整理加工。其他子公司包括從事不動產相關業務的宜盛資產管理，以及從事一般投資的威盛實業。
