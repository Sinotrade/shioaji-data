summary_short: 以車用裝置、車載通訊系統及智慧聯網裝置的開發製造與銷售為主要業務。
summary_long: 神數以車用裝置及車載通訊系統、智慧聯網裝置為兩大業務，2025年營收占比分別為56.13%、38.46%，其他業務占5.41%。車用產品包括K系列聯網型行車記錄器與MioWORK F840強固型車載平板，並提供VisionMax車隊雲端管理平台，整合車載影像與後台管理。智慧聯網產品涵蓋嵌入式邊緣運算系統、POS機及自助結帳系統。最新K系列導入5G通訊，支援多鏡頭影像傳輸。神達控股為其母公司。
