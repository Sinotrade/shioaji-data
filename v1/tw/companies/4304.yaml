summary_short: 製造電線電纜遮蔽材料、塑膠膜及積層包材，另經營電力工程。
summary_long: 勝昱科技以電線電纜用EMI遮蔽材料、塑膠膜與積層包裝材料的製造及銷售為主要業務，產品包括鋁箔聚酯帶、靜電防護材、拉鍊膠膜、聚乙烯膠膜與真空包裝袋。2025年營收以鋁箔麥拉帶為最大項目，占59.38%；塑膠膜占11.31%、積層膜占8.52%、真空袋占7.12%。公司亦投入電力工程業務，同年度設計及工程收入占7.32%。年報另列富達商行、東莞鴻錦應用材料等百分之百綜合持股事業。
