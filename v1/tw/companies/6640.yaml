summary_short: 研發、製造及銷售半導體封裝設備與相關精密模具。
summary_long: 均華以半導體製程設備及相關精密模具為主要營收來源，2025年占營收93.90%，其餘6.10%為零件和技術服務收入。主要產品包括晶片挑選機、黏晶機、雷射刻印機、沖切成型機與自動封膠機，其中黏晶機支援扇出型及2.5D／3D IC製程，雷射刻印設備可處理8吋及12吋晶圓。公司亦從事CoWoS相關先進封裝設備業務。均豪持股過半，子公司架構涵蓋英屬維京群島、馬來西亞及透過轉投資持有的蘇州公司。
