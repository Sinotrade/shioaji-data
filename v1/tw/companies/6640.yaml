summary_short: 均華製造半導體封裝設備與精密模具，主力為晶粒挑揀機及黏晶機。
summary_long: 均華主要銷售半導體製程設備與相關精密模具，2025年占營收93.9%。核心產品包括晶粒挑揀機與黏晶機；黏晶機同年占總營收22%，分選機仍是主力產品。公司另已開發面板級先進封裝黏晶設備，可整合不同尺寸與方向晶片的固晶作業。矽品向均華採購營業用設備；均華與均豪、志聖組成G2C聯盟，並與DISCO整合切割及取放設備。近年交易包括投資漢民測試系統、向祁昌取得不動產，以及董事會通過美國子公司與馬來西亞合資投資案。
