summary_short: 主要提供航空器維修服務，並製造航太零組件。
summary_long: 長榮航太以航空器維修及航太零組件製造為主要業務，維修範圍包括機體、發動機與飛機零組件，製造部門從事相關零組件的製造、加工及銷售。2026年上半年，維修與製造部門的外部收入分別為新台幣78.14億元及21.47億元，維修為主要營收來源。公司亦取得半導體設備零組件製造訂單，進行開發量產作業，並投入商用無人機與次世代產品開發。長榮航空為其母公司，於2026年6月底持有55.05%普通股。
