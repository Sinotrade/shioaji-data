summary_short: 設計與銷售顯示器驅動、時序控制、電源管理及觸控IC。
summary_long: 瑞鼎主要從事顯示器應用IC設計與銷售，晶圓製造及封裝測試委由專業廠商執行。2026年第二季，中小尺寸AMOLED驅動IC占營收49%，大尺寸驅動、時序控制及電源管理IC占33%，車載與工控驅動IC占18%。公司亦提供觸控IC及AMOLED TDDI，並已與客戶合作將Micro LED穿戴裝置產品導入量產。具名晶圓供應商包括聯電、台積電、世界先進及中芯國際；友達及其蘇州、廈門子公司為已揭露客戶。集團另透過RSA及昆山瑞創芯於2025年合資設立合肥瑞創芯。
