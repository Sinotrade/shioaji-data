summary_short: 益航集團以乾散貨運輸、船舶租賃及船舶管理服務取得收入。
summary_long: 益航集團以國際乾散貨運輸及船舶租賃為主要業務，運送鐵礦砂、煤礦、農產品等大宗物資，服務範圍遍及全球。2025年度航運收入為新台幣14.48億元，占重分類停業單位後合併營業收入97.22%，構成主要營收來源。公司亦提供船東專業船舶管理服務。益航直接持有First Steamship S.A.及First Mariner Holding Ltd.全部股權，Ahead Capital Ltd.亦為其子公司。
