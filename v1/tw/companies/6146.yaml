summary_short: 主要靠電子與無線通訊產品檢測認證服務賺取收入，另銷售電子零組件。
summary_long: 耕興主要提供電子與無線通訊產品的測試、認證及驗證服務，涵蓋電磁相容、產品安全、5G終端與Wi-Fi檢測，另銷售EMC相關電子零組件。依2025年報營業比重表，測試報告、安規及零件收入分別占86.48%、1.38%與12.14%。公司與華碩、博通及Tarana Wireless合作辦理Wi-Fi 7或6GHz產品認證，並與聯發科合作完成Wi-Fi 8平台認證。台灣是德科技及台灣羅德史瓦茲為其機器設備採購對象。
