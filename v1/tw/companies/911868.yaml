summary_short: 透過子公司製造、銷售及貿易LED照明與裝飾燈產品。
summary_long: 同方友友集團從事照明產品製造、銷售及貿易，年報將其列為單一經營分部，營收來自照明產品銷售。官網產品包括柔性霓虹燈、燈帶及LED燈串。集團透過廣東同方燈飾及越南子公司從事製造與銷售，香港及美國主要照明子公司則從事燈具貿易；另有子公司經營物業與基金投資。Resuccess Investments Limited為直接母公司，同方股份有限公司為最終母公司。
