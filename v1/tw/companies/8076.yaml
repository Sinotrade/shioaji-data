summary_short: 以商用電腦、POS系統、自助服務機及顯示設備為主要業務。
summary_long: 伍豐以商用電腦與終端設備為核心，提供零售、餐旅及自助服務場域所需硬體。主要產品涵蓋一體式POS系統、XPPC模組化觸控面板電腦、XELF自助服務機、XComp無風扇盒式電腦與XMonitor顯示器。面板電腦可用於POS、自助服務機及嵌入式整合，顯示器產品則提供搭配XPPC的機型。2024年合併財報將產品營收分為電腦及周邊設備與酒類批發，以前者為主要來源。直接子公司包括Firich International Co., Ltd.及AKAM Group B.V.。
