summary_short: 以數位相機、影像模組及車載與安防攝影機的設計製造、代工為主。
summary_long: 佳能企業以光學影像產品設計、製造與代工為核心，2025年年報列示光電產品占營收100%。商品涵蓋高階數位相機、數位攝影機、車用與監控攝影機及照相模組，另提供雙鏡頭深度相機及具邊緣運算功能的安防攝影機。公司與TIER IV合作開發自動駕駛車載相機，並向Mantis Robotics供應近接感測器；與Agility Robotics的關係包括股權投資及機器視覺、光學感測零組件開發。主要生產相關子公司包括東莞能率科技、越南佳智電能及一品光學。2026年公司公告增加越南子公司投資，宏羚亦公告向佳能出售佳能國際股權。
