summary_short: 設計、製造與代工數位相機、車載及安防攝影機、影像模組。
summary_long: 佳能企業以光學與數位影像產品的設計、製造及代工服務為主要業務，產品包括高階數位相機、運動攝影機、車用及監控攝影機與照相模組。2025年度營業比重按光電產品列示，占營收100%。其影像模組提供單鏡頭及多鏡頭整合，車載產品涵蓋先進駕駛輔助影像，智慧安防產品則採用邊緣運算技術。公司亦提供光聲電產品的設計、校正、測試及量產服務，官網列示無人機配件模組與陪伴型、互動型智慧機器人等應用。製造相關子公司包括越南佳智電能及透過BVI控股的東莞能率科技。
