summary_short: 製造瓶用聚酯粒、聚酯纖維、工程塑膠及光學薄膜。
summary_long: 新纖以聚酯材料為核心，製造瓶用聚酯粒、聚酯纖維與工業用紗、工程塑膠及光學薄膜。2026年上半年製造事業營收中，塑膠占63%、化纖占19%、光電占18%。工程材料應用包括電動車連接器與充電，以及伺服器零組件；公司亦開發海洋再生聚酯，拓展回收材料用途。光電業務中的TAC膜由子公司達輝光電研發與製造，應用於液晶顯示器偏光板。子公司欣泛亞聚酯工業則將回收寶特瓶加工為工業及食品級膠片。
