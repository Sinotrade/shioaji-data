summary_short: 主要銷售聚酯粒、工程塑膠、化纖及光學薄膜，塑膠為最大生產事業。
summary_long: 新纖主要經營塑膠、化纖與光電材料，產品包括聚酯粒、瓶用酯粒、工程塑膠、聚酯纖維及光學薄膜。2026年上半年，塑膠、化纖及光電分別占生產事業營收63%、19%及18%，此口徑並非合併總營收。公司揭露儒鴻、台達電、統一及黑松等客戶，未逐家揭露交易品項與營收占比。公司與Celanese合作生產NEOLAST纖維，並投資Ambercycle循環聚酯設施。近三年另有入股新昕資本、增資新光幼獅、自地委建總部及子公司不動產交易。2026年與極現科技、JEDSY簽署意向書，規劃成立醫藥物流無人機合資公司。
