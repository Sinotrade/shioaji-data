summary_short: 以航空貨運承攬為主，提供海運、報關、派送與倉儲物流服務。
summary_long: 捷迅主要經營跨境整合型物流服務，提供航空貨運承攬、海運承攬運送、報關、卡車派送，以及倉儲物流與跨境電商服務。2026年上半年合併營收中，空運服務占84%、海運服務占9%、其他服務占7%，收入結構以空運為主。依2025年年報截至年底的轉投資資料，公司持有Soonest Express, Inc.、捷迅（香港）有限公司及捷迅（中國）國際貨運有限公司全部股權，透過這些子公司形成海外營運布局。
