summary_short: 以顯示器與背光模組製造、導光板及智慧顯示系統整合賺取營收。
summary_long: 達運精密以顯示器與背光模組製造為核心，產品涵蓋商用顯示器、桌上型顯示器、工控顯示器、筆記型電腦及液晶電視。2025年上半年，製造服務占合併營收96.50%，系統整合占3.44%，多元布局占0.06%。其導光板技術包括防窺、高亮度、前光與曲面設計，另提供Mini LED背光。系統整合涵蓋專業顯示、智慧移動、醫療、零售與育樂應用，多元產品包括微針及器官晶片解決方案。友達光電為其母公司，遠近科技、微一生醫及新一智能列入子公司名單。
