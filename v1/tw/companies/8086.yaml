summary_short: 以六吋砷化鎵晶圓代工賺取收入，提供射頻及VCSEL光電製程。
summary_long: 宏捷科以六吋砷化鎵晶圓代工為核心，2025年砷化鎵晶片占營收100%。製程包括HBT、pHEMT及BiHEMT，服務手機與Wi-Fi射頻應用，另提供VCSEL製程，用於3D感測、LiDAR與光通訊。2026年5月官網記載400G／800G VCSEL產品持續放量。主要磊晶供貨商包括全新光電與高平磊晶；IQE於2024年公告供應砷化鎵晶圓，供宏捷科製造Lansus手機功率放大器。公司為中美矽晶子公司，並於2026年8月公告約28億元無塵室及產線整合工程規劃，交易相對人尚未確定。
