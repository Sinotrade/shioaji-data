summary_short: 提供LED、ICLED與光學感測元件，主要應用於智慧感測及汽車。
summary_long: 弘凱光電提供LED、感測元件及光電整合系統解決方案，營收應用分為智慧感測、汽車與其他。2025年智慧感測占51.9%、汽車應用占45.9%、其他占2.2%。產品涵蓋智慧座艙與車外照明用ICLED、紅外線LED、ToF飛時測距及穿戴式感測元件。光學編碼器已開始小量出貨，應用於伺服馬達與精密運動控制系統。官網另列mini LED 0603，供鍵盤照明應用。集團子公司包括弘凱光電（深圳）有限公司及弘凱光電（江蘇）有限公司。
