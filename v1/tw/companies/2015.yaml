summary_short: 以電爐煉鋼及軋延生產鋼筋、條線與型鋼，鋼筋為最大營收來源。
summary_long: 豐興以電弧爐與軋鋼設備生產鋼材，主要業務為鋼筋、條線與型鋼。依公司法說簡報，2025年三項業務銷售金額占比分別為55%、24%及21%，以鋼筋為最大來源。鋼筋產品用於混凝土結構，條線產品包括圓棒鋼與盤元，型鋼產品包括角鋼、槽鋼及扁鋼。根基營造2023年度年報將豐興列為鋼筋供應來源。2025年公司標購彰濱產業園區土地，交易總額約32.60億元，並與台灣鋼聯及豐堉資源合資成立豐力互聯；年底財報列示豐興持有豐力互聯52%股權。
