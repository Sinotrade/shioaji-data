summary_short: 以LED與光電元件封裝為核心，銷售發光、感測、光耦及功率元件。
summary_long: 億光以LED及光電元件封裝為主要業務，2025年合併營收組成為LED封裝產品94%、照明產品5%、其他產品1%。主要產品包括照明、車用、背光及顯示用LED、紅外線發光與受光元件、遙控接收模組、環境光與接近感測器，以及光耦合器、IGBT閘極驅動器與固態繼電器。公司亦提供SiC與GaN功率元件，並投入Mini／Micro LED技術開發；功率元件方案涵蓋電動車與AI伺服器應用。億光智能科技為集團子公司。
