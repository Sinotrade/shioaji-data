summary_short: 研發、生產及銷售連接器與連接線，主要應用於伺服器、車用及筆電。
summary_long: 凡甲科技主要從事電子連接器、連接線及其零組件的研發、生產與銷售，產品應用包括伺服器、車用及筆記型電腦。2026年第一季，伺服器產品占營收50%至57%，車用占30%至35%，其餘為筆電。公司供應AI伺服器高功率連接器，產品功率已提升至4200瓦。具名新聞列示的客戶包括Google、Amazon、Meta、Dell、比亞迪與寧德時代，其中比亞迪及寧德時代的採購應用亦涵蓋儲能設備連接器。公司持有越南子公司全部股權，2026年2月董事會決議依營運及資金需求分批增資，預計總額1000萬美元，用於擴充產能及充實營運資金。
