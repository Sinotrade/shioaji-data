summary_short: 以離岸風電套管式水下基礎製造、組裝及專案管理取得收入。
summary_long: 世紀能源主要製造離岸風電套管式水下基礎與基樁，並提供大型組裝、專案管理、供應鏈及碼頭管理服務。2025年套管式水下基礎占營收96.52%，基樁占1.19%。具名供應專案包括沃旭大彰化、CIP渢妙，以及風睿能源海盛與海廣風場。世紀鋼鐵結構為母公司，亦為構件供應商，2025年占進貨30.49%；世紀樺欣也供應腿管、斜撐等構件。2026年公司公告向台灣科慕取得觀音土地，並通過以發行新股方式收購世紀樺欣全部股份的交易案，尚未據此認定已完成交割。
