summary_short: 製造離岸風電套管式水下基礎與基樁，並提供組裝及專案管理服務。
summary_long: 世紀風電以離岸風電水下基礎製造為核心，主要產品為套管式水下基礎及基樁式水下基礎。2025年兩項產品分別占營收96.52%與1.19%，其他業務占2.29%。公司另提供水下基礎大型組裝、專案管理、供應鏈管理及碼頭管理服務。依2026年第二季財報，世紀鋼鐵結構為其母公司，旗下世紀鈽錸特持股66.60%，該子公司已獲核准解散，尚待清算。
