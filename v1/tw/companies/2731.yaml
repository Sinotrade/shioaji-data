summary_short: 以國內外團體旅遊為主，另提供自由行、票務與簽證代辦服務。
summary_long: 雄獅主要經營團體旅遊，安排國內外行程、交通與食宿，另提供自由行元件訂購、客票代售及出入境簽證代辦。2025年團體旅遊收入約283.39億元，占合併營收約94%。航空供應來源包括長榮航空與中華航空，長榮於2024年占進貨淨額13.97%。鐵道服務取得臺鐵海風號、山嵐號營運權，並與國泰航空合作香港機加酒自由行。2025年董事會通過投資新越開發創業投資有限合夥，授權金額上限為新台幣1.2億元。
