summary_short: 以國內外團體旅遊為主要收入來源，另提供自由行、票務及簽證代辦服務。
summary_long: 雄獅主要經營國內外團體旅遊，安排觀光行程、食宿與相關服務；2025年度合併團體旅遊收入為283.39億元，財報揭露約占營業收入94%。另向非參團旅客提供FIT旅遊元件諮詢與訂購，2025年度FIT收入為4.81億元。服務亦包括國內外交通客票代售、代購、行李託運及出入境簽證代辦。組織方面，直接子公司包括寶獅旅行社、Lion International Holding Limited及雙獅投資；雄獅通運、欣聯航國際旅行社及雄獅小客車則為間接子公司。
