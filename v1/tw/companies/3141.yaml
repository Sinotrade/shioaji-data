summary_short: 以液晶與電子紙顯示驅動IC設計、銷售為主要收入來源。
summary_long: 晶宏以顯示驅動IC的研發與銷售為主要業務，產品涵蓋液晶顯示、電子紙及觸控控制。2025年顯示器驅動IC占營收91.46%，其他產品占8.54%。液晶產品應用於工控、醫療及車載顯示，電子紙產品包含電子貨架標籤驅動與控制IC。公司亦提供馬達控制IC與GaN預驅動IC，涉及水冷馬達控制及電源應用。主要子公司包括超核感科技、超炫科技及控股公司JPS Group Holdings, Ltd.。
