summary_short: 製造陶瓷散熱基板與陶瓷電路板，主要營收來自車用照明應用。
summary_long: 立誠光電主要生產陶瓷散熱基板，並提供陶瓷電路板製程整合與設計，應用涵蓋LED及車用照明。2024年營收組成以車用照明67.23%為主，高功率照明14.55%，其他18.22%。產品包含DPC陶瓷電路板、雷射二極體用氮化鋁與氧化鋁Submount、3D感測封裝材料，以及功率電子與通訊用陶瓷基板。3D感測產品對應VCSEL與EEL封裝需求，通訊產品可用於5G陶瓷濾波器金屬化。一詮精密工業為其母公司。
