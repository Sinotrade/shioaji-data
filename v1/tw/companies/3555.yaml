summary_short: 主要經營遊戲娛樂產品通路、電子產品買賣及區塊鏈資訊系統開發。
summary_long: 博士旺的營業收入來自消費性娛樂通路、電子產品銷售、資訊系統開發及生技產品。2026年第一季以消費性娛樂通路收入最高，其次為電子產品及資訊系統開發。消費娛樂業務銷售遊戲主機與軟體；數位金融業務提供資產保管、供應鏈金融及系統整合方案，另有Soteria分散式安全儲存與Pistis DID身分認證產品。集團直接子公司包括天行生技與博斯資訊安全，合流科技則由博斯資訊安全持有；威剛科技為集團最終母公司。
