summary_short: 建大以製造與銷售機車、工業車、汽車及自行車輪胎為主要業務。
summary_long: 建大以車輛用輪胎為主要業務，產品涵蓋機車及斜交胎、工業用車胎、汽車輻射層胎與自行車內外胎。2026年1至5月，機車、斜交及工業胎合計占合併營收48%，汽車輻射層胎占33%，自行車胎占19%。汽車產品另有EMERA 616EV電動車專用輪胎，對應電動車零組件應用。集團旗下的建大橡膠（越南）有限公司、建大橡膠（印尼）有限公司及建豐工業股份有限公司，均從事車輛用內外胎的生產與銷售。
