summary_short: 製造銷售機車、工業車、汽車及自行車輪胎。
summary_long: 建大製造及銷售輪胎，產品涵蓋機車、斜交與工業車胎、汽車輻射層胎及自行車內外胎。2026年前五月，三類產品分別占合併營收48%、33%及19%。KENDA自行車胎除供車款配套，也由美國子公司經營售後銷售；Giant及MERIDA官方車款規格均列有建大輪胎。公司另供應本田美國市場備用胎，電動車產品包括Emera 616EV專用輪胎。集團透過越南、印尼及中國子公司從事輪胎生產。2025年由中國子公司取得昆山台緣新能源全部股權，2026年另向子公司建豐承租斗六土地與廠房。
