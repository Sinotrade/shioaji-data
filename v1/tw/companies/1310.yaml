summary_short: 主要生產及銷售苯乙烯單體，另有對二乙苯、甲苯與乙苯。
summary_long: 台苯主要產品包括苯乙烯單體、對二乙苯、甲苯及乙苯。2024年度營業比重以苯乙烯單體為主，占95.1%，對二乙苯占1.8%，其他占3.1%。苯乙烯單體用於製造聚苯乙烯及ABS樹脂；乙苯則是苯乙烯製程的中間產品，進一步經脫氫反應製成苯乙烯。對二乙苯主要作為Parex與Eluxyl製程生產對二甲苯時使用的脫附劑。甲苯為苯乙烯製程的副產品，主要用途為有機溶劑。
