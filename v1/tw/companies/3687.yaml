summary_short: 以第三方支付及電子支付服務為主，兼營遊戲與電商工具。
summary_long: 歐買尬集團以第三方支付、電子支付及數位娛樂服務為主要業務。2025年合併營收中，勞務收入占95.97%，線上遊戲軟體收入占0.42%，其他收入占3.61%。旗下綠界科技提供金流、物流及電子發票等電商服務，歐付寶電子支付提供交易款項代收付及帳戶間轉帳服務。遊戲業務涵蓋LUNA Infinite及聯運遊戲，另經營歐買尬虛寶交易與簡訊電郵王平台，提供虛擬寶物交易及企業訊息發送工具。
