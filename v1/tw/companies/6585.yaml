summary_short: 研發製造TPU薄膜、密封件與管帶，以薄膜為主要營收來源。
summary_long: 鼎基以高機能熱塑性聚氨酯（TPU）材料的研發、製造與銷售為主，產品包括薄膜、密封件與管帶。2025年薄膜占合併營收91.31%，密封件占5.38%，管帶占3.25%。公司具備原料配方開發、TPU粒料製造到成品加工的垂直整合能力；薄膜應用涵蓋汽車、醫療與電子，密封件用於液壓設備，管帶包括氣動管、飲水管及傳動輸送帶。海外布局包含中國、美國、越南與歐洲子公司，美國行銷公司則透過當地控股子公司間接持有。
