summary_short: 主要設計、製造與銷售磁性元件，另提供無線充電與智慧電源模組。
summary_long: 聯寶以磁性元件的設計、製造與銷售為主要業務，產品涵蓋PoE、LAN及TLVR等元件，並提供高密度、高瓦數電源模組。2025年磁性元件占營收89.45%，無線充電占10.55%。無線充電業務包含發射與接收模組、磁吸充電成品及工業級充電模組，公司亦為蘋果MFI授權製造商。另以低功耗藍牙Mesh技術開發智慧照明、智慧家居及智慧樓宇的聯網與供電模組。其磁性元件也應用於5G小型基地台與電動車相關電源系統。
