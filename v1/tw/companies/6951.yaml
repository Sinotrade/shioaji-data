summary_short: 以醫療及事業廢棄物清運為主，兼營再利用處理、塑木建材與廢水處理。
summary_long: 青新以台灣醫療及事業廢棄物清運為主要收入來源，2025年兩者分別占營收44.09%及46.70%。另有醫療廢棄物再利用處理、青新木銷售、廢水處理及專案勞務收入。2026年法說會揭露，斗六廠空瓶回收處理產線已於4月中旬正式投產，產製塑膠碎片及塑膠粒。日友環保科技為母公司，2026年3月24日持股57.42%；青新並全資持有良衛環保工程與正新環保工程。
