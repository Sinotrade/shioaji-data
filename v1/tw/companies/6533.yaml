summary_short: 提供處理器矽智財與開發工具，收入來自授權、權利金及維護服務等。
summary_long: 晶心科以矽智財授權、權利金及維護服務等取得收入，2025年授權收入占65%、權利金占19%，維護服務及其他占16%。產品涵蓋32與64位元RISC-V處理器核心、AX46MP(V)多核心向量處理器，以及符合ISO 26262 ASIL-B/D的D23-SE功能安全核心。另提供AndesAIRE邊緣深度學習加速器與AndeSight整合開發環境，支援系統晶片及嵌入式應用開發。
