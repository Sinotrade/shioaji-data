summary_short: 以LED及螢光照明燈具為主要營收，另銷售電子零組件。
summary_long: 吉祥全集團以光電照明應用產品為主要營收來源，2025年占營收89%，電子應用及多媒體資訊產品占9%，其他業務占2%。照明產品包括LED與螢光燈具，應用於建築室內、室外及零售展示等商用照明。官網電子零組件品項包括DDR3、DDR3L及DDR4記憶體模組、電源管理IC與感測器。依2025年第三季合併財報，子公司包括經營照明設備的大友國際光電，以及華訊創業投資、浩瀚動力；另透過浩瀚動力持有大吉祥國際建設與雷博電子。
