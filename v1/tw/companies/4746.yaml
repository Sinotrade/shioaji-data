summary_short: 以原料藥製造銷售為主，並提供CDMO、ADC與針劑開發製造服務。
summary_long: 台耀以原料藥開發、生產與銷售為主要業務，並提供委託研發代工生產服務。2025年合併營收中，膽固醇磷酸鹽結合劑占33.60%，維他命D衍生物占15.71%，CDMO占11.08%，類固醇占11.06%。其ADC服務涵蓋開發設計、偶聯分子與高效價藥物研發，以及GMP生產與針劑充填；自有Eribulin注射劑亦已取得歐洲上市核准。主要子公司包括台新藥、台昂生技及SynChem-Formosa，其中台新藥從事生技新藥研發。
