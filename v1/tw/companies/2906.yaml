summary_short: 經營商品出口、服飾零售及餐飲，並透過子公司經營醫療器材通路與能源業務。
summary_long: 高林的營收來源涵蓋商品貿易、品牌零售、醫療通路及其他投資事業。出口商品包括家用五金、電器、室內外家具與成衣，國內業務包括服飾配件銷售及餐飲代理。醫療業務主要透過子公司杏昌生技經銷醫療器材與耗材，以血液透析相關產品為主。2026年上半年合併營收以生技醫療34.5%最多，其次為貿易26.2%、其他投資20.6%及時尚18.7%。主要子公司另包括美之心國際、高昌生醫及高明能源；綠能業務包括儲能案場，並將車用充電系統整合列為業務重點。
