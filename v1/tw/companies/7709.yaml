summary_short: 製造與銷售電腦數控立式車床、車銑複合加工機，並提供維修服務。
summary_long: 榮田精機以電腦數控工具機製造與銷售為主，主要產品包括電腦數控立式車床、立式車銑複合加工機與龍門型車銑複合機。2025年電腦數控車銑複合加工機營收占52%，為最大收入來源；電腦數控車床占44%，維修收入及其他占4%。車床用於切削各式金屬及特殊材料零組件，車銑複合機兼具切削與銑削功能；產品應用涵蓋航太、風電、一般機械、金屬品加工及電子產業。
