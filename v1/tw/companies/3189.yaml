summary_short: 以ABF、BT等IC封裝載板為主，並合併晶碩光學的隱形眼鏡業務。
summary_long: 景碩提供ABF及BT載板，FCBGA產品用於GPU、CPU等高階晶片，並面向AI資料中心與伺服器應用。2025年合併營收中，載板部門占82.11%，光學部門占17.89%；子公司晶碩光學從事軟式隱形眼鏡設計、研發、製造與銷售。和碩為集團母公司。近期具名載板客戶證據包括AMD、美光與輝達；高通、聯發科、博通、TI及Apple則分別保留為來源當時的歷史關係。2026年景碩投資海昇微電子，並公告取得平鎮土地、向盟立訂購設備及取得玄通廠務工程。2024年公告的中國子公司股權出售案已於2025年取消。
