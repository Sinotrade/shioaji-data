summary_short: 經營太陽能工程與售電，以及光學膜材製造與加工代工。
summary_long: 迎輝科技經營光學膜材，以及太陽能工程與售電。2026年上半年合併太陽能部門對外收入為2,333.2萬元，光學膜部門為1,763.7萬元，太陽能為較大的營收來源。公司持有盛暉能源55%及東今國際100%股權，兩家子公司從事太陽能系統規劃建置。膜材產品包括量子點膜、ITO透明導電膜、防窺膜、阻水膜及3D投影銀幕，另提供捲對捲真空濺鍍代工。量子點膜可搭配Mini LED背光，終極銀幕與RealD合作開發；公司亦受未具名美國低軌衛星客戶委託，代工生產太空環境防護膜。
