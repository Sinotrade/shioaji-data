summary_short: 製造銷售金屬置物架、商用設備及倉儲收納產品。
summary_long: 益張以金屬置物架、商用置物設備及功能架的製造加工與銷售為主。2025年營收以置物架系列44.87%為最大來源，商用置物設備占34.94%，另有伸線加工、功能架及其他產品。置物架用於展示與收納，商用設備涵蓋醫療照護、倉儲、飯店餐飲及商店展示。官網另列OGEE電控移動儲物裝置，可串接網路或WMS系統；客製化自動倉儲用棧板可搭配AGV／AMR等設備。集團子公司包括翔貿工業、新秀家居與奕天馬等。
