summary_short: 主要生產與銷售PPTC自復式保險絲，另提供過電壓保護及功率元件。
summary_long: 富致科技主要生產及銷售PPTC自復式保險絲。2025年營收以SMD型占53.72%最多，DIP型占32.87%，其他占13.40%。PPTC產品涵蓋插件式、表面黏著式、高電壓、高溫及電池用系列，另提供MOV壓敏電阻、TVS二極體、複合式保護元件與矽MOSFET。年報列示產品用於車用與電動車電子，並持續交貨至Tesla車系。集團透過全資投資子公司持有蘇州富鼎商貿有限公司，後者經營電子零組件買賣。
