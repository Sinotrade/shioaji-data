summary_short: 以半導體矽晶圓及晶棒製造銷售為主，產品涵蓋磊晶、SOI與化合物半導體材料。
summary_long: 環球晶以半導體矽晶圓與晶棒的研發、製造及銷售為主，2026年上半年財報中，半導體晶片產品為最大收入項目。產品包括拋光片、磊晶片、退火片、擴散片與SOI晶圓，並布局SiC及GaN on Si材料。中美矽晶為其母公司，環球晶位於晶片製造的上游材料環節。已具名確認的客戶包括台積電、聯電與美光；Intel關係採歷史供應商名單確認。美國子公司GlobalWafers America與Apple建立供應鏈合作，其矽料來源包括Hemlock Semiconductor。近年投資事件包括設立與增資環球晶資本，以及美光宣布的5億美元策略融資安排。
