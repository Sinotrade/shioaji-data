summary_short: 研發、製造及銷售衛星接收、有線電視傳輸與住宅寬頻設備。
summary_long: 兆赫電子以數位有線視訊及衛星通訊傳輸系統相關產品的研發、製造與買賣為主要收入來源。衛星接收產品包括低雜訊降頻器與dCSS，住宅寬頻產品涵蓋G.hn轉接器、XGS-PON設備及Wi-Fi路由器；另提供有線電視放大器與ATSC 3.0機上盒。公司官網亦列示5G及物聯網裝置。2026年第一季合併財報將主要收入歸於數位有線及通訊產品部門，其他營運部門包括資訊軟體服務與智慧財產權開發等業務。
