summary_short: 設計與銷售利基型記憶體IC，另提供音訊放大器與電源管理晶片。
summary_long: 晶豪科從事利基型記憶體IC設計與銷售，產品涵蓋DRAM、LPDRAM、PSRAM、NOR Flash、NAND Flash及多晶片記憶體，另提供音訊放大器與電源管理晶片。2025年8月公司說明的營收組合約為DRAM 55%、Flash 35%、Audio 10%，屬當時揭露的概數。晶圓供應方面，公司與力積電維持長期代工合作，NOR Flash亦在XMC投片。公司另開發面向邊緣AI的aiPIM記憶體內運算平台，並與Cadence、愛普科技及工研院共同展示。依2025年底資料，晶鎂電子為透過長風投資持有的間接子公司。
