summary_short: 以海事及離岸電氣用品通路為主，另提供工程、資安與熱感測產品。
summary_long: 明輝環球以海事與離岸電氣用品通路為核心，透過子公司供應船用電纜、照明設備與配件。2026年上半年電氣與技術供應占合併營收78.58%，整合工程占9.72%，安全事業占11.69%。工程子公司提供海事工程、船舶電動化與混合動力服務；資安子公司提供IT與OT網路防護顧問及產品代理；熱感測子公司提供群體體溫篩檢與船用夜視系統。集團另經營LED照明改裝，並透過關聯企業參與LED燈具設計製造。
