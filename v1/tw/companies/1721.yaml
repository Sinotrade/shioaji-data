summary_short: 以特用化學品、植物保護用藥、TPU膠粒與PU樹脂銷售為主。
summary_long: 國慶科技以特用化學品為主要營收來源，2025年度占57.19%；植物保護用藥、熱可塑性聚氨酯膠粒及樹脂分別占26.70%、11.24%與4.07%。特用化學品包括橡塑膠抗氧化劑、成核劑、壓克力鋅鹽交聯助劑、DOPO無鹵阻燃劑及DMAB電子化學還原劑。交聯助劑用於高爾夫球球芯，DOPO用於銅箔基板與印刷電路板，DMAB用於PCB黑化及化學電鍍。TPU部分發泡材料用於鞋材與運動產品，PU樹脂用於人工皮革、機能性紡織品等塗層與接著劑。公司另提供TPV，並揭露開發AI伺服器與通訊板材所需的BMI、PPE化學材料；2025年11月法說所述量產仍為後續計畫。
