summary_short: 經營移工匯款、電信預付卡代理，並透過子公司銷售消費品及提供票務服務。
summary_long: 統振以在台外籍移工為主要服務對象，經營Qpay薪資匯兌、電信預付卡代理及手機加值服務。2025年合併營收中，通訊服務占81.97%，IC及其他通路事業占18.03%，年報未另拆分匯款與預付卡營收。旗下東旺利從事電池、保健食品與化妝品零售批發；快速購旅行社提供國內外客票代購。統振持有兩家公司股權分別為92.26%及67%，相關消費品通路與票務業務由子公司營運。
