summary_short: 經營百貨零售、玩具城與停車場，並取得電影院及不動產租賃收入。
summary_long: 欣欣大眾市場以百貨、電影院及租賃三個部門取得營業收入，百貨項目包含百貨及超級市場、玩具城與停車場。2025年度百貨部門收入為新臺幣6,832.5萬元，是最大營收來源；電影院部門收入為2,640萬元，租賃部門收入為3,602.4萬元。租賃業務包括以營業租賃方式出租自有土地及建築物。電影院部門的相關收入在財報明細列為影片收入。
