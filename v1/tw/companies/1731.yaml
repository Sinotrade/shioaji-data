summary_short: 以洗護髮、染髮及個人清潔用品為主，另經營醫藥產品銷售。
summary_long: 美吾華以個人清潔與美髮用品為主要業務，產品涵蓋洗護髮、染髮、沐浴及個人保養，並具備研發、生產與品牌經營能力。另設醫藥事業部，從事國內外醫療健康產品引進與銷售，官網列有懷特血寶凍晶注射劑、懷特痛寶軟膠囊等品項。2026年上半年，美吾髮事業部收入高於醫藥事業部，為主要營收來源。海外架構包括直接持有的薩摩亞美吾華，以及經該公司間接持有的香港美吾華與美吾髮化妝品（上海）有限公司。
