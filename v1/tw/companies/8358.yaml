summary_short: 製造及銷售電子級電解銅箔，供銅箔基板、電路板及高頻高速應用。
summary_long: 金居以電子級電解銅箔製造與銷售為主要業務，2025年度年報揭露電解銅箔營業比重為100%，產品提供銅箔基板及印刷電路板使用。公司揭露AI伺服器與一般伺服器內層電路板用HVLP3、HVLP4及RG系列銅箔，官網亦列出5G天線用高頻材料。具名媒體報導確認台光電、聯茂的銅箔供應關係，較早報導亦列台燿為客戶。金居直接持有BVI投資子公司，並透過該公司間接持有上海銅箔銷售公司。2025年第一季以新台幣2.9億元投資恆勁科技；2026年9月董事會另通過擬設立東南亞子公司案。
