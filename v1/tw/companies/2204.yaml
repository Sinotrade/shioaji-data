summary_short: 以商用車、乘用車及相關零組件的製造銷售為主要收入來源。
summary_long: 中華汽車以整車及相關零組件製造銷售為主，2025年度年報揭露該業務占營業比重98%。產品包含Delica商用車、Outlander休旅車及MG品牌車款，並自主研發3.5噸ET35電動商用車。日本三菱自動車與上海汽車國際商貿為進口車材零件供應商；中華汽車另供應FUSO車輛及國產售服零件予台灣戴姆勒亞洲商車。新竹物流已導入30台ET35。2026年，台鈴公告中華汽車將轉讓eMOVING產銷體系，中華汽車則提供核心技術授權，並持續經營充電站維運與電池租賃服務。
