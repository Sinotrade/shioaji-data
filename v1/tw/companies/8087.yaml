summary_short: 以太陽光電電廠開發建置、儲能及電廠資產管理服務取得收入。
summary_long: 麗升能源以再生能源電廠開發與建置為主要業務，提供太陽光電案場評估規劃、建置及維運管理服務。太陽光電服務涵蓋漁電共生、農電共生、工業廠房等屋頂型及地面型案場，並提供電廠投資與財務資本規劃。儲能業務包含系統服務、案場建置管理及電力交易平台調頻備轉服務；資產管理服務涵蓋電廠營運、維運與發電效能追蹤。2025年度個體財報揭露工程合約與勞務服務收入，主要子公司包括麗崴新能源、香印永續及廣靖科技。
