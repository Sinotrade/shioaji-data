summary_short: 提供遊戲開發、聯運及社群電商平台服務。
summary_long: 華義的業務包括美術設計代工、線上遊戲與數位內容。2023年年報揭露，美術設計代工占營收83.64%，線上遊戲及數位內容占16.36%，此比例僅代表該年度。2026年8月法說所列平台為遊戲大亂鬥，服務涵蓋社群與電商；遊戲業務另包括自研與IP聯運，簡報揭露已有兩款自研遊戲完成。公司官網審計委員會紀錄另明列香港子公司華逸科技娛樂有限公司。
