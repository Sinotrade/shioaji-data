summary_short: 以電源管理IC為主，另銷售磁場感測、馬達驅動及微控制器IC。
summary_long: 類比科主要從事半導體積體電路的設計、研究與開發，以電源管理IC為最大營收來源。2025年電源管理IC占營收72.26%，磁場感測及馬達驅動IC占26.30%，微控制器IC占1.44%。電源管理產品涵蓋穿戴式及手持式AMOLED顯示器應用；馬達產品包括單線圈與三相直流無刷馬達驅動IC，微控制器則有通用型與整合型產品。依2026年第二季財報，致新科技持有43.54%股權，為其最終母公司。
