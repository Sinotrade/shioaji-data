summary_short: 以蝶閥為主要收入來源，提供工業流體控制閥門及外購閥產品。
summary_long: 捷流閥業以工業流體控制閥門為核心，產品包括三偏心蝶閥、雙偏心蝶閥、直軸型橡膠蝶閥、三片式螺紋球閥及V型控制球閥。2024年度營收組成為蝶閥58.81%、外購閥38.54%、其他2.65%，蝶閥為最大收入來源。三偏心與雙偏心蝶閥用於高低溫、高壓及防火等工況，直軸型橡膠蝶閥涵蓋造船、空調及水處理應用。集團直接持有佳和閥業與安圭拉投資公司，並透過境外子公司間接持有蘇州閥門製造與銷售公司。
