summary_short: 以電漿蝕刻、清洗及去膠渣設備銷售與維修取得營收。
summary_long: 暉盛科技以銷售電漿製程設備及維修取得營收，2025年機台銷售占84.84%、維修收入占15.16%。產品包含反應性離子電漿蝕刻機、去膠渣機、清洗機與去光阻機，用於蝕刻、殘膠去除、封裝前清潔與光阻去除。RIE設備應用涵蓋CoWoS、2.5D／3D IC、FOPLP及ABF／BT載板製程。截至2026年6月底，直接持有Stable Promise Group Co., Ltd.全部股權，並間接持有昆山金暉盛電子商貿有限公司全部股權。
