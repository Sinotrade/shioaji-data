summary_short: 代理半導體電子零組件，提供技術服務、軟體與AI系統整合方案。
summary_long: 茂綸主要從事半導體電子零組件代理買賣及技術服務，代理產品涵蓋可程式邏輯元件、微控制器、類比與功率元件及記憶體，應用領域包括伺服器、通訊與工業電子。2025年半導體電子零組件占營收98.37%，其他營業收入占1.63%。公司也提供CAE模擬軟體、GPU運算及網通系統方案，並整合機械手臂與AI視覺，提供智慧瑕疵檢測方案。駿日股份有限公司為其直接母公司，另直接持有數位資安系統股份有限公司50.1%股權。
