summary_short: 研製矽基感測與保護元件、LED晶粒及光通訊接收元件。
summary_long: 鼎元主要研發、製造與銷售光電半導體元件。2025年矽元件占營收70.4%，產品包括光電晶體、光敏二極體及電路保護元件；化合物半導體元件占28.9%，涵蓋可見光、紅外光LED及磷化銦感測產品，其餘0.7%為LED模組應用設計與製造。磷化銦感測產品應用於光纖通訊模組及短波紅外光感測。公司亦提供Micro PD接收元件，參與友達的Micro LED CPO光學模組合作開發。2026年上半年，對富采光電的銷售額為新台幣117,377仟元，占財報揭露銷售總額9.49%。
