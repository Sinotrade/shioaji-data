summary_short: 以LED背光模組製造與銷售為主，另開發車燈及顯示光學技術。
summary_long: 先益電子以背光模組製造與銷售為主要業務，2025年合併背光模組收入為新臺幣11.35億元，其他產品收入為1.61億元。產品及技術涵蓋LED背光模組、Mini LED顯示器、前光模組、汽機車頭燈模組，以及模具設計製造與高速射出成型製程。公司間接持有的東莞先益電子與東莞可盛光電從事中小尺寸背光模組製造及銷售，另持有誠益光電科技49.17%股權並具控制力，其業務為光學產品製造及銷售。2024年報已揭露Mini LED顯示器商品化，據此列入Mini／Micro LED題材。
