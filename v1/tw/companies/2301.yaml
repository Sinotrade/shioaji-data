summary_short: 以伺服器、資訊電子電源管理及光電元件為主，另提供液冷與車用電子。
summary_long: 光寶以電源管理與光電元件為主要業務，2025年雲端及物聯網、資訊及消費性電子、光電部門營收占比分別為45%、38%與17%。雲端產品涵蓋AI伺服器機架式電源與CDU液冷，並與NVIDIA合作開發電源方案；資訊電子產品供應遊戲主機及低軌衛星地面接收設備，車用產品包含ADAS鏡頭模組與電動車充電設備。公開資料記載其對微軟、AWS、SpaceX及三大遊戲主機品牌的供貨關係，各筆關係依來源日期記錄。近三年公告包括投資Cosel、DenseLight與DCX、公開收購宇智，以及由子公司收購Dialight交通事業與規劃AmpUp併購。
