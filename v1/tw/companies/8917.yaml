summary_short: 以管線供應天然氣賺取售氣收入，另有裝置工程及租賃收入。
summary_long: 欣泰以公用天然氣供應為核心，服務範圍涵蓋新北市樹林、土城、三峽、鶯歌、蘆洲、泰山、五股、林口、八里，以及桃園市龜山區迴龍里。2024年度售氣收入為22億4,847.9萬元，為最大營收來源；另有裝置收入3億3,561.5萬元、其他收入1億8,269.7萬元及租金收入484.2萬元。公司亦提供燃料導管安裝工程、微電腦瓦斯表裝置及不動產租賃服務；截至2024年底，微電腦表累計換裝212,149只，換裝比率76.96%。
