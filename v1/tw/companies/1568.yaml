summary_short: 製造汽車變速箱、傳動系統與新能源車零組件。
summary_long: 倉佑以汽車傳動系統零組件製造為主要業務，2025年汽車類自動變速箱零組件占營收65.69%，新能源車馬達占15.41%，重型卡車離合器零組件占9.23%。產品涵蓋燃油車自動變速箱傳動與換檔零件、扭力轉換器零件，以及重型卡車離合器與油泵系統零件；產業機械產品用於採礦機械、農用機械及堆高機傳動系統模組。新能源車產品應用於新能源汽車與電動自行車齒輪箱，另有半導體設備零件。
