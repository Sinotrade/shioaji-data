summary_short: 以紙張、紙板與紙漿產銷為主，另經營紙膠帶及特殊功能用紙。
summary_long: 華紙主要經營紙張、紙板、紙漿與紙膠帶，2025年營收比重分別為68.50%、14.28%、11.25%與3.73%。印刷用紙提供塗佈與未塗佈等選擇，包裝紙板供各類包裝盒使用；紙漿則生產短纖原生漿。特殊用紙包括無氟防油紙、光電玻璃襯紙及碳纖維布製程離型底紙。華紙為永豐餘投控的子公司，並透過CHP International (BVI) Corporation持有廣東鼎豐紙業。公司與康軒合作將回收書籍再製為教材卡紙，並於2025年董事會決議出售觀音廠部分土地予元太；2026年另決議出租台東廠部分土地及設施予三越企業。
