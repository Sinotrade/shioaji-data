summary_short: 開發、製造與銷售家用及商用健身器材、醫療復健器材與電輔車。
summary_long: 岱宇主要從事健身器材開發、製造與銷售，產品包括電動跑步機、橢圓機、健身車、醫療復健器材及電動輔助自行車。2026年第二季家用健身器材占營收61.8%、商用占27.1%、復健醫療占6.0%、電輔車占3.7%。旗下有Spirit Manufacturing、Sole及巨琛工業，並成立美國Santi Innovation及台灣三體創新布局無人載具組裝。2026年10月揭露的無人載具業務仍在廠區認證階段。
