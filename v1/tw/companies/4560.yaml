summary_short: 生產銷售工業縫紉機刀具、針位組及自動化縫製裝置與設備。
summary_long: 強信-KY主要生產及銷售工業縫紉機零配件，2025年度此項業務占營收100%。依公司法說會揭露，2025年上半年刀類占營收69%，自動裝置成套及散件分別占10%與6%，針位組占7%，其他占8%。主要產品包括工業縫紉機刀具、針位組、自動化輔助裝置、自動縫製設備及其他產業刀具。官網列示直接或間接全資持有的子孫公司包括Faith Light International Corporation、VANDEN INTERNATIONAL、強信機械科技（萊州）及浩強精密機械（青島）。
