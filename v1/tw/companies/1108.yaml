summary_short: 以水泥、熟料、爐石粉及石材產銷為主，子公司經營預拌混凝土。
summary_long: 幸福水泥以水泥、熟料、爐石粉及石材的生產銷售為主要業務，石材包括石灰石、規格石與砂石。水泥產品涵蓋卜特蘭Ⅰ型、Ⅱ型與低鹼水泥，另列有卜特蘭石灰石水泥。2025年度合併營收組成為水泥及熟料52.83%、水泥製品29.90%、其他17.27%，以水泥及熟料為最大來源。預拌混凝土由子公司幸孚預拌混凝土廠經營；直接子公司另有從事不動產開發的大升開發及從事船務代理的信福航業，幸孚預拌旗下福昱開發則從事土石採取。
