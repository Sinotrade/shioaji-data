summary_short: 研發、生產及銷售商用展示架與智能電動床機構件，提供客製加工服務。
summary_long: 裕慶-KY的業務涵蓋各類材質商用展示架及智能電動床機構件的研發、生產與銷售。商用展示架依品牌及商品需求提供客製化方案，服務包含展示架設計開發，以及鐵件與木件製造、安裝和配送。電動床相關產品則包括智能電動床機構件。官網另外列有電子鎖、客製金屬零件及客製木製零件，產品範圍涵蓋展示設施與零組件加工。其展示架服務串接設計、製造、物流及現場安裝，依個別專案需求提供整合服務。
