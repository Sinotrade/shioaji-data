summary_short: 設計製造商用展示架與電動床機構件，並提供倉儲、配送及安裝服務。
summary_long: 裕慶-KY以商用展示架與電動床機構件為主要業務，2025年第一季兩者營收占比分別為83%及13%。展示架業務採ODM模式，服務涵蓋設計、製造及後勤，並透過美國Beeline體系承接當地業務。具名客戶包括Walmart、Target、Home Depot、Lowe’s、Kohl’s及Coca-Cola；L&P亦列於公開報導的客戶名單。2024年公司決議購入新莊辦公不動產，子公司Beeline Corp.另決議以4,200萬美元購入美國西岸倉庫。2025年則調整印尼合資架構，由全資子公司HORIZON FIXTURE INVESTMENT與OWNACE等共同投資。
