summary_short: 經營食品銷售、保健食品研發代工及天然物原料。
summary_long: 佰研以食品銷售及保健食品研發代工為營運內容，2025年合併食品收入為新台幣3億2,284.6萬元，其他收入為2,323.4萬元。公司提供配方設計、原料、檢驗、包裝及委託生產服務。官網原料產品包括超穀酵素Saponzyme、狼尾草／淡竹葉Zeurogen與透明質酸酶抑制劑Hyase-E2。截至2026年6月底，子公司展飛從事肉品等買賣，邁高從事生物技術研發服務，另持有投資公司Le Beau Limited。
