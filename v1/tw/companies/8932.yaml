summary_short: 以企業軟體開發、資訊服務及拉鍊製造取得營收。
summary_long: 智通科創以資訊軟體服務與拉鍊製造為主要營收來源，2026年上半年軟體及其他收入占63%，拉鍊占37%。軟體業務透過聯和科創及其子公司Global Line Network Sdn. Bhd.開展，提供ERP、供應鏈、客戶關係管理及電子商務等企業系統。GLN另推出消費者資安應用程式FraudEyes Mobile；印度金融科技產品Zenzy在2026年8月法說揭露為上線準備中。拉鍊產品包括尼龍、塑鋼、金屬及隱形拉鍊，並供應拉頭與配件，用於服裝、箱包及汽車椅套等。
