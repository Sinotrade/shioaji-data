summary_short: 提供醫療影像AI軟體與客製化雲端生醫平台服務。
summary_long: 長佳智能提供醫療影像人工智慧軟體及客製化雲端生醫平台服務。AutoSeg以深度學習自動勾勒放射治療所需的危及器官與淋巴區域；骨齡系統分析兒童及青少年左手X光影像，輔助評估骨齡。急診與放射影像產品涵蓋腦出血、腦中線偏移及胸腔X光異常偵測，部分功能仍屬研究用途或審核中。雲端平台採模組化設計，依需求提供客製化服務。此外，公司透過子公司長聯科技開發生成式AI照護機器人，應用包含導覽、衛教諮詢及送藥支援。
