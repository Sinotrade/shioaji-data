summary_short: 開發、製造及銷售電感與磁性元件，以電源電感為主要營收來源。
summary_long: 臺慶科從事磁性材料及電感元件的開發、製造與銷售。2026年上半年，電源電感占營收61.7%，積層晶片電感與磁珠占20.6%，共模／網路濾波器及訊號電感占17.8%；車用電子占應用營收41%，為最大應用領域。公司提供車用共模扼流圈及功率電感，用於電池管理、車載充電與電源轉換，也提供AI伺服器供電用TLVR磁耦合電感，以及5G與網通設備用被動元件。2024年向豪倫電子購置工業用地及廠房，2025年引進台灣柏恩氏電子認購私募普通股，2026年另公告擬標售楊梅不動產。
