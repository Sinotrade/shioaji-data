summary_short: 以矽利光、導熱材料及其他特殊材料的代理銷售為主要業務。
summary_long: 崇越電通以矽利光及特殊材料代理銷售為主，產品涵蓋矽油、矽橡膠、導熱介面材料與化妝品原料。2026年上半年按應用產業區分，電子占營收37.63%、散熱16.18%，另有車用、醫療與休閒等用途。公司銷售用於AI伺服器的導熱片，並將電動車OBC元件保護導熱材料列為下半年持續成長及新導入品；另介紹可整合至CDU等系統的液冷冷卻液在線監控方案。主要直接投資子公司包括Topco Investment Holding、崇皓貿易、崇越工程及美國崇越。
