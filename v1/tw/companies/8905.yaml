summary_short: 以冷凍肉品、蔬品銷售為主，兼營食品加工、低溫倉儲及住宅開發。
summary_long: 裕國以冷凍肉品與蔬品銷售為主要營收來源，進口牛肉、羊肉、薯條及青豆仁於國內販售，並在南投從事肉品加工，生產冷凍牛肉、火鍋肉片及罐頭。2024年商品銷售占營收75%，冷凍冷藏租賃占17%，物流占8%；營建亦有收入，年報四捨五入列示占比為0%。公司提供冷凍冷藏庫房租賃，子公司裕鵬物流經營汽車貨運及貨櫃貨運。另經營住宅開發銷售，以及裕國紅敞生鮮超市與線上購物通路。
