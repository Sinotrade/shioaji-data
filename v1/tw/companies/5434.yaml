summary_short: 銷售半導體關鍵材料，並透過集團提供廠務與環保工程服務。
summary_long: 崇越科技以半導體關鍵材料銷售與整合服務為主要業務，涵蓋光阻、晶圓、石英製品與研磨液。2025年半導體相關產品占合併營收84.6%，工程與廠務系統占9.0%，LED／LCD／電子相關產品占3.8%，另有綠能循環經濟及其他業務。公司與SHIN-ETSU CHEMICAL CO., LTD.訂有經銷合約，具名客戶包括台積電、聯電、美光與英特爾。先進封裝方面布局CoWoS與HBM材料，另供應AI伺服器高頻板材用石英布。2024年財報列建越為子公司，業務包括純廢水與無塵室工程；2025年官網聲明亦確認光宇工程的旗下公司身分。公司於2024年8月投資設立永越先進，2026年官網另列投資東虹綠能環保科技。
