summary_short: 透過子公司FDK銷售電池與電子裝置，另製造機構整合元件及汽車零組件。
summary_long: 閎暉原有業務包括機構整合元件與汽車零組件，產品涵蓋彩色矽膠錶帶、異材質複合成型元件、汽車內飾與開關，以及開發中的車用曲面玻璃蓋板。公司持有FDK株式會社45%股權，並自2026年8月底將其營收納入合併報表；FDK主要製造、銷售電池及電子裝置。依2026年9月單月揭露，電池相關產品占合併營收68.5%，電子裝置占13.2%，機構整合元件占9.7%，汽車零組件占8.6%，當月營收結構已以電池業務為主。
