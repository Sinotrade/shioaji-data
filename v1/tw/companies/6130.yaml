summary_short: 以進口學名藥販售為主要營收來源，另經營光學鍍膜、太陽能發電及IC設計業務。
summary_long: 上亞科技從事進口學名藥販售、太陽能發電與晶圓級光學鍍膜，集團另有IC設計及技術服務收入。2025年度營收資料列示，西藥產品占37.01%，為最大單一來源；其餘包括IC設計19.91%、加工17.59%、售電17.07%、技術服務7.38%及租賃1.04%。藥品業務以引進國外學名藥為主，光學鍍膜事業聚焦晶圓級代工。2025年第一季財報列示永泰益工程及諾肯科技為子公司，分別從事太陽能光電與半導體業務。
