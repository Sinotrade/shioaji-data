summary_short: 群電研發、製造及銷售電源供應器，另提供LED應用產品與智慧建築系統服務。
summary_long: 群電以交換式電源供應器為主要產品，提供雲端及AI邊緣運算伺服器電源，也有低軌道衛星電源。2025年電子零組件產品占合併營收81.09%，消費性電子產品及其他電子產品占12.36%，智慧建築系統服務占6.11%。公司揭露的伺服器電源系統涵蓋500W至5500W，筆電電源則採用英飛凌氮化鎵功率元件；恩智浦供應GreenChip電源解決方案。具名媒體報導確認群電列入SpaceX星鏈電源供應鏈。群光電子為母公司，群電直接持有泰國電源製造子公司，並於2025年第二季完成投資設立Diligent Technology (Thailand) Co., Ltd.。
