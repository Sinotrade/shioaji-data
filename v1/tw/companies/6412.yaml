summary_short: 以交換式電源供應器為主，涵蓋電腦、AI伺服器及低軌衛星應用。
summary_long: 群電以交換式電源供應器為主要產品，提供雲端與AI邊緣運算伺服器、低軌衛星等應用的電源系統。2025年營收中，電子零組件產品占81.09%，消費性電子產品及其他電子產品占12.36%，智慧建築系統服務占6.11%，其他占0.44%。公司推出採用氮化鎵轉換器的65W筆電電源，並以IWA平台提供智慧環控、碳排與能源管理。群光電子持有過半股權；年報列示東莞、蘇州、重慶及泰國四家生產子公司。
