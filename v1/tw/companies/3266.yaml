summary_short: 以住宅及大樓開發、房地出售為主，合併營收另含營建工程、租金及管顧收入。
summary_long: 昇陽主要從事住宅及大樓開發、房地出售與都市更新重建，產品區域以大台北為重心，涵蓋台北市、新北市及桃園市。2025年合併營收中，出售房地占51.18%，為最大收入來源；營建收入占40.03%，租金及管顧收入等占8.79%。集團營建業務包含子公司新東陽營造的綜合營造業務。截至2026年3月底，昇陽持有新東陽營造77.14%股權，並持有昇陽置地及昇陽國際置地兩家全資子公司。
