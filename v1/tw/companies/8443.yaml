summary_short: 以自有品牌鞋履、鞋墊及皮件配件零售為主要收入來源。
summary_long: 阿瘦以自有品牌鞋履及相關商品零售為主要業務，商品包含鞋類、鞋墊、皮包與襪品，並提供動態足壓量測服務。2025年度營收中，鞋類占39.76%、鞋墊占20.08%、包類占2.77%、襪類占2.08%，其他項目占35.32%，鞋類為最大單一品項。鞋墊產品包含依足壓量測結果調整的醫療級鞋墊，足測服務亦用於推薦適穿鞋款及鞋墊。截至2025年底，公司持有雙岳股份有限公司全部股權，該子公司主要從事鞋、包製造業務。
