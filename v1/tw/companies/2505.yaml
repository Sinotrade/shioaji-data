summary_short: 以住宅、商業大樓及廠辦開發、出租與出售為主要業務。
summary_long: 國揚實業以國內不動產開發及租售為主要業務，委託營造廠興建住宅、商業大樓與廠辦大樓；114年度年報揭露，相關租售業務占公司營業額100%。現有商品包括住家、別墅、店鋪與廠辦，並規劃都市更新住宅及智能廠辦。主要直接子公司包括上揚國際資產管理、神揚建設、欣揚國際開發及星紀元國際；前三家持股均為100%，星紀元國際持股80%。
