summary_short: 製造與銷售醫療管類、密閉式抽痰管、傷口引流套等醫療耗材。
summary_long: 太醫以醫療耗材的製造與銷售為核心，產品涵蓋醫療管類、密閉式抽痰管、傷口引流套、客製化套組與袋類。2026年上半年，管類營收占比約26%、密閉式抽痰管約20%、傷口引流約13%、客製化套組約10%。密閉式抽痰套由接頭組件、真空控制閥及覆保護膜的抽痰管組成；真空傷口引流套供單一病人使用，用於收集傷口廢液。袋類產品包括用於收集尿液的精密尿袋。2026年第2季財報明列可成科技為母公司。
