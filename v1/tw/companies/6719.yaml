summary_short: 設計與銷售電源管理IC、智慧功率級及MOSFET。
summary_long: 力智電子為無晶圓廠IC設計公司，設計與銷售電源管理IC及MOSFET。2025年電源管理IC占營收76.13%，MOSFET占23.87%。電源管理產品涵蓋CPU／GPU多相位降壓控制器、智慧功率級模組與電池保護IC，並提供氮化鎵電晶體用驅動IC。智慧功率級具電流與溫度監控功能，產品布局涵蓋AI與伺服器電源應用。2024年引進國巨認購私募普通股，募集總額51.849億元。2026年6月底合併範圍包含香港力群、深圳力智與日本JPD Labo；美國uPI Semiconductor Inc.已於2025年6月完成清算。
