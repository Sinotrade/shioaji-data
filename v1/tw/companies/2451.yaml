summary_short: 製造並銷售DRAM模組、SSD及工業嵌入式儲存產品。
summary_long: 創見以記憶體模組與儲存產品為主要業務，涵蓋工業嵌入式及消費應用。董事長於2025年11月表示，嵌入式儲存記憶體約占六成營收，DRAM產品約占二成；該報導未明示統計期間。產品包括DRAM模組、企業級與消費性SSD、記憶卡、嵌入式鏡頭及密錄器，ETD410T用於資料中心與高效能伺服器。具名供應來源包含三星、美光、SanDisk及慧榮，創見可攜式SSD採用慧榮SM2320控制器。公司亦透過Amazon北美平台銷售產品。2024年集團公告上海子公司合併與歐洲股權架構調整，並完成對瑞音生技醫療器材的現金增資投資。
