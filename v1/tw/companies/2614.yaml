summary_short: 以寵物商品零售與美容、媒體廣告及港埠穀物倉儲服務取得營收。
summary_long: 東森國際的主要營收來自寵物零售、媒體廣告及穀物倉儲。2025年合併營收約54.73億元，其中貿易事業約21.45億元、媒體事業約19.07億元、倉儲事業約14.12億元，以貿易事業規模最大。旗下東森寵物雲整合線上與實體通路，提供寵物商品銷售及美容服務；東森新媒體經營媒體內容與廣告業務。公司本體提供穀物裝卸與儲轉服務，倉儲據點涵蓋臺中港及高雄港。另直接持有東林資產55%股權，列為子公司。
