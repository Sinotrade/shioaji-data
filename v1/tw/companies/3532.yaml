summary_short: 製造及銷售8吋、12吋半導體用矽晶圓，包含拋光、熱處理及磊晶產品。
summary_long: 台勝科主要製造與銷售8吋及12吋半導體用矽晶圓，2024年度矽晶圓占合併營收100%。產品包含鏡面拋光、熱處理及磊晶晶圓，屬半導體產業鏈的上游材料。公司取得SUMCO的矽晶圓製造技術授權，亦向其採購原料；2025年底持有日本台塑勝高株式會社全部股權。公司揭露HBM相關晶圓包含貼合用carrier wafer，並布局CoWoS相關interposer，報導時已進入送樣階段。2026年8月SUMCO減持後，台勝科由其合併子公司轉為權益法適用關聯企業，雙方持續生產與銷售合作。
