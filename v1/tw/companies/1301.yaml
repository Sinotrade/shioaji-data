summary_short: 製造銷售PVC、PE、PP等塑膠原料，以及碳纖維與高吸水性樹脂。
summary_long: 台塑製造銷售PVC、PE、PP、EVA、液鹼、碳纖維及高吸水性樹脂。2025年塑膠事業部占營業額35.24%，為最大部門；聚烯、台麗朗及聚丙烯事業部分別占20.21%、16.85%及15.62%。台塑石化與台灣中油供應乙烯、丙烯，2025年分別占進貨淨額36.38%及10.33%。公司透過開曼及寧波子公司經營海外事業，原全資子公司台塑工業美國於2026年8月併入台塑美國。2026年另公告與日本大賽璐合資布局光阻稀釋劑，並核准投資台塑中華先進化學及FTA Tech，規劃電子級硫酸與鹽酸事業。
