summary_short: 經營電力設備、智動化與AI視覺系統，兼營液晶顯示及電子通路。
summary_long: 所羅門經營電力設備、智動化產品、液晶顯示零組件與電子通路。2025年年報揭露，機電事業群占營收40%、智動化29%、光電製造21%、電子通路8%、其他2%。電力產品涵蓋發電機、不斷電設備與配電盤；視覺產品包括SolVision人工智慧瑕疵檢測及AccuPick 3D料箱揀選系統。光電業務銷售自有品牌客製化液晶模組及人機介面。合併子公司包含從事液晶顯示器製造銷售的富相科技，以及經營再生能源自用發電設備的盈門能源科技。
