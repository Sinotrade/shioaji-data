summary_short: 以單株抗體、配對抗體、蛋白質等研究與檢測試劑銷售為主。
summary_long: 亞諾法主要銷售單株抗體、多株抗體、配對抗體、蛋白質與醫療檢測儀器，產品涵蓋研究用重組蛋白。2025年單株抗體為最大營收類別，占33.25%；配對抗體占19.80%、蛋白質占12.98%、多株抗體占6.51%、檢測儀器占1.59%，其他產品占25.87%。公司在蛋白質與抗體產業鏈屬中游生產環節。已揭露的全資子公司包括核心生醫投資股份有限公司及德國Abnova GmbH，其中德國子公司仍在清算註銷中。
