summary_short: 研發、製造及銷售汽車空調、冷卻與機電散熱模組。
summary_long: 萬在研發、生產及銷售汽車空調、汽機車冷卻與機電散熱模組，汽車空調產品包括冷凝器、蒸發器及暖氣芯子。2025年汽車空調模組占營收70.15%，冷卻模組占29.20%，其他占0.65%。汽機車產品包含鋁塑水箱；機電產品應用於CPU、VGA、LED及汽車電子散熱。公司亦開發AI伺服器機櫃水冷散熱系統，並提供浸沒式機櫃使用的水冷散熱器；產品應用另涵蓋電動車車載系統、電池組及資料中心散熱。
