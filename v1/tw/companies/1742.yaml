summary_short: 以精製石蠟、半微晶蠟及微晶蠟製造銷售為主，另經營太陽能售電。
summary_long: 台蠟以精製石蠟、半微晶蠟及微晶蠟的製造與銷售為核心，蠟品經分餾、脫油、提純、脫色及脫臭等程序製成。官網列示多種熔點的全精煉石蠟，以及160°F半微晶蠟與180°F微晶蠟。2026年上半年，合併蠟品銷售收入為2,858.4萬元，售電收入為1,274萬元，水產部門收入為零。公司另提供太陽能光電系統規劃、設計及建置服務；主要子公司包括經營太陽能設備銷售與安裝的冠達綠能，以及經營水產產品銷售的京海水產（上海）。
