summary_short: 設計與銷售USB、PCIe等高速傳輸控制晶片，並經營車用監控晶片。
summary_long: 祥碩以高速傳輸介面IC的設計與銷售為主要業務，產品涵蓋USB主控端與裝置端控制器、PCIe橋接與封包交換器、SATA控制器、高速訊號切換晶片及客製化ASIC。2025年高速介面控制晶片占營收78.81%，裝置端高速控制晶片占10.81%，車用監控產品占10.38%。華碩是母公司及商品銷售客戶，文曄亦有商品採購關係；超微是晶片組客戶，品佳為台灣授權經銷商。2025年6月完成約3.9億美元的Techpoint全股權收購，納入安防與車用影像傳輸業務。PCIe Gen4交換晶片的公司公告應用包括伺服器、邊緣運算及AI。
