summary_short: 設計及銷售類比與混合訊號IC，主要收入來自電源管理IC。
summary_long: 致新科技從事類比及混合訊號 IC 設計，以電源管理產品為主要收入來源。2025 年電源管理 IC 占營收 82%，溫度偵測 IC 占 10%，運算放大器 IC 占 5%，磁場感測及馬達驅動 IC 占 3%。年報揭露 PMIC 研發成果涵蓋無人機及 AI 伺服器記憶體電源管理，據此列入相關題材。2026 年第二季合併財報列示致強投資、Aimtron Technology Corp.及台灣類比科技為直接子公司；台灣類比持股 43.54%，因掌握董事會過半席次而具控制力。
