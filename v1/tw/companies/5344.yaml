summary_short: 提供晶圓針測、IC成品、系統模組及影像感測器等測試服務。
summary_long: 立衛科技提供積體電路測試服務，涵蓋封裝前的晶圓針測與封裝後的成品測試。CP服務針對晶片進行電性功能檢測；FT服務確認封裝後成品符合設計規格，並提供測試程式開發、工程驗證及治具維護。公司另提供SLT系統模組測試與CIS影像感測器測試，前者檢驗晶片在軟硬體系統中的運作情形，後者服務影像感測晶片。封裝產品後段服務則包含依客戶需求進行烘烤，以及影像感測器自動貼膠等作業。
