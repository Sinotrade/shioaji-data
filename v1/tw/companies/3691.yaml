summary_short: 以太陽能電池導電漿為主，合併業務另含散熱材料與售電。
summary_long: 碩禾主要提供太陽能電池用導電漿，產品包括正面銀漿、背面鋁漿與背面銀漿。2025年合併營收以導電漿為最大項目，其次為散熱材料，另有售電、太陽能矽輔料及其他收入。國碩科技工業為其母公司，華旭先進為合併子公司，碩通散熱則透過華旭先進納入合併。碩通從事AI伺服器散熱元件及材料製造與銷售，液冷產品涵蓋HoseKIT、Manifold、Bellow、Cold Plate與客製化轉接接頭。
