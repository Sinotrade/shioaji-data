summary_short: 提供企業系統整合、金融應用軟體、電腦設備銷售與資訊維運服務。
summary_long: 中菲電腦提供企業資訊系統整合，結合電腦設備銷售、平台建置及後續維護服務。2025年營收組成為銷貨收入52.96%、勞務收入47.04%。應用軟體涵蓋信託與保管銀行系統、證券及期貨交易帳務平台，以及投資理財與財富管理系統，服務包括系統規劃、開發、導入與維運。另透過IDC資源共享中心提供主機代管、備援演練及雲端服務，並提供跨平台虛擬化、資料庫與備份整合等技術服務。
