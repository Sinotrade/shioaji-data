summary_short: 提供證券期貨資訊系統、維修與授權服務，並代理交易軟體及伺服器。
summary_long: 凱衛資訊提供證券與期貨業資訊系統，涵蓋交易、帳務、行情及FIX等軟體解決方案，產品包括XBOS現貨帳務系統。另代理MultiCharts程式交易軟體及eXtreme系列高頻交易伺服器，並提供nStock台股基本面資料與選股APP。2025年前三季營收分為軟硬體系統整合、勞務及維修與授權三類，其中勞務及維修收入金額最高。依2025年第三季合併財報，凱衛投資為全資子公司，並由其持有凱旭證券投資顧問85%股權；凱旭原名亨達證券投資顧問。
