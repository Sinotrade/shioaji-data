summary_short: 製造精密與特用化學品，並經營N次貼辦公文具。
summary_long: 聚和以精密化學品、特用化學品及辦公文具用品為主要營收來源，2025年精密化學品約占46%，為最大部門。精密化學產品包括醫藥級生物緩衝劑、電鍍添加劑及鋰電池電解液添加劑，應用於醫藥、生物技術、半導體電鍍與電池領域。特用化學產品涵蓋造紙助劑及廢水處理添加劑，文具事業經營Stick’N N次貼自黏便條紙。集團另有聚和生醫科技與聚天生醫兩家子公司，分別發展居家環境保健產品及早期藥物開發。
