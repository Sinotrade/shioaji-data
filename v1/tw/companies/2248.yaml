summary_short: 研發、生產及銷售汽車LED內飾件、氛圍燈與汽車內外飾件。
summary_long: 華勝-KY從事汽車金屬與塑膠裝飾件、光電產品及車用電子的研發、生產與銷售，產品涵蓋內飾氛圍燈、LED光電系列及汽車內外飾件。2025年汽車LED內飾件占營收80.98%，汽車內外飾件占15.76%，其他占3.26%。門檻踏板產品結合金屬表面處理、沖壓及PCBA焊接工藝；光電產品運用曲面印刷與LED控制技術。集團透過華勝國際控股持有平湖、泰國及墨西哥子公司，並透過E-LAN HOLDING COMPANY持有美國車用電子元件銷售公司。
