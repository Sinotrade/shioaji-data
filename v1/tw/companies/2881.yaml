summary_short: 經營金融事業投資與管理，透過子公司提供保險、銀行、證券及資產管理服務。
summary_long: 富邦金為金融控股公司，經營金融事業投資與管理，透過富邦人壽、台北富邦銀行、富邦證券、富邦產險及富邦投信提供保險、存放款、證券與資產管理服務。海外金融成員包括富邦銀行（香港）、富邦華一銀行及富邦人壽旗下富邦現代人壽。台北富邦銀行與momo及台灣好市多合作聯名信用卡，富邦人壽另承保好市多員工團體保險。2025年富邦投信完成合併日盛投信，富邦華一銀行承接大華銀行中國個人銀行業務；2026年母公司公告向富邦人壽續租辦公室使用權資產。
