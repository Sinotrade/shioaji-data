summary_short: 以學名藥製造與銷售為主，產品涵蓋多種固體製劑及噴鼻劑。
summary_long: 強生化學製藥廠主要從事學名藥生產與銷售，為固體劑型專業製藥廠，產品包括膠囊、糖衣錠、膜衣錠、粉劑及顆粒，另生產噴鼻劑。2024年合併營收以神經肌肉系統用藥占23.78%最高，抗發炎止痛及抗過敏占13.17%，心血管系統藥物占11.46%，胃腸道肝膽系統用藥占10.06%。其餘產品組合包括內分泌、呼吸道、泌尿系統用藥、化學治療劑、維生素與礦物質及其他製劑。2026年第二季財報列示，北進國際有限公司為其全資子公司，主要經營西藥批發及零售。
