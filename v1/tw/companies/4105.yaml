summary_short: 以癌症、抗感染及醫療保健藥品銷售為主，另提供藥品委託開發製造服務。
summary_long: 東洋主要經營醫療及保健藥品，2025年度此類收入占合併營收95%，勞務及權利金占5%。主要產品包括癌症用藥Lipo-Dox、抗感染用藥Lipo-AB，以及醫療保健產品胃逆舒口服懸浮液。公司具備微脂體、微球及傳統劑型開發能力，並提供涵蓋製劑研發、放大批量與商業量產的委託開發製造服務。截至2026年6月底，直接子公司包括全資持有的旭東海普國際、榮港國際，以及持股56.48%的東生華製藥。
