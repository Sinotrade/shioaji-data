summary_short: 主要設計製造車用中空成型外飾件，以及車用與家用濾網。
summary_long: 大億金茂以車用中空成型件及濾材為主要業務。汽車外飾件涵蓋擾流板、側踏板、車後斗護欄與車斗罩，並運用中空成型技術開發汽車外部配件。過濾產品包括車用冷氣濾網、自動變速箱濾網及家用空氣清淨機濾網，涵蓋汽車與居家應用。皮卡後車斗飾件另有結合Sport Bar與Bed lamp照明功能的設計。官網董事會決議亦記錄大億科技（薩摩亞）與大億金茂（泰國）等子公司關係，分別依相關決議日期列示。
