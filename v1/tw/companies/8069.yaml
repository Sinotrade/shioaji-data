summary_short: 研發、製造與銷售電子紙薄膜及顯示器，應用於閱讀器、電子標籤與看板。
summary_long: 元太從事電子紙材料與顯示器的研發、製造及銷售，主要產品包括電子紙薄膜與電子紙顯示器。2025年營收依應用區分，消費性電子占56%，物聯網應用占44%。彩色技術包括Kaleido彩色印刷電子紙與Spectra 6全彩電子紙；官網列有Amazon Kindle及Kobo閱讀器客戶案例，並明確說明向Hanshow供應電子墨水技術。模組合作夥伴包括群創與京東方。2025年宣布與達擎簽署大型電子紙模組合資投資條件書，同年董事會通過向中華紙漿購置觀音土地。2026年董事會另通過觀音廠廠辦大樓新建計畫。
