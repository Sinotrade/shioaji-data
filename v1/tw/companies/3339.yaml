summary_short: 主要製造及銷售LED磊晶片與晶粒，另開發光通訊雷射晶片。
summary_long: 泰谷主要製造及銷售LED磊晶片與晶粒，產品應用涵蓋消費性電子、家電、車用、背光與感測。2025年前三季合併營收以光電部門為主，另有半導體部門收入。公司亦開發雷射二極體，官網列有CWDM DFB雷射晶片，並說明雷射產品針對矽光子、CPO與外部雷射光源應用。截至2025年9月底，直接子公司包括泰士科技、承芯科技及正誠電子，前兩者從事電子材料銷售，後者從事電子零組件加工。
