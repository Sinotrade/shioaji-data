summary_short: 以純ODM模式設計製造不斷電系統與太陽能逆變器，UPS為主要營收來源。
summary_long: 旭隼以純ODM模式提供不斷電系統與太陽能逆變器的設計製造服務，不經營自有品牌。2025年在線式UPS占營收36.96%、離線式UPS占25.79%，逆變器與太陽能逆變器占28.90%，其他產品占8.35%。具名供貨對象包括Schneider Electric、Vertiv、Eaton及Riello。公司產品包括伺服器用1U在線式UPS、結合逆變器與電池的儲能系統，以及直流電動車充電樁；另與Schneider合作開發800V高壓直流電源產品，布局AI資料中心供電應用。2024年董事會決議在美國設立Inversolenergy Tech, Inc.，同月投入50萬美元資本金。
