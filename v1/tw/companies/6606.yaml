summary_short: 以精密磨床及加工中心製造銷售為主，另有零組件業務。
summary_long: 建德工業以精密磨床與加工中心為主要業務，2025年度磨床及加工中心占營收96.11%，零組件占3.04%，其他占0.85%。官網產品涵蓋KGS三軸自動平面磨床、KGS-HT超精密平面磨床、KGS-CNC立柱移動式平面磨床、KGP定柱型龍門平面磨床及KGR軸承式旋轉工作台平面磨床。主要製造子公司包括直接持有的江蘇建德精密機械，以及間接持有的浙江榮德機械，業務涵蓋機床及相關配件。
