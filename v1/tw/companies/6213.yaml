summary_short: 製造銷售銅箔基板與玻璃纖維膠片，並提供多層壓合代工。
summary_long: 聯茂以銅箔基板與玻璃纖維膠片製造銷售為主，2025年營收占比分別為72.20%與27.71%，並提供多層壓合代工及軟性銅箔基板。高頻高速材料用於AI伺服器與高速交換器，另有智慧手機及穿戴裝置柔性基材。定穎投控年報將聯茂列為基板與膠片供應商；亞泰金屬供應其製程設備。2026年聯茂增資泰國子公司，泰國、Inspire Investments及無錫子公司另有具名設備採購。與三菱瓦斯化學合資的菱茂電子於同年7月決議解散。
