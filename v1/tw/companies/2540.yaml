summary_short: 經營房地產代銷與開發，並透過子公司承攬營造工程。
summary_long: 愛山林的業務包含不動產代銷、住宅與商業大樓開發租售，以及由全資子公司祝旺開發承攬的土木建築工程。2025年合併營收113.04億元，其中營造部門53.34億元、建設部門39.88億元、代銷部門18.63億元，營造為最大收入來源。甲山林建設為代銷客戶，也向祝旺採購工程服務。公司於2025年與宏匯合資山林匯開發，並投資環宇上城參與十四張站捷運開發；另向北基國際購入高雄土地。2026年獲選基隆德新村都更案最優申請人，公告公司預計投入約27.99億元。
