summary_short: 製造與銷售不織布及保溫隔離材料，應用於衣著、汽車與工業領域。
summary_long: 新麗以不織布為主要業務，2025年度營收占比為96%，其他業務占4%。不織布系列產品包括樹脂棉、針軋棉、車棉布、VFT直立棉及水軋布。保溫隔離材中的T3E採用再生纖維，供成衣、手套與睡袋等用途。工業材料涵蓋汽車內外裝、消音、制震及阻燃材料，也提供土工、建築、農用不織布，以及空氣、水與油的過濾材料。依2025年底持股資料，公司持有台灣吳羽84.62%股權，並全資持有Shinih Vietnam Company Ltd.及Shinih USA INC.。
