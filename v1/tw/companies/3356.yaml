summary_short: 以網路攝影機、監控主機、影像管理軟體及門禁系統銷售為主。
summary_long: 奇偶科技以數位監控產品銷售為主要業務，2025年網路攝影機占營收52%，另有監視系統主機、門禁系統及影像管理軟體等產品。其AI網路攝影機具備人車分類功能，GV-VMS影像管理軟體支援即時監看與錄影回放。GV-Cloud VMS提供雲端影像監控，透過單一平台管理攝影機與事件。產品線亦涵蓋門禁控制及車牌辨識，將影像與人員、車輛進出管理結合。海外直接子公司包括美國、捷克、日本及越南的公司。
