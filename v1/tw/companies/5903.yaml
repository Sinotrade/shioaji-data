summary_short: 以便利商店銷售食品、飲料與日用品，並提供數位購物及生活服務。
summary_long: 全家以便利商店販售食品、飲料與日用品為主，2025年零售業務占合併營收93.7%，物流占3.0%。截至2026年6月底，門市達4,504家。商品涵蓋金飯糰、uno pasta義大利麵、minimore甜點及Let’s Café、Let’s Tea飲品，並經營全家行動購、隨買跨店取等數位渠道。集團以晉欣食品、福比及全台物流支援鮮食、烘焙、採購與配送，另有電子支付子公司全盈支付及餐飲子公司全家國際餐飲。日本全家提供商標與便利商店經營技術授權；2025年新增投資全寵家科技。
