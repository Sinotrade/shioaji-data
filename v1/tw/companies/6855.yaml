summary_short: 開發、製造與銷售數位扭力扳手等數位手工具。
summary_long: 數泓科技主要從事數位手工具的開發與製造，產品包括數位扭力扳手、數位活動扳手與數位螺絲起子，另有數位扭力及角度接桿、數位角度規等工具。公司以微機電系統（MEMS）技術結合訊號感測及資料處理，提供數位手工具功能。依2024年度年報，數位手工具及零組件占營收99.73%，為主要收入來源；其餘營收歸於其他項目，占0.27%。
