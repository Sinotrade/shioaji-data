summary_short: 以電機、電子零組件代理經銷為主，兼營自動化設備及嵌入式電腦組裝。
summary_long: 大拓-KY以電機、電子零組件代理經銷為主要業務，並經營工廠自動化設備製品組裝及工業嵌入式電腦組裝。代理產品包括伺服馬達、可程式化自動化控制器、變頻器及連接器等。2025年產業工作機械設備類產品占營收75.62%，其他類產品占24.13%，印刷電路板相關製品占0.25%。集團全資持有日本大拓公司，並直接及透過日本大拓合計持有尚茂電子材料68.15%股權，主要子公司包含日本大拓與尚茂電子材料。
