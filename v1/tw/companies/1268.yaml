summary_short: 經營漢來海港、島語等多品牌餐廳，主要收入來自餐飲服務。
summary_long: 漢來美食以多品牌餐廳經營為主，2026年上半年收入分為餐飲、商品銷貨及其他，以餐飲收入為最大來源。旗下漢來海港供應中、西、日式自助百匯，島語提供餐酒搭配的精緻百匯；漢來名人坊經營粵菜，漢來上海湯包提供手工湯包，漢來蔬食將港滬點心手藝導入蔬食料理。合併財報列有漢和股份有限公司與HI-LAI FOODS HOLDING CO., LTD.兩家子公司，董事會已決議清算，截至2026年8月6日財報通過日仍未完成程序。
