summary_short: 以住宅不動產開發及房地銷售為主，兼營不動產租賃。
summary_long: 三發地產以住宅不動產開發及房地銷售為核心，合併業務亦包含不動產租賃。2025年合併財報將營運分為營建部及影音部，兩部門對外收入分別為1,769,178千元及18,556千元，營建部為主要收入來源。旗下京富祥營造從事土木及建築工程，金革國際唱片從事CD及DVD生產、製作、出版與進出口買賣，金革資產開發經營不動產開發。截至2025年底，這三家公司均為三發地產直接持有百分之百股權的子公司。
