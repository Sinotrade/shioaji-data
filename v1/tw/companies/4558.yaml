summary_short: 以客製化工業鋁擠型為主，提供鋁鍛造、陽極處理及建築鋁材。
summary_long: 寶緯以客製化鋁擠型與鋁合金加工為主，2026年第一季產品營收以工業料63%為最大宗，建築料25%、工程收入1%、其他11%。鋁擠型產品涵蓋工業模組、滑軌、氣密窗、帷幕牆及太陽能板框與支架；鋁鍛造產品應用於汽機車、自行車、機械及運動器材零組件。公司另提供超過六米長鋁料的陽極處理，以及鋁門窗、帷幕牆等建築材料。鋁合金模板業務則涵蓋設計、配模、擠型、摩擦攪拌、銑床加工與奈米塗裝，提供一站式服務。
