summary_short: 研發、製造及銷售人用原料藥，另經營賦形劑及動物用藥。
summary_long: 生泰以人用西藥原料藥的研發、製造及銷售為主要業務，產品涵蓋肌肉鬆弛、局部麻醉、中樞神經、呼吸、消化及心臟血管等用途，另經營賦形劑及動物用藥。2025年營收以肌肉鬆弛劑原料藥占26.29%最高，中樞神經系統劑占19.18%，局部麻醉劑占11.46%，呼吸系統劑占10.83%；賦形劑占6.66%，動物用藥占1.02%。生達化學製藥官網將生泰列為子公司。
