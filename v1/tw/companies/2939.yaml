summary_short: 開發及銷售廚房、美體養護、家居等生活百貨商品。
summary_long: 永邑-KY從事生活應用商品開發及銷售，經營通路涵蓋電視購物、購物頻道、零售商店、郵購及網購。2025年產品銷貨收入占營收100%，產品包括廚房用品、美體養護、家居用品、運動器材與電子電器。廚房用品以鍋具為主，美體養護包括護膚用品、女性內衣與塑型產品，其他商品涵蓋居家健身器材、太陽能燈及小家電。集團透過永邑國際控股有限公司持有台灣與香港子公司，並由香港子公司持有深圳的貿易與服務公司。
