summary_short: 以金融事業投資管理，透過子公司經營壽險、銀行、產險及資產管理。
summary_long: 國泰金控主要從事金融事業投資與被投資事業管理，透過子公司提供壽險、銀行、產險、證券及資產管理服務。旗下主要子公司包括國泰人壽、國泰世華銀行、國泰世紀產險、國泰綜合證券、國泰投信及國泰創投。國泰世紀產險與Swiss Re及Munich Re訂有再保險合約。國泰人壽於2024年完成康利股權轉換，換取Generali Investments Holding約16.75%股權；同年公告向永彰科技取得桃園觀音土地。國泰人壽另於2024及2025年與國泰電業共同投資沃旭大彰化西北及西南離岸風場，議定股權分別為50%及55%。
