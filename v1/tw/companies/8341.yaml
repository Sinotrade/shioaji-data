summary_short: 以事業及醫療廢棄物清除、焚化、物化、固化與掩埋服務取得收入。
summary_long: 日友以事業及醫療廢棄物清除處理為主要業務，提供醫療廢棄物焚化，以及有害事業廢棄物焚化、物化、固化與掩埋服務，另承作焚化爐設計、規劃及建造。2026年第二季營收組成為台灣事廢66%、台灣醫廢21%、北京醫廢10%、大陸事廢2%及其他1%，主要收入來自台灣事業廢棄物處理。青新環境工程為其直接持股子公司，北京潤泰環保科技則為間接持股子公司。
