summary_short: 製造銷售飲料、穀奶及加工食品，以飲料類為最大營收來源。
summary_long: 愛之味以飲料、穀奶及加工食品為主要業務。2025年度營收以飲料類38.32%居首，其次為傳統類21.46%、穀奶類20.46%及甜點類14.04%，其餘為油品、保健與其他類。產品包括分解茶油切四季春、純濃燕麥、土豆麵筋及五穀開運八寶粥，涵蓋茶飲、燕麥飲品、傳統食品與甜點。合併子公司包括雲乳食品科技公司與愛健生命科學公司，另透過新加坡愛寶諾公司間接持有上海愛之味食品公司。
