summary_short: 製造及銷售雙面與多層印刷電路板，營收以多層板為主。
summary_long: 育富主要從事雙面與多層印刷電路板的製造、加工及銷售。2024年度多層板占營收99.73%，雙面板占0.27%，營收結構集中於多層板。產品包括供個人電腦、工業電腦及醫療儀器使用的主機板，以及應用於伺服器、通訊基地台與高精密儀器的高頻阻抗控制板。集團旗下有YUFO ELECTRONIC (BVI) LTD.，並透過該公司持有鼎富電子(惠州)有限公司；鼎富電子為集團主要生產基地，負責雙面與多層印刷電路板製造。
