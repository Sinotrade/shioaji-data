summary_short: 以電腦、工業及伺服器電源供應器銷售為主，另提供醫療電源與儲能系統。
summary_long: 全漢以電源供應器為主要業務，產品涵蓋桌上型電腦、外接式、基板、工業電腦及醫療電源。2025年合併營收組成中，電源供應器占59.75%，外接式電源占22.92%，基板電源占9.60%，另有逆變器、高雄分公司及其他業務。公司已推出3200W通用冗餘電源，提供12V與54V輸出機種，其中54V產品鎖定高密度AI伺服器及多GPU運算叢集。醫療電源涵蓋PC電源、適配器、基板及備用電源，儲能產品則包括便攜移動式與住宅應用。
