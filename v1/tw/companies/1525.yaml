summary_short: 製造銷售汽車車架、載台、鈑金與懸吊零組件，亦提供模治具及電動車車架。
summary_long: 江申主要製造銷售卡車與巴士車架大樑、載台、鈑金及底盤懸吊零組件，並提供模治具。2026年第一季，載台占營收36%、車架25%、電巴車架21%、零件17%、其他1%，模具為0%，最大營收來源為載台。公司亦展示電動機車車架產品，結合已揭露營收的電巴車架業務，可歸入電動車零組件題材。中華汽車為其母公司；江申全資持有海外投資子公司，並透過該公司間接全資持有香港投資子公司。
