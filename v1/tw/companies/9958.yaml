summary_short: 製造離岸風電水下基礎構件與建築鋼構，並透過子公司承攬水下基礎。
summary_long: 世紀鋼以離岸風電與建築鋼構為主要業務，2025年風電鋼構占合併營收89.05%，高樓鋼構占7.99%。世紀鋼製造腿管等構件，子公司世紀風電承攬套管式水下基礎，世紀樺欣供應水下基樁。集團供應沃旭大彰化、CIP渢妙及風睿海盛、海廣等風場，其中渢妙、海盛與海廣合約由子公司承接。鋼板供應商包括中鋼與新光鋼，前端風電亦列主要進貨廠商。公司另取得印尼風電構件公司股權、增資印尼子公司，並公告向台灣科慕取得觀音土地。
