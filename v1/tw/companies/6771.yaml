summary_short: 以工業廢水代處理為主，並提供廢液回收、藥劑及廢棄物清除服務。
summary_long: 平和環保以工業廢（污）水代處理及廢酸洗液回收再利用為主，處理水系涵蓋一般、鉻系、鎳系及氨氮，並提供廢水代操作。2026年截至第2季，集團產品收入比重為廢水代處理72%、藥劑及耗材9%、廢棄物清除6%、其他13%。子公司平和材料從事高濃度氨氮廢水回收、氯化銨製造及廢酸鹼液再利用；鳳嘉製造及銷售廢水處理藥劑，並買賣基本化學品。清境及萬境提供廢棄物清除服務。
