summary_short: 主要靠室內家具研發、客製製造與銷售取得營收。
summary_long: 商億-KY主要經營室內家具研發、製造與銷售，並提供ODM設計開發及MTO計劃性訂單製造服務。產品涵蓋沙發、休閒椅、床具及餐桌椅。2025年室內家具占營收87.76%，其他項目占12.24%，家具業務為主要營收來源。集團透過投資控股子公司管理營運，杭州及柬埔寨的子公司負責家具生產，美國子公司Spectra Home LLC則從事室內家具銷售。
