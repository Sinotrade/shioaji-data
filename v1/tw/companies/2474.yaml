summary_short: 以筆電金屬機殼與精密機構件為核心，另拓展AI伺服器及醫療業務。
summary_long: 可成主要製造金屬外部機殼與功能性內構件，應用於筆電、平板及穿戴裝置，並提供CNC精密加工。2026年上半年，可成部門外部客戶收入約52.71億元，太醫部門約11.85億元。公司加入NVIDIA MGX生態系，供應伺服器機構件與功能件，另拓展半導體前端設備機構件、醫療零組件及航太精密加工。醫療布局包括將太平洋醫材納入合併、由可力生醫取得精能醫學CDMO業務資產，以及投資Niche Biomedical、邦特、聯合骨科與鐿鈦。海外產能布局則包括公告泰國購地及越南土地使用權取得案。
