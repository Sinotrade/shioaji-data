summary_short: 以廢鐵買賣為最大收入來源，兼營螺栓銷售與環保服務。
summary_long: 久陽精密經營螺栓銷售及轉投資事業，產品涵蓋內外六角、凸緣及特殊螺栓；2025年3月起改採外購螺絲成品銷售。2025年合併營收中，廢鐵占46.24%、螺絲占17.18%、運輸占9.13%、承攬占6.84%，最大收入來源為廢鐵。子公司台鋼運輸從事運輸與廢鐵買賣，台鋼環保提供廢棄物清除，榮福提供焚化爐操作，台鋼能源從事能源技術服務。2026年6月底另持有合一特用材料71.43%股權，其業務為精密化學材料及其他金屬製品製造。
