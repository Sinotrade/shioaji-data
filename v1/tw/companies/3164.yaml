summary_short: 研發、製造及銷售功能性益生菌，提供菌粉與保健品代工服務。
summary_long: 景岳從事功能性益生菌的研發、製造與銷售，提供益生菌粉及客製化保健品代工服務。2025年合併營收中，輔助調節過敏體質乳酸菌產品占44%、牙齒保健產品占18%、腸胃道保健益生菌產品占12%、不易形成體脂肪產品占2%，其餘24%包含奶粉、其他乳酸菌產品及原料銷售。主要產品包括樂亦康益生菌膠囊、保亦康乳酸菌口含錠、景岳樂亦纖263乳酸菌膠囊及固醣樂ADR-1益生菌膠囊。另持有景岳生物科技(中國)有限公司85%股權。
