summary_short: 以電子功能性材料製造加工為主，兼營膠帶及接著劑等產品經銷。
summary_long: 汎瑋材料的主要業務為電子功能性材料，另經營膠帶及接著劑等產品經銷。2025年度電子功能性材料占合併營收83.89%，經銷業務占16.11%。功能材料包括導電散熱與EMI材料、絕緣材料、黏接材料及保護膜，可用於電子產品的導熱、導電、絕緣、固定及表面保護。黏接材料具有多種膠系與基材，保護膜則用於手機、平板及機構件的製程或出貨保護。公司年報另列有AI伺服器的散熱材料、電動汽車的緩衝材料，以及機器人的功能性材料應用。
