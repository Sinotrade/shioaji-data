summary_short: 現有收入來自健康食品銷售，另研發CBL-514等醫美與代謝相關新藥。
summary_long: 康霈現階段以健康食品銷售取得收入，2025年健康食品收入為新臺幣3,803.7萬元，其他產品及勞務收入為零；官網列有孅甘紅膠囊及黃金組合甘甘好膠囊。新藥研發方面，自行開發的CBL-514為局部減脂注射候選藥物，公司於2026年9月公告其腹部減脂全球樞紐三期試驗SUPREME-01已完成首位受試者給藥，另有CBA-539與CBF-520研發產品線。集團子公司分別從事臨床試驗服務、專利申請及投資控股；2025年完成對澳洲子公司增資，並向Caliway Global注資美金5,000萬元。
