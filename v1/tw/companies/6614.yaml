summary_short: 提供政府與企業資訊系統開發、整合、維運及軟硬體服務。
summary_long: 資拓宏宇提供資訊系統開發與整合服務，業務涵蓋智慧政府、智慧金融、智慧醫療與智慧城市。2026年上半年四大領域營收比重依序約為31%、18%、29%及23%，以智慧政府最高。公司亦提供資訊安全顧問與軟體委外人力服務，自有產品包括以RAG技術建立企業知識庫的iNana RAG，以及涵蓋碳管理、氣候相關財務揭露與能源管理的資拓宏宇永續雲；醫療產品則包括整合影像擷取、儲存、檢索與傳輸的iPACS。2025年第二季財報列中華電信為其母公司。
