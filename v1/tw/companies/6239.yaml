summary_short: 提供記憶體與邏輯晶片封裝測試、晶圓級封測及模組加工服務。
summary_long: 力成提供記憶體與邏輯晶片封裝測試，以及晶圓級封測和模組加工服務。2025年合併營收以IC封裝服務占61.76%為主，IC測試與模組加工分別占13.95%及10.77%。美光委託其DRAM封裝測試，力成亦與SK Hynix維持具名合作。先進技術包括FOPLP、TSV及AI伺服器用FCBGA，並布局HBM與CPO封裝。公司與AMD合作FOPLP專案，與BROADCOM TECHNOLOGIES INC.規劃新加坡合資；2025年向友達購置竹科廠房以擴充FOPLP。主要子公司包括超豐、Tera Probe及晶兆成。
