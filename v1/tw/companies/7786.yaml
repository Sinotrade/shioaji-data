summary_short: 以離岸風電工程船舶租賃為主，提供海事工程、海纜建置與運維服務。
summary_long: 東方風能主要經營海事工程船舶租賃、離岸風場近岸與海上工程、海纜建置及專案管理。2025年船舶租賃占營收72.10%，客戶合約收入占27.90%。公開具名客戶包括沃旭能源、Vestas、CIP、風睿能源及中華電信，另與DeepOcean簽訂東方海威租船契約。財報揭露，海盛發電為十五年起運維住宿船租約的簽約對象。公司於2024至2026年間向VARD訂造專業船舶，亦與Westcon簽署海纜船建造合約，並投資安捷航空發展海空運維。宏華營造為其最終母公司；公司另持有新加坡子公司，並於2026年公告兩項分割設立子公司的計畫。
