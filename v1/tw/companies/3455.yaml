summary_short: 研發與銷售半導體、PCB／IC載板及顯示器自動光學檢測設備。
summary_long: 由田以機器視覺為核心，研發與供應自動光學檢測設備。2025年SEMI檢測系統占營收41.77%，PCB／IC載板占28.45%，LCD檢測系統占22.47%，其他占7.31%。半導體產品包含CoWoS、RDL及Interposer黃光製程用螢光細線路晶圓AOI，以及FOPLP面板級封裝檢測設備，另將CPO封裝檢測設備列為2025年研發成果。載板設備用於出貨前外觀檢查，年報列示欣興、南亞電與景碩採購；顯示器設備已導入友達與群創。另有矽品向由田採購營業用機器設備的具名公告。
