summary_short: 研發與製造尼龍、聚丙烯、聚碳酸酯及功能性工程塑膠複合材料。
summary_long: 晉倫主要生產尼龍、聚丙烯、聚碳酸酯與功能性工程塑膠複合材料，提供纖維補強及阻燃規格，用於汽車零件、電腦週邊與工具五金塑膠件。2025年營收以尼龍複合材料82.18%為主，聚丙烯及聚碳酸酯分別占8.46%與7.14%。BIPEX防靜電與導電材料可用於FOUP、光罩盒及其他晶圓載具，電磁遮蔽材料則列為研發方向。集團關係包括英屬維京群島子公司、越南全資子公司及江蘇孫公司。
