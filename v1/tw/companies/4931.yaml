summary_short: 研發、製造及銷售鋰離子電池模組，應用於備援電力、電動工具與輕型電動載具。
summary_long: 新盛力主要從事鋰離子電池模組的研發、製造與銷售，並自行設計及生產電池管理系統。產品涵蓋電動手工具、儲能與電池備援、輕型電動交通工具及無人機電池模組。備援電池模組用於人工智慧算力中心與伺服器；輕型電動交通工具產品涵蓋電動自行車及電動機車。2026年上半年營收分類為鋰離子電池模組與其他，前者為主要收入來源。
