summary_short: 研發、製造與銷售安控攝影機、網路錄影機及機器視覺產品。
summary_long: 彩富以安全監控設備為主要業務，2025年合併營收中，安全監控系統占92%、機器視覺系統占1%、其他占7%。安控產品涵蓋網路攝影機、快速球型攝影機與網路錄影機，並提供移動式NVR供移動監控使用。網路攝影機包含魚眼全景與雙通道分離式設計；深度神經網路技術支援物件追蹤及人臉偵測。機器視覺產品則包括工業攝影機與IP67防水防塵外殼。
