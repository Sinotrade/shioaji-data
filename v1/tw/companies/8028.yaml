summary_short: 以晶圓再生、測試晶圓及晶圓薄化加工服務取得營收。
summary_long: 昇陽半導體主要提供晶圓再生及晶圓薄化服務，2026年10月報導所載營收結構約為85%與15%。晶圓加工業務包含再生服務及全新測試晶圓，應用於半導體製程監控；薄化業務包含研磨、表面處理、金屬薄膜沉積及晶圓測試，亦列有SiC與GaN晶圓薄化服務。公司獲德州儀器供應商獎項，經濟部2019年公告另確認台積電與聯電使用其產能。再生晶圓市場相關競爭者包括辛耘、中砂及RS tech。2025至2026年間，公司公告向均豪、KLA、SHINSHO、登普及迪思科取得生產用機器設備。
