summary_short: 以晶圓再生、測試晶圓及晶圓薄化加工服務取得營收。
summary_long: 昇陽半導體提供晶圓再生與晶圓薄化製程服務，2025年度半導體晶圓代工服務占營收100%。晶圓再生服務涵蓋6吋、8吋及12吋，採用剝膜、拋光與清洗技術。測試晶圓產品涵蓋8吋及12吋，提供P型或N型規格。薄化業務包含矽晶圓的一般及Taiko製程，以及6吋、8吋SiC與GaN晶圓薄化，並提供超薄化研磨、表面處理與金屬薄膜沈積。2026年9月法說會另介紹先進材料解決方案，應用包括Dummy Die、散熱管理及翹曲控制。
