summary_short: 以己內醯胺、丙烯腈及附屬石化產品的製造銷售為主要營收來源。
summary_long: 中石化以己內醯胺、丙烯腈及附屬產品的製造銷售為核心。2025年營收中，己內醯胺及附屬產品占46.81%，丙烯腈及附屬產品占40.14%，另有鄰苯基苯酚與其他部門收入。己內醯胺用於尼龍6纖維與樹脂，丙烯腈用於聚丙烯腈纖維及ABS塑膠；硫酸銨供農業肥料使用，鄰苯基苯酚應用於抗菌防腐、光學與阻燃材料。公司另開發高頻低介電材料，官網列有5G應用。已核實子公司包括鼎越開發、中石化綠能科技及江蘇威名新材料。
