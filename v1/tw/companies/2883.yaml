summary_short: 以金融事業投資管理為主，透過壽險、銀行、證券、投信及私募股權業務取得收益。
summary_long: 凱基金控以金融事業投資與管理為核心，2025年母公司個體收益中，採用權益法認列子公司、關聯企業及合資損益占99%。主要子公司包括凱基人壽、凱基銀行、凱基證券、凱基投信與中華開發資本。凱基人壽提供壽險、意外險與投資型商品；凱基銀行提供存匯、貸款、信用卡與投資理財服務；凱基證券經營經紀、自營、承銷及財富管理。凱基投信發行ETF，中華開發資本提供私募股權投資與基金顧問服務。近三年具名事件包括中華開發資本與鴻海共同成立開鴻能源，以及凱基人壽公告向潤泰創新取得南港不動產。
