summary_short: 以投資及管理金融子公司為業務，透過旗下公司經營銀行、證券、票券及產險。
summary_long: 兆豐金控以投資及管理被投資事業為業務，2025年母公司個體收益中，採權益法認列的投資收益占99.56%。旗下七家全資主要子公司包括兆豐銀行、兆豐證券、兆豐票券、兆豐產險、兆豐投信、兆豐資產管理及兆豐創投。銀行子公司提供企業放款、專案融資及聯貸服務；證券子公司經營承銷與有價證券受託、自行買賣；產險子公司承作火災及汽車等保險。近三年具名資本配置事件包括2024年認購兆豐產險45億元增資、2025年決議認購兆豐銀行142.4694億元增資，以及2026年增資兆豐證券10億元。
