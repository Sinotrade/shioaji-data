summary_short: 以磁碟陣列儲存系統為主，提供影音、監控、企業與AI儲存設備。
summary_long: 喬鼎資訊主要銷售儲存系統，應用涵蓋影音製作、影像監控、企業資訊系統與資料中心。Pegasus 系列提供影音創作者高速外接儲存，Vess 系列提供監控管理、錄影與智慧影像分析伺服器，VTrak 系列支援網路附接與儲存區域網路應用。BoosTrak C 系列整合運算、GPU 擴充及儲存，供 AI 訓練與推論使用；S 系列提供雙節點儲存設計，處理低延遲及資料密集工作負載。
