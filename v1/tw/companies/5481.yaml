summary_short: 經營兒童美語品牌、教材與教育服務，並提供土地及廠房租賃管理。
summary_long: 新華泰富的官網業務包括授權兒教、升學文教及物業管理。授權兒教以芝蔴街美語品牌提供加盟與直營體系服務，內容涵蓋師資培訓及SSE1.0+教材；旗下芝蔴村文教為子公司。升學文教服務針對國中、高中全科目，提供自編講義、題庫及個人學習歷程紀錄。物業管理涵蓋旗下近二萬平方公尺土地與廠房，透過出租取得收益；玉豐物業管理顧問亦為子公司。公司沿革另列龍軒文教為子公司。
