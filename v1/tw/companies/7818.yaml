summary_short: 以淨水設備與濾芯耗材為主，兼營車載戶外裝備及工業水處理。
summary_long: 溢泰實業以淨水設備與濾芯耗材為主要營收來源，2025年水資源產品占營收61%，金屬產品約占35%。集團提供家用及商用淨水產品與OEM／ODM代工服務，泳池及SPA濾芯業務包含子公司FILBUR Manufacturing。車載戶外裝備由子公司Yakima Products經營，產品涵蓋車頂架、自行車架及車頂箱。工業水處理由彰華（南京）及溢華實業提供純水、超純水、廢水處理與維護服務，集團另將活性碳回收與再生列為產品服務。
