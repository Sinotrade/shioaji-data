summary_short: 製造銷售丁腈、丁苯及壓克力乳膠，供手套、造紙與接著用途。
summary_long: 申豐以合成橡膠乳液的製造與銷售為主要業務，產品包括丁腈乳膠、丁苯乳膠及壓克力乳膠。2025年丁腈乳膠占營收51.19%，丁苯乳膠占48.68%，其他占0.13%。丁腈乳膠用於醫療、試驗、手術及工業手套；丁苯乳膠用於紙張塗佈、木工接著、水泥砂漿添加與建材接著；壓克力乳膠用於阻隔膠、標籤及紙膠帶。合併財報列永豐餘投資控股為最終母公司，並列SHIN FOONG TRADING SDN. BHD.為全資子公司。
