summary_short: 研發、生產及銷售光收發模組與光學次模組，以熱插拔式模組為主要營收來源。
summary_long: 創威光電從事光收發模組及光學次模組的研發、生產與銷售，產品包括熱插拔式SFP系列、固定式模組與OSA。2024年熱插拔式及固定式光收發模組營收占比分別為65.92%及32.71%，光學次模組占1.20%。SFP系列應用於網路電信、行動通訊、資料中心及工業規格場域；固定式模組主要用於網路電信，OSA則作為光收發模組元件。2025年研發規劃包括加速25G、100G高速新產品開發，以及CPO／LPO相關OSA與ESA核心技術布局。
