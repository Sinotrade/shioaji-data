summary_short: 以保健食品配方設計與代工為主要收入，另銷售自研保健原料。
summary_long: 綠茵主要提供保健食品配方設計與代工服務，並銷售自研保健原料。2025年營收以保健食品配方為主，占71.81%，原料占27.57%，其他占0.62%。配方服務涵蓋原料研發與採購、生產管理、配方及包裝設計，並延伸至整合行銷。自有原料包括Insumate苦瓜胜肽、Antromax固態培養牛樟芝菌絲體、Zymologist 101綜合蔬果發酵液及RabenWhite昭和草萃取。公司另持有康普森生物科技株式會社100%股權。
