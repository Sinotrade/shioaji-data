summary_short: 以數位機上盒晶片設計銷售為主，另經營ASIC設計服務及網路設備。
summary_long: 揚智以數位機上盒（STB）晶片設計及銷售為主要業務，2025年度年報揭露其營收比重約85%，網路相關設備約15%。STB整合晶片涵蓋衛星、地面廣播、有線及IP機上盒；F6P為DVB-S2X／DVB-C系統單晶片。公司另提供ASIC設計服務，涵蓋前端設計、實體晶片整合、生產與軟體支援，並於官網列示ALiIN室內智慧運算平台。網路設備業務由安瑞科技及其子公司經營，涵蓋網路連線安全與流量加速相關系統。
