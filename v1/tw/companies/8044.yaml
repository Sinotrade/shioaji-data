summary_short: 以PChome 24h購物經營網路零售，另有交易市集、跨境電商、支付及物流業務。
summary_long: 網家以PChome 24h購物經營B2C網路零售，商品涵蓋3C家電與生活百貨。2025年報揭露電子商務營收占94.9%，其他業務占5.1%。集團透過子公司露天市集經營C2C交易平台，並間接持有商店街市集；日本比比昂提供跨境代標代購服務。金融科技業務包括二十一世紀金融科技株式會社，以及其旗下拍付國際資訊提供的Pi 拍錢包行動支付。物流方面，網家直接持有網家速配，經營物流運輸業務。
