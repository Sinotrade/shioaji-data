summary_short: 主要製造汽車、網通及消費電子機構件，另提供模具產品。
summary_long: 乙盛-KY以汽車、網通及消費電子機構件為主要業務，另有模具產品。2025年汽車機構件占營收57.99%，網通機構件占22.51%，消費電子機構件占14.35%，其他占5.15%。產品涵蓋車椅結構件、車架組件、伺服器機殼與電視組件，並提供低軌衛星地面接收設備相關零組件。公司年報揭露推進AI伺服器生產製造，車用業務亦涵蓋電動車零組件。營運子公司包括墨西哥的Multiwin de Mexico與Esonmex Monterrey，以及越南的Eson (VN)。
