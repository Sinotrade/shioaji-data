summary_short: 以伺服器主機板與整機系統的開發及銷售為主要業務。
summary_long: 永擎電子以伺服器主機板與整機系統的開發及銷售為主要業務，2025年伺服器周邊產品占營收93.57%，其他占6.43%。產品涵蓋HGX B300平台AI GPU伺服器及IGX Thor平台邊緣AI伺服器，其中AI GPU伺服器用於資料中心AI訓練與推論。公司並在伺服器導入兩相式直接液冷技術。華擎科技為母公司，和碩聯合科技為最終母公司；永擎持有美國子公司全部股權，該子公司負責美洲地區銷售服務。
