summary_short: 製造銷售UV光固化材料、機能性樹脂與高頻電子材料。
summary_long: 國精化以製造及銷售UV光固化材料、機能性樹脂與電子材料為主要業務。2026年上半年，三者營收占比分別為48.2%、32.0%與19.8%，UV光固化材料仍為最大來源。UV產品涵蓋反應單體與寡聚物，供塗料與油墨使用；傳統樹脂則包括不飽和聚酯與醇酸樹脂。電子材料包含低介電高頻銅箔基板樹脂及PSMA，應用於AI伺服器、高速交換器與5G高頻基板，在PCB材料供應鏈位於樹脂環節。
