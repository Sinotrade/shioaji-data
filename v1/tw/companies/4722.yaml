summary_short: 製造UV光固化材料、機能性樹脂及高頻電路板用電子化學材料。
summary_long: 國精化學製造UV光固化材料、機能性樹脂與電子材料，2026年上半年營收占比分別為48.2%、32.0%及19.8%，以UV光固化材料為最大產品線。UV產品包括反應單體、寡聚物、光起始劑與助劑；機能性樹脂涵蓋不飽和聚酯及塗料樹脂。電子材料包括低介電耗損樹脂，應用於5G高頻通訊及AI伺服器用電路板，另有供高頻銅箔基板使用的PSMA樹脂。具名報導指出，台光電、台燿及生益科技已完成相關材料驗證並陸續出貨。公司與JSR合作開發5G材料，透過IGM拓展能量固化樹脂通路，並與Electroninks及EMD Electronics合作提供先進封裝材料與應用服務。
