summary_short: 透過越南子公司生產銷售PVC人造皮革、PU／TPU皮革及膠布。
summary_long: 富林-KY透過越南子公司富林塑膠工業股份有限公司經營人造皮革業務，2025年底持有該子公司100%股權。主要產品包括PVC乳膠皮、柔軟皮、PU／TPU皮革及膠布。2025年合併營收以乳膠皮占58.27%為最大來源，其次為PU／TPU占15.03%、柔軟皮占13.76%、膠布占12.33%，其他產品占0.61%。官網另列水性PU、無溶劑PU皮、TPU皮及高固PU等產品，膠布則包含雨衣用產品。
