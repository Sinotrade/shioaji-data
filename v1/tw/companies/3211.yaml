summary_short: 研發、製造及銷售鋰電池模組，應用於筆電、BBU、儲能及輕型電動載具。
summary_long: 順達科技以鋰電池模組研發、製造與銷售為主，屬電池組產業中游組裝廠商；2025年鋰電池組占營收99.8%，其他項目占0.2%。資訊產品電池方案涵蓋筆記型電腦與平板電腦，非資訊應用則包括伺服器及資料中心備援電池模組、儲能電池模組與輕型電動載具電池模組。公司亦提供電池組充電器，BBU業務對應AI伺服器電力備援及資料中心設備應用。製造子公司包括泰國Dynapack Technology (Thailand) Co., Ltd.及間接持有的順達電子科技（蘇州）有限公司。
