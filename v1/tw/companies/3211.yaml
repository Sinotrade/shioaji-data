summary_short: 研發、製造及銷售鋰電池模組，產品涵蓋筆電、伺服器備援與儲能。
summary_long: 順達以鋰電池模組為主要業務，2025年鋰電池組占營收99.8%。資訊產品包括筆記型電腦、平板及智慧型手機電池模組，另提供伺服器備援電池模組、儲能系統電池模組與電動自行車電池方案。公司參與AI伺服器及資料中心備援電力應用，並與台達電合作開發400VDC及800VDC BBU產品。Apple公布的2023會計年度供應商名單列有順達；其他品牌客戶的具名證據部分來自較早期報導。除電池業務外，順達於2024年公告將龜山區合建分售案土地處分予富宇建設，交易金額為新台幣26.305億元。
