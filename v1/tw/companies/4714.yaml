summary_short: 製造PU樹脂、多元醇與高分子材料，另經營房地開發。
summary_long: 永捷製造聚氨酯樹脂、聚酯多元醇與熱塑性聚氨酯彈性體，應用於合成皮革、鞋材、服裝及接著劑。另有導電、抗靜電高分子複合材料，以及可撓式OLED顯示器表面耐磨層材料。2025年個體營收中，樹脂與化工占62.23%，房地銷售占24.69%，另有租金及其他收入。其合併子公司包括信立化學與斐成開發科技，普大應用材料由信立持有，屬間接子公司；母公司為上曜建設開發。
