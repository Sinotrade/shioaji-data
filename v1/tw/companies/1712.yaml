summary_short: 以農藥、肥料等植物保護產品為主，並透過子公司經營超市與團膳。
summary_long: 興農主要經營植物保護產品，產品包括農業用殺蟲劑、殺菌劑、除草劑及肥料，另有微生物農藥、微生物肥料、精密化學品及其中間體與塑膠包材。2026年1至7月，植物保護占合併營收57.7%，超市百貨占21.2%，家用品食品占16.8%，其他占4.3%。子公司台灣楓康超市經營生鮮超市；玉美生技經營農產運銷、食品團膳及家庭用品，集團業務因此涵蓋農業資材、食品與民生消費。
