summary_short: 主要製造與銷售軟性印刷電路板，產品包括多層軟板、Mini LED基板及高頻高速軟板。
summary_long: 同泰主要從事軟性印刷電路板設計與製造，2025年軟板占營收99.92%，其他業務占0.08%。產品包括單面、雙面及多層軟板。官網記載Mini LED基板於2019年8月量產，高頻高速5G光通訊LCP軟板於2020年8月量產。集團另有兩家全資投資控股子公司，並透過其中一家間接持有同揚光電（江蘇）有限公司全部股權，由該公司從事軟板生產銷售。
