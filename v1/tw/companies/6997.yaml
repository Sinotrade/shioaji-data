summary_short: 以公有雲整合、技術顧問、雲端代管及資安服務為主要收入來源。
summary_long: 博弘以公有雲服務銷售、雲端基礎架構建置、技術顧問與維運服務為主要業務，2025年雲端服務占營收99.95%，銷貨收入占0.05%。公司提供全天候雲端代管及MSSP資安營運服務，並開發AICOM雲智能管理平台，整合資產、成本、治理、安全與權限控管；LEMMA則提供企業知識檢索與生成式AI代理應用。主要子公司包括宏庭科技、博弘香港與Renova Cloud HK Limited。直接母公司為新世紀資通，遠傳電信為間接母公司，最終母公司為遠東新世紀。
