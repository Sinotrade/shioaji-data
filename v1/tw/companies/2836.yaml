summary_short: 以企業與個人授信為主要收入，另經營投資、財富管理及存匯業務。
summary_long: 高雄銀行以企業及消費金融授信為主要收入來源，2025年授信業務占總收入69.60%，投資業務占21.83%，財富管理占5.65%。授信商品涵蓋企業週轉金、資本支出貸款，以及個人房貸、消費性貸款與就學貸款；另提供存款、外匯與信託服務。政府業務包括受高雄市政府財政局委託代理市庫，以及受中央銀行委託代理國庫。數位金融方面使用財金資訊的開放銀行平台，並與睿元國際及臺灣集中保管結算所合作提供資訊查詢服務；中小企業融資則有信保基金提供信用保證的合作專案。
