summary_short: 以存放款與證券投資為主要收入來源，並提供財富管理、外匯與信託服務。
summary_long: 高雄銀行以存放款與投資業務為主要收入來源。2025年授信業務收入占總收入69.60%，投資業務占21.83%，財富管理占5.65%；其餘為存款、外匯與其他業務。國內銀行業務辦理存款與貸款，OBU及金融市場營運處辦理海外存放款和有價證券投資、買賣。其他部門涵蓋公庫、信託及保險代理服務，另提供財務規劃、資產配置，以及進出口與匯款等外匯服務。
