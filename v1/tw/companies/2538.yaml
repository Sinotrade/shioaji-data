summary_short: 開發住宅、辦公及商業大樓，以出售、出租與經營取得收入。
summary_long: 基泰建設主要經營住宅、辦公及商業大樓開發，透過委託營造廠興建，從事房屋出售、出租與經營業務。2025年度合併營收為新台幣2.98724億元，其中營建業務1.80597億元、占60%，其他業務1.18127億元、占40%。集團旗下君匯開發、京匯開發及鼎峰開發，均以住宅及大樓開發、租售為主要業務；截至2026年6月30日，基泰直接持有三家子公司全部股權。
