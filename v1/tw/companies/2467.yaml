summary_short: 研發製造半導體、先進載板及PCB製程設備，以熱處理、壓合與貼膜等設備取得營收。
summary_long: 志聖研發製造半導體與PCB製程設備，產品涵蓋烘烤、電漿、撕膜壓膜、鍵合、曝光及塗佈設備。2026年第一季營收組合為半導體50%、先進PCB19%、一般PCB24%、其他電子7%。公司供應台積電CoWoS製程設備，日月光半導體製造與矽品亦公告向志聖採購營業用機器設備。志聖與均豪、均華組成G2C+聯盟，整合半導體、面板與PCB技術，提供一站式服務。公司亦有ABF載板剝膜設備及HBM封裝烘烤設備應用。2026年向凱柏取得台中土地及廠房，並認購東捷私募普通股。
