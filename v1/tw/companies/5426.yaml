summary_short: 以電腦與伺服器機殼、網路連接器及精密沖壓零組件製造取得營收。
summary_long: 振發以電腦外殼、網路連接器及精密沖壓零組件製造為業務，2025年電腦外殼占合併營收76.53%，網路連接器占10.04%，其他業務占13.43%。機殼產品涵蓋工業電腦、伺服器與個人電腦，並提供從設計、樣品、製模、量產到加工的統包服務。公司另推出NVIDIA MGX相容伺服器滑軌，用於高密度GPU運算設備的安裝，屬AI伺服器機構件題材。
