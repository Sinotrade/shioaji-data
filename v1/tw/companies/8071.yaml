summary_short: 主要從事事務機機構件與模具製造、電子零組件銷售，另經營隱形眼鏡及運動通路。
summary_long: 能率網通以事務機零組件製造及電子零組件銷售為主要業務，產品包括事務機機構件、金屬沖壓與塑膠射出模具。2025年度事務機業務占營收40.50%，電子零組件占39.42%，其他營運占20.08%。集團透過能遠國際從事電子零組件通路、精能光學製造及銷售隱形眼鏡，並透過新時代電商經營運動用品銷售平台。正能量智能亦列入合併子公司，能率創新為控制能率網通的母公司。
