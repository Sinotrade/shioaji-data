summary_short: 以射頻天線設計製造為主，兼營量測設備銷售與測試認證。
summary_long: 耀登科技以射頻天線開發、設計與製造為主要業務，2025年占合併營收67.95%。產品包含5G毫米波射頻天線模組及低軌道衛星接收設備，後者屬用戶終端設備。量測設備銷售及技術支援占營收26.96%，包含電磁波人體吸收率檢測設備代理與售後服務。測試認證占3.33%，其他占1.76%；集團提供開放式電信基礎設備合規測試及資安驗證。耀睿科技為全資子公司，從事通訊產品測試與資安相關服務。
