summary_short: 以成衣設計、製造與銷售為主，產品涵蓋流行、運動、睡衣及智慧服飾。
summary_long: 聚陽主要從事成衣設計、製造及銷售，2025年成衣占營業比重97.4%，布料買賣及其他占2.6%。產品涵蓋流行服飾、運動服飾與睡衣服飾，另提供可符合ISO 13485醫療認證的智慧服飾。集團的全資子公司Global Trading Int'l Corp.與Fortune Star Investment Limited均從事投資控股。依成衣為主要營收來源的業務結構，歸類於成衣與服飾，位於紡織產業鏈的成衣製造階段。
