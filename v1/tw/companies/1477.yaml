summary_short: 以成衣設計、製造及銷售為主，供應國際服飾品牌與零售通路。
summary_long: 聚陽主要提供成衣設計、製造及銷售，產品涵蓋流行服飾、運動服飾及睡衣，並提供材質、設計、製造與物流等整合服務。2025年成衣占營業比重97.4%，布料買賣及其他占2.6%。同年度Gap Inc、Target、Dicks與Kohls營收占比分別為36%、18%、9%及7%；官網另列Old Navy、Banana Republic、GU及Walmart為客戶。集團於2024年6月投資設立薩爾瓦多成衣子公司，10月設立河內行政服務子公司，並透過孟加拉子公司從事成衣製造。供應端則有越南子公司向關聯企業Namtex進貨的具名揭露。
