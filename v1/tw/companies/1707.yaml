summary_short: 以保健食品製造銷售為主，另提供發酵代工與功能性原料。
summary_long: 葡萄王以保健食品製造與銷售為主，2025年保健食品占合併營收76%，委託代工占10%，另有通路銷售、化妝品與飲料品等收入。產品包括益菌王旗艦EX400粉末與康普茶，並提供發酵代工及菌菇、益生菌發酵素材，菌菇素材涵蓋靈芝、樟芝與猴頭菇。主要子公司包括持股60%的葡眾企業、全資的溢昭，以及經英屬維京群島投資公司持有的上海葡萄王；其中上海葡萄王屬間接子公司。
