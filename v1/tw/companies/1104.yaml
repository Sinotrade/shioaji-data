summary_short: 以混凝土、水泥及石膏板的生產與銷售為主要收入來源。
summary_long: 環球水泥以混凝土、水泥與石膏板的生產及銷售為主要業務。2025年度混凝土收入52.94億元，為最大產品別收入；水泥與石膏板收入分別為15.31億元及9.73億元。集團旗下環球混凝土、嘉義混凝土與台南混凝土從事預拌混凝土業務，另有利永環球科技經營電子零組件銷售。利永環球科技旗下持有Tekscan Holdco，並透過該公司間接持有從事電子零組件加工製造及銷售的Tekscan Inc.。
