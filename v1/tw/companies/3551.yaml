summary_short: 以半導體與光電製程設備零組件的精密洗淨、再生及維修服務為主要收入。
summary_long: 世禾科技主要提供半導體、光電及太陽能製程設備零組件的精密洗淨與再生處理，並提供設備維修保養及幫浦維修洗淨服務。2025年合併營收以精密設備潔淨再生服務為主，占93.40%，商品銷貨占5.92%，勞務收入占0.68%。公司另有製程設備及零組件銷售業務。集團持有境外控股子公司Skill High Management Limited，並透過昌昱科技從事半導體與光電設備零件陽極處理、維修及組裝業務。
