summary_short: 以晶片、功率及濾波電感器製造銷售為主，另有陶瓷散熱片與精密金屬零件。
summary_long: 千如以電感器製造與銷售為主，產品涵蓋晶片電感、各式功率電感及SMD貼片電感，另有變壓器、LTCC元件、陶瓷散熱片與精密金屬零件。2024年電感器占營收96.27%，其餘為精密金屬零件、陶瓷散熱片及其他業務。公司揭露電感產品應用於5G通訊、工業控制、醫療器材、電動汽車及智慧駕駛。依2026年第一季財報，集團直接持有ATEC HOLDING COMPANY及ABC AMERICA ELECTRONICS CORP.，並透過間接子公司經營馬來西亞與中國的電子零組件製造業務。
