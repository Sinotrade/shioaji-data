summary_short: 以事業廢棄物焚化、蒸餾回收及再生溶劑銷售為業，子公司經營垃圾熱處理與發電。
summary_long: 台鎔科技經營事業廢棄物處理中心，以焚化處理、廢熱回收與廢溶劑蒸餾回收提供服務，並銷售再生溶劑。其物理處理與再生品業務涵蓋EBR、IPA、NBAC及CPN，焚化處理範圍包括半導體業廢棄物。集團透過全資子公司翰陽科技綠能，以BOO模式經營新竹縣垃圾熱處理設施及再生能源發電。官網2023年6月記事另記載GREEN BREEZE PLANT CORPORATION為全資子公司，並透過其間接持有日環股份有限公司，兩者納入集團子公司。
