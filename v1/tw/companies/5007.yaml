summary_short: 以螺帽、螺絲等扣件製造銷售為主，另有模具、墊圈與線材業務。
summary_long: 三星科技以螺帽與螺絲等扣件為主要業務，2025年分別占合併營收52.00%及28.53%。其他業務包括模具、墊圈、線材與機械及零件，其中模具占營收8.64%。車用扣件採訂單生產，透過汽車廠的OEM廠商供應，年報明確區分其與直接供應整車廠的關係。2025年中國鋼鐵及Hyosung Corporation分別占合併進貨淨額50.27%與19.74%。集團另透過子公司利孟科技布局伺服器散熱風扇；馬來西亞子公司ACKU於2025年取得電鍍加工廠Jiwei的95%股權。
