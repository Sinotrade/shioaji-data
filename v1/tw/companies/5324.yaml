summary_short: 以不動產開發銷售、旅館住宿餐飲及俱樂部服務取得收入。
summary_long: 士林開發從事不動產開發、旅館及俱樂部經營，不動產產品包括商務大樓與集合住宅，近年聚焦台北核心地段開發與都市更新。2025年合併營收組成為營建39%、客房住宿39%、餐飲服務13%、會員服務6%及其他3%，占比依年報列示。旅館業務由持股79.31%的子公司群欣置業經營，在台北西門町、中山及松山提供住宿與餐飲服務。另持有不動產開發子公司匯德開發100%股權，並將持股43.30%的嘉德開發納入合併報表，其業務為餐飲與俱樂部。
