summary_short: 以建築工程承攬為主要收入，提供統包、總包及預鑄構件生產吊裝服務。
summary_long: 潤弘提供建築工程統包、總包及專業分包服務，並生產與吊裝預鑄外牆板、樑柱結構及高科技廠房無塵室格子版。2025年合併營收以工程合約收入占85.57%為主，商品銷售收入占14.11%。潤泰創新為母公司，也是工程客戶；年報列示的鋼筋供應商包括東和鋼鐵與豐興鋼鐵。合併範圍涵蓋潤泰精密材料、潤陽營造及孫公司潤德。2026年公告以新台幣592,522,071元購買潤泰營造全部股權，後續公告已稱其為子公司；2024年另由子公司潤泰精密材料投資德欣先進35%股權。
