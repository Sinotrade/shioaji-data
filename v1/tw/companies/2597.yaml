summary_short: 以營建統包、土建機電工程及預鑄構件生產與吊裝取得收入。
summary_long: 潤弘以營建統包、總包及預鑄構件生產與吊裝提供工程服務，整合設計、土建與機電施工。主要預鑄產品包括外牆版、梁柱系統及高科技廠房無塵室格子版，並運用BIM與MRO平台支援施工檢討及建物維運。2026年上半年合併營收以營造事業部為最大來源，另有建材及室內裝修設計部門。母公司為潤泰創新國際，合併子公司包括潤泰精密材料、潤陽營造、潤泰營造，以及間接子公司潤德室內裝修設計工程。
