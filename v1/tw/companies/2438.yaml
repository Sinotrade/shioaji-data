summary_short: 以子公司光學面板及彩色濾光片基板業務為主，另提供算力租賃與軍服。
summary_long: 翔耀的合併業務以光學面板及彩色濾光片基板加工銷售為主，2025年占營收約71.82%，另有代採購及其他收入。光電業務由子公司體系經營：勁耘科技從事彩色濾光片基板再生與研磨，間接子公司嵩達光電提供電阻式及電容式觸控面板。翔耀另提供NVIDIA GPU算力租賃、私有化機房代管與AI機房建置，服務涵蓋液冷散熱、供電及機電整合。專案事業則提供軍用服裝生產與供應。
