summary_short: 以迴轉式壓縮機為主要營收來源，另提供熱泵熱水設備及子公司馬達產品。
summary_long: 瑞智精密主要經營迴轉式壓縮機，產品應用於窗型與分離式冷暖氣機、除濕機、熱泵乾衣機、車載空調及熱水器等設備。2025年壓縮機營收占94.65%，其他產品占5.35%。公司亦提供家用及工商用熱泵熱水設備，可供單機或群組使用，服務住宅與工商業熱水需求。子公司瑞展動能經營直流無刷馬達，另有從事投資業務的Rechi Holdings及瑞展投資，形成壓縮機、熱泵熱水設備及子公司馬達業務的產品布局。
