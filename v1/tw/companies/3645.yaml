summary_short: 製造與銷售聚醯亞胺薄膜，供軟板、銅箔基板與工業絕緣使用。
summary_long: 達邁以聚醯亞胺（PI）薄膜製造與銷售為主，2025年個體公司產品銷售全部來自PI薄膜。TH、TL系列供軟性印刷電路板、有膠系軟性銅箔基板及工業絕緣使用；TX系列提供薄型保護與絕緣材料。BK系列為低透光黑色薄膜，OT系列為無色薄膜，可用於軟性顯示器與軟性電子；WB系列為白色薄膜，應用包含LED燈條及條碼印刷。合併財報子公司包括柏彌蘭金屬化研究、TAIMIDE INTERNATIONAL及昆山達邁電子科技。
