summary_short: 設計與銷售光學導航、CMOS影像感測及其他感測晶片。
summary_long: 原相從事感測晶片設計與銷售，產品採委外生產模式，2025年CMOS影像感測元配件占合併營收98.17%，其他產品占1.83%。主要產品包括光學導航感測器、CMOS影像感測器、健康管理與熱感測器、物體動態感測器，以及射頻與低功耗藍牙晶片。光學導航產品涵蓋滑鼠、手指導航、光學追蹤及編碼器；影像感測產品包括影像感測系統單晶片與全域快門感測器。集團產品應用涵蓋掃地機，並已揭露無人機影像感測晶片需求，對應機器人及無人機的感測零組件領域。
