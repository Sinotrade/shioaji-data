summary_short: 設計與銷售光學滑鼠、影像及其他感測晶片，並提供客製化 ASIC 設計服務。
summary_long: 原相以感測晶片設計與銷售為主，生產採委外模式，2025年CMOS影像感測元配件占合併營收98.17%。2026年第二季應用別營收以滑鼠62%為主，遊戲機9%，其他產品29%。產品涵蓋光學導航、健康管理與熱感測，並提供客製化ASIC設計服務。原相曾與Razer、SteelSeries共同開發滑鼠感測器，大聯大官網則列明詮鼎集團及WPG Americas為授權經銷商。2024年7月參與天光材料增資後，直接與間接合計持股由30.01%增至52.51%，將其納為子公司。太空規TDI感測器於2026年第二季已小量出貨予立方衛星客戶。
