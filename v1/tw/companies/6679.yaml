summary_short: 從事 IC 設計，產品涵蓋 MEMS 麥克風、感測器與電源管理晶片。
summary_long: 鈺太科技定位為專業 IC 設計公司，產品涵蓋聲學、感測及電源管理元件。MEMS 麥克風提供類比與數位輸出形式，感測產品包括數位氣壓與溫度感測器。音訊產品另有音訊放大器，電源管理產品包括降壓與升壓 DC/DC 轉換器，以及 LDO 穩壓器。公司官網說明正投入開發低功耗、小型化的 MEMS 壓力感測元件，應用包含無人機中的氣壓計，因此列入無人機題材的感測元件階段。依其 IC 設計定位，歸類為半導體產業鏈上游。
