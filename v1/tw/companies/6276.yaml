summary_short: 以電腦機殼與電源供應器銷售為主，另提供散熱產品及掌上型電腦。
summary_long: 安鈦克主要從事電腦機殼、電源供應器、散熱模組與散熱風扇的研發、設計及銷售。2024年度營收中，電腦機殼占55.5%、電源供應器占36.2%，其他產品占8.3%，機殼為最大收入來源。散熱產品包括VORTEX VIEW 360液冷CPU散熱器，配備可旋轉液晶顯示螢幕。公司也提供CORE HS掌上型電腦，採用AMD Ryzen 7 7840U處理器，產品範圍涵蓋電腦零組件與掌上型裝置。
