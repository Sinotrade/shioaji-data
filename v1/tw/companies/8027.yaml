summary_short: 以半導體雷射、電漿製程設備及集團SMD包裝材料取得營收。
summary_long: 鈦昇以半導體雷射與電漿製程設備為核心，2025年集團營收以雷射設備占48.81%最高，電漿設備占10.75%，SMD包裝材料占18.83%，其他業務占21.61%。公司提供FOPLP面板級封裝設備，涵蓋雷射打印、切割及電漿製程，並提供玻璃基板TGV雷射鑽孔結合濕式蝕刻的加工方案，以及ABF晶圓與面板雷射鑽孔技術。子公司唐威科技從事軟性電路板製造與銷售，鈦昇半導體材料經營SMD包材業務；美國子公司於2025年8月在亞利桑那州成立。
