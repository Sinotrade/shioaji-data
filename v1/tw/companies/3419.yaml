summary_short: 以無線通訊天線為主，另提供電子零件、RFID產品及電子製造服務。
summary_long: 譁裕的天線產品涵蓋Wi-Fi 6／6E／7、5G／LTE基站及車載GNSS／5G多合一天線。2025年合併營收以高中低頻無線裝置為主，占67.60%；電子及光通訊零件占24.62%，電子訊號連結裝置占7.71%，電子產品占0.07%。公司另提供RFID智慧貨架、讀取器，以及PCB組裝、測試、檢驗與包裝等電子製造服務。無人機應用包含FPV影像傳輸天線；2026年10月並公告將展示供無人系統與低軌衛星／物聯網定位使用的高精度主動式GNSS天線模組。
