summary_short: 以電子系統保全服務為核心，並經營駐衛、運鈔、物流及餐飲。
summary_long: 中保科以電子系統安全管理服務為核心，2025年電子系統收入占合併營收42.53%，另有留駐警衛、運鈔、物流及餐飲服務。公司提供中保無限+智慧宅，整合防災偵測、家電連動與全天候管制監控，並提供居家防火產品。旗下國興保全從事駐衛保全，立保保全提供安全防護；中保迷你倉為國興保全體系提供的倉儲租用服務。公司另推出中保無限飛AI無人機平台，以訂閱制或任務制提供空中巡檢，並公開展示具自主導航與異常事件感知功能的AI巡檢機器人。
