summary_short: 製造及銷售盤元、鋼筋、退火線與螺絲螺栓等緊固件。
summary_long: 泰聚亨主要製造與銷售盤元、鋼筋、球化退火線，以及螺絲、螺栓與牙條等緊固件。2025年產品別營收以盤元45.11%為最大來源，緊固件占28.93%，退火線占6.90%；其餘包含預力鋼絞線4.90%、預力鋼線0.50%與其他13.65%。公司業務涵蓋鋼鐵中游鋼材與下游緊固件，依最大營收產品歸入鋼鐵業。合併財報另列兩家直接子公司與三家間接子公司，母公司為Tycoons Group Enterprise Co., Ltd.。
