summary_short: 以MEMS探針卡自動化設備為主要收入，另經營探針材料、維修及銅柱技術。
summary_long: 創新服務開發、製造及銷售半導體自動化設備，2025年半導體設備占營收約98%。產品涵蓋MEMS探針卡植針、雷射加工、檢查與返修設備，並提供CoWoS基板元件返修設備。Technoprobe集團是其設備客戶，公司亦引入TP MEMS探針，經營材料包銷售與維修服務。Technoprobe於2025年1月以660萬歐元取得創新服務9.37%股權。先進封裝業務包括高密度銅柱模組與TGV玻璃銅柱基板技術，並與晶呈科技合作開發玻璃載板金屬填孔。公司於2025年及2026年分別公告向銘金科技與岱宇國際購置大甲不動產。
