summary_short: 以基因檢測為主要收入，另提供數位研發與資訊管理服務。
summary_long: 訊聯基因以基因檢測為主要收入來源，2025年占營收87.77%，數位化數據管理系統開發、導入服務及商品銷售占12.23%。檢測產品包括胚胎著床前染色體篩檢、非侵入性胎兒染色體檢測、孕知因帶因篩檢，以及康知因與癌知因成人健康風險評估。數位科技服務結合虛擬研發、合規資訊管理及AI應用，涵蓋生物與材料模擬、實驗室資訊管理及電子送件。訊聯生物科技為其母公司；合併個體包括馬來西亞基因檢測子公司及受控制的內湖訊聯醫事檢驗所。
