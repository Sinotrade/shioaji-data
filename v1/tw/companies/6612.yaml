summary_short: 以人工水晶體、植入系統、醫材表面處理技術服務及授權取得收入。
summary_long: 奈米醫材經營人工水晶體與植入系統，集團亦提供醫材表面處理相關技術。2025年合併營收組成為醫材及射出成型等銷售61%、權利金20%、技術服務19%。主要產品包括愛視睫單焦點疏水性人工水晶體、散光矯正型人工水晶體、預載式植入系統，以及搭配LubriMATRIX潤滑塗層的安視導引器。子公司AST PRODUCTS從事醫材表面處理技術，AST VISIONCARE經營眼科器械通路，詠豪科技則從事醫材與電子塑膠製品射出成型及模具業務。
