summary_short: 製造銷售血糖試片、血糖機及居家醫療設備，兼營代工與自有品牌。
summary_long: 泰博科技以血糖機與拋棄式血糖試片的製造及銷售為核心，採OEM/ODM代工及FORA自有品牌經營。2024年血糖試片占營收53.90%，血糖機占14.08%，其餘包含新冠肺炎檢驗試劑及其他產品。產品線另涵蓋酮體、膽固醇、尿酸與糖化血色素檢測、耳溫槍、血壓計、霧化器、專業醫用監測設備及具無線連線功能的遠距醫療產品與APP。截至2025年9月底，直接子公司包括福爾聯合、喬聯科技、泰達精密科技、亞太遠見及泰瑞特科技，分別從事醫療器材或電子零組件相關業務。
