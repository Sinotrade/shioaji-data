summary_short: 供應水龍頭、蓮蓬頭與衛生陶瓷，經營自有品牌、代工及英國廚衛倉儲物流。
summary_long: 成霖主要供應水龍頭、蓮蓬頭與衛生陶瓷，營運涵蓋自有品牌、ODM/OEM及英國倉儲物流事業。2025年營業比重中，自有品牌占40%、ODM/OEM占18%，兩者均屬全球衛浴事業體；英國PJH事業占42%。Gerber Plumbing Fixtures, LLC為集團間接子公司，負責衛浴產品組裝及銷售；PJH Group Limited亦為間接子公司，經營廚衛產品銷售。
