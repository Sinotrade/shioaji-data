summary_short: 以印刷電路板為主要營收來源，產品涵蓋金屬基板、FR4及覆銅陶瓷基板。
summary_long: 佳總主要從事印刷電路板業務，2025年印刷電路板營收為新台幣462,684仟元，占營收100%。產品包括高導熱金屬基板、FR4硬板、覆銅陶瓷基板與內埋型電路板。高導熱金屬基板可生產0.3至3.0毫米厚度，FR4最高可生產24層。覆銅陶瓷基板列有DBC及AMB製程，應用市場包括功率模組。內埋型電路板採用Under-fill與Any-layer製程，應用涵蓋AI加速卡及伺服器MOS功率模組；複合式電路板則列有智慧車燈應用。
