summary_short: 透過子公司產製及銷售緹花網布、鞋帶、織帶、黏扣帶與鬆緊帶。
summary_long: 百和興業集團主要產製及銷售緹花網布、織帶與鞋帶、黏扣帶及鬆緊帶。2025年緹花網布占營收45.0%，織帶與鞋帶占24.7%，黏扣帶占12.2%，鬆緊帶占9.3%，另有房地銷售及其他產品收入。主要營運子公司包括江蘇百宏複合材料科技股份有限公司、東莞百宏實業有限公司及越南百宏責任有限公司。直接母公司為百和國際有限公司，最終母公司為台灣百和工業股份有限公司。
