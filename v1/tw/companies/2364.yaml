summary_short: 倫飛研發、製造及銷售軍工規強固型筆電、平板與相關零組件。
summary_long: 倫飛以軍工規可攜式電腦為主要業務，2024年度可攜式電腦（含成品板）占營收92%，其他占8%。主要產品包括強固型筆記型電腦、強固型平板電腦，以及軍工規主機板、零組件及週邊產品，並提供售後服務。筆電產品包含Z14I，平板產品包含R8。公司直接持有Durabook Americas Inc.與倫飛（亞洲）股權，並透過倫飛（亞洲）持有Twinhead Enterprises、倫飛電腦（昆山）及昆山倫騰電子等間接子公司。
