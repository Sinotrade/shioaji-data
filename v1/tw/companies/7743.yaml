summary_short: 以HPP超高壓低溫技術製造冷壓蔬果汁、機能食品，並提供食品代工服務。
summary_long: 金利食安以HPP超高壓低溫食品加工為核心，製造及銷售冷壓蔬果汁，並提供ODM代工服務。2025年度冷壓蔬果汁占營收86.27%，其他HPP產品占7.75%，其他業務占5.98%。產品線另涵蓋鱸魚精、膠原蛋白飲等精補品，以及冷萃茶、冷萃咖啡與花草茶。餐飲原料包括冷壓果蔬原汁、沾醬、果泥與截切果塊；加工服務涵蓋飲品、機能食品、水產品、肉品及即食食品，提供HPP低溫加工與技術服務。
