summary_short: 以休閒、流行、運動機能及無縫成衣的設計、代工製造與銷售為主。
summary_long: 振大環球主要從事成衣設計、代工製造與銷售，產品涵蓋休閒、流行、運動機能、居家及無縫等針織成衣，法說會亦列有平織成衣。公司提供一站式ODM服務，範圍包含流行趨勢掌握、布料建議、成衣設計及門店櫥窗設計。2025年成衣銷售占營收99.96%，其他收入占0.04%。集團直接持有GLI、GVI、GAMA及BAOBAB等子公司，分別涉及投資、外發管理與成衣加工製造，並透過GLI持有從事成衣加工製造的GGI與GV。
