summary_short: 以半導體製程設備研發製造、設備代理與12吋晶圓再生服務取得營收。
summary_long: 辛耘的業務涵蓋自製製程設備、晶圓再生及設備代理。2026年上半年，製造業營收占52%，代理業務占48%；製造業包含自製設備與晶圓再生。自製產品包括WS批次式濕製程設備及Polar單晶圓濕製程設備，提供清洗、蝕刻與光阻剝離等功能。Pyxis暫時性貼合設備由辛耘與3M合作開發，公司另提供WSE Panel面板級批次濕製程設備。公司官網明確指出，其濕製程設備已導入CoWoS及其他先進封裝量產產線。晶圓再生業務提供12吋服務，代理業務涵蓋製程、量測設備及分析儀器。年報揭露，台積電占2025年第一季銷貨淨額27.28%。
