summary_short: 以動力電池材料為主要收入，另製造氧化觸媒、特用化學品與肥料。
summary_long: 康普以動力電池材料為主要收入來源，2026年上半年占集團營收71%；其餘為特用化學12%、氧化觸媒10%、肥料4%與其他3%。公司生產硫酸鎳，供電動車電池市場使用，並提供PTA等氧化製程使用的催化劑。子公司天弘化學的產品包括硫酸鈷；恆誼化工的產品包括工業級與半導體級硫酸及肥料。主要子公司另有越南VINACOREMAX COMPANY LIMITED，從事無機鹽類及其晶體的製造與銷售。
