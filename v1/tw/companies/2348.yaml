summary_short: 以不動產代銷及經紀服務為主，並透過集團建設業務取得房地銷售收入。
summary_long: 海悅以不動產代銷及經紀服務為主，服務涵蓋產品規劃建議、整合行銷與交易居間移轉，代銷標的包含預售屋、新成屋、餘屋、一般事務所、土地與停車位。2025年度代銷勞務收入占合併營收53.28%，房地銷售收入占46.72%，形成代銷服務與建設開發兩項業務。集團建設部門經營住宅興建及不動產買賣。截至2025年9月底，子公司包括海悅建設、海宇國際及金毓泰，業務涵蓋不動產開發、租售與都市更新。
