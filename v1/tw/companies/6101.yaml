summary_short: 以演唱會、商演及影視等文創業務為主要收入來源。
summary_long: 寬魚國際以文創娛樂業務為主，2025年文創收入占合併營收99%，其他收入占1%。售票表演活動占總營收71.13%，商演活動占19.77%；影視製作或經紀占1.17%，運動賽事占3.87%，版稅收入占1.69%。售票表演業務包括海內外大型演唱會，並經營電影、運動賽事與音樂版權業務。截至2026年3月底，公司直接持有鑫連國際有限公司及香港寬魚國際文創股份有限公司各100%股權，並間接持有上海寬魚文化創意發展公司100%股權。
