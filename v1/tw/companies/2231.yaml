summary_short: 製造車用開關、胎壓偵測與雷達系統，並經營通訊設備及工程。
summary_long: 為升集團以車用電子零組件與安全系統為主要業務，產品包括車用開關、TPMS胎壓偵測系統及採用子公司模組的ADAS毫米波雷達。2025年營收中，汽車電機開關占27.41%，汽車安全件及系統占33.11%，通訊設備及工程及其他占39.48%。主要子公司包括為昇科科技、至鴻科技及立承系統科技。另已推出雷盾無人機反制系統，年報將其列為研發項目。
