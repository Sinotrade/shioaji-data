summary_short: 主要生產銷售家用縫紉機，並透過子公司宇隆經營精密金屬零件。
summary_long: 伸興以家庭用縫紉機及相關零組件的生產銷售為主要業務，並製造吸塵器及鋁合金壓鑄產品。2025年合併營收中，縫紉機占51.56%，精密金屬零件占40.41%，吸塵器占1.22%，其他項目占6.81%。精密金屬零件業務由子公司宇隆科技負責，涵蓋汽車、醫療、工業及自行車等應用；伸興截至2025年底持有宇隆26.06%股權。主要製造子公司另包括越南的伸興工業責任有限公司，以及中國的張家港伸興機電有限公司。
