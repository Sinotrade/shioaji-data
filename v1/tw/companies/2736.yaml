summary_short: 經營飯店客房住宿、餐飲、宴會會議與溫泉休閒服務。
summary_long: 富野以飯店客房住宿與餐飲服務為主要業務；2024年第一季合併客房收入為新台幣5,940.5萬元，餐飲收入為2,562.3萬元，其他收入為498.1萬元，客房為最大收入來源。知本富野溫泉休閒會館提供多種客房，並設有餐飲、宴會與會議空間、獨立湯屋及露天溫泉SPA。依2024年3月底合併財報，儷野與君野為全資旅館子公司，村野為持股55%的旅館子公司；另透過直接及間接持有的薩摩亞公司從事投資控股。
