summary_short: 製造電容式、電阻式觸控面板，提供觸控顯示模組與客製化整合服務。
summary_long: 萬達光電以觸控面板與觸控顯示模組的設計、製造及整合服務為主要業務，產品涵蓋投射式電容、五線電阻式觸控面板及觸控顯示模組。電容式產品用於工業、醫療、強固型、車載與航海設備；電阻式產品依尺寸、比例及操作條件選型。觸控顯示模組整合面板與顯示需求，可依介面及安裝條件選型，並提供光學全貼合規格。公司亦提供從需求評估、材料選型、打樣測試到量產導入的客製化服務。集團設有境外控股子公司，並透過其間接持有昆山希格斯光電科技有限公司。
