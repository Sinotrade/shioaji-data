summary_short: 主要銷售植物油脂、大宗原料、畜禽飼料及麵粉。
summary_long: 福懋油脂主要提供植物油脂、大宗原料、畜禽飼料及麵粉產品。植物油脂包括黃豆油、芥花油與棕櫚油，並提供散裝及桶裝規格；飼料產品涵蓋禽用與畜用飼料，原料產品另有黃豆粉及全脂熟豆粉。2025年個體營收中，油脂產品占65.15%，原料產品占24.55%，飼料產品占9.01%，麵粉產品占1.28%，以上數據不含各子公司。子公司台灣大食品位於台中港港區，生產麵粉及副產品。
