summary_short: 以ITO導電玻璃生產、銷售及鍍膜加工為主，合併營收另含矽橡膠產品。
summary_long: 安可光電以ITO導電玻璃的生產、銷售與專業加工為核心，產品應用於液晶顯示器及觸控面板。2025年合併營收中，光電資訊產品占71.71%，矽橡膠產品占27.35%，其他占0.94%。官網另列圖案化藍寶石基板、黑色矩陣玻璃及彩色濾光片用ITO玻璃；其中圖案化藍寶石基板採奈米壓印搭配電漿蝕刻製作，提供四吋與六吋產品。年報將錸德科技列為母公司，並揭露安可持有互力精密化學及振專過半股權。
