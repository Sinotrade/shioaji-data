summary_short: 透過銀行利息與手續費、壽險及證券投信業務取得收益。
summary_long: 中信金以金融控股方式整合旗下銀行、保險、證券與資產管理業務。中國信託商業銀行提供放款、財富管理、信用卡與法人金融服務，收入包含利息及手續費；台灣人壽經營人壽保險。中國信託證券提供證券與期貨服務，中信投信經營共同基金、ETF與全權委託業務，台灣彩券受中信銀行委託辦理公益彩券。中信銀行與LINE Pay共同發行聯名卡，並與統一超商及財金資訊合作提供金融通路與數位服務。近年子公司另有南港地上權續約、桃園航空城合資及日本債權回收公司收購。
