summary_short: 以太陽能電廠售電為主要收入，兼營太陽能模組與金屬3D列印。
summary_long: 安集經營太陽能電廠建置與售電，並製造太陽能電池模組及提供金屬3D列印產品。2025年度合併營收組成以售電收入67.38%為主，其次為太陽能電池模組20.70%、3D列印5.70%，其他收入占6.22%。模組業務包含建築整合型產品；金屬3D列印則提供產品完整解決方案，官網另列無人機金屬機身元件。集團子公司包含六合光電、瑤光能源、擎陽農產科技、安力仕科技及安太能源。
