summary_short: 透過南岩半導體提供封裝測試代工，母公司另經營不動產租賃。
summary_long: 南染以不動產租賃及半導體封裝測試為兩大營運項目；母公司經營不動產租賃，半導體業務由子公司南岩半導體負責。截至2026年6月底，南染持有南岩83.14%股權，並將其納入合併財務報告。2025年度合併營收為新台幣1億8,900.8萬元，其中半導體封裝測試收入1億2,848.5萬元，占68%；租金收入6,052.3萬元，占32%。南岩提供專業通訊半導體封裝及測試代工，封裝測試為集團年度最大營收來源。
