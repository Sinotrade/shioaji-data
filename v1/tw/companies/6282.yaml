summary_short: 研發、製造及銷售電源供應器，並提供車用電源與綠能服務。
summary_long: 康舒以電源供應器與電源管理產品為主要業務，2025年電源及零組件占營收93.92%，五金零件及其他占6.08%。產品涵蓋消費性電子、企業雲端伺服器、資料中心及電信應用，並提供電動車車載充電器與充電設備。公司亦提供綠能服務，並規劃開發採用SiC的高壓車載充電器。AI雲端伺服器電源屬其企業用產品範圍；OmniOn Power Inc.為其間接全資子公司。
