summary_short: 透過子公司製造銷售工業用紙、紙箱、紙漿、家庭用紙及清潔用品。
summary_long: 永豐餘主要造紙子公司包括中華紙漿、永豐餘工業用紙及永豐餘消費品實業。2026年第二季，工紙紙器事業群占營收46%，林漿紙21%，消費品14%，其他事業19%。旗下工紙紙器業務生產牛皮紙板、瓦楞芯紙及紙箱等包裝產品；消費品業務經營五月花、柔情、得意等紙品及橘子工坊、植淨美等清潔用品品牌。2026年8月，子公司YFY Cayman董事會通過向Up High Developments Limited購買永尚包裝30%股權，公告交易金額為USD 13,472,080。
