summary_short: 以投資控股經營紙漿、造紙、紙器包裝及家庭用紙，紙類為主要營收來源。
summary_long: 永豐餘透過主要造紙子公司經營相關事業，2025年報揭露紙類製造與銷售約占營業比重85%，其他項目約15%。主要子公司包括永豐餘工業用紙、中華紙漿及永豐餘消費品實業。工紙紙器事業群生產牛皮紙板、瓦楞芯紙及紙器包裝，產品涵蓋瓦楞紙箱、彩色紙盒與食品容器。林漿紙事業群提供紙漿，並由中華紙漿開發特殊功能紙。永豐餘消費品實業經營五月花、柔情、得意等家庭用紙品牌，另以橘子工坊及植淨美提供清潔用品。
