summary_short: 以Acerpure品牌銷售生活家電，子公司另經營旅宿及不動產租賃。
summary_long: 宏碁智新以Acerpure品牌經營生活家電，主要產品包括冷暖空調、涼暖空氣循環清淨機、RO濾淨飲水機、無線吸塵器及高速離子吹風機。2025年合併營收中，商品銷售占67.19%，旅宿及不動產租賃占31.11%，其他占1.70%。宏碁為其母公司；旗下渴望園區服務開發經營旅館與租賃業務，另有龍顯國際及印度子公司Acerpure India CE Private Limited。
