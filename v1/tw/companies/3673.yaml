summary_short: 主要製造觸控模組與觸控顯示產品，並提供精密貼合服務。
summary_long: TPK-KY以觸控模組、觸控顯示模組及貼合服務為核心，2025年觸控模組占營收85.38%，其他產品占14.62%。公司亦提供保護外蓋研發與量產、3D列印消費性產品元件，以及光達製造、工程與設計服務，光達應用延伸至配送機器人。2026年官方公告已將奕力-KY列為子公司並納入營收；另投入TGV玻璃通孔技術，中壢試產線已完成建置並進行樣品驗證。Apple公布的FY2023供應商名單列有TPK，Tesla供貨亦有歷史文件支持。Luminar曾為代工客戶與工程合作對象，但其2026年申報已載明出售主要資產並停止營業。
