summary_short: 主要靠臍帶血與幹細胞私存服務取得營收，另提供公庫配對及細胞製劑。
summary_long: 永笙-KY以臍帶血及幹細胞相關業務為核心，營收主要來自細胞私存服務。旗下台灣永生細胞提供新生兒臍帶血採集、處理與長期保存服務；集團另提供HLA基因分型檢測、公捐臍帶血庫預配對及公庫資源方案。美國子公司StemCyte, Inc.為REGENECYTE的申請人及製造商，該臍帶血來源造血前驅細胞製劑已取得美國FDA生物製劑許可，用於非親屬捐贈者移植程序中的造血與免疫系統重建。其業務涵蓋細胞保存服務與細胞產品製造。
