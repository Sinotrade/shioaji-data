summary_short: 製造沙灘車、機車及搬運車，提供電動車代工，並透過子公司經營風電海事服務。
summary_long: 合騏工業以自創ADLY品牌經營車輛業務，主要產品包括多功能休閒車（沙灘車）、機車與農用搬運車，並提供OEM、ODM代工。2025年營收以沙灘車占44.72%最多，其他車種及零件占33.24%、機車占11.05%，其餘10.99%為投資收入。產品亦涵蓋電動沙灘車、電動搬運車及電動高爾夫球車代工。海事業務透過子公司屹海風電科技與屹海船舶發展，服務包括船舶租賃、離岸風場海事工程及風機維運；年報載明風電維運作業船已正式投入營運。
