summary_short: 製造光通訊主動元件、模組與晶粒，並提供光通訊代工服務。
summary_long: 華星光主要經營光通訊主動元件及模組、晶粒與代工服務，2025年營收占比分別為86.35%、11.05%，其他業務占2.60%。產品包括雷射與檢光晶粒、光學次模組、光引擎及光收發模組，應用涵蓋資料中心高速傳輸。公司具備InP晶圓製程能力，並開發CPO及矽光子應用技術。具名關係包括承接Marvell光通訊委外代工，以及與聯亞合作CWLD後段製程。公司於2025年1月取得中壢吉林路新廠土地廠房，2026年5月董事會另決議以新台幣10.5億元向亞帝歐光電購置八德土地與廠房。
