summary_short: 經營遠雄悅來大飯店，以客房住宿、餐飲及婚宴會議服務取得收入。
summary_long: 遠雄悅來大飯店主要經營客房住宿與餐飲服務，2026年上半年以客房部門之外部收入最高。同期客房、餐飲及其他部門之外部收入分別為146,941仟元、100,454仟元及10,146仟元。住宿服務包括山景、海景、庭園及家庭客房等房型。餐飲服務涵蓋英倫西餐廳、唐苑中餐廳、秋草鍋物料理、皮爾沙酒吧及麥坊。飯店另提供婚禮與婚宴服務，以及宴會、會議場地和客製化活動規劃，並配置專業餐飲服務與視聽資源。
