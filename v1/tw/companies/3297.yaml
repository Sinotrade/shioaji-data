summary_short: 研發、製造及銷售安全監控設備，以網路攝影機為主要營收來源。
summary_long: 杭特電子從事安全監控產品的研發、製造與銷售，主要營收來源為網路攝影機。2025年網路攝影機營收占74.16%，其他產品占25.84%，產品另包括網路影像錄放影機與影像伺服器。官網展示的AI智慧攝影機具人形與車型偵測、人臉偵測及辨識、車牌辨識、人流計數及客製AI功能。2025年度研發成果包含符合NDAA的16CH POE網路錄影機。公司截至2025年底持有佑得科技股份有限公司100%股權。
