summary_short: 以防詐軟體的廣告、訂閱、企業服務及金融科技服務取得營收。
summary_long: 走著瞧以防詐軟體與金融科技服務取得營收。Whoscall 提供陌生來電辨識，ScamAdviser 提供網站風險檢測，Watchmen 偵測企業偽冒資訊。集團另提供袋鼠金融的金融商品比較、導購服務，以及 JUJI 招財麻吉的小額借款服務。2026 年第二季數位廣告占營收 34%、訂閱占 29%、金融科技占 28%、企業防詐占 9%，消費者防詐為主要收入來源。主要子公司包括走著瞧金融科技與艾思艾。
