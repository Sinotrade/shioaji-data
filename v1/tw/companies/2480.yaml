summary_short: 提供企業資訊系統整合、設備與軟體銷售、諮詢維修及資安服務。
summary_long: 敦陽科技提供企業資訊系統的規劃、整合、銷售與維護，產品涵蓋伺服器、儲存設備、網路及企業應用軟體。2026年上半年，諮詢與維修服務占合併營收27%，為最大單項，儲存設備占23%，電腦軟體占19%，網路產品占16%，工作站及伺服器主機占11%。公司亦提供人工智慧系統架構規劃、雲地整合、威脅偵測應變與委外資安託管服務，並提供資料中心規劃、建置及售後服務。敦陽資訊則為透過敦雨投資持有的全資子公司。
