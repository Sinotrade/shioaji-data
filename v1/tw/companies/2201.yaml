summary_short: 經營汽車製造代工、金融租賃及資產出租，合併營收以裕融為最大來源。
summary_long: 裕隆汽車個體經營整車、零組件製造與代工，合併範圍並包括裕融的汽車融資及租賃服務；依官網2025年公司別資料，裕融營收占比54.65%，為最大來源。製造客戶包括裕隆日產、鴻華先進與中華汽車，分別涉及日產品牌車輛、電動車及MG車款。公司透過華創車電參與鴻華先進投資，並與鴻海合作電動車業務。納智捷100%股權以新台幣7.876億元售予鴻華先進，2026年4月10日完成交割。另有裕隆城租金收入、電池代工及儲能服務。
