summary_short: 製造高壓充氣鋼瓶，並透過子公司經營安全氣囊氣體發生器。
summary_long: 元翎集團以高壓充氣鋼瓶與氣體發生器為核心業務。2024年氣體發生器占合併營收60.64%，高壓充氣鋼瓶占36.32%，其他占3.04%。氣體發生器業務由全資子公司元翊精密工業經營，產品涵蓋汽車安全氣囊及穿戴式防護用途。公司亦提供小鋼瓶、奶油瓶與蘇打瓶等餐飲用品，另有商用電子式膨脹閥，應用於空調與熱泵系統；官網並列有純電垂直起降無人機產品。
