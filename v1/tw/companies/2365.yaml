summary_short: 以 Genius 品牌銷售滑鼠、鍵盤、影音與遊戲周邊產品。
summary_long: 昆盈以 Genius 品牌經營電腦與遊戲周邊，產品包括滑鼠、鍵盤、喇叭、網路攝影機及賽車方向盤。滑鼠產品包含配備 Copilot 功能的無線藍牙靜音滑鼠；鍵盤則有 Copilot 無線藍牙精巧鍵盤，提供編輯與多媒體控制快捷鍵。喇叭產品涵蓋電腦 USB 供電及防水藍牙款式，網路攝影機則涵蓋全高清、串流及臉部辨識機種。遊戲周邊包含震動與力回饋賽車方向盤，部分機種搭配排檔桿。
