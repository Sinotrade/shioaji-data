summary_short: 以精密蝕刻為核心，經營液冷零組件、微波半導體零件、OLED遮罩及清洗服務。
summary_long: 旭暉應材以精密蝕刻為核心，提供OLED金屬遮罩、均熱片與精密清洗再生服務。2025年合併收入中，AI液冷零組件為最大單項；年報將其與真空微波管、半導體設備零組件合併列示，營收比重為73.55%，金屬遮罩占13.77%、清洗再生占6.69%、散熱模組占4.79%。集團透過子公司宏碩系統經營微波與半導體零件，並持有越南千鋐及旭翔動力等子公司；旭翔投入無人機次動力系統研發。
