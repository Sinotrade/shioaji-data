summary_short: 以LED裝飾燈、光耦合器及繼電器製造銷售為主，另經營節淨蒸汽。
summary_long: 冠西電主要經營LED裝飾燈、光耦合器與繼電器，並提供節淨蒸汽。2025年營收組成為裝飾燈58.28%、光電元件36.54%、能源及材料貿易5.18%。光耦合器用於電路隔離，繼電器用於電路控制與切換；裝飾燈包含聖誕節慶產品。公司官網列有光纖模組及工業機器人應用產品，2025年法說揭露電動車、5G與AI伺服器光纖模組布局。年報另列香港及印尼的百分之百持股子公司。
