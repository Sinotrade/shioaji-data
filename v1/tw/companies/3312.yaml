summary_short: 以IC通路與應用方案為主，另有伺服器租賃業務。
summary_long: 弘憶國際以IC通路與應用方案為主要業務，產品涵蓋數位通訊、儲存裝置及類比電子元件。2025年個體營收中，數位通訊占85.32%、儲存裝置占12.70%、類比元件占0.80%，伺服器租賃利息收入占1.18%。通訊元件包括無線網路及區域網路IC，儲存元件包括SRAM、DDR記憶體與SPI Flash，類比元件包括MOSFET。集團另有GPU伺服器融資租賃業務，旗下GMI USA Corporation從事伺服器租賃；官網亦提供AI音訊晶片與應用程式設計方案。
