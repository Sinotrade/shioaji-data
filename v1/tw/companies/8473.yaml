summary_short: 以水處理工程、操作維護及服務特許權為主要收入，另經營廢棄物資源化。
summary_long: 山林水以水處理工程承攬、操作維護及服務特許權為主要收入來源，服務涵蓋都市污水下水道、工業廢水、再生水與海水淡化設施。2025年度工程承攬占營收45.05%，操作維護31.11%，服務特許權15.99%；另有廢棄物處理6.74%及其他收入1.11%。合併業務亦包括焚化爐底渣與污泥的處理再利用、有機廢棄物處理及生質能廠建置售電。鶴京企業為直接母公司，力麒建設為最終母公司；水務子公司包括綠山林、東山林、元山林及高山林。
