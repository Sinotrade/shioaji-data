summary_short: 研發製造支付交易安全設備、電子金融交易終端機及讀寫卡機。
summary_long: 同亨以交易資料安全保護設備、電子金融交易終端機與讀寫卡機等產品取得營收，其中2026年上半年以交易資料安全保護設備收入最高。主要產品包括取得PCI PTS v7認證的AT150ED智慧支付終端，以及通過PCI PTS 6認證的AP20 Android智慧密碼鍵盤。AT150U用於無人值守自助付款，C10為可整合於POS與自助服務設備的NFC模組；另提供取得PCI MPoC軟體認證的SoftPOS方案。
