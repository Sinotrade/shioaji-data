summary_short: 開發抗癌新藥，營收主要來自PTS302肺癌用藥銷售。
summary_long: 共信-KY以微創靶向腫瘤消融技術開發抗癌新藥，2025年營收主要來自PTS302肺癌用藥銷售。PTS302已於中國上市，針對肺部中央氣道阻塞；產品管線另包括肝癌用藥PTS100、腺樣囊性癌用藥PTS-02、惡性肋膜積液用藥PTS500及動物用癌症藥Gwa103。台灣子公司共信醫藥科技為集團營運與主要研發主體，集團另有寵物生醫、醫療器材及美國、香港與中國子公司。
