summary_short: 以飛行劇院等體感遊樂設備專案為主要收入，另有勞務、授權及門票收入。
summary_long: 智崴主要銷售體感模擬遊樂設備，2025年專案合約收入占合併營收86.43%，其餘包括勞務、門票及商品、權利金與租賃收入。主要產品i-Ride飛行劇院採懸掛式座椅、球幕及六自由度動作平台；m-Ride以旋轉、俯仰與擺盪呈現飛行體驗；o-Ride E則強調精巧設計及快速安裝，可配置於商場與電影院等場域。旗下子公司包括智崴全球、史特萊設計規劃、智崴日本娛樂及荷蘭Flyover Attractions B.V.，並透過荷蘭子公司持有Flyover相關營運公司。
