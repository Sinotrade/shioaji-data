summary_short: 以回收廢紙製造工業用紙、瓦楞紙板與紙箱，兼營資源再生及汽電共生。
summary_long: 榮成以回收廢紙製造瓦楞紙箱用紙，低碳造紙產品包括裱面紙板與瓦楞芯紙，供下游加工紙板及紙箱。綠色包裝事業生產瓦楞紙板與瓦楞紙箱，另經營廢紙採購銷售及汽電共生。2025年合併財報揭露對寶隆國際銷貨，並向南京宏成科技採購商品，均屬關係人交易。2026年股東臨時會通過投控轉型相關議案，擬將台灣工紙及紙箱事業分割予全資子公司榮成低碳紙箱；分割營業價值估計約新台幣60億元，基準日暫定2027年1月4日。
