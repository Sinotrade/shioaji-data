summary_short: 設計製造鋰電池模組，產品包括筆電電池、儲能系統及備援電池。
summary_long: 加百裕以鋰電池模組的設計與製造為主要業務，產品包括筆電與平板電池組。2024年鋰電池組占合併營收99.54%，其他業務占0.46%。公司自行開發電池管理系統（BMS），並提供儲能系統，官網列有容量56kWh的高壓儲能產品。電動載具應用包括電動機車電池組，官網揭露96V、60Ah規格。2025年底法說會另揭露BBU備援電池的開發驗證進度，以及無人機產品持續出貨情形；兩者分別屬備援電力與無人機電池應用。
