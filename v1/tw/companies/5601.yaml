summary_short: 以倉庫、場地出租及貨櫃集散、吊卸與維修服務取得收入。
summary_long: 台聯櫃的收入來自倉庫與場地出租，以及貨櫃集散站作業兩類服務。依2024年營收組成，倉庫場地租賃占58%，貨櫃作業占42%，租賃為較大收入來源。貨櫃服務涵蓋裝櫃、拆櫃、裝車、卸車與貨櫃的集中、分散，並提供貨櫃保養、維護及整修。公司亦經營空重櫃板車架停放業務，與倉庫、空地出租共同構成其場站服務內容，業務同時包含出租場地及提供貨櫃相關作業。
