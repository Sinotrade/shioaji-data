summary_short: 代理及經銷資訊軟硬體、遊戲娛樂與家電，並提供企業資安及系統整合產品。
summary_long: 展碁國際以資訊產品代理及經銷為主要業務，產品涵蓋電腦、儲存、網通、顯示及電源管理設備。軟體業務提供企業生產力工具、創意軟體與雲端服務，另經銷任天堂Switch 2遊戲產品及智慧家電。企業端提供網路管理、資安防護、資料備份與儲存管理解決方案，系統整合產品亦包括伺服器與機房設備。2026年上半年收入類別以系統資訊及數位娛樂為最大項，另有電腦軟體、橡膠、塑料及其他。宏碁為最終控制者，直接子公司包括好漾生活、沛捷生醫、博瑞達應用材料及Bluechip。
