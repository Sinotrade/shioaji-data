summary_short: 製造銷售PVC塑膠粉、膠粒、塑膠布、管材及PU合成皮革。
summary_long: 大洋主要製造及銷售PVC塑膠原料與加工製品，產品包括塑膠粉、塑膠粒、塑膠布、塑膠管材及接頭，另有水性PU與無溶劑PPU合成皮革。2025年年報營業比重表列塑膠原料48.64%、塑膠布23.52%、塑膠建材22.71%、合成皮5.13%，原料為最大項目。依2025年第三季合併財報，OCEAN GROUP LTD.與常新欣業均為直接持股100%的子公司，前者從事控股業務，後者從事土地開發。
