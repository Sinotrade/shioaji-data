summary_short: 研發製造半導體微影、光學元件及顯示器用特用化學材料。
summary_long: 新應材主要提供半導體及顯示器特用化學材料，2025年半導體應用材料營收37.08億元、占約87%，顯示器材料營收5.54億元。半導體微影產品包括表面改質劑、底部抗反射層、洗邊劑與清洗劑，另提供IC正型光阻及顯示器光阻，並將光學元件用去光阻材料列入產品開發計畫。台積電曾將其列為黃光材料優良供應商。近年交易包括收購思微七成股權、投資昱鐳可轉債，以及與南寶樹脂、信紘科合資開發先進封裝膠帶；2026年另投資奇鼎科技、富宸可轉債並簽訂龍科廠興建工程。
