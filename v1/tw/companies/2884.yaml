summary_short: 以銀行存放款、財富管理及信用卡為主，並經營證券、基金與壽險。
summary_long: 玉山金控透過玉山銀行提供存放款、外匯、信用卡與財富管理服務，2026年上半年銀行業務是集團最大淨收益來源。玉山證券提供證券經紀、承銷、自營及債券服務，玉山投信經營共同基金、ETF與全權委託等資產管理業務，玉山創投亦為旗下子公司。玉山金控於2025年完成保德信投信股權收購，標的同年更名為玉山投信；2026年9月完成三商美邦人壽股權交割，並全數認購其160億元現金增資。另已公告投信剩餘股權及三商美邦保險代理人收購案，兩案仍須依公告程序完成交割。
