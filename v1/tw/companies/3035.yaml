summary_short: 提供客製化 ASIC 設計與量產服務，並收取矽智財授權收入。
summary_long: 智原以客製化 ASIC/SoC 設計、生產服務及矽智財授權為主要業務。2025 年營收組成為 ASIC 及晶圓產品 78.85%、委託設計 12.72%、智財元件及技術權利金 8.43%，以量產產品收入為主。公司亦提供整合 Chiplet、HBM、interposer 與 substrate 的 2.5D 平台，AI 解決方案支援 HBM2 與 GDDR6 記憶體整合。主要海外子公司包括美國、日本及越南公司，分別持股 100%、99.95%及 100%。
