summary_short: 以客製化ASIC設計、量產服務與矽智財授權取得收入。
summary_long: 智原提供客製化ASIC／SoC設計、生產服務與矽智財授權。2025年營收中，ASIC及晶圓產品占78.85%，委託設計占12.72%，智財元件及技術權利金占8.43%。公司使用Arm IP及Cadence、Synopsys設計工具；聯電同時為晶圓供應商與銷貨客戶。智原亦提供多來源Chiplet、HBM與中介層的先進封裝整合服務，並與Kiwimoore合作開發進入量產階段的2.5D封裝平台。集團於2024年取得Aragio全數股權，並透過子公司勝邦投資CoAsia SEMI Korea特別股。
