summary_short: 以聚酯粒及聚酯原絲製造、銷售為主，並生產環保紗。
summary_long: 宏洲以聚酯粒及聚酯原絲的製造、行銷為主要業務，2024年度年報揭露兩者合計營業比重為100%。官網主要產品包括聚酯粒、聚酯半延伸絲及聚酯全延伸絲，對應紡織產業鏈中的纖維與紗階段。公司亦列有BioPro生物可降解系列，產品說明指出可製成親水性聚酯纖維。2025年度營業報告書另揭露，公司購入環保酯粒生產環保紗，將回收聚酯類化纖產品與寶特瓶再利用。宜進實業為其母公司，2025年聯合法說會報導明確將宏洲列為宜進子公司。
