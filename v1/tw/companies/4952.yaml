summary_short: 以消費性IC、多媒體晶片及MCU的設計開發與銷售為主要業務。
summary_long: 凌通科技以微控制器（MCU）為研發核心，從事消費性積體電路的設計與開發，晶圓生產採委外代工。主要產品涵蓋語音與音樂控制晶片、液晶顯示控制／驅動晶片、多媒體影像處理晶片及 MCU。語音產品可用於多聲道玩具，多媒體晶片可用於迷你數位相機及行車記錄器，MCU 產品項目包含無線充電控制。公司簡介另列航拍機為產品終端應用。官網治理運作頁將凌陽科技稱為集團母公司。
