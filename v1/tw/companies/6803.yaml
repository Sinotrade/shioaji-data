summary_short: 以能資源中心營運、廢棄物處理及售電取得收入，兼營水務、資源再利用與太陽光電。
summary_long: 崑鼎以能資源中心營運維護、廢棄物處理及售電為主要業務。2026年上半年能資源服務占合併營收56%、售電占30%、機電設施建置與維運占8%，水務、再利用及其他占6%。集團參與台積電南科再生水廠操作維護，並提供聯電創生中心廢溶劑與廢液處理回收系統營運服務；耀鼎將半導體製程廢異丙醇純化為工業級產品，昱鼎電業經營太陽光電。台電為售電客戶，2025年占銷貨淨額25.77%。中鼎工程為母公司，也是營業收入交易對象。2026年崑鼎出售元鼎40%股權，信鼎則決議投資設立基鼎綠能環保。
