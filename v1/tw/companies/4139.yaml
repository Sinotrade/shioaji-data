summary_short: 透過集團經營連鎖中醫、社區醫療及醫管教育，另銷售中藥材與保健品。
summary_long: 馬光-KY透過集團經營中醫及社區醫療服務，主要收入來自新加坡連鎖中醫，服務涵蓋中醫診療、骨傷推拿與婦幼照護。2025年新加坡連鎖中醫占營收65.86%，天津連鎖社區醫療占23.38%，新加坡醫管培訓及教育占7.52%，其他業務占3.24%。天津業務提供中西醫診療、牙科及慢病管理；集團另銷售中藥材與保健品，並提供醫管培訓及教育服務。天津馬光醫療管理有限公司為其子公司。
