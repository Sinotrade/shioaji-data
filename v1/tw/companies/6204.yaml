summary_short: 主要製造與銷售可變電阻器、開關、編碼器及薄膜感測元件。
summary_long: 艾華主要產品包括可變電阻器、開關、編碼器及薄膜感測元件。2025年合併營收中，可變電阻占74%、開關占18%、編碼器占7%、其他占1%，以可變電阻為最大營收來源。可變電阻產品涵蓋旋轉型與滑動型；薄膜壓阻感測元件可依按壓力提供訊號回饋，適用於穿戴式電子與機器人手指感知。公司另開發電容式三軸力感測技術，2026年9月揭露已有初步成果，可同步感測垂直力與水平剪切力，硬體機構模組仍在開發中。
