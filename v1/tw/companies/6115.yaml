summary_short: 主要製造銷售電源線連接器、網路線及專用線組，另有塑膠加工材料。
summary_long: 鎰勝以電源線連接器及相關線材的製造與銷售為主要業務，2025年電源線連接器占合併營收95.39%，塑膠加工材料占4.61%。電源線連接器用於個人電腦、筆記型電腦、監視器、家用電器及消費性電子，產品範圍亦包括AI伺服器用電源線連接器。其他主要產品包括區域網路線、太陽能專用線組及電動車充電專用線組。塑膠加工材料業務提供線材用塑膠原料與成型加工服務；集團間接子公司包括鎰勝電子科技(昆山)有限公司及鎰勝電子(深圳)有限公司。
