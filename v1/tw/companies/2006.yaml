summary_short: 以電爐煉鋼製造及銷售鋼筋、型鋼，並透過子公司經營鋼構工程。
summary_long: 東和鋼鐵採電爐煉鋼，將廢鋼再製為鋼材。2025年鋼筋占合併營收51.53%、型鋼占21.60%、其他業務占26.87%。鋼筋主要應用於大樓、廠房及公共工程，型鋼產品包括H型鋼、I型鋼及槽鋼。集團透過東鋼鋼結構經營鋼構工程，並持有越南鋼鐵子公司；台積電新廠建置的供應關係屬於東鋼鋼結構。已揭露母公司客戶包括立達鋼鐵，中鋼則列為合併供應商。近年事件包括參與台灣智慧電能共同經營案、出租廠房土地予子公司，以及調整桃園加工中心擴建預算。
