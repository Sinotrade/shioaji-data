summary_short: 以鋼筋與型鋼製造銷售為主，產品包括H型鋼、鋼板及鋼板樁。
summary_long: 東和鋼鐵以鋼筋與型鋼製造銷售為主要業務，產品包括光面、竹節及螺紋節鋼筋，以及H型鋼、熱軋鋼板與鋼板樁，並採用電爐煉鋼製程。2025年合併營收中，鋼筋占51.53%、型鋼占21.60%、其他業務占26.87%，鋼筋是最大營收來源。苗栗廠製造H型鋼、鋼板及鋼板樁；重要子公司東鋼鋼結構從事鋼構工程專業營造，Tung Ho Steel Vietnam Corp., Ltd.則經營越南鋼鐵業。
