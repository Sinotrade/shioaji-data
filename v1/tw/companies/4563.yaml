summary_short: 製造綜合加工機與航太加工設備，旗下Winbro提供放電及雷射加工機。
summary_long: 百德機械提供金屬切削用加工設備，產品涵蓋立式、臥式及五軸加工中心，也提供彈性製造系統。集團旗下Winbro產品包含高速單點放電鑽孔設備，以及雷射切割與鑽孔機，與一般金屬切削設備形成不同加工技術的產品組合。依2024年度年報，綜合加工機占營收36.77%，航太加工機占28.21%，其他業務占35.02%，其中綜合加工機為最大單一揭露產品類別。百德持有Winbro Group UK Limited全部股權，官網亦列有德國子公司Quaser Europe Technical Center GmbH。
