summary_short: 以顯示器化學材料為主要收入來源，另銷售半導體材料及關鍵原材料。
summary_long: 達興材料研發、設計及製造特用化學材料，業務涵蓋顯示器材料、半導體材料與關鍵原材料。2026年上半年三項營收占比分別為77%、21%及2%，以顯示器材料為主要收入來源。顯示器產品包括用於彩色濾光片的黑色矩陣光阻及電視面板配向膜；半導體產品包括暫時接著用離型層、線路重佈層感光介電材料及光阻剝離液。關鍵原材料包括酸酐單體與特用高分子。2025年對友達銷貨占全年銷貨淨額43.80%。公司年報將CoWoS列入先進封裝材料的應用技術。
