summary_short: 以環保機能布料、咖啡紗及成衣製造銷售為主要業務。
summary_long: 興采以機能性布料與成衣為主要業務，2025年布料占合併營收54.74%，成衣占45.26%。產品包括利用寶特瓶與咖啡渣製成的S.Café®咖啡紗、結合平織與刷毛工藝的STORMFLEECE®面料，以及不含彈性纖維的S.LEISURE™彈性布料。AIRMEM™薄膜以回收咖啡油取代部分石化原料。旗下聚紡從事紡織品加工，神采時尚從事成衣製造，另透過控股公司持有越南MAGICTEX，集團業務涵蓋紗線、布料加工與成衣。
