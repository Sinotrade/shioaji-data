summary_short: 以螺絲螺帽及工業扣件配銷為主，另銷售防護手套、鋁產品與手工具。
summary_long: 大國鋼主要經營螺絲、螺帽及工業扣件通路，產品涵蓋低、中、高碳鋼、合金鋼及不銹鋼材質，以機械業用扣件及零組件為核心商品。2025年營收組成為螺絲螺帽84.75%、防護性手套4.37%、鋁產品2.48%、汽車零組件3.80%及其他4.60%。產品線另有以Preferred Hand Tool品牌銷售的手工具。母公司為大成不銹鋼工業股份有限公司，子公司包括BBI-USA及正道工業股份有限公司。
