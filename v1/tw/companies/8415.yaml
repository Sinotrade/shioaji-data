summary_short: 以螺絲螺帽等扣件貿易與海外配銷為主，另經營工業五金及鋁製品。
summary_long: 大國鋼以螺絲、螺帽等扣件買賣與配銷為核心，產品涵蓋碳鋼、不鏽鋼及合金鋼，另經營手工具、工業防護具及鋁材貿易。旗下美國全資子公司Brighton-Best International, Inc.從事扣件進出口及銷售，大成帝國工業則經營鋁製品，正道工業從事汽機車零件製造銷售。大成不銹鋼工業為其最終母公司。2025年大國鋼兩度取得正道私募普通股；同年美國子公司公告購買紐澤西土地並委託興建倉庫，用於營運倉儲。2026年另公告累積取得大成鋼857.1萬股。
