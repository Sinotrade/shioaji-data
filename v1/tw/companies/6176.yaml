summary_short: 以液晶顯示背光模組為主，並供應電子紙前光板及超穎光學元件。
summary_long: 瑞儀以背光模組及相關零組件為主要業務，2025年「背光板－模組及零組件」占合併營收99.54%，產品應用涵蓋平板、筆電及車載顯示。公司也生產電子紙前光產品，並透過NILT、Nanocomp及Inkron等子公司拓展超穎光學、奈米壓印與光學材料業務；馬來西亞檳城據點已量產超穎透鏡，應用於工業機器人3D感測發射端。具名客戶包括Apple、友達及群創，稜鏡片供應商包含3M光電。近年交易包括收購NILT與Inkron、向松瑞製藥取得竹南廠房，以及向EV Group採購營業設備。
