summary_short: 提供零售與商業場域數位轉型方案，收入來自方案建置與持續性服務。
summary_long: 騰雲提供一站式客商金流數位轉型解決方案，採SolaaS架構，涵蓋SaaS軟體應用、雲端平台與AI演算模組。主要產品包括TCRM會員管理、TCMS雲端營運管理、TPOS智慧終端及OLink支付整合，功能涵蓋會員招募、紅利積點、帳務同步、收銀與點餐。收入分為一次性方案建置及持續性服務，2025年上半年持續性收入占比為49%。集團架構列有中國、馬來西亞、日本及泰國子公司，另由騰創數析與騰加數位分別從事AI及數據科學、AIoT終端應用。
