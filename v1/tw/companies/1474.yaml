summary_short: 製造與銷售工業、傢飾、成衣及醫療用梭織布料。
summary_long: 弘裕以長、短纖織物的產銷為主，位於紡織產業中游，產品涵蓋工業用布、傢飾用布、成衣用布及醫療紡織品。袋材與裝備布可用於袋材、嬰兒車及鞋材；傢飾布應用於窗簾、沙發與戶外遮陽，成衣布用於襯衫、休閒服及外套；醫療紡織品包括手術衣、隔離衣與病人服。2024年長纖織物占營收91.08%，醫療用布占2.02%。截至2024年底，製造子公司包括裕展新創、九江德裕及透過控股公司持有的弘裕紡織（浙江）。
