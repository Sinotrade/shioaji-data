summary_short: 以TDS藥物傳輸平台開發新劑型藥品，並承接委託開發取得收入。
summary_long: 泰合以自主開發的TDS透皮與透黏膜藥物傳輸平台，研發505(b)(2)新劑型新藥，劑型涵蓋貼片、口溶膜及口頰溶膜。公司亦承接委託開發，2026年6至9月認列CDO營收589.9萬元。主要產品包括Apixaban抗血栓口溶膜BEQIA（TAH3311），已進入美國標準審查；TAH4411化療止吐口溶膜已在日本取得藥證上市銷售。其他研發產品包括TAH2231鴉片過量解毒口頰溶膜，以及TAH9922過動症口服液。
