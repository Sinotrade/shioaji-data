summary_short: 以焊錫材料製造與銷售為主，產品含無鉛焊錫、錫條、錫膏及助焊劑。
summary_long: 晟楠以焊錫材料製造與銷售為主要業務，產品包括無鉛錫銅鎳鍺合金SN100C、無鉛錫銀銅系列、無鉛錫銅系列、有鉛錫鉛系列及助焊劑。錫銀銅系列供應錫條與錫膏，有鉛系列提供樹脂心、水熔性、免洗型及實心錫絲。SN100C可應用於印刷電路板、電源供應器、通訊設備及電腦主機板。晟裕科技為持股67.43%的子公司，於2026年10月公告取得桃園市同意，依甲級廢棄物處理機構試運轉計畫進行測試，測試期間為10月14日至12月12日。
