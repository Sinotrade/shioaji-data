summary_short: 製造及銷售商業照明器具，產品涵蓋室內燈具與戶外照明。
summary_long: 湯石照明以商業照明器具製造及銷售為主要業務，產品包含大功率LED商業照明器具。室內照明產品包括軌道燈具與圓型嵌燈，戶外照明產品則包括投光燈與埋地燈。2026年上半年合併商品銷售收入為新臺幣498,373仟元。集團直接持有大峽谷半導體照明系統（開曼）股份有限公司及WORLD EXTEND HOLDING INC.全部股權，兩者均為合併財報列示的子公司。
