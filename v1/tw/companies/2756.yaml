summary_short: 經營歇腳亭、UG樂己與MAMAK檔，收入來自商品銷售、加盟授權及餐飲。
summary_long: 聯發國際從事茶飲品牌全球連鎖加盟及南洋美食主題餐廳營運，旗下品牌包括Sharetea歇腳亭、UG樂己與MAMAK檔，提供外帶茶飲及馬來西亞料理。2025年營收以商品銷貨占42.42%最高，其次為加盟授權33.29%、餐飲23.81%，其他收入占0.48%。年報列示的子公司包括聯發國際餐飲事業(香港)有限公司、Lilian USA LLC及Uni Green INC.。
