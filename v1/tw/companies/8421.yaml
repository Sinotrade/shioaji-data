summary_short: 主要銷售熱收縮膜印刷標籤，並製造套標、貼標及收縮設備。
summary_long: 旭源主要經營熱收縮膜印刷標籤及套、貼標籤設備，2025年度營收占比分別為88.2%與9.56%，另有透明膜料及膠粒與其他收入。包材業務提供PET、OPS及PVC收縮膜印刷，以及供零食、糖果、餅乾等食品使用的自動包裝積層膜。設備產品包括直立式收縮套標機、圓瓶貼標機與蒸汽收縮爐，分別執行容器套標、圓瓶自動貼標及標籤熱收縮作業。2025年底持有鴻源包裝科技及印尼包裝科技子公司全部股權。
