summary_short: 設計與授權基礎及高速介面矽智財，收取授權金與權利金。
summary_long: M31（円星科技）以矽智財設計與授權為主要業務，產品包括標準元件庫、記憶體編譯器，以及PCIe、USB4與MIPI等高速介面IP。標準元件庫支援晶片邏輯設計，記憶體編譯器提供嵌入式記憶體設計方案；高速介面產品用於晶片資料傳輸。2026年第二季營收中，授權金占82.2%，權利金占17.8%。公司亦投入面向AI伺服器及高速互聯應用的PCIe Gen6與112G SerDes IP開發，並透過美國、印度與上海子公司提供行銷或技術服務。
