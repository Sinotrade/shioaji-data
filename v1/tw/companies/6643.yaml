summary_short: 設計並授權基礎元件、高速介面及類比矽智財，收取授權金與權利金。
summary_long: M31（円星科技）從事矽智財設計與授權，產品涵蓋標準元件庫、記憶體編譯器、GPIO等基礎元件IP，以及USB、PCIe、MIPI、SerDes等高速介面IP與類比IP。2025年營收組合為授權金85.1%、權利金14.9%。公司與台積電合作推進eUSB2 IP，並曾公開採用Synopsys及Cadence的EDA工具。2026年與Ambiq共同開發台積電N12e超低功耗基礎IP，並擴大與Rambus的MIPI控制器技術合作。同年引進信驊認購私募普通股53萬股，於8月12日收足新台幣187,090,000元，雙方合作涉及AI伺服器及高速介面IP。
