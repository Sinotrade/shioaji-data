summary_short: 以布袋戲劇集、角色周邊商品、IP授權、電視頻道與展演活動取得收入。
summary_long: 霹靂以布袋戲劇集、角色周邊商品與IP授權為主要營運內容，並經營霹靂台灣台及展覽、專案活動。2025年合併營收以商品銷售占29%最多，其次為系統及廣告25%、劇集發行19%，授權與展覽及專案活動各占9%。周邊商品涵蓋戲偶、公仔及兵器，劇集亦透過霹靂線上看OTT平台發行。子公司包括全資持有的大霹靂國際整合行銷、大畫電影文化及霹靂全球品牌授權；2026年另成立持股60%的羽林軍娛樂。
