summary_short: 主要製造及銷售百葉窗、軟式窗簾、毛毯與其他家飾用品。
summary_long: 慶豐富主要製造與銷售窗簾及家飾用品。2025年度窗簾占營收86.47%，家飾占12.72%，其他占0.81%。百葉窗產品包含鋁、仿木、塑膠及直立式款式；軟式窗簾涵蓋羅馬簾、無拉百摺簾與無拉蜂巢簾。家飾產品包括珊瑚絨毛毯、法蘭絨毛毯、寢具、抱枕及靠墊。子公司包括ALL STRONG INDUSTRY INC.、越南慶豐富責任有限公司及富越責任有限公司，其中富越由慶豐富與新加坡子公司共同持有。
