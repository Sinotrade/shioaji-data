summary_short: 主要銷售電源供應器與電腦機殼，另有光觸媒空氣淨化產品。
summary_long: 首利主要經營電源供應器與電腦機殼，2025年電源供應器占營收84.44%，電腦機殼占14.43%，其他產品占1.13%。電源產品涵蓋80 PLUS白金級全模組系列，機殼產品包括MicroATX規格，另有奈米光觸媒空氣清淨機產品。依2026年第二季合併財報，直接子公司包括AMPLE CROWN INTERNATIONAL LTD.與豐寅投資，間接子公司東莞首利科技及成翔電子（東莞）從事電源供應器生產。
