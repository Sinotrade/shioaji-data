summary_short: 透過子公司經營電子產品製造與通路、精密塑膠及電動工具零組件。
summary_long: 能率創新透過子公司經營電子產品製造與通路、電動工具與粉末冶金、精密塑膠零組件及金屬加工。2024年電子產品製造及通路占營收38.59%，為最大項目；電動工具及粉末冶金占32.42%，精密塑膠零組件占27.03%。主要子公司包括毅金精密、IKKA-KY、能率網通及宏羚，其中IKKA-KY為集團孫公司。機器人業務由毅金精密製造平價消費型機器手臂。母公司為能率國際，最終控制者為佳美投資。
