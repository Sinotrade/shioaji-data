summary_short: 以氣動元件及電控自動化零組件的研發、生產與銷售為主要業務。
summary_long: 氣立以空氣壓及電控自動化零組件為主要產品，供各類自動化設備使用，產品涵蓋氣缸、電磁閥、機械夾爪、真空與吸盤及電動缸。2025年度營收組成為氣動元件60.81%、其他業務39.19%。氣缸負責動作執行，夾爪用於夾持與抓取，真空吸盤用於吸取工件，電動缸則整合控制與驅動功能。公司官網說明氣動元件可控制機械臂運動，對應機器人零組件應用。上海氣立可與氣立可科技（浙江）屬間接持有子公司，氣立可科技（泰國）則為直接持有子公司。
