summary_short: 以磁性元件、電容與電阻銷售為主，並提供感測器。
summary_long: 國巨以磁性元件、鉭質電容、MLCC及晶片電阻為主要營收來源；2025年占比分別為27%、22%、19%及14%，感測器與其他產品各占9%。集團產品亦包括供AI伺服器電源使用的Rogowski線圈電流感測器，並透過Mouser經銷產品。KEMET與Pulse分別為國巨間接及直接全資子公司。國巨於2025年10月完成芝浦電子公開收購，2026年1月取得其100%表決權；另於2025年10月交割取得茂達21.43%股權，性質為財務性投資。
