summary_short: 以導光板應用及塑膠零組件的設計、製造與銷售為主要業務。
summary_long: 茂林-KY以塑膠導光板應用與塑膠零組件的設計、製造及銷售為主要業務，技術核心為光學微結構。2025年導光板應用占營收82.74%，塑膠零組件占16.96%，其他占0.30%。導光產品用於電視與顯示器、發光鍵盤、平板電腦、電子書及筆記型電腦，也提供車內裝飾導光元件與客製化背光模組。消費性產品採超薄、可撓式導光膜板，最薄厚度可達0.1毫米。年報另揭露Mini-LED背光模組的研發成果。
