summary_short: 以配電盤、變壓器等重電設備銷售，搭配工程承攬與太陽能售電取得收入。
summary_long: 樂事綠能的集團業務涵蓋重電設備、太陽能發電與工程承攬，2025年以電機事業群為最大營收來源。機電產品包括配電盤、變壓器、變比器及電工器材，系統工程涵蓋變電所統包、水電與太陽能發電工程。能源業務採投資自建太陽能電廠及承攬代建兩種方式，另有太陽能售電收入。營造業務由子公司萬全營造承攬綜合營造工程，主要子公司另包括森欣能源與金來國際開發。
