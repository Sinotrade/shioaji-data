summary_short: 以儲能系統、光儲整合與維運服務為主，兼營電源及網通產品。
summary_long: 盛達以儲能與能源整合服務為主要業務，並保有電源及通訊產品。2026年前八月營收組成為台灣能源40%、海外能源26%、電源13%、通訊21%。旗下盛齊綠能提供太陽能與儲能解決方案及電廠維運，晟瑞科技從事鋰電池模組、家用及工商儲能系統整合。集團主要產品包括Fusio Nex工商儲能整合系統、Giga太陽能變流器、BEVC直流充電樁、電源供應器與LED驅動器，以及5G路由器；能源服務另涵蓋案場建置、能源調度及資產管理。
