summary_short: 以聲學產品設計製造及代工為業，主要營收來自家用音訊系統。
summary_long: 東科控股及其子公司以OEM、ODM及JDM模式提供聲學產品設計與製造服務，產品涵蓋家用音訊系統、個人音訊系統、穿戴式音訊、喇叭單體與聲學模組，Soundbar為核心業務。2026年上半年，家用音訊系統占營收66.9%，個人音訊系統占17.7%，穿戴式音訊占5.8%，其餘包括喇叭單體、聲學模組、模具及其他業務。主要子公司包括東亞科技(香港)有限公司，並經其間接持有Eastech (VN) Company Limited、東聲(惠州市)電子有限公司及Scan-Speak A/S。
