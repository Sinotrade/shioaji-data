summary_short: 以車用及高階運算散熱風扇、模組為主，兼營淨飲水與空氣清淨家電。
summary_long: 元山主要設計、製造與銷售BLDC及EC散熱通風風扇、散熱片與客製化散熱模組，車用產品應用包含座椅通風與中控系統。2025年依應用領域區分，汽車電子占營收47%、高階運算系統29%、生活科技系統15%，工業設備與其他9%。公司另開發AI伺服器散熱方案與液冷設備，2025年12月公告120kW Sidecar已完成量產準備，並展示資料中心冷卻方案。家電產品則包括RO飲水機、開飲機與空氣清淨機。
