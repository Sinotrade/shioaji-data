summary_short: 設計及銷售小尺寸顯示驅動晶片，透過子公司經營感測器、車用晶片與電源管理。
summary_long: 矽創是無晶圓廠IC設計公司，主要產品為小尺寸顯示器驅動晶片，應用於物聯網、工控與手機。2026年第二季合併營收以物聯網49%為最大來源，其次為感測器16%、車用14%、工控13%及其他8%。感測器業務由子公司昇佳電子發展，車用顯示驅動晶片由子公司力領科技經營，另透過極創電子提供電源管理方案、新特系統投入半導體設備。公司亦提供整合觸控與顯示功能的TDDI，零電容TDDI占同季總營收22%。2025年完成鈊創剩餘股權收購，2026年另對禾保科技投入新台幣6,000萬元。
