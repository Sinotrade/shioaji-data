summary_short: 以物聯網與工控顯示驅動晶片為主，集團另經營車用驅動與感測晶片。
summary_long: 矽創為無晶圓廠晶片設計公司，主要提供物聯網與工控顯示器驅動晶片，並提供投射式電容觸控控制晶片。物聯網產品採用零電容技術，工控產品支援TN、VA、STN及TFT顯示技術。2026年第二季合併營收中，物聯網占49%、感測器占16%、車用占14%、工控占13%、其他占8%。集團子公司昇佳電子研發感測晶片，力領科技經營車用顯示驅動晶片，新特系統從事半導體製程與測試設備業務；子公司的產品與業務範圍分別揭露。
