summary_short: 經營連鎖藥妝藥局，銷售藥品、保健食品、醫材及婦嬰用品。
summary_long: 佑全經營佑全保健藥妝、健康人生藥局與札幌藥粧三大通路，透過連鎖藥妝藥局銷售藥品，並提供收受健保處方箋相關服務。主要商品另包括保健食品、醫療器材及婦嬰用品，零售品項涵蓋醫美、日用品、奶粉與尿布，營業項目亦包含樂齡長照服務。公司以醫療保健用品通路及藥事服務為主要業務，二〇二五年第三季財報採單一營運部門揭露，並明載其最終母公司為優盛醫學科技股份有限公司。
