summary_short: 以顯示器、電視代工為主，兼營電腦周邊、視訊會議設備與機器人。
summary_long: 瑞軒以顯示器及電視的OEM／ODM設計製造為核心，並供應電腦周邊與視訊會議設備。2025年顯示器占營收52.30%、數位電視機12.77%、電腦周邊22.57%、視訊會議設備8.37%，顯示器為最大營收來源。顯示產品包括OLED電競螢幕及Mini LED電視，電腦周邊包括滑鼠與網路攝影機。2026年具名報導列三星、華碩、微星及技嘉為電競顯示器代工客戶；公司亦提供陪伴型機器人產品，具備機器人整機製造能力。集團2024年前三季處分VIZIO持股，並於同年9月底前全數出清。
