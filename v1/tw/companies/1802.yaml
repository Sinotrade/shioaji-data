summary_short: 製造銷售平板玻璃、玻璃纖維與玻璃器皿，並供應電子級玻纖布。
summary_long: 台玻主要經營平板玻璃、玻璃纖維及玻璃器皿，2025年年報揭露三者營業比重分別為59.63%、31.31%及9.06%，以平板玻璃為最大來源。玻纖布由自製玻纖紗織造，供銅箔基板廠製作印刷電路板材料，產品包括Low DK及Low CTE玻纖布，相關應用涵蓋AI伺服器及5G高頻高速材料。公司曾與Owens Corning簽訂技術授權及製造供應協議；日東紡則是玻纖布市場競爭對手。主要直接子公司包括台灣玻璃中國控股、台灣玻璃美國銷售及台灣汽車玻璃。實聯化工的進貨關係可確認於旗下台玻東海玻璃，未據此認定母公司直接採購。
