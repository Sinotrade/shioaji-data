summary_short: 以 unitech 品牌銷售工規行動電腦、條碼與 RFID 設備，提供設備管理及倉儲整合方案。
summary_long: 精聯以 unitech 品牌研發、製造及銷售自動辨識資料收集設備，產品涵蓋軍工規行動電腦、條碼掃描器與 RFID 讀取器。2025 年軍工規行動電腦占營收 41.86%，條碼印表機、碳帶及耗材占 21.86%，條碼掃描器占 12.83%，其他占 23.45%。另提供 MoboLink 平台，支援行動裝置遠端管理、監控與維護，並整合 AMR 機器人及自動輸送系統提供智慧倉儲方案。精技電腦為其母公司，海外營運子公司負責美洲、歐洲、日本及中國大陸銷售。
