summary_short: 製造顯示面板，並提供車用顯示及智慧場域整合方案。
summary_long: 友達提供電視、顯示器與筆電面板、LED顯示，以及車用顯示整合方案。2026年第二季顯示科技、智慧移動、垂直場域與其他業務營收占比分別為48%、29%、19%及4%。垂直場域由子公司達擎提供智慧零售、企業及醫療等軟硬體整合應用。友達於2024年完成BHTC收購，並透過友達智慧移動經營車用事業；凌華自2025年6月底納入合併財報。公司另發展Micro LED顯示、Micro LED CPO光學模組及玻璃核心基板，與康寧合作光通訊及先進封裝技術。2026年10月，能源事業分割子公司達耀科技由星耀投控完成收購。
