summary_short: 開發、製造及貿易汽車與工業用螺絲、螺帽等特殊扣件。
summary_long: 友鋮以汽機車、農機及工業機械用特殊扣件與零配件的開發製造及貿易為主要業務，產品涵蓋螺絲、螺帽與客製化汽車零件。主要產品另包括海外授權在台製造的MAThread®及TEC WASHER雙齒防鬆華司。2026年上半年，集團貿易營運部門外部收入高於生產營運部門，業務同時涵蓋扣件貿易與製造加工。必鋮為全資子公司，並透過必鋮全資持有蘇州友連。公司官網列明電動車電池包封裝螺栓與高壓連接系統固定件等應用。
