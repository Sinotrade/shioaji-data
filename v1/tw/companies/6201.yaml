summary_short: 以專業音訊產品為營收主力，另製造健康家電與小家電。
summary_long: 亞弘電以電子音訊產品為營收主力，2025年占營收83.97%，健康家電占12.95%，其他占3.08%。音訊產品涵蓋DJ唱盤、數位DJ控制器及串流混音機。健康家電包括血壓計與具身體組成分析功能的智慧體重計，年報說明該業務以ODM生產為主。公司官網亦列有咖啡機等小家電產品。主要海外營運子公司包括東莞與菲律賓公司，官網分別介紹其當地工廠與生產活動。
