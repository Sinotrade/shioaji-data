summary_short: 設計製造取像鏡頭、光學元件、車用光學、3D列印系統及微投光機。
summary_long: 揚明光學主要業務包括取像光學、光學元件、車用光學、3D列印系統及微投光機。2025年營收以取像光學占36%最高，其次為光學元件23%、車用16%、3D列印機12%、微投光機10%，其他占3%。產品涵蓋取像鏡頭模組、波導鏡片、DLP光機、智慧頭燈及光達鏡頭。取像光學應用包含低軌衛星與無人機，CPO相關元件則持續推進送樣及試量產。中強光電為具實質控制能力的母公司，子公司包括昆山揚明、蘇州揚明及Young Optics (BD) Ltd.。
