summary_short: 以顯示驅動、觸控及整合型IC的設計研發與銷售為主要業務。
summary_long: 奕力-KY旗下擁有奕力科技股份有限公司，集團主要從事顯示驅動與觸控IC設計、研發及銷售。2024年報將產品營收統一歸類為顯示器驅動IC，占全年營收100%。集團產品涵蓋手機AMOLED顯示驅動IC、筆電LCD與OLED驅動IC，以及平板與車載顯示觸控整合晶片TDDI。獨立式觸控IC應用包含筆電、電子書及工控設備；資訊設備產品另包含整合時序控制的TED與TCON時序控制器，提供不同顯示系統所需的驅動及控制功能。
