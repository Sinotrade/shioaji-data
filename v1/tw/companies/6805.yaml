summary_short: 製造折疊手機與筆電轉軸、伺服器滑軌及液冷快接頭。
summary_long: 富世達主要產品包括折疊手機與筆記型電腦轉軸，以及伺服器滑軌、液冷快接頭。2026年上半年，伺服器應用占營收55.7%，折疊手機應用占38%，伺服器已成為最大營收來源。公開資料揭露的手機轉軸客戶包括華為、摩托羅拉，筆電轉軸客戶包括戴爾、聯想。奇鋐科技是富世達的母公司；富世達透過MARKETHILL間接持有深圳子公司，並直接持有越南子公司。2025年3月董事會通過對越南子公司增資800萬美元；2024年8月亦通過投資王道銀行乙種可轉換特別股，核准金額上限為新台幣8,000萬元。
