summary_short: 以不動產出租、旅館客房及濕紙巾、保養品等消費品銷售取得營收。
summary_long: 士紙的營收來自不動產出租、旅館客房及民生消費品銷售。2026年上半年租賃收入3,996萬元，客房收入1,869萬元，商品銷售收入1,797萬元，以租賃收入為最大來源。消費品涵蓋獅子寶寶濕紙巾、嬰幼兒洗沐保養與防護用品，以及子公司日和士林經營的氧顏森活面膜與保養品。直接子公司另有陽光士林開發、士林環境淨化；大地都更建設由陽光士林開發持有，屬間接子公司。
