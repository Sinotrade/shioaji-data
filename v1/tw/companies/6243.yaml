summary_short: 以筆電內嵌式控制器、微控制器及周邊應用IC設計為主，另拓展無人機產品。
summary_long: 迅杰科技從事個人行動裝置與電腦周邊IC設計，2025年度電腦及周邊消費電子相關應用IC占營收99.85%，其他業務占0.15%。主要產品包括筆記型電腦內嵌式控制器、微控制器及USB-C PD電力傳輸晶片；EC整合快閃記憶體與多種介面，MCU涵蓋RGB控制，USB-C PD提供電源管理與快充控制。公司亦跨足自有品牌無人機，整合AI影像處理、衛星物聯網與邊緣運算，提供整機設計、地面控制及雲端管理平台解決方案。
