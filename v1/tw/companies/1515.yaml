summary_short: 以健身器材OEM／ODM設計製造為主，另提供電動工具等產品。
summary_long: 力山以健身器材及電動工具的設計、製造為主要業務，健身器材採OEM／ODM模式，涵蓋跑步機、飛輪車、划船機、橢圓機與重訓器材。2025年合併營收中，健身機占83.94%、電動工具機占10.35%、其他占5.71%。電動工具包括斜切鋸與台鋸，其他產品領域涵蓋割草機器人、電動輔助自行車及無人機動力系統；無人機產品包括無刷電機、電調與動力模組整合。子公司包含力山科技、桐鄉力山與越南力山。
