summary_short: 製造銷售自有品牌MLCC及陶瓷基板金屬化產品，並代理電子零組件。
summary_long: 禾伸堂製造銷售自有品牌積層陶瓷電容（MLCC），並經營半導體與電子零組件代理業務。2025年合併營收中，被動元件占42%、主動元件占23%、系統模組占14%、其他占21%。自製產品另包括陶瓷基板金屬化加工；MLCC涵蓋AI伺服器電源與BBU使用的低損耗、高壓、高容NP0產品，以及5G網通等應用。公司官網與原廠資料確認VISHAY、Azoteq的代理關係，DELTA則為電源元件代理原廠。2026年公告向ALPHADESIGN CORPORATION取得設備、向中傳企業購置龍潭不動產，以及向孫公司Everplus Material Co., Ltd.購入機器設備。
