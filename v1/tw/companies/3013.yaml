summary_short: 以伺服器與電腦機殼為主要收入，另提供液冷機櫃、模具及MIM零組件。
summary_long: 晟銘電主要從事伺服器與個人電腦機殼的設計、製造及銷售，亦提供液冷機櫃。2025年電腦與伺服器機殼占營收98%，模具占2%，收入集中於機殼業務。產品另涵蓋MIM金屬零組件及浸沒式散熱設備；公司曾展示AI機櫃解決方案，並揭露GB200機櫃出貨。其產品對應AI伺服器機構件與液冷散熱系統。集團主要製造子公司包括東莞成銘、晟銘電子（寧波）及晟銘泰國，業務均包括電腦機殼及相關零件的生產、銷售。
