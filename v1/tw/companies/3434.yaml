summary_short: 設計、製造及銷售監控、工業與醫療顯示產品，營收以安全監控系列為主。
summary_long: 哲固從事安全監控、工業應用及健康醫療產品的設計、製造與銷售。2025年營收以安全監控產品系列為主，占88.44%，涵蓋監控顯示器、混合式數位錄放影機及弱視輔助設備。工業應用占7.37%，產品包括觸控顯示器、防水防塵一體機及數位看板；健康醫療占1.35%，提供臨床、手術與診斷顯示器，其他業務占2.84%。年報另將10.1吋觸控顯示螢幕地面控制站列為規劃開發項目。旗下包含投資控股與貿易子公司。
