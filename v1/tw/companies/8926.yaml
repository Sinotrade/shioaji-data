summary_short: 經營汽電共生與天然氣發電，並提供電業工程、運維及綠電售電服務。
summary_long: 台汽電以汽電共生、天然氣發電及電業工程服務為主要業務，汽電共生業務供應電力與蒸汽，天然氣電廠由星能電力、森霸電力及星元電力等子公司營運。2026年第一季合併營收中，銷貨占91%、工程占8%、運轉及服務占1%。集團提供電廠與輸變電工程統包及運轉維護服務；子公司星能股份承攬電力工程，台汽電綠能經營再生能源購售電與輔助服務。地熱業務目前評估其他開發專案及籌組鑽井團隊。
