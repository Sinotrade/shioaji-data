summary_short: 經營發電、蒸汽供應與售電，並提供電廠及輸變電統包工程服務。
summary_long: 台汽電經營汽電共生，供應電力與蒸汽，並提供電廠及輸變電工程服務。2026年前七月合併銷貨收入388.40億元，研究諮詢及工程服務收入17.95億元。2026年1月完成收購東京電力國際持有的三家燃氣電廠股權後，對森霸、星能電力及星元的持股分別提高至62.5%、60%及64%；另於2025年參與國光電力增資，持股增至45.83%。子公司星能股份有限公司承作電力工程，台汽電綠能經營再生能源售電及輔助服務代操作。地熱方面，集團已於2024年處分宜元及其清水地熱子公司，大屯山合作開發協議則於2026年7月終止。
