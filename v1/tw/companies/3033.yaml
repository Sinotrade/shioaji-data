summary_short: 威健以半導體電子零組件、電腦周邊代理經銷及技術服務取得營收。
summary_long: 威健實業以半導體電子零組件及電腦周邊設備的代理經銷、技術服務為主要業務，2025年度相關銷售約占營收100%。代理產品包括嵌入式處理器、微控制器、MOSFET與IGBT，並提供應用技術支援及供應鏈管理服務。集團開發並陸續提供AI伺服器、5G通訊及電動車相關參考解決方案，涵蓋運算、通訊與車用電子應用，業務角色以零組件通路與應用支援為主。
