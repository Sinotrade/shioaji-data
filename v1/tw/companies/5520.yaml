summary_short: 以預拌混凝土製造銷售為主，另有運輸服務收入。
summary_long: 力泰主要從事預拌混凝土製造與銷售，服務範圍涵蓋大台北地區。2025年合併營收中，預拌混凝土占91.78%、運輸收入占8.14%，其他產品占0.08%，其中包含砂石等產品。混凝土產品包括已量產的10,000至13,000 PSI高性能混凝土、低碳混凝土及綠混凝土。子公司包括皓泰投資、佳裕開發實業、泰山航運事業與立勝航運，業務分別涵蓋一般投資、不動產租賃買賣及船舶出租運送。
