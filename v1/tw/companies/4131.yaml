summary_short: 集團以醫療器材銷售、維修及租賃為主，另經營生物晶片與檢測產品。
summary_long: 浩泰集團營收以醫療器材部門為主，2025年該部門營收為新臺幣2億1,269.8萬元，生技部門為3,195.8萬元。醫療器材業務由子公司八億實業經營，涵蓋設備銷售、維修與租賃。生技產品包括人類乳突病毒基因分型檢測套組、肉種鑑定檢測套組及生物晶片判讀儀，分別用於病毒分型、食品肉種辨識與晶片結果判讀，其中判讀儀限研究開發用途。廣泰金屬工業為最終母公司，旗下另有從事五金批發及國際貿易的中一國際銲材子公司。
