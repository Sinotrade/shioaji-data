summary_short: 製造飛機機身、引擎結構與起落架零組件，另生產特殊模治具。
summary_long: 駐龍精密機械主要製造航太零組件及特殊模治具，產品涵蓋飛機機身結構、引擎結構與起落架零組件。2025年度營收以飛機結構零組件為主，金額為新臺幣6億3,111.3萬元，占94.07%；模具及其他營收為3,975.2萬元，占5.93%，顯示收入主要來自航太零組件。截至2026年3月31日，公司持有駐龍科技股份有限公司100%股權，該公司為其全資子公司。
