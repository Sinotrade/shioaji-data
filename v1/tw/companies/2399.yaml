summary_short: 以BIOSTAR品牌銷售主機板、顯示卡與工業及邊緣運算硬體。
summary_long: 映泰以BIOSTAR品牌經營電腦板卡與運算硬體，2025年營收以電腦主機板為最大來源，占49%，顯示卡16%、工業電腦11%，其他24%。產品涵蓋Intel與AMD平台主機板、顯示卡、固態硬碟與記憶體，並提供工業及邊緣運算平台。EdgeComp MS-NAT4000支援NVIDIA Jetson Thor T4000模組，面向工業邊緣AI運算；另展示MW-W88U4-S 4U AI工作站，處理企業本地運算。公司亦提供電動車充電樁運算解決方案，相關產品為工業主機板。
