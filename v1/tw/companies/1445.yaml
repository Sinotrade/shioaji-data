summary_short: 以聚酯纖維布、加工絲及布料加工為主，另有房地租賃收入。
summary_long: 大宇紡織以聚酯纖維布與加工絲為主要業務，布料涵蓋聚酯長纖布、T/R交織布及彈性布種，供男女時裝與襯衫等用途，並提供貼合、燙金、壓花及印花加工布料。2025年紡織事業部占營收67.13%，假撚事業部占24.57%，房地租賃占8.30%。加工絲產品包括仿毛、仿麻、仿棉及複合紗；彰濱廠於2025年轉為廠辦租賃，報告註明已無生產行為。集團旗下有長富投資與弘宇科技兩家全資子公司。
