summary_short: 透過大陸工程、大陸建設與欣達環工經營營建、不動產及環工事業。
summary_long: 欣陸投控透過子公司經營營建工程、不動產開發，以及環境工程與水資源處理三項事業。大陸工程承攬土木與建築工程，是2025年集團最大外部營收來源；大陸建設從事不動產開發與房地產租售；欣達環工業務涵蓋水處理、廢棄物、再生能源處理及管線工程。2026年，集團公告大陸工程以19億元出售楊梅土地予三暢開發的計畫，大陸建設另公告投資三暢開發25%股權。欣達環工同年公告投資6億元設立客雅水務，以執行新竹客雅再生水案。
