summary_short: 製造與銷售一般、耐熱、自融及特殊漆包線。
summary_long: 榮星以漆包線的製造、加工與銷售為主，產品分為一般、耐熱、自融與特殊漆包線。一般漆包線可用於馬達、變壓器及發電機；耐熱線用於耐熱線圈、冷凍壓縮機與電動工具馬達。自融線提供溶劑、熱風或通電加工方式，特殊線包含扁平線、絞線及銅包鋁線。公司於2026年展覽資料推廣電動車車載與馬達用線、AI伺服器變壓器所需大扁線與電感用線，以及無人機高功率馬達專用自融線。
