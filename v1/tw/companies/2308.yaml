summary_short: 以電源、散熱零組件與資料中心、自動化及電動車系統方案取得營收。
summary_long: 台達電以電源與散熱技術供應電子零組件及系統方案。2025年電源及零組件占營收50%，基礎設施33%、自動化10%、交通7%。產品包含AI伺服器機架式電源、高壓直流供電、冷卻液分配裝置、電感與變壓器，也提供電動車充電設備及D-Bot協作機器人。台達與NVIDIA共同設計AI資料中心電源及散熱方案，並使用英飛凌OptiMOS功率級開發垂直供電模組。近三年透過不動產交易及收購擴充業務，包括取得觀音廠、Alps Alpine功率電感資產、晶睿剩餘股權，以及子公司執行的ACT Genomics與Noda RF收購。
