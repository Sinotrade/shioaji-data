summary_short: 研發製造面板、Micro LED及半導體封裝製程設備。
summary_long: 東捷從事設備研發與製造，涵蓋LCD製程整合與整廠自動化，並將雷射微加工技術應用於Micro LED及半導體產業。顯示器相關產品包括Micro LED巨量轉移與巨量修補設備，用於顯示器量產製程；半導體相關產品包括PLP自動化搬運與AOI光學檢測設備。先進封裝產品涵蓋玻璃載板雷射切割、EMC雷射修整及雷射剝離設備，另有PLP RDL自動光學測量機，產品布局聚焦FOPLP與晶圓級封裝製程。
