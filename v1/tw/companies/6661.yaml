summary_short: 以基因檢測、癌症液態活檢及相關試劑與儀器銷售取得收入。
summary_long: 威健生技提供基因檢測服務，並代理銷售相關試劑與儀器。2025年合併營收中，試劑銷售占37.80%，為最大單項；基因檢測占32.78%、癌症液態活檢占19.62%、儀器銷售占9.45%，其他收入占0.35%。研究服務涵蓋基因晶片、次世代及第三代定序，臨床服務包含產前羊水晶片、胚胎染色體與非侵入性胎兒染色體檢測，另提供蛋白質體分析服務。截至2025年底，持有威茂股份有限公司全部股權及微傳股份有限公司88.47%股權。
