summary_short: 開發、出租及出售集合住宅與商業大樓，以建設業為主要收入來源。
summary_long: 名軒開發主要經營集合住宅與商業大樓的開發、出租及出售，房屋興建委由營造廠商承建。2025年年報列示建設業營業比重99.52%，其他業務為0.48%。2025年法說資料所列建案包括新北市淡水區的名軒海樂地，產品涵蓋住宅、事務所與店面；高雄市鳳山區的名軒亞灣城規劃住宅、辦公室與店面；苗栗縣後龍鎮的名軒心城市規劃住宅及店面。名軒另持有嘉圓營造股份有限公司100%股權。
