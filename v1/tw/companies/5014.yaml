summary_short: 以不鏽鋼材料銷售及裁剪、分條、拋光加工服務為主要業務。
summary_long: 建錩以不鏽鋼材料銷售及加工服務為主要業務，集團產品包括冷、熱軋不鏽鋼捲材與板材，並供應分條鋼帶、止滑板、角鋼及扁鋼。分條產品由原鋼捲加工為所需尺寸的小鋼帶，止滑板則是另列的材料品項。加工能力包含整平裁剪、雷射切割與拋光，對應鋼材尺寸加工及表面加工需求。其產品與服務結合原料供應、裁剪分條及表面處理，業務主要圍繞不鏽鋼材料及其加工展開。
