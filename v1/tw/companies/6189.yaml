summary_short: 以半導體元件、液晶面板代理經銷及設計導入服務為主要業務。
summary_long: 豐藝以半導體元件及液晶面板代理經銷為主，提供產品設計導入與技術支援。2025年合併營收中，線性／分散式元件占34.28%，影像處理IC占27.30%，特定應用晶片占13.52%，特定應用暨液晶面板相關產品占19.52%，其他產品占5.38%。代理產品亦涵蓋網通與RF相關元件，應用包括5G通訊。子公司勁豐電子從事人機介面與嵌入式控制系統研發製造，提供醫療顯示、健身器材控制及工業觸控等客製化方案。
