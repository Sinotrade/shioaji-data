summary_short: 製造銷售衛生棉、紙尿褲、濕巾與不織布，營收以衛生棉類為主。
summary_long: 康那香以衛生用品及不織布產品的製造銷售為主要業務，產品涵蓋衛生棉、護墊、產墊、紙尿褲、濕巾、化妝棉與口罩。2026年上半年產品別營收以衛生棉類占51%為主，其次為濕巾類25%、紙尿褲類13%，不織布及其他占9%、口罩類占2%。自有品牌產品包括康乃馨衛生棉及蘭韻化妝棉。依2025年底合併財報，子公司包括康潔環境保護工程與OUTLOOK INVESTMENT PTE LTD，並透過後者持有康衛生活用品（揚州）有限公司。
