summary_short: 提供UEFI BIOS、OpenBMC系統管理韌體授權及客製化工程服務。
summary_long: 系微以電腦系統韌體授權及客製化工程服務為主要業務，應用涵蓋個人電腦、伺服器與資訊設備。2026年上半年，基本輸入輸出系統占合併營收83%，基板管理控制系統占17%。主要產品包括InsydeH2O UEFI BIOS、Supervyse OpenBMC管理韌體及TapRUUT平台信任根產品。Supervyse用於企業資料中心、AI及高效能運算伺服器的系統管理。集團直接持有Clean Slate Ltd.及系微軟件科技(上海)有限公司，並透過前者持有Insyde Software Inc.。
