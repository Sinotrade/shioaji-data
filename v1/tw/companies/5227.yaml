summary_short: 以磷酸系電池正極材料研發、製造與銷售為主，另提供技術授權及服務。
summary_long: 立凱-KY以磷酸系電池正極材料的研發、製造與銷售為主要業務，產品包括磷酸鐵鋰（LFP），並開發磷酸鐵錳鋰（LMFP）材料。2025年合併財報列示，電池粉體製造收入為新台幣399,883仟元，技術授權及服務收入為767仟元，營收以製造業務為主。集團另提供專利技術授權與正極材料生產諮詢及支援服務，應用市場涵蓋儲能與電動車電池。主要子公司包括台灣立凱電能科技股份有限公司。
