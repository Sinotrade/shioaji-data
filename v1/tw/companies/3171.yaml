summary_short: 以「包大師」經營包裝材料通路，銷售膠帶、緩衝包材及包裝機械。
summary_long: 炎洲流通以「包大師」經營包裝材料連鎖通路，銷售膠帶、電子包裝材料、緩衝包材、塑膠袋、紙品包裝及包裝機械。2026年上半年合併財報將包裝材料進出口買賣列為單一應報導部門。炎洲股份有限公司為最終母公司，持股42.73%。直接子公司包括包大師（上海）、亞化科技（武漢）、聯勝國際科技、星穎科技與金穎材料；前兩家為全資子公司，後三家持股分別為55.08%、55.06%與55.02%。
