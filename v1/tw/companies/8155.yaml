summary_short: 製造伺服器、工業電腦、網通及IC測試用印刷電路板。
summary_long: 博智以印刷電路板製造為主要業務，2025年PCB占營收97.09%。產品應用涵蓋伺服器、工業電腦、網通及IC測試，具備HDI製程，並已量產AI伺服器用板；IC測試產品包括探針卡與負載板所需的PCB。具名報導列美超微、戴爾及亞馬遜AWS為AI伺服器客戶，另指出研華為工業電腦最大客戶。年報列示台光、聯茂等基板及膠片供應來源。2025年與Meiko共同投資越南PCB公司，由博智持股70%；2026年董事會另通過不超過8,000萬美元的增資額度，依需求分次投入。2026年10月，越南子公司公告向Meiko關係企業承租廠房並取得使用權資產。
