summary_short: 製造多層PCB與HDI，應用於伺服器、網通、工業電腦及半導體測試。
summary_long: 博智電子以多層印刷電路板及高密度連接板為主要產品，多層板涵蓋二至七十二層，HDI涵蓋四至七十二層。產品應用包含伺服器、網通交換器、嵌入式工業電腦，以及探針卡、負載板等半導體測試設備所需PCB。公司沿革記載二〇二三年已有多種AI伺服器產品量產。二〇二五年度合併收入按產品分為印刷電路板、樣品及其他。年底合併子公司包括昆山博好智貿易有限公司，以及持股七成的Allied Circuit Meiko Vietnam Co., Ltd.。
