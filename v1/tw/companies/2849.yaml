summary_short: 以企業與個人授信、財富管理及金融市場業務賺取利息與手續費。
summary_long: 安泰銀行經營企業授信、個人金融、財富管理及金融市場業務。企業金融包括貿易融資、現金管理、聯貸與結構融資；個人金融涵蓋房貸、信貸及信用卡，另提供保險、基金與信託服務。2025年利息淨收益30.66億元、手續費淨收益15.55億元，法說簡報列示兩者占淨收益約53%及27%。具名授信客戶包括兆基屋管，安泰銀行於2026年統籌主辦其三年期聯貸。科技應用方面，與台灣大哥大、群聯電子合作導入語音辨識服務。2026年另公告辦公室使用權資產續租，以及向台北富邦銀行新加坡分行、王道銀行轉讓聯貸資產。
