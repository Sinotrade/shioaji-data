summary_short: 製造航空發動機冷卻片、環形件及超合金薄板組合件。
summary_long: 寶一製造航空發動機零組件，產品包括超合金機製及薄板組合件、薄板成型航太零件，以及環型鍛件精密加工件。組合件涵蓋集油器與空氣罩，薄板成型件包括噴嘴葉片冷卻片及托架，環形加工件則包括引擎燃燒筒內襯、靜子內外環與凸緣。其製程技術涵蓋超合金及鈦合金成型、焊接、機械加工，以及超合金熱處理與表面處理。年報列示的零件應用包括CFM56、PW1000G、PW1500G及LEAP系列發動機，這些名稱代表產品應用機型。
