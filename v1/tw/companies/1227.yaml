summary_short: 製造及銷售營養食品、穀物、乳製品與食用油，廚房料理食品為最大營業來源。
summary_long: 佳格主要製造及銷售營養食品、食用油品、乳製品及飲料。依2025年年報揭露，廚房料理食品類占營業比重54%，營養食品類占37%，其他類占9%，以廚房料理食品類為最大來源。主要產品涵蓋桂格穀物食品、桂格完膳營養補充品、天地合補保健品、福樂乳製品及得意的一天食用油。集團直接子公司包括佳乳食品與德泰科技；上海佳格食品及佳格食品（中國）則列為間接持有的子公司。
