summary_short: 製造顯示器用增亮膜、複合光學膜、量子點薄膜及保護膜。
summary_long: 友輝光電主要製造顯示器用光學薄膜，2025年度營收組成以增光膜列示，占比100%，其中內銷60.71%、外銷39.29%。增亮膜利用微結構聚集與導引光線，提高顯示亮度及光效；複合膜則將不同功能薄膜貼合，以滿足輕薄化需求。量子點薄膜用於提高LCD面板色域，保護膜則降低載材在生產與出貨過程中的刮傷風險。公司為新光合成纖維旗下子公司，另持有建凱企業、友榮資本，並透過建凱企業持有從事增亮膜裁切加工的蘇州新友輝。
