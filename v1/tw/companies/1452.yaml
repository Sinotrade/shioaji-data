summary_short: 以聚酯加工絲的製造與行銷為主，產品包含多種複合紗。
summary_long: 宏益纖維以聚酯加工絲的製造與行銷為主，2025年度年報揭露該業務占營業比重100%。官網產品規格表列有CD複合絲、石墨烯複合紗及T40046N彈性複合紗，涵蓋不同組成及規格的紗線，其中石墨烯複合紗列有平織與針織用途。公司主要營業內容集中於加工絲製造與銷售。截至2026年6月底，宏益持有宏邦投資股份有限公司100%股權；該子公司從事一般投資業，並列入宏益的合併財務報告。
