summary_short: 製造電源供應器，並透過馳諾瓦經營電動車充電設備。
summary_long: 飛宏以電源供應器與電動車能源產品為主要業務，2026年第一季營收占比分別為68.3%與31.7%。電源產品包括採用GaN技術的外接式電源、乙太網路PoE及客製化醫療電源，並提供資料中心使用的冗餘電源系統。公司亦將SiC技術用於自行車充電器，且開發低軌衛星相關設備的供電方案。電動車充電業務由子公司馳諾瓦科技經營，產品涵蓋AC交流與DC直流充電樁。
