summary_short: 提供儲能工程與維運、綠電交易、節能工程及能源資訊服務。
summary_long: 富威電力提供儲能系統統包建置與維運、再生能源電力交易、節能績效保證工程及綠能管理資訊服務。2025年度合併營收約49.90億元，其中工程收入約32.96億元、售電收入約13.06億元、服務收入約3.88億元，工程為最大收入來源。綠電業務提供再生能源電力交易服務，節能業務提供節能績效保證工程，資訊業務建置綠能管理系統。依2025年底合併財報，森崴能源為母公司，正崴精密工業為最終母公司；直接子公司包括旭威認證、惠捷能源及智電系統。
