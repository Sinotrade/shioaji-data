summary_short: 以晶圓廠自動化供應系統、廠務機電工程、設備材料代理與設備代工取得收入。
summary_long: 帆宣以晶圓廠水、氣體及化學品自動化供應系統、無塵室與機電工程，以及設備材料代理和客製化設備代工取得收入。2026年第一季，自動化供應系統占營收36.57%，設備材料代理占30.39%，整合系統占16.69%。公司提供AI資料中心機電與無塵室系統建置，並有CoWoS相關製造與整合專案。具名客戶包括台積電、鴻海、日月光半導體及力成；2023年報導另確認其替ASML代工EUV模組。2025年與住友商事マシネックス簽署日本合資契約，2026年決議增加投資美國全資子公司3,400萬美元。
