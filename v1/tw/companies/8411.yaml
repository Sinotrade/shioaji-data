summary_short: 透過轉投資公司製造鋁罐、馬口鐵罐與罐蓋，並提供食品飲料充填代工。
summary_long: 福貞-KY為金屬包裝集團的上市控股公司，本身與兩家直接子公司均無實質營運活動，製造及充填業務由轉投資公司執行。2025年合併營收以鋁罐占54.60%為主，馬口鐵罐占29.33%，其他產品與服務包括罐蓋、塗黃彩印製品及食品飲料灌裝代工。集團的福建福貞與山東福貞從事金屬罐生產銷售，台灣鼎新金屬生產鋁蓋，鼎立金屬包裝生產鋁罐；福建福天食品與湖北福天食品則提供充填罐裝服務。
