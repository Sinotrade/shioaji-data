summary_short: 代理半導體封裝材料與設備，並透過子公司製造導線架。
summary_long: 長華電材代理銷售半導體封裝材料與設備，並透過子公司長華科技製造導線架。2025年合併營收以IC導線架為最大來源，占48.91%，封膠樹酯與基板分別占29.29%及6.14%。代理產品包括住友電木封膠樹酯、京瓷覆晶基板及山田系晶圓級模壓設備。易華電子是關聯企業及基板供應商，並非目前子公司。公司亦引進CoWoS相關設備與材料，銷售Mini LED類BT基板；Mini LED導線架由長華科技開發生產。
