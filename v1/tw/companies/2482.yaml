summary_short: 製造及銷售電子支付讀卡機、支付終端設備，並提供雲端管理平台。
summary_long: 連宇以電子支付讀卡機與支付終端設備的製造及銷售為主要業務，2025年IC讀卡機占產品營收66%，其他產品占34%。產品涵蓋讀卡機、無人自助支付終端、行動POS及櫃檯支付終端，應用包括零售收款、自助服務與戶外支付場景。公司另提供UIC Connect平台，功能包含交易報表、設備狀態監控、遠端控制及應用程式更新管理。2026年法說會列示的投資子公司包括UIC USA、新儀科技及燦宇新視界。
