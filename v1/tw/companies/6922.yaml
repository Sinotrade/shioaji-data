summary_short: 主要銷售強固型無風扇工業電腦、邊緣AI電腦及垂直應用運算產品。
summary_long: 宸曜主要銷售工業電腦與嵌入式運算產品。2024年營收以AI邊緣運算電腦占41.20%最多，強固型無風扇寬溫工業電腦占39.67%，另有垂直市場應用電腦及I/O卡、週邊產品。NRU系列採用Jetson Orin NX，提供無風扇邊緣AI運算，官網亦將其列入自主移動機器人應用。FLYC-300是針對無人機與無人地面載具設計的任務電腦。年報並列有美國、德國子公司，以及間接持有的上海子公司。
