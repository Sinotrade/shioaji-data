summary_short: 以品牌藥與學名藥銷售、藥品委託開發製造及消費者保健產品取得收入。
summary_long: 保瑞以藥品銷售、委託開發製造及消費者保健產品為收入來源。2026年第二季全球銷售、CDMO及消費者保健營收占比分別為50%、36%及14%，全球銷售為最大部門。旗下Upsher-Smith製造與銷售品牌藥及學名藥；CDMO服務涵蓋口服固體、液劑、半固體、生物製劑及無菌注射劑。GlaxoSmithKline為具名製造服務客戶。集團2024年收購Upsher-Smith及Emergent的針劑製造資產，2026年再透過全資子公司取得MacroGenics製造資產。消費者保健業務則透過晨暉生技及其收購的Weider Global Nutrition經營。
