summary_short: 經營貨櫃集散站，提供船舶裝卸、櫃場及倉棧服務。
summary_long: 中櫃以船舶裝卸、櫃場及倉棧作業提供貨櫃集散服務。依2025年報個體口徑，貨櫃集散站作業收入為新台幣31.13億元，占營業收入100%。集團直接子公司包括中友船舶貨物裝卸承攬、中櫃投資及銘揚投資；中櫃並透過中櫃投資持有安躍系統與臺運實業，兩家公司屬間接子公司。截至2026年6月底，中櫃投資對安躍系統及臺運實業的持股分別為70%及67.25%。
