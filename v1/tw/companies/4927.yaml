summary_short: 透過泰國子公司製造銷售硬式印刷電路板，以多層板為主。
summary_long: 泰鼎國際及子公司主要製造、銷售單面、雙面與多層硬式印刷電路板。2025年多層板占營收77.73%，雙面板18.95%，單面板3.04%，產品應用涵蓋家庭、電腦、通訊及汽車領域。集團亦完成三次增層HDI PCB開發。官網列示SAMSUNG、Sony、Canon、LG、Amazon、HP Inc及Seagate等客戶品牌，另將Foxconn與Pegatron列為合作夥伴。2024年重要子公司APT與梨樹飛達簽署合資協議，合作範圍包括網通與伺服器PCB；泰鼎並於2024及2025年認購APT現金增資股份。
