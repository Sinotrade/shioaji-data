summary_short: 透過子公司製造及銷售硬式印刷電路板，以多層板為主要營收來源。
summary_long: 泰鼎國際透過子公司經營印刷電路板製造與銷售，主要產品包括多層板、雙面板及單面板，應用於液晶電視、視訊轉換盒、硬碟、印表機與車用多媒體設備。2025年營收以多層板為主，占77.73%，雙面板占18.95%，單面板占3.04%，其他項目占0.28%。集團直接子公司APT從事印刷電路板生產及銷售，另一直接子公司AET負責供應鏈整合，並透過APT持有泰國電路板公司APS。
