summary_short: 銷售光纜、通信線材與光纖配件，並提供工程及電信服務。
summary_long: 台通光電以通信線纜與光纖配線產品銷售、工程及電信服務取得收入。2026年上半年合併營收中，銷貨占47%、電信服務占40%、工程占12%、其他占1%。產品包括光纜、機架配線箱、光纖連接器與插座，以及通信、高頻同軸及電力用銅纜。子公司台灣智慧光網經營電信事業，SING TUNG從事通信網路工程，瓊蓮銷售通訊設備與線材。公司並承作桃園A-Top新嶺雲端數據園區的專用電信基礎設施與管道規劃建設。
