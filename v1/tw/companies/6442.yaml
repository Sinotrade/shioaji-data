summary_short: 以光通訊主被動元件、光纖跳接線及高頻連接器的製造銷售為主。
summary_long: 光聖的營運分為光通訊與高頻連接器，2025年營收占比分別為91%與9%。光通訊產品包括MPO/MTP多芯光纖跳接線及XGSPON ONU BOSA，應用於資料中心與光纖接取網路；RF產品包含5G連接器、轉接器及線組。公司年報列出Furukawa與Sumitomo的光纖供應關係，經濟日報則具名報導Google為其主要客戶。光聖集團投入CPO外部雷射光源模組開發，並公告與IET-KY進行策略換股合作。2024年完成向精英電腦購買原承租土地及廠房的過戶，另於2024、2025年參與合聖科技增資；合聖為關聯企業，並非合併子公司。
