summary_short: 以積層陶瓷電容與電感為核心，從事電子零組件代理銷售。
summary_long: 蜜望實主要從事電子零組件代理銷售，核心產品為積層陶瓷電容與電感，營運性質屬電子零組件通路。官網另列有E-Bike系統、MEMS麥克風及薄膜精密電阻等代理產品，產品範圍涵蓋被動元件、聲學元件與電動輔助自行車系統。截至2026年3月底，公司直接持有OUTRANGE STAR LIMITED及蜜望實香港有限公司，並透過前者間接持有蜜望實電子國際貿易（上海）有限公司。財報另按台灣與亞洲等營運部門揭露收入。
