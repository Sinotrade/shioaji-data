summary_short: 以空調製造與銷售為主，另經營液晶顯示器及生活家電。
summary_long: 禾聯碩主要經營空調、液晶顯示器及生活家電，產品涵蓋洗衣機、冰箱、冷凍櫃與小家電。2025年度空調營收占68.16%，為主要收入來源；液晶顯示器占11.83%，其餘生活家電、服務維修零件與原物料等合計占20.01%。液晶顯示產品線包含MiniLED顯示技術。集團透過全資子公司聯碩電器製造冷氣及視訊盒、禾雄電器製造冰箱，另持有禾聯電器、夏禾電器販賣及山田和風家電等全資銷售子公司。
