summary_short: 以新藥及保健食品銷售為主，產品包含癌因性疲憊症用藥與止痛藥。
summary_long: 懷特以新藥與保健食品為主要業務，2026年上半年合併營收以藥品及保健食品部門為最大來源，另有醫療診斷及精密醫療器材儀器部門。上市藥品包括改善癌症末期中重度疲勞症狀的懷特血寶凍晶注射劑，以及解除急性中度至嚴重疼痛的懷特痛寶軟膠囊。保健食品包括黃耆成分的懷特耆力、含麩醯胺酸的懷特胺速，以及以皇耆、刺五加與紅棗製成的懷特皇耆飲。合併範圍包含具實質控制力的安克生醫，以及透過安克生醫控制的聲博科技。
