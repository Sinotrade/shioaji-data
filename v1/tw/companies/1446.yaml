summary_short: 經營營建開發與平織布，2025年度營建占營收89%。
summary_long: 宏和精密紡織經營營建開發與平織布業務，2025年度營建占營收89%，平織布占11%。營建業務包括板橋建案銷售；紡織商品包括聚酯平織布、長短纖交織物與超細纖維織物，已開發的產品涵蓋彈性布及單撥單吸後加工布種。公司另直接持有宏和投資股份有限公司、宏洋租賃股份有限公司與UNITED INTERCONTINENTAL LTD.全部股權，三者均為直接全資子公司。
