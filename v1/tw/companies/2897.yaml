summary_short: 經營企業與個人銀行服務，並透過子公司經營票券及創投業務。
summary_long: 王道銀行提供企業聯貸及融資服務，個人金融業務涵蓋存款、貸款、支付、財富管理與保險。合併財報分為銀行、海外、票券及其他部門，以銀行部門為主要業務。主要子公司包括中華票券、IBT Holdings及台灣工銀柒創投；美國華信銀行由IBT Holdings持有，新加坡O-Bank Capital Asia則屬間接子公司。已確認台橡為借款客戶，資訊系統契約對象包括甲骨文及資拓宏宇，另與信保基金合作提供中小企業融資服務。2026年公告擬認購台灣工銀柒創投增資股，公告載明須經主管機關核准後執行。
