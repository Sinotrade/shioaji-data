summary_short: 製造與銷售MLCC、晶片電阻及射頻元件等被動元件。
summary_long: 華新科從事被動元件製造與銷售，2025年全球營業比重以積層陶瓷晶片電容43.5%最高，其次為晶片電阻21.5%及高頻／射頻元件17%，另有圓板電容、薄膜電容及其他產品。公司法說資料列有AI伺服器用X6S高容值MLCC、電動車用車規高壓與高容電容，以及5G網通用高壓高容MLCC，並將ADAS列為產品應用。具名媒體列出台達電與光寶為電源類主要客戶。合併子公司包括信昌電、佳邦及間接持有的釜屋電機、雙信電機；近三年另公告晶技私募認購、透過釜屋電機收購雙信股份，以及向信昌電與華新麗華取得廠房使用權資產。
