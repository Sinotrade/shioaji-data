summary_short: 以電子級玻纖布為主要營收來源，另有石英纖維產品與子公司複合氣瓶業務。
summary_long: 德宏以電子級玻璃纖維布為主要營收來源，2025年占合併營收98.40%，其他業務占1.60%。玻纖布是印刷電路板的主要材料，位於PCB產業鏈上游。旗下德宏電子（蘇州）承接玻纖布生產與銷售，集團官網另列石英纖維紗與石英纖維布產品。公司公布的玻纖布應用涵蓋AI伺服器高速互連板及5G天線基板，石英纖維布應用則包括6G通訊設備。子公司德宇複合材料從事複合LPG容器生產與銷售，集團產品亦包括複合氣瓶。
