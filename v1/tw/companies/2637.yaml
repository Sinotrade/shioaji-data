summary_short: 以散裝船舶出租為主要收入來源，另提供船舶管理服務。
summary_long: 慧洋-KY以散裝船舶出租為核心業務，2025年租金收入占營收98.59%，船舶管理占0.14%，其他收入占1.27%。集團2025年底船隊為126艘，以輕便型至巴拿馬極限型船舶為主力。2025年具名主要客戶包括Cargill Ocean Transportation、Bunge及SwissMarine，分別占營收20.95%、16.66%及12.33%。集團向今治、常石、名村及尾道等船廠取得新船，另透過Wisdom Marine Lines S.A.於2026年取得Benefit Transport S.A.的造船合約，總船價為3,200萬美元。
