summary_short: 透過子公司經營中國百貨零售，賺取聯營佣金、商品銷售、租金及管理服務收入。
summary_long: 大洋-KY透過旗下公司從事商業管理諮詢與百貨零售，營收市場為中國大陸。收入包括百貨聯營佣金、自營商品銷售、商場及不動產租賃，以及勞務提供與其他收入。2025年度上述收入依序為新臺幣663,259千元、447,915千元、938,430千元及701,650千元。集團持有投資控股子公司GRAND CITI LTD.全部股權，並透過該公司全資持有大洋晶典商業集團有限公司，後者從事化妝品、服裝鞋帽等百貨買賣業務。
