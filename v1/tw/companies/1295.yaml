summary_short: 研發製造益生菌菌粉、發酵劑及後生元，並提供保健品客製化服務。
summary_long: 生合從事乳酸菌研究、生產製造及應用開發，提供益生菌菌粉原料與OEM、ODM保健品客製化服務。產品涵蓋豆乳與牛乳發酵劑，可應用於凝固型及攪拌型優格，另有經熱處理的後生元LDL557。動物用產品包括禽畜專用益生菌芯來旺及水產專用益生菌水益旺。公司以SYNTEK菌種優化製程及SYNPACK包裝技術開發益生菌產品。官網並列有生合生物科技（揚州）有限公司及芯來旺生物科技（揚州）有限公司兩家中國子公司。
