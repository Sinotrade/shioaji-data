summary_short: 以電線電纜製造為主，兼營鋁門窗、帷幕牆及太陽能光電。
summary_long: 華電以電線電纜與鋁窗帷幕牆為主要營收來源，2024年營收占比分別為71%及29%，另有太陽能光電收入933.8萬元。電纜產品包括25kV、69kV與161kV交連PE地下電力電纜，以及全鋁電線、鋼芯鋁電線與超耐熱鋼心鋁線；建材業務提供鋁門窗、帷幕牆製造及安裝。依地下電力電纜與架空導線產品，可歸入重電與電網題材的材料階段。2024年底列入合併報表的子公司包括宏禹興業、台灣倉智企業、凱澤企業、華通國際及和裕建設。
