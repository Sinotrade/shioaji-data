summary_short: 提供工業網通設備，以及工業電腦、車用與半導體設備電子製造服務。
summary_long: 台林提供工業網通設備與電子製造服務，主要產品及服務包括TSN乙太網路交換器、5G工業路由器、工業電腦、電動車電子產品及半導體設備電路板設計製造。2025年通信網路產品占營收39.75%，為最大產品類別，電腦及週邊設備占26.54%，其他電子產品占30.91%，其他占2.80%。工業電腦業務提供客製化少量多樣生產，車用業務涵蓋二輪與四輪電動車電子產品；5G路由器提供行動與有線網路切換功能。
