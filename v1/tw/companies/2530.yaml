summary_short: 投資開發住宅與辦公大樓，以房地產出租及出售為主要業務。
summary_long: 華建即大華建設，主要投資興建住宅與辦公大樓，委託營造廠商施工，再辦理出租及出售，業務以不動產開發為主。2025年年報揭露，委託營造廠商興建國民住宅出租、出售業務占營業比重100%。住宅作品包括桃園市中壢區的「大華畔」，規劃226戶住宅及店面，於2025年2月取得使用執照。旗下華建開發從事開發租售業，華鑑營造從事營造業，2025年底持股分別為58.36%及100%。
