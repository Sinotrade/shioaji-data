summary_short: 以藥品委託開發製造服務取得營收，並研發抗癌新藥及多胜肽產品。
summary_long: 北極星藥業集團2025年營收為新台幣4,060.2萬元，來自生物藥品委託開發暨製造服務。子公司霖揚生技提供原料藥至無菌製劑的開發、生產、品質管制及法規查登服務，涵蓋胜肽、大分子原料藥及注射劑。集團核心候選藥物為 pegargiminase（ADI-PEG 20），針對肺間皮癌及急性骨髓性白血病等癌症進行開發，2025年報載明尚無營業收入。多胜肽業務包含霖揚生技的 Semaglutide 原料藥、針劑與口服學名藥開發。
