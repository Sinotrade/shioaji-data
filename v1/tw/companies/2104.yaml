summary_short: 以集團碳黑製造與銷售為主，另經營蒸汽及開發先進碳材料。
summary_long: 國際中橡以集團碳黑製造與銷售為主要業務，2025年碳黑營收占98.35%，其他業務占1.65%，並經營蒸汽製造與買賣。產品涵蓋一般碳黑、適用於車用鋰離子電池與IC載帶的超導電碳黑，以及使用回收材料的環保循環碳黑。公司亦開發單壁奈米碳管，2025年已進入小批量產階段。主要碳黑營運子公司包括林園先進材料科技，以及透過CCC USA Corp.持有的Continental Carbon Company。
