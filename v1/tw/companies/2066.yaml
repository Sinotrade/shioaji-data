summary_short: 製造銷售螺絲、螺帽等扣件與沖壓、機械加工零件。
summary_long: 世德以金屬扣件與加工零件的製造及銷售為主要業務，產品包括螺絲、螺栓、螺帽、塞子、鋁製滑塊，以及沖壓與機械加工件。官網產品目錄列有六角螺栓、油封螺帽等品項。公司2025年法說資料列有電動車業務，並展示特殊客製化零件的生產能力。集團旗下德國子公司 Max Mothes GmbH 從事機械零件及螺絲的生產與銷售，法說簡報另展示該子公司的車削、銑削及整合加工能力。
