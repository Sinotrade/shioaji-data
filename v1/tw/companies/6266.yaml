summary_short: 以PCBA電路板組裝、電子零件代購及成品測試組裝服務取得營收。
summary_long: 泰詠電子以電子產品製造代工為核心，提供PCBA電路板組裝、SMT表面黏著加工、DIP及電子零件代購服務。公司另提供成品測試、系統組裝，以及可製造性分析、製程設計與生產技術諮詢，服務定位為少量、多樣、高難度及不成熟產品。依2024年度合併營收組成，聲學產品占61.53%，為最大應用類別；電力電子占12.89%、網路通信占11.27%，其餘涵蓋影像、工業電腦、醫療器材、汽車電子及其他產品。
