summary_short: 以工業電腦、工業控制及嵌入式板卡為主，提供邊緣AI運算產品。
summary_long: 研華以工業電腦、工業控制及嵌入式運算硬體為主要業務，2025年工業電腦與工業控制占營收52%，嵌入式板卡與機殼占37%，售後服務及其他占11%。公司與Intel、AMD及Qualcomm合作擴展WEDA邊緣AI生態系，並與NVIDIA進行邊緣AI技術合作。產品包括採用NVIDIA MGX平台的SKY-622G4 GPU伺服器、面向機器人應用的MIC-735，以及無人機AI任務電腦ASR-D501。研華於2024年啟動AURES股權收購，2025年持股增至100%；2026年透過全資子公司研華投資完成加雲聯網策略投資。
