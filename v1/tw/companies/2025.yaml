summary_short: 以300系不銹鋼冷軋鋼捲的加工製造與銷售為主。
summary_long: 千興主要從事不銹鋼鋼捲加工製造與銷售，將熱軋不銹鋼捲經生產線加工成300系冷軋產品，依此歸類為鋼鐵產業鏈中游軋延與鋼材業務。2025年度300系產品占營業比重98.92%，其他產品占1.08%。官網列示304、304L、316與316L鋼種，產品涵蓋NO.1熱軋白皮鋼捲、2D及2B冷軋鋼捲，以及H硬質冷軋鋼捲。2D經冷軋及退火酸洗形成霧面，2B再經調質精軋取得表面；H產品則保留硬質材料狀態供下游加工。
