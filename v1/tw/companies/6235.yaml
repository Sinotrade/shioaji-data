summary_short: 製造鎂鋁合金車用機構件，並提供電腦機構件、模具及塑膠射出品。
summary_long: 華孚主要從事鎂鋁合金射出及壓鑄成型，製造汽車零組件的機構、殼體與支架，並提供加工、塗裝及組裝服務。依2025年年報的合併營業比重表，車用部件占營收93.04%，電腦及週邊設備占5.44%，塑膠射出品占1.52%，營收以車用部件為主。其他產品與技術包括筆記型及平板電腦機構件、模治具，以及鎂鋁合金半固態射出成型技術。公司亦有新能源汽車機構業務，可列入電動車零組件題材。
