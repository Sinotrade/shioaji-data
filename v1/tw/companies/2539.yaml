summary_short: 以住宅、店面及商業大樓開發、銷售與出租為主要業務。
summary_long: 櫻花建設以委託營造廠興建國民住宅與商業大樓，辦理房地出售及出租為主要業務，住宅產品包含住家與店面。公司於2024年1月現金投資設立櫻雄公司，後以櫻雄營造為子公司，並委託其承攬台中北屯碧柳段及新竹東濱段工程。銷售端的「櫻花南科之櫻」由海宇國際代銷。土地取得方面，2024年購入烏日新高鐵段土地，2025年取得台南新營及台中南屯土地，2026年另公告取得桃園楊梅、中壢及烏日新站南段土地。
