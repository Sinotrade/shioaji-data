summary_short: 以叢書與外版書出版銷售為主，並開發電子書及有聲書。
summary_long: 時報以圖書出版與銷售為主要業務，出版領域涵蓋文學、人文、社會科學、商業、科普、心理、生活、漫畫及童書。2025年前三季合併營收中，叢書收入為新台幣2億9,742.6萬元，外版書為3,267.1萬元，另有勞務收入63萬元。公司亦投入電子書與有聲書的創新研發。集團透過薩摩亞投資子公司，持有時報（北京）文化諮詢有限公司，後者經營出版品與文藝活動的規劃、設計及諮詢。
