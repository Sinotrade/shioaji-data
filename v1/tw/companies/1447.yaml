summary_short: 本業製造尼龍粒、尼龍絲與布料，合併營收以石化品貿易為主。
summary_long: 力鵬本業製造尼龍粒、尼龍絲及平（針）織布，並提供染整加工；合併集團另經營石油化學品貿易，子公司伊德石化從事化學原料批發。2025年石油化學品占營收68.18%，平（針）織布13.69%、尼龍粒9.08%、尼龍絲3.74%，其他5.31%。尼龍粒用途涵蓋纖維、薄膜及工程領域，布料則應用於戶外運動、流行服飾及家飾。年報亦列示電動車用尼龍粒及纖維為已量產產品，並揭露配合力麗企業提供Apple用紗。
