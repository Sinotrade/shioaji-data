summary_short: 製造銅箔基板含浸、塗佈貼合及陶瓷薄膜製程設備。
summary_long: 亞泰金屬以印刷電路板基材製程設備為主要業務，2025年營收占比92.78%，薄膜製程設備占3.25%，其餘為舊機整改搬遷、售服及其他業務。主要產品包括銅箔基板直立式含浸機、PTFE鐵氟龍含浸機與軟性銅箔基板塗佈貼合機，另提供MLCC及LTCC陶瓷塗佈設備。其設備服務銅箔基板、軟性電路板基材與被動元件材料製程。集團持有薩摩亞天崴環球及泰國子公司，並透過天崴間接持有昆山睿平。
