summary_short: 透過子公司經營光罩、晶片設計、配電設備、電子通路及遊戲業務。
summary_long: 光聚晶電透過子公司經營光罩、電子晶片、配電設備及電子通路，集團業務橫跨半導體與電力等領域。依2025年第三季合併範圍，台灣光罩與揚智科技為間接子公司，分別經營光罩及電子晶片研發設計；合正科技旗下三江電機生產變壓器與配電盤，全達國際經營電子通路。公司另有遊戲研發、代理、線上營運及授權業務，合併營運部門亦涵蓋網路設備、金流、餐飲與醫療。
