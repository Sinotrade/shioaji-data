summary_short: 製造與銷售銅箔基板用電子級及工業級玻璃纖維布。
summary_long: 建榮以玻璃纖維布製造與銷售為主，電子級產品供銅箔基板使用，另有航太及PTFE用途的工業級產品。產品開發涵蓋NE Glass、T-glass與NER-glass；截至2026年5月，T-glass已通過客戶認證並完成小批量出貨，NER-glass仍在認證測試。公司為日東紡子公司，並以日東紡品牌承作T-glass的OEM生產。2025年具名銷貨對象包括日東紡與NITTOBO TAIWAN，進貨對象包括日東紡及NITTOBO ASIA GLASS FIBER。公司亦揭露AI相關伺服器、交換器及路由器為產品研發方向。
