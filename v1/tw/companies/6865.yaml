summary_short: 提供企業無密碼身分認證、零信任資安與數據治理應用軟體。
summary_long: 偉康科技提供企業身分認證與數據應用軟體，產品涵蓋智慧資安與智能決策。OETH FIDO身分鑑別方案支援UAF與FIDO2標準；OETH One以FIDO強認證為基礎，提供設備健康管理與條件式存取。Nous CDP透過智能分群、標籤及自動貼標支援顧客分析與行銷決策。Nous數據治理平台涵蓋元數據管理、數據審核、品質與血緣功能，並納入AI營運助理。Nous AI閘道則集中管理企業生成式AI對話的輸入與輸出。
