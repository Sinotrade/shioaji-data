summary_short: 以電動車整車銷售為主，提供委託設計製造服務並經營FOXTRON品牌。
summary_long: 鴻華先進以電動車整車銷售與技術服務為營運核心，採CDMS委託設計與製造服務模式。2025年度整車銷售占營收98.98%，技術服務占1.02%。主要車款包含已量產交付的Model C與Model T電動巴士，以及以FOXTRON品牌販售的BRIA與2026年上市的CAVIRA。BRIA為首款掛上FOXTRON品牌的乘用車，CAVIRA為第二款主力車型。公司並持有杭州與美國子公司，持股均為100%。
