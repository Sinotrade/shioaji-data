summary_short: 以子公司提供AI伺服器液冷零件清洗，並經營殯葬、租賃及商品銷售。
summary_long: 天品聯合企業主要經營潔淨服務與生命事業，2025年潔淨業務占合併營收56.91%，殯葬相關業務占32.78%，其餘來自租賃、電商及文創業務。旗下奈科潔淨科技為天品持股80%的子公司，提供AI伺服器水冷系統零件、散熱模組與特殊元件的先進清洗服務，導入高階無塵製程及自動化設備。生命事業涵蓋納骨寶塔、骨灰罐、葬位附屬內裝及生命禮儀服務，集團另有天品國際與永恆生命事業等子公司。租賃業務為閒置廠房出租，電商經營直播商品買賣，文創業務產製創意玩具。
