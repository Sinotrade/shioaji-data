summary_short: 以交換式電源、磁性元件及代工製造為主，另有快充、充電與儲能業務。
summary_long: 立德電子以交換式電源供應器與磁性元件為核心，並提供代工製造及USB-C快充產品。2025年度電源供應器及磁性元件等電子零組件產品占合併營收97%，另有勞務、電站及儲能收入。交換式電源提供標準品與客製化服務；USB-C充電器產品導入GaN技術。官網亦列有電動車充電方案及高功率儲能系統。集團子公司立德新能源從事能源技術服務，其儲能業務涵蓋案場開發、設計及工程管理。
