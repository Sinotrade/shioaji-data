summary_short: 透過長春英利等子公司製造汽車金屬與非金屬零組件。
summary_long: 英利-KY透過子公司長春英利經營汽車零組件業務，產品包括儀表板橫梁、保險桿骨架等金屬件，以及前端框架、車底護板、備胎倉等非金屬件，另提供車身焊接總成與模具設計製造服務。2026年上半年營收以金屬件為主，占71.1%，非金屬件占22.4%，模具及其他占6.5%。長春英利旗下寧波英利從事新能源及輕量化汽車鋁合金零件製造，集團業務涵蓋電動車零組件。
