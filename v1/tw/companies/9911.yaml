summary_short: 製造銷售熱水器、廚衛電器與整體廚房，並投資居家裝修業務。
summary_long: 台灣櫻花製造與銷售熱水器、瓦斯爐、排油煙機及整體廚房，營運核心為廚衛電與整體廚房。依公司2026年法說說明，2025年廚衛電約占營收55%，整體廚房約占32%。集團透過全資子公司雅適國際經營莊頭北品牌，另持有櫻花家居全部股權及愛菲爾51%股權。公司於2024年公告愛菲爾投資案，金額1.1億元，拓展居家裝修業務；2025年董事會通過烏日北廠拆除重建計畫，當時預估工程總金額約新台幣7.23億元。
