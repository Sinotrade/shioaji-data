summary_short: 製造銷售熱水器、廚房配備與系統廚具，提供整體廚房服務。
summary_long: 台灣櫻花主要經營廚衛電與整體廚房，產品包括熱水器、瓦斯爐、除油煙機、淨水器及系統廚具。2025年合併營收以整體廚房占31.7%最高，其次為廚房配備30.5%、熱水器24.4%，其他占13.4%。整體廚房提供規劃設計、製造供應及售後服務。旗下直接持有雅適國際、櫻花家居室內裝修、櫻花企業（英屬維京群島）及新加坡控股公司全部股權，並持有愛菲爾51%股權。
