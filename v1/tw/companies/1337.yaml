summary_short: 透過福建子公司製造銷售EVA發泡材料，營收以箱包片材為主。
summary_long: 再生-KY以三斯達(福建)塑膠有限公司為主要營運主體，製造及銷售EVA共混發泡材料，並將廢塑膠及邊角料再利用。2025年營收以箱包片材占42.62%最多，普通片材占31.50%，高彈性發泡占7.20%，地墊占3.44%，特種片材占0.01%，其他項目占15.23%。主要子公司包括Sansda Holding Limited、三斯達(香港)有限公司及三斯達(福建)塑膠有限公司。
