summary_short: 製造與銷售電力電纜、建築配線、裸銅線及太陽能電纜。
summary_long: 宏泰電工以電線電纜製造與銷售為主，2025年合併營收中，電力電纜占79.28%、裸銅線占4.27%、通信電纜占0.31%，其他占16.14%。主要產品包括600V至161kV交連PE電力電纜、無鉛PVC電線及太陽能電纜；特高壓電纜用於地下輸變電配線，太陽能電纜用於模組與直流配電設備間連接。公司法說會列有台灣資料中心工程實績，依產品用途歸入電網材料與資料中心電力設備題材。合併子公司包括信福投資與宏弘工程，宏弘工程已決議辦理停業。
