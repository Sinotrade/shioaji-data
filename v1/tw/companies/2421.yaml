summary_short: 主要銷售散熱風扇、鼓風扇與散熱模組，並提供液冷零件及CDU。
summary_long: 建準以散熱風扇、鼓風扇及散熱模組為主要業務，產品涵蓋DC、AC與EC風扇，並提供熱管、均溫板及EC高效能馬達。2025年報揭露，DC散熱風扇、散熱模組與鼓風扇占業務比重77.22%，AC散熱風扇占2.36%，原物料及零組件占20.42%。液冷零件包括水冷板、水泵、水路分配器及水管快接頭；公司亦展示支援高密度AI機櫃散熱的液對液CDU，並提供晶片、伺服器至機櫃級液冷解決方案。
