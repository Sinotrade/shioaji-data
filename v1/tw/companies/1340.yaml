summary_short: 以商辦與廠房出租、旅館服務取得收入，已停止鞋材生產。
summary_long: 勝悅-KY目前以商辦大樓、廠房出租及旅館服務取得收入，原鞋底與EVO膠粒生產已於2025年停止。2026年上半年租賃收入占45.08%，客房收入占35.70%，其他營業收入占19.21%，其中包括管理費與會務收入。世紀勝悅新材料科技有限公司及晉江成昌鞋業有限公司為集團經營租賃業務的子公司，福建省成悅酒店運營有限公司從事租賃及旅館業務。集團另有投資控股子公司，萬舶酒店亦已列入2026年中合併範圍。
