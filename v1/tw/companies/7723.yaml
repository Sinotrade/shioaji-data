summary_short: 經營火鍋、燒肉及和牛放題品牌，提供連鎖與加盟餐飲服務。
summary_long: 築間以連鎖及加盟餐飲服務為主要業務，經營火鍋、個人燒肉與和牛放題等餐飲品牌。築間幸福鍋物提供石頭鍋等鍋物餐點；燒肉Smile主打個人燒肉套餐；有之和牛提供和牛鍋物放題，本格和牛則提供燒肉放題與多種套餐。公司透過不同品牌提供鍋物與燒肉兩類用餐服務，營運模式涵蓋連鎖門市與加盟。海外子公司日本築間餐飲株式會社於2026年8月經董事會決議終止營運，並辦理解散及清算事宜。
