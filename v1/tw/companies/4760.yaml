summary_short: 研發、製造及銷售銀漿、銀鈀漿與銅漿等電子導電材料。
summary_long: 勤凱科技以客製化導電漿料的研發、設計、製造與銷售為主，產品包括銀漿、銀鈀漿及銅漿，應用於電感、電阻與MLCC等被動元件。2025年導電漿料占營收99.38%，其他產品占0.62%。產品線另涵蓋IC與LED固晶銀膠、PERC太陽能電池背銀膠及TIM1高導熱材料。公司揭露AI伺服器相關材料研發，法說並列出合金膏與TIM1的AI散熱應用；CoWoS先進封裝TIM1列為測試階段，ABF及機器人感測應用則列為Ready。
