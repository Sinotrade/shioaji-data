summary_short: 以保健食品等生技產品銷售為主，另經營保經、電商及無人機業務。
summary_long: 世紀民生科技以保健食品等生技產品銷售為主要收入來源，2025年度合併財報中，生技產品收入高於佣金、生活用品、電子產品及服飾配件等類別。集團另提供保險經紀與電商零售服務，並透過電商平台及直播銷售商品。無人機業務涵蓋載重型、救難檢測及商用軍規應用，並自行開發航程電腦控制模組與飛控系統軟硬體。母公司為上曜建設開發，主要子公司包括翰禹科技、雲康世紀、台保大投資控股及詠昇電子。
