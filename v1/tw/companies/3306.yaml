summary_short: 以GPS接收機為主要營收來源，另提供定位模組與車用雷達、影像系統。
summary_long: 鼎天以GPS接收機為主要營收來源，2026年第一季占銷貨收入86%，其他產品占14%。定位產品包括支援L1與L5雙頻的GNSS模組；車用產品則涵蓋79GHz毫米波雷達、盲點偵測與360度環景影像系統。公司另提供結合駕駛監控、行車記錄及先進駕駛輔助功能的DMS產品，以及提供駕駛行為報告的雲端方案。廣達電腦為其母公司及集團最終控制者。
