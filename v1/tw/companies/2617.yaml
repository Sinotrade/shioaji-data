summary_short: 以散裝船傭船收入為主，兼營港勤拖帶、油輪代營及高澎客貨運。
summary_long: 台航以乾散貨船運為核心，主要採論時傭船方式經營；2025年上半年散裝業務占營收79.07%。公司另經營高雄至馬公的澎湖輪，載運旅客、貨物與車輛，並在台中港及觀塘工業港為中油提供LNG船拖帶與補給服務，也承接中油三艘油輪的代營業務。主要子公司包括台新海運與新旺海運。集團近年透過訂造新船及出售舊船調整船隊，2024年簽訂兩艘四萬噸級新船建造合約，並公告台新海運出售兩艘散裝貨輪；2025年再與大島造船所及住商海業簽訂兩艘六萬四千噸級新船合約。前述四萬噸級新船於2026年交付。
