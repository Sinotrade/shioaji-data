summary_short: 以Matrix、Horizon、Vision等品牌銷售健身器材，並經營按摩椅產品。
summary_long: 喬山以健身器材及電動按摩椅為主要業務，2024年度營業比重分別為89.7%與9.6%，其他業務占0.7%。旗下Matrix服務家庭與俱樂部健身市場，Horizon提供家用健身器材；Vision則提供商用心肺與重量訓練設備，適用於健身俱樂部、企業健身房及多戶住宅等場域。Fujiiryoki為旗下按摩椅品牌。因此，集團產品涵蓋家用健身、商用運動訓練及按摩椅等不同使用需求，營業組成仍以健身器材為主。
