summary_short: 喬山以自有品牌製造、銷售商用與家用健身器材，並經營按摩椅。
summary_long: 喬山主要經營健身器材與電動按摩椅，2025年營收占比分別為90.2%與8.9%。旗下Matrix涵蓋家庭及俱樂部健身市場，Vision提供商用心肺與重量訓練設備，Horizon以家用健身器材為主，另經營FUJIIRYOKI按摩椅品牌。供應鏈方面，祺驊越南廠供應喬山越南廠磁控產品；銷售端包括Amazon及使用Matrix設備的Basic-Fit。2024年，美國零售子公司收購BowFlex幾乎全部資產及相關品牌；2025年，越南兩家子公司分別委建廠房，旗下JFW零售通路亦與Peloton及Tonal展開產品銷售合作。
