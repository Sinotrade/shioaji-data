summary_short: 以系統整合、電腦設備銷售及維護服務為主要收入來源。
summary_long: 凌群主要提供系統整合、電腦設備銷售與維護服務。2025年度系統整合及電腦設備銷售占營業比重76%，設備維護占24%。產品包括自行研發的Ayuda智慧服務機器人、NETCenter資訊架構監控管理平台，以及內嵌企業知識庫的NeuroChain生成式AI解決方案。公司亦提供資料中心規劃、建置與服務，業務涵蓋機器人整機與資料中心建置應用。旗下直接持股子公司包括美商Casemaker、網美科技、凌群資訊、凌群電腦（泰國）、可取科技管理及Syscom International。
