summary_short: 以不鏽鋼捲板加工製造與銷售為主，提供裁切、分條、表面處理及精密冷軋。
summary_long: 運錩以不鏽鋼捲板加工製造與銷售為主要業務，2025年不鏽鋼捲板占合併營收99.94%，其他項目占0.06%。母公司提供不鏽鋼板捲裁切、分條與表面處理，依需求加工鋼材尺寸及表面。旗下寧波奇億金屬有限公司經營精密冷軋不鏽鋼帶材，生產厚度0.08至1.0毫米的軟態、硬態及超硬態冷軋BA／CSP板，應用涵蓋醫療器械、電腦配件、手機零件及汽車零部件。
