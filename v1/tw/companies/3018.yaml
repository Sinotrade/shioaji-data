summary_short: 主要承作無塵室、廠房及建築機電整合工程，並提供土木建築工程服務。
summary_long: 隆銘綠能主要承作機電系統整合工程，官網將服務分為高科技無塵室機電系統、工業廠房機電系統、一般建築機電系統及土木建築工程四類。公司所屬同開營造為甲級營造廠，可支援土木建築及統包工程。依2024年度合併財報，工程部門收入為850,388仟元，其他部門為1,034仟元，環保部門未列收入，主要收入來自工程業務。證交所收錄的2026年8月公告摘要，另將威望國際科技列為公司子公司。
