summary_short: 以禽畜飼料、生鮮肉品及肉類加工食品生產銷售為主要收入來源。
summary_long: 卜蜂主要經營飼料、生鮮肉品及肉類加工食品，採飼料、肉雞契養與屠宰的垂直整合模式。2024年農畜牧肉品占營收44.9%，飼料與加工性熟料占28.8%，消費食品占26.3%。2023年具名報導指出，卜蜂供貨麥當勞，並向智逐科技採購養雞用AI體重設備。最終母公司為CPF，主要子公司包括瑞牧、瑞福、台灣愛拔益加及卜蜂（台灣）。卜蜂於2024年投資蜂勝合資事業，2025年收購瑞牧剩餘32%股權，並於2026年1月再投入瑞牧現金增資。
