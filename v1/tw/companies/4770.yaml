summary_short: 製造氟素樹脂內襯設備、管件及應用材料，並提供相關工程服務。
summary_long: 上品以氟素樹脂加工產品及相關工程服務取得營收，業務涵蓋內襯設備、內襯管件、應用材料與工程。2025年營收以內襯設備為主，占59.12%；應用材料、工程及內襯管件分別占17.12%、14.75%及9.01%。內襯設備包含桶槽、熱交換器與槽車，產品應用涵蓋半導體及面板產業。官網另列PTFE複合材料，可應用於密封件。原料供應關係方面，2024年報具名列出Chemours、Daikin與3M。
