summary_short: 主要製造銷售鋁電解電容器，集團另經營上游鋁箔業務。
summary_long: 立隆電主要製造與銷售鋁電解電容器，產品包含高分子固態及固液混合型電容器。2025年合併營收中，鋁電解電容器占66.8%，鋁箔占33.2%。依2024年應用資料，汽車電子約占整體業績33%；公司另揭露電動車、5G基地台與AI伺服器相關應用。集團包含上游鋁箔子公司立敦，以及惠州、蘇州與泰國等子公司。2024年由蘇州子公司處分土地使用權及廠房；2025年董事會通過購買經由LIRO轉投資惠州公司的股份，同年子公司立敦增資立瀚科技取得控制。
