summary_short: 設計銷售低功耗微控制器、x86嵌入式處理器及周邊控制晶片。
summary_long: 金麗科從事微控制器與微處理器晶片設計，產品以低功耗嵌入式應用為主。MCU產品涵蓋16位元與32位元，應用於工業控制、工業電腦及通訊設備。x86處理器平台包括EmKore 32位元系列，面向人機介面、精簡型電腦與工業自動化設備；64位元雙核心R819300平台在官網標示為開發中。公司亦提供用於通訊、NAS與路由器的網路處理器，以及透過PCI Express擴充周邊介面的C6138 I/O控制器。
