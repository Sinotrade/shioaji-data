summary_short: 經營iQueen品牌電商，銷售美妝保養品、保健食品及生活用品。
summary_long: 軒郁以品牌電商模式銷售美容保養品，並經營iQueen愛女人購物網，販售自有及其他品牌的美容保健品與居家生活用品。2025年網路平台商品及其他占營收55.42%，美妝保養品占44.58%。美妝品牌包括SEXYLOOK、MIRAE、LUDEYA及Dr.May，另有MIRAE美容儀器。子公司新普利從事保健食品銷售及委外製造；阿原工作室提供青草手工皂與清潔保養用品。2026年6月底，軒郁持有新普利100%及阿原42.46%股權，並對阿原具有控制力。
