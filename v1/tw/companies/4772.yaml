summary_short: 製售半導體特殊氣體，並透過弘潔科技提供設備零件清洗與再生服務。
summary_long: 台特化製造與銷售半導體特殊氣體及精密化學材料，產品包括矽乙烷、矽丙烷與無水氟化氫。矽乙烷用於先進半導體介電矽化合物薄膜的氣相沉積製程。公司於2025年8月取得弘潔科技65.22%股權及控制力，透過該子公司提供高階設備零件清洗、檢測、表面精密加工與再生服務。2026年上半年合併收入中，半導體精密設備服務高於精密化學材料，因此目前業務同時涵蓋設備維護與材料供應。中美矽晶為其母公司；台積電於2019年將台特化列為特殊氣體技術合作的優良供應商。
