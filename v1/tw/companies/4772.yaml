summary_short: 透過弘潔科技提供半導體設備零件服務，並製造與代理電子級特殊氣體。
summary_long: 台特化合併業務包含半導體設備零件服務與電子級特殊氣體。2026年第二季營收中，子公司弘潔科技的清潔服務占42%，鍍膜及新品占19%，其他占4%；台特化特氣占36%。台特化自製矽乙烷、矽丙烷及無水氟化氫，另代理矽甲烷。矽乙烷用於化學氣相沉積製程，無水氟化氫用於晶圓薄膜蝕刻及設備清潔。弘潔科技提供設備零件清洗、表面精密加工與再生服務，自2025年8月起納入合併報表。
