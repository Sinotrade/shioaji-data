summary_short: 以餐旅服務及不動產租賃取得收入，原南科觸控制造業務已停產。
summary_long: 精金原有AMOLED觸控感測器製造業務，南科廠於2026年1月31日全面停止生產，相關部門已列為停業單位。目前持續經營不動產租賃，並透過白石等子公司經營餐旅服務。2026年上半年繼續營業收入以餐旅服務為主，另有租賃收入。公司對白石持股42.31%，雖未過半，仍因擁有三分之二董事席次及相對多數表決權而具控制能力，將其納入合併財務報告。
