summary_short: 以汽車售後市場散熱水箱為主，兼營冷卻零件與伺服器液冷散熱。
summary_long: 吉茂以汽車售後維修市場的散熱水箱為核心，產品包括鋁製與銅製水箱、機油冷卻器、中冷器及冷凝器。2025年合併營收中，水箱占80.30%、機油冷卻器占4.79%、半成品占5.77%，其他相關產品占9.14%。公司亦提供AI伺服器液冷散熱解決方案，並已開發電動車逆變器及電池散熱用水箱。主要子公司包括美國、墨西哥及南京公司，汽車散熱零組件仍為主要營收來源。
