summary_short: 以散熱模組、散熱片、熱管及均熱板為主，並提供伺服器液冷方案。
summary_long: 尼得科超眾從事電子資訊產品散熱零組件的設計與製造，主要產品包括散熱模組、散熱片、熱管與均熱板。2024年度散熱模組占營收75.24%，散熱片占18.42%，其他產品占6.34%。官網另列伺服器與機櫃液冷方案，涵蓋客製化冷板及分水器，並列有資料中心應用；2026年法說會亦展示AI伺服器CPU散熱方案。母公司Nidec Corporation於2026年8月持股86.30%；2024年度年報列有越南子公司，以及間接持有的昆山巨仲與重慶群祥。
