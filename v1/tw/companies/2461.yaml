summary_short: 以雷射全像膜、雷射紙、燙金箔與防偽標籤等包裝材料銷售為主。
summary_long: 光群雷射以雷射全像材料為主要營收來源，產品包括雷射紙、雷射膜、熱燙金箔與冷燙箔，以及雷射防偽標籤，應用涵蓋包裝、印刷、裝飾與防偽認證。2025年前三季，雷射全像材料占合併營收90%，光學膜及投影機占10%。在雷射全像產品營收內，雷射紙占38%、雷射膜占29%、熱燙金箔及冷燙箔占24%，防偽標籤及其他占9%；這些細項比例以全像業務為分母。集團另透過合併子公司群曜醫電從事消化道內視鏡研發與銷售。
