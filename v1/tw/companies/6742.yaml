summary_short: 以半導體光學鍍膜、精密光學玻璃加工及光學元件製造取得營收。
summary_long: 澤米以半導體光學鍍膜與精密光學元件製造取得營收，2025年占比分別為54.05%與43.73%，薄膜濾光片及光學鍍膜占2.22%。半導體光學鍍膜應用於車載電子及智慧穿戴裝置；精密光學業務提供玻璃研磨、拋光、光學低通濾波器及AR用LOE元件。公司另揭露供應CoWoS等先進封裝玻璃載板、光通訊基板及半導體設備石英耗材。越南澤有科技有限公司為間接持有的子公司，負責玻璃與石英切割、研磨及拋光。Sony與Nikon的OLPF訂單屬2022年報導揭露的歷史客戶關係。
