summary_short: 承接國內外財產與人身再保險，以國內財產再保險為主。
summary_long: 中央再保險承接國內外財產與人身再保險業務，以財產再保險為主要業務。2025年保費收入中，國內財產再保險占63.77%，國內人身再保險占18.85%，國外財產再保險占17.12%，國外人身再保險占0.26%。具名客戶包括富邦產險、國泰世紀產險、泰安產險、華南產險，以及富邦人壽、國泰人壽、南山人壽及新光人壽，往來內容涵蓋財產險與人身險再保服務。財報認列長榮國際為母公司，另揭露2025年完成出售文山區自用不動產。
