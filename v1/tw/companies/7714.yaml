summary_short: 以資安軟硬體加值銷售、授權保固及技術顧問服務取得收入。
summary_long: 創泓科技主要從事資安軟硬體加值銷售與資安顧問服務，收入來源包括產品銷售、授權保固及人力技術服務。2025年網路資訊安全硬體占營收36.90%，軟體占29.32%，授權保固占26.82%，人力技術服務占6.96%。除資安業務外，公司亦提供反無人機防禦方案的代理與整合，運用通訊特徵辨識與控制權接管技術，引導無人機安全降落。紘瑒科技為其全資子公司。
