summary_short: 以辦公事務設備銷售、租賃、耗材維修及文件與通訊整合服務取得收入。
summary_long: 互盛電以辦公設備銷售、租賃及售後服務為主要業務。2025年合併營收組成為辦公室自動化商品46%、租賃收入54%。商品與服務涵蓋A3數位影印機、A4單功能及多功能事務機、相關耗材與維修，並提供文件應用、資訊安全及管理流程優化建置。另有辦公室弱電工程、交換機、門禁、監視及視訊會議系統的規劃與施工服務。截至2026年3月底，持有從事事務機器買賣租賃的震旦開發100%股權，以及從事事務機器銷售、維修與租賃的互盛（中國）70%股權。
