summary_short: 經營醫療用品連鎖通路，銷售醫療照護、健康護理及生技保健商品。
summary_long: 杏一為醫護用品連鎖通路商，主要銷售醫療照護、健康護理及生技保健商品，並提供健康照護諮詢。依113年度年報，醫療照護占營收72.44%，生技保健占14.12%，健康護理占6.36%，其他占7.08%。集團除經營醫療用品通路，也承攬醫院醫療用品販賣部及醫院商場管理、規劃，並推出行動購APP與寄庫分批取等會員服務。旗下公司包括杏州醫藥、精實生技、寬德安，以及福建、上海的杏一醫療用品貿易公司。
