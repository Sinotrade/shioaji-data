summary_short: 設計、製造及銷售主機板、迷你電腦與筆記型電腦。
summary_long: 精英電腦以電腦產品的設計、製造與銷售為主要業務，產品涵蓋主機板、迷你電腦及筆記型電腦。2025年度年報揭露，電腦及其週邊產品占營收99.16%，其他業務占0.84%，該項分類未再拆分各類電腦的營收占比。公司官網另列工業主機板產品；2024年度年報亦載明智慧電動車充電樁的代工生產及交流充電樁量產出貨。2025年度年報並確認，Elitegroup Technology (Thailand) Co.,Ltd為公司子公司。
