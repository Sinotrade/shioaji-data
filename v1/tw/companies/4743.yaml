summary_short: 研發、製造與銷售傷口照護新藥及醫材，並進行新藥授權。
summary_long: 合一以生技新藥研發、藥品銷售及授權合作為主要業務；2024年報列生技新藥占營收96.85%，農業科技占3.15%。速必一用於糖尿病足部傷口潰瘍，另有急慢性傷口與疤痕照護醫材Bonvadis。FB825為過敏疾病抗體新藥，與LEO PHARMA合作研發及授權；SNS812則與中天上海共同開發。中國大陸業務由合一供貨中天上海，再由華潤雙鶴負責授權區域銷售，新加坡市場透過Apex Pharma Marketing經銷。合一於2024年取得中天健康事業51%股權，擴充保健食品營運。
