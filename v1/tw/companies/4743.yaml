summary_short: 以新藥研發與銷售為主，產品涵蓋傷口藥品、醫材及抗體與小核酸新藥。
summary_long: 合一的營收以新生物藥為主，2025年占64.05%，農業科技與其他業務分占7.24%及28.71%。主要產品包括治療糖尿病足部潰瘍的ON101乳膏，以及傷口照護醫材Bonvadis。研發管線涵蓋針對異位性皮膚炎與過敏性氣喘的抗體新藥FB825、抑制冠狀病毒複製的小核酸藥物SNS812，以及針對肥胖及過重合併代謝異常的SNS851。
