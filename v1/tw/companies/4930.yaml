summary_short: 以小家電研發、製造與銷售為主，兼營品牌代工經銷及咖啡烘焙。
summary_long: 燦星網通以家電產品研發、生產與銷售為核心，兼營品牌代理、經銷及代工。2025年度小家電商品占營收96.22%，非小家電商品占3.78%。產品包括咖啡機、煎烤器、電熨斗、掛燙機、衣物護理機、烤箱及氣炸鍋，另提供相關模具設計製造、材料加工與咖啡豆烘焙銷售。家電製造體系包括間接子公司廈門燦坤、漳州燦坤及PT. STAR COMGISTIC INDONESIA；直接子公司金鑛連鎖企業從事咖啡批發。
