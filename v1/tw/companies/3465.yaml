summary_short: 以OEM／ODM模式設計製造音響及揚聲器，主要營收來自音箱系統。
summary_long: 進泰電子以OEM／ODM模式提供音響產品，主要業務涵蓋音箱系統、牆壁式揚聲器及揚聲器零配件。2025年營收組成以音箱系統為主，占95.29%；牆壁式揚聲器占2.16%，其他產品占2.55%。音箱產品包括重低音箱、立式、書架式、中置及室外音箱與家庭劇院系統。集團旗下香港子公司負責揚聲器設計研發及買賣，越南子公司從事揚聲器生產，東莞蓁順從事貿易；另透過持股80%的Advanced Sound Technologes, Inc.間接持有東莞進泰。
