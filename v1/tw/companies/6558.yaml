summary_short: 以可充式鋰電池研發、設計與製造為主，營收以小方型電池為大宗。
summary_long: 興能高主要從事可充式鋰離子及鋰高分子電池的研發、設計與生產。2026年第一季產品型態比重以小方型電池87.4%為主，其次為中大型方形電池7%、圓柱型電池4.3%及其他1.3%。公司推出採用XNO鈮基材料的快充電池，並發展電池備援單元與客製化電池管理系統解決方案。官網亦列有無人機電池及半固態電池產品；AI伺服器BBU相關軟包電池模組於2025年公告時仍在開發階段。昆山興能能源科技有限公司為其重要子公司。
