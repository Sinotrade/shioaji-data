summary_short: 以工業應用為主的半導體與電子零組件代理商，提供選料及技術支援。
summary_long: 安馳科技為半導體與電子零組件代理商，以工業應用為業務主軸，並以業務團隊搭配現場應用工程師提供服務及用料建議。代理產品涵蓋類比與混合訊號積體電路、電源管理與感測元件、FPGA及自適應系統級方案，以及影音介面轉換晶片。公司亦引進MLSoC邊緣AI平台，提供相關硬軟體方案；5G通訊整合方案已有出貨，並拓展碳化矽元件於資料中心及伺服器電源供應器的應用。公司隸屬日本Macnica集團，駿日為持股過半的控股股東。
