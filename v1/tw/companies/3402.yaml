summary_short: 以製程管路工程為主，提供無塵室機電統包、特氣設備及廢氣處理設備。
summary_long: 漢科以高科技廠房的製程管路工程與系統整合服務為主要業務。2025年製程管路工程占營收79.74%，特殊氣體氣瓶櫃及廢氣處理機占11.95%，無塵室及機電統包占6.19%，濕製程設備、化學系統統包及其他占2.12%。服務涵蓋主系統與二次配管的規劃、設計、施工及測試，並提供氣瓶櫃與廠務監控、Local Scrubber及化學品供應設備。集團設有新加坡、美國、日本及德國子公司，上海營運公司則列為孫公司。
