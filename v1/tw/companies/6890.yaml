summary_short: 透過集團子公司製造及銷售運動鞋、休閒鞋與特殊功能鞋。
summary_long: 來億-KY透過集團子公司生產與銷售運動鞋、休閒鞋及特殊功能鞋，以鞋類製造為主要業務。運動鞋採冷貼製程，休閒鞋包含加硫鞋，產品亦涵蓋戶外及防水用途。依據2026年第三季法說資料，2026年上半年運動鞋與休閒鞋分別占營收92%及8%。集團由來億興業有限公司承接控股架構，並透過其全資持有的薩摩亞商旺隆發展有限公司從事進出口貿易；億春責任有限公司則為間接持有85%的製鞋子公司。
