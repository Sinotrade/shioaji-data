summary_short: 製造揚聲器鍛造、沖壓與塑膠零組件，另有汽車零件及越南證券業務。
summary_long: 錩新以揚聲器鍛造、沖壓零組件為主要製造業務，產品涵蓋導磁極、導磁環、導磁座及鋁音錐，另提供磁氣迴路組裝及汽車冷鍛零件。2024年合併營收以精密金屬加工為主，占66.80%，塑膠射出成型占8.29%，金融證券事業占24.90%。塑膠射出業務由旗下富川精密工業發展，官網載明其為百分之百持股子公司；另透過越南子公司富鑫證券經營證券業務。2026年公司已開始出貨AI機櫃、機架零組件。
