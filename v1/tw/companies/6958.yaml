summary_short: 以車輛分期、設備融資租賃及長期租車取得租金與利息收入。
summary_long: 日盛台駿以車輛分期及企業融資為核心，提供設備融資租賃、長期租賃車、應收帳款受讓及太陽能電廠設備融資服務。車輛分期涵蓋重車、遊覽車、小貨車與小客車；集團亦透過子公司日盛全台通提供車輛租賃服務。2025年合併營收以租賃收入占37.59%最多，其次為融資租賃利息收入22.63%及分期付款銷貨利息收入19.28%。旗下另有日盛全能源、日盛台駿全實業，以及中國大陸與泰國的租賃子公司。
