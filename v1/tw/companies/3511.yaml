summary_short: 研發、製造及銷售連接器、線材與電子模組，以車用、工業及醫療應用為主。
summary_long: 矽瑪主要研發、製造及銷售電子連接器、線材與電子模組，並提供線束組裝服務。2025年營收以車用、工業及醫療產品為主，占82.50%；消費及商用產品占9.50%，穿戴式產品占7.85%，其他占0.15%。公司亦布局AI伺服器用連接器、線材與模組，官網另列無人機與機器人專用線材及客製線束。2025年底持有同星科技59.35%股權，並直接及透過子公司合計持有矽瑪企業全部股權，深圳生產公司則為間接持有的子公司。
