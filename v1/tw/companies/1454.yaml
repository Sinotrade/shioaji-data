summary_short: 生產銷售聚酯長纖布料、機能布料及加工絲。
summary_long: 台富提供聚酯長纖布料，產品包括 ELASLANA 毛彈布料，並供應常規與環保聚酯加工絲。環保加工絲使用環保聚酯原料，產品應用涵蓋運動休閒服、時尚服飾、運動針織及制服工作服。布料方面，公司提供提花布料，可依需求繪製花樣並接單織造，透過經緯紗形成不同花紋、顏色與材質變化。另外供應高彈力布，使用 Spandex 等彈性纖維，產品訴求包括貼身舒適、易保養，以及伸展與彈性回復性能。
