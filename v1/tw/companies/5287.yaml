summary_short: 營運房屋、汽車、人力及虛寶等網路平台，收取刊登費與成交手續費。
summary_long: 數字科技營運生活服務網路平台，以刊登費及交易手續費等方式取得收入。591房屋交易網提供房屋租售資訊與刊登服務；8891汽車交易網提供中古車銷售資訊平台，兩者主要收入均為刊登費。518熊班提供求職與徵才服務並收取徵才刊登費；8591寶物交易網提供遊戲帳號、道具等交易服務，向賣方收取成交手續費；100室內設計提供設計案例資訊。2025年網路服務收入占85.08%，網路平台佣金收入占14.92%。
