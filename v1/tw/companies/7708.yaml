summary_short: 經營大戶屋、bb.q CHICKEN及IKIGAI燒肉，以餐食銷售取得營收。
summary_long: 全家國際餐飲經營連鎖餐飲，旗下有大戶屋、bb.q CHICKEN及IKIGAI燒肉三個品牌。大戶屋提供日本定食料理，bb.q CHICKEN提供韓式炸雞及韓式料理，IKIGAI則提供個人燒肉定食。品牌經營型式包含代理及自創，其中IKIGAI為自創品牌。依公司法說會揭露，2025年大戶屋占營收76%，bb.q CHICKEN占12%，IKIGAI占11%，其他占1%，以大戶屋為最大營收來源。全家便利商店股份有限公司為其母公司。
