summary_short: 研發製造軟板用純膠、銅箔基材、保護膠片及功能性聚醯亞胺材料。
summary_long: 律勝研發與製造軟性電路板用材料，產品包括純膠、軟性銅箔基材及保護膠片。2024年個體財報以純膠營收最高，軟板基材及保護膠片次之，另列原料及在製品與其他收入。公司亦提供耐彎折透明聚醯亞胺薄膜，應用於捲曲式顯示器與可撓式電子產品；負型感光聚醯亞胺材料則用於先進封裝重配線層。5G高速FPC產品為低介電常數、低介電損失的高頻純膠，可接合銅箔基材與絕緣膜材。
