summary_short: 以再生能源電力購售及轉供為主要收入，另提供憑證管理與碳管理服務。
summary_long: 天能綠電主要從事再生能源售電，依企業用電需求提供採購規劃、電力轉供及憑證移轉申請，並進行用電匹配優化分析。2025年度售電業務占營收99.66%，勞務業務占0.34%，收入集中於電力購售服務。除綠電交易外，公司亦提供再生能源憑證申請及管理、碳盤查與減量計畫等服務，官網另設碳權交易平台，提供碳權媒合及諮詢。天能綠電為雲豹能源科技股份有限公司旗下售電子公司，並持有台灣碳資產電業股份有限公司全部股權。
