summary_short: 以多功能事務機及模組設計製造為主，另提供工業列印與3D列印技術。
summary_long: 東友以多功能數位影印機、雷射傳真機及數位複合機模組為主要業務。2024年數位複合機占營業比重74.70%，模組占7.46%，其他產品占17.84%。模組產品包括自動送稿器、傳真套件、掃描單元、控制器及操作面板，其他產品涵蓋自動護貝機、彩色工業標籤機與切割繪圖機。公司亦開發TIS 3DP技術，導入無人機產品概念驗證，並完成無人機地面站軟體開發及資安認證。東友透過投資子公司間接持有東友數碼科技（東莞）有限公司，由該子公司研發、生產及銷售多功能事務機相關產品。
