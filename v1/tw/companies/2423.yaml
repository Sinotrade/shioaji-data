summary_short: 以電源、電子負載、示波器等電子測試與量測儀器銷售為主要業務。
summary_long: 固緯以電子測試及量測儀器為主要業務，產品包括電源與電子負載、示波器、頻譜分析儀、訊號產生器及安規測試儀。2026年上半年，電源產品占營收50%，量測產品占19%。其示波器包含數位儲存機種，電源產品包含雙向直流電源，電子負載可用於伺服器電源測試；訊號產生器涵蓋函數與射頻產品，安規儀器提供絕緣耐壓測試。集團旗下包括直接子公司TEXIO TECHNOLOGY CORP.及間接子公司固緯電子(蘇州)有限公司。
