summary_short: 提供半導體IC封裝與測試，以先進基板及導線架型封測服務為主要營收來源。
summary_long: 典範主要提供半導體IC封裝與測試服務。2025年營收中，先進基板或導線架型積體封裝及測試占65.23%，傳統導線架型封裝及測試占31.30%，其他占3.47%。產品涵蓋TSOP、SOP、TQFP、QFN／DFN、LGA與記憶卡封裝，亦提供MEMS感測晶片封裝及晶片加工服務，後者包括晶圓減薄、切割、光學檢測與晶粒挑選。公司揭露封測產品用於無人機及低軌衛星裝置，並持續發展氮化鎵電源晶片模組封裝與測試。
