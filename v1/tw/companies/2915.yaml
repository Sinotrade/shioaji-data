summary_short: 經營量販、紡織貿易與品牌零售，並從事營建及轉投資業務。
summary_long: 潤泰全經營量販、紡織貿易、零售成衣、營建及投資業務。2025年量販占營收40.85%，為最大來源，紡織貿易與零售成衣分別占24.01%及19.26%，營建與投資收入則占4.45%及11.43%。量販業務由中和分公司營運大全聯中和店；布料產品包括牛津布、法蘭絨與防火布，另承接成衣及團體制服業務。零售事業代理Nautica、Jeep及Whittard等品牌。2025年公告以新台幣10.6億元出售觀音廠土地及廠房予群光電子，並參與潤成投控現金增資；子公司Full Shine另公告投資私募基金。
