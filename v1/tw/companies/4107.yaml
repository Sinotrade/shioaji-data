summary_short: 研發、製造及銷售 TPU 導管、血液迴路管與藥用軟袋等醫療耗材。
summary_long: 邦特以醫療耗材的研發與製造為主要業務，產品涵蓋 TPU 體內導管、血液迴路管、藥用軟袋、外科管與血管導管。2025 年營收中，TPU 導管占33.06%，血液迴路管占19.85%，藥用軟袋占19.07%；其餘來自外科管、穿刺針、血管導管、關鍵零組件及其他醫療耗材。菲律賓邦特為其全資子公司，從事醫療器材製造及買賣；另透過該子公司全資持有 BONTEQ 公司，經營醫療器材買賣。
