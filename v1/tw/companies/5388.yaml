summary_short: 研發、製造與銷售電信寬頻設備，以寬頻終端設備為主要營收來源。
summary_long: 中磊提供電信寬頻設備，產品包含FTTx、Cable DOCSIS、小型基地台與智慧物聯方案。2025年營收以寬頻終端設備為主，占55.92%；商用網通設備占20.88%，網路基礎建設及物聯網占19.31%。具名設備供應關係可由T-Mobile、Verizon、Comcast及樂天行動的官方產品文件確認。晶片供應商包含Qualcomm與聯發科，另與Broadcom及Harmonic合作開發設備。旗下子公司包括菲律賓、印度及墨西哥公司，2024年與2026年分別公告印度及墨西哥子公司增資。
