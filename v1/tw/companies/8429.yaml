summary_short: 經營休閒鞋與自有品牌鞋服，收入以集團品牌業務為主。
summary_long: 金麗-KY經營休閒鞋及品牌鞋服，2024年休閒鞋占產品營收100%；2025年前三季集團旗下品牌占營收100%，代工占比為零。公司品牌產品包含時尚休閒與牛仔服飾，法說會揭露零售價格定位為人民幣150至500元，目標客群為18至35歲消費者。集團架構包括百慕達金麗控股公司，以及金蘋果（中國）、長泰金蘋果實業、愛奇（福建）鞋塑等子公司；另有領先國際生物科技，於法說會中列為美妝品營運公司。
