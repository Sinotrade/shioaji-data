summary_short: 以運動鞋與休閒鞋代工製造為主要收入來源。
summary_long: 志強-KY集團以鞋類代工製造為主要業務，產品涵蓋足球鞋、美式足球鞋、棒球鞋，以及供慢跑、健行與一般休閒使用的鞋類，屬鞋業中游製造商。2025年度運動鞋占營收80.59%，為最大收入來源；休閒鞋占18.10%，其他產品占1.31%。集團的子公司架構包括直接持有的薩摩亞志強，以及間接持有的越南志雄、志寧與柬埔寨Can Sports Shoes等公司。
