summary_short: 以太陽能電廠EPC統包工程為主，另提供維運、儲能與能源管理系統。
summary_long: 聚恆科技以太陽能電廠EPC統包工程為主要業務，提供屋頂型與地面型電廠的規劃、設計、採購及施工。2025年EPC系統工程占營收95.75%，其他業務占4.25%。公司亦提供太陽能電廠維運、表前與表後儲能系統整合，以及HHR液冷儲能電池櫃，並自行開發H-ELink聚能網能源管理系統，整合光電、儲能與用電調度。旗下聚恆動能經營HiEV電動車快充服務，另有子公司鮮豐生物科技。
