summary_short: 提供製程設備自動操控、數據採集與AI監控等智慧工廠軟硬體整合方案。
summary_long: 竹陞科技以高科技製程設備的智能自動化與軟硬體整合方案為主要業務，提供遠程操控、製程資料採集及機器感官監控。2025年智能自動操作系統占營收36.46%，製程數據採集系統占31.42%，GoVision智能化產品占31.98%，其他占0.14%。產品包含iRPA自動操控、Gobot邊緣運算智能系統，以及智慧機器人代操系統，分別對應設備操作、運算與工廠自動化需求。官網另列G2 Technology Corp.為北美子公司。
