summary_short: 提供製造設備智能操控、製程數據採集與AI感官監控系統。
summary_long: 竹陞科技提供製造設備軟硬體整合方案，產品涵蓋Gobot邊緣運算、iRPA遠程自動操控、IoT製程數據採集與GoVision感官監控。2025年智能自動操作系統占營收36.46%，GoVision占31.98%，製程數據採集占31.42%。具名報導確認台積電與美光的客戶關係，公司另代理Sensirion液態感測器。海外布局包含持股50%的美國G2合資企業，合肥原全資子公司已完成清算。近年公告交易包括向竹駿科技購買廠房與承租廠辦，以及向龍遠建設購買台南土地。
