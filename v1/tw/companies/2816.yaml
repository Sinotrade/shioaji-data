summary_short: 承作汽車、火災、健康傷害、工程及貨物運輸等產物保險。
summary_long: 旺旺保經營產物保險，提供汽車、商業火災、健康傷害、工程及貨物運輸等保險商品。汽車險涵蓋強制責任、車體損失、竊盜損失與第三人責任；商業火險服務公司行號及工廠，提供火災等財產損失保障。健康傷害商品包含個人、團體與微型傷害保險，以及個人健康保險。工程險包括營造、安裝工程、營建機具、鍋爐、機械及電子設備綜合保險。貨物運輸險則提供貨物運送途中遭遇意外事故所致毀損、滅失及相關費用的保障。
