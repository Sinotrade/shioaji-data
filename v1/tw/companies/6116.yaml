summary_short: 研發、製造及銷售TFT-LCD面板與觸控產品，以中小尺寸顯示應用為主。
summary_long: 彩晶從事TFT-LCD及觸控面板的研發、設計、製造、銷售與維修。2026年第二季產品組合中，6.06至10.4吋中尺寸平板相關產品占銷售額57%，6吋以下手機面板占28%，11吋以上面板占15%。公司提供On Cell／In Cell觸控方案，以及具光學全貼合、防窺與異形切割技術的車用顯示產品；工控產品則涵蓋寬溫、強固顯示及客製化貼合。2026年4月董事會決議以約新台幣43.2億元向矽品出售南科廠房及附屬設施，7月另公告新加坡設立公司投資案的資本額上限為新台幣15億元，須待設立條件成就後完成投資。
