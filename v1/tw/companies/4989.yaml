summary_short: 製造及銷售電解銅箔，供應印刷電路板與銅箔基板材料。
summary_long: 榮科以電解銅箔為主要業務，供應印刷電路板及銅箔基板所需材料，位於印刷電路板產業鏈上游。產品包含 PK-HTE-LP3、反轉銅箔及高頻高速銅箔；反轉銅箔透過亮面處理降低壓合面的粗糙度，HVLP／VLP 產品則用於 5G 通訊、AI 伺服器與高頻網通設備。2026 年第一季財報以銅箔單一產品說明營運，未分別揭露各等級產品的營收占比。公司另全資持有從事投資業務的子公司 LCYT Holdings Corp.。
