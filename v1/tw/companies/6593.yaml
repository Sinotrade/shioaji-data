summary_short: 主要製造金融與智慧卡片，提供卡片個人化服務及銘板產品。
summary_long: 台灣銘板主要業務為卡片製造、卡片個人化服務及銘板產品。2025年11月法說簡報列示的2025年第三季業務營收占比，卡片為58%、卡片個人化為17%、銘板為25%。卡片產品包括信用卡、金融卡與票證卡，個人化服務涵蓋晶片錄寫、磁條錄碼及卡面打印。銘板事業部產品包括各式銘板與薄膜按鍵開關。公司亦發展FortVax冷錢包卡，以及整合客製化簽帳卡、U卡與冷錢包簽帳卡的CaaS服務。
