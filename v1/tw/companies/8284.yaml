summary_short: 以企業簡訊發送及金融看盤交易系統服務為主要收入來源。
summary_long: 三竹資訊以簡訊發送與金融看盤服務為主要營收來源，2026年上半年營收占比分別為73.15%與24.94%。企業簡訊提供API串接，支援驗證、警示及帳務通知；金融看盤產品涵蓋行動交易與電腦看盤，電腦版整合即時報價及技術分析功能。公司另提供客製化App與Web系統開發及維護，以及CoLine企業通訊平台，支援私有雲或公有雲部署。官網沿革記載，新華財經與簡訊王於2024年成為其子公司。
