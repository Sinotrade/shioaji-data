summary_short: 以低、中、高壓MOSFET等功率半導體元件的設計與銷售為主要業務。
summary_long: 富鼎先進電子以功率半導體元件的研發、設計與銷售為主要業務，產品包括低、中、高壓MOSFET、IGBT及電源管理IC。2025年低壓、中壓與高壓MOSFET營收占比分別為49.07%、32.03%與16.06%，其他產品占2.84%。公司亦開發碳化矽MOSFET與氮化鎵HEMT；年報記載氮化鎵650V／700V系列已完成開發，正進行可靠度驗證，碳化矽產品則持續優化。另開發供AI伺服器散熱風扇及水冷系統水泵使用的MOSFET。
