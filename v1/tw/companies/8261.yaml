summary_short: 以高、中、低壓MOSFET設計及銷售為主要收入，另開發IGBT與第三代功率半導體。
summary_long: 富鼎從事功率半導體設計與銷售，核心產品為高、中、低壓MOSFET，亦提供IGBT。2025年低壓、中壓及高壓MOSFET分別占營收49.07%、32.03%及16.06%，其他產品占2.84%。公司開發碳化矽MOSFET與氮化鎵元件，其中氮化鎵650V／700V系列已完成產品開發並進行可靠度驗證，另完成AI伺服器用Oring FET產品驗證。公司與鴻海、國巨在產品設計、製程優化及銷售通路合作，2025年亦揭露對國巨銷貨及向鴻揚半導體進貨。海外布局包括2025年10月新設的日本全資子公司富鼎先進電子株式會社。
