summary_short: 主要銷售微動開關與交換式電源供應器，微動開關為最大營收來源。
summary_long: 新巨主要收入來自微動開關與交換式電源供應器，並以ZIPPY及EMACS自有品牌行銷全球。2025年微動開關占營收53.12%，交換式電源供應器占46.88%，以前者為最大收入來源。開關產品涵蓋微動開關與操作型按鈕開關，電源產品包括CRPS模組及備援式機種。公司官網列有AI伺服器電源應用，並說明導入GaN與SiC打造鈦金級伺服器電源。集團另有美國、歐洲及中國子公司，銓發股份有限公司亦列入合併子公司。
