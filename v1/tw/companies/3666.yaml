summary_short: 研發、製造及銷售液晶顯示器背光模組用光學膜，以中尺寸產品為主要營收來源。
summary_long: 光耀科技從事光學膜的研究、設計、開發、製造及銷售，稜鏡片主要應用於液晶顯示器背光模組。產品包括標準及高輝度增益稜鏡片、整合型擴散稜鏡片、多功能複合型稜鏡片、微結構光學擴散片與集光型逆稜鏡片。2025年營收組成以中尺寸產品為主，占91.66%，小尺寸占7.98%，其他占0.36%。公司持有全資子公司BRIGHT TRIUMPH LIMITED；其間接持有的寧波光耀已公告全數處分決議，交割完成狀態尚待確認。
