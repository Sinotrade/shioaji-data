summary_short: 以自有品牌及代工業務銷售交換式電源供應器。
summary_long: 海韻電主要從事交換式電源供應器的研發、設計、製造與銷售，經營自有品牌及客製貼牌代工。2025年電源供應器占營收99.66%，其他業務占0.34%。產品包含個人電腦電源、工業電腦用Flex12V及1U／2U電源，另有MagFlow磁吸串接風扇。公司於2025年6月法說會表示，已開發2200W電源，當時正開發2800至3200W電源，投入AI伺服器與工作站市場。主要海外子公司包括美國Seasonic Electronics及荷蘭Sea Sonic Europe；東莞海韻為間接持有的製造子公司。
