summary_short: 以衛生瓷器、給水銅器、馬桶蓋及廚房住宅設備製造銷售為主。
summary_long: 和成主要製造及銷售衛生瓷器、給水銅器、馬桶蓋、精密陶瓷與廚房用具。2025年度營收以衛生瓷器為最大項目，占36%，給水銅器占23.7%，馬桶蓋占12.54%，精陶占2.09%，其他占25.67%。子公司寶隆室內工藝經營瓷器、陶板與瓷磚，和旺友比從事整體衛浴產品銷售及工程設計、監造與施工；海外間接子公司和成中國與菲律賓和成則生產及銷售給水潔具。
