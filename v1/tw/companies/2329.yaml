summary_short: 以記憶體與邏輯晶片封裝測試、伺服器及儲存產品電子製造服務賺取收入。
summary_long: 華泰電子以半導體封裝測試及電子製造服務為主要業務。2025年封裝及測試占營收58.66%，電子產品製造占40.53%，其他收入占0.81%。封裝服務涵蓋記憶體及邏輯產品，並提供晶圓、記憶體與積體電路測試。電子製造服務包括電路板組裝、系統組裝與測試，製造項目涵蓋伺服器主機板、固態硬碟及隨身碟，亦承作AI伺服器相關業務。直接子公司包括樺誠投資，蘇州華禕科技則為間接子公司。
