summary_short: 以IC封裝測試為主，另提供伺服器板卡與儲存產品電子代工。
summary_long: 華泰電子以積體電路封裝測試及電子製造服務為主要業務，2025年兩者營收占比分別為58.66%與40.53%。封測服務包含晶圓測試及NAND／嵌入式快閃記憶體測試，應用涵蓋消費性電子等領域。電子製造服務承接伺服器主機板、周邊卡及SSD製造，也提供AI伺服器主機板與板卡的PCBA、SMT代工。2024年具名媒體報導的封測客戶包括金士頓、群聯及江波龍電子，伺服器業務客戶包括美超微。近三年公告事件包括新廠工程發包、生產設備採購及廠務工程取得。
