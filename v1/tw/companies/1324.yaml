summary_short: 研發、製造與銷售包裝、絕緣、遮蔽及雙面固定用途膠帶。
summary_long: 地球以各式膠帶的研發、製造與銷售為主，產品涵蓋包裝、電氣絕緣、遮蔽與雙面固定用途。OPP標準包裝膠帶採水性壓克力膠塗佈於聚丙烯薄膜，可用於封箱與捆紮。PVC絕緣膠帶供電工作業使用，免刀布紋膠帶則可手撕，應用於塗裝遮蔽、封箱與捆紮。另有皺紋紙遮蔽膠帶及以紙、泡棉等為基材的雙面膠帶。財報將膠帶製造加工及買賣列為單一應報導部門。
