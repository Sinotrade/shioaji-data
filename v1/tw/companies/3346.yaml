summary_short: 以LED車燈模組、車燈控制器及LED晶粒元件銷售為主要業務。
summary_long: 麗清提供LED車燈模組OEM／ODM服務，產品應用涵蓋尾燈、煞車燈、霧燈、轉向燈及日間行車燈。2025年營收中，LED車燈模組占64.44%，車燈控制器占34.31%，LED晶粒及元件占0.32%，其他占0.93%。智能頭燈控制器可自動調節前照燈亮度、模式與方向，公司亦針對新能源車低能耗需求開發照明系統。集團的上海及東莞子公司從事車用照明研發、製造與銷售，美國子公司負責相關產品銷售，墨西哥子公司則從事製造與銷售。
