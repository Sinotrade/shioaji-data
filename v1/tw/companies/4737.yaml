summary_short: 研發製造血糖檢測試片、血糖機及連續葡萄糖監測系統，以試片為主要營收來源。
summary_long: 華廣專注血糖管理系統的研發、設計、製造與行銷，產品供個人居家及專業醫療使用。2025年營收組成為血糖檢測試片61%、血糖檢測儀12%、其他27%，收入以檢測耗材為主。公司以瑞特RIGHTEST為自有品牌，產品包括血糖機、安活連續葡萄糖監測系統，以及結合GM700 Pro 2的醫療用血糖管理系統，並提供雲端血糖管理功能。海外子公司涵蓋美國、瑞士、澳洲及馬來西亞；中國深圳與平潭公司則透過集團持股架構間接控制。
