summary_short: 經營藥品、保健食品與醫療器材通路，並布局健檢事業。
summary_long: 慕康生醫經營生技醫療產品通路，引進藥品、醫療器材與保健食品，服務領域包括婦產科與小兒科。產品包括女性私密處保養用的淨洛美MixCare，以及自日本引進的芙樂貼剖腹產傷口照護敷料。淨洛美官網標示由慕康生技醫藥製造，透過指定專業醫療院所販售。公司另於2021年成立健檢事業處。2026年6月的官網公告確認育新企業與聯崴生技為其子公司。
