summary_short: 以天線、高頻線材及無線通訊次系統的設計製造與整合服務取得營收。
summary_long: 榮昌科技以無線通訊零組件與次系統的整合設計、製造服務為主要業務，產品涵蓋天線與天線系統、高頻線材與智能感測線材，以及次系統與無線準系統。依2024年度年報，前三類營收占比分別為39%、27%及28%，另有6%來自NRE。產品應用包括車用線組、戶外智慧電錶、交通天線及工業級天線。公司另已推出通過日本TELEC認證的NPI ANT03系列5G全向天線，具防水特性。
