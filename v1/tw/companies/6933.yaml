summary_short: 集團以AI高效能運算伺服器、液冷整機櫃及儲存系統解決方案取得營收。
summary_long: 艾瑪斯科技控股集團提供企業級人工智慧與高效能運算解決方案，業務涵蓋伺服器、儲存設備及液冷整機櫃的設計、製造與系統整合。2025年人工智慧高效能運算解決方案占營收58.89%，液冷整機櫃占30.28%，高密度伺服器與儲存方案占6.75%，其他占4.08%。集團位於伺服器產業中游，依需求整合運算、儲存與散熱設備。產品包含空冷及液冷GPU機櫃，並提供資料中心的機櫃、電力、流體分配與熱交換設備整合。主要營運子公司包括美國AMAX Engineering Corporation及蘇州超集信息科技有限公司。
