summary_short: 透過營運子公司提供客製化AI伺服器、液冷機櫃與儲存系統。
summary_long: AMAX-KY透過旗下營運子公司，提供人工智慧與高效能運算、液冷整機櫃，以及高密度伺服器與儲存解決方案。2025年三項業務營收占比分別為58.89%、30.28%及6.75%，其他業務占4.08%。集團業務涵蓋代工生產與系統整合，官方列出的上游通路商包括Ingram Micro及Synnex。美國營運子公司為NVIDIA DGX菁英合作夥伴，提供相關系統部署服務；2023年具名報導亦確認集團為ASML提供伺服器液冷解決方案。2026年美國子公司啟用HostMax，將服務延伸至短期託管與部署。
