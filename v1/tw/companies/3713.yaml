summary_short: 以太陽能電廠售電為主要收入，另經營系統工程、模組銷售與維運。
summary_long: 新晶投控以太陽能相關業務為核心，集團投資太陽能電廠並經營售電，同時提供太陽能發電系統的規劃、設計及安裝服務。2025年度售電收入占合併營收52.31%，為最大收入來源。集團另銷售各型太陽能面板模組，並以自有監控系統與維運團隊監控發電量及處理電廠異常。綠電業務涵蓋整合自有電廠發電資源與外部綠電供應，轉供國內企業。新晶投控持有頂晶科技100%股權，上述營運服務以集團口徑呈現。
