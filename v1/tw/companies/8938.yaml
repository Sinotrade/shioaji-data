summary_short: 以高爾夫球具及高爾夫球代工為主，並製造複合材料與相關零組件。
summary_long: 明安以高爾夫球具代工為核心，產品包括木桿頭、鐵頭、推桿與碳纖維球桿。2025年度主要產品營業比重為球具74.12%、高爾夫球16.11%、複合產品9.77%。集團高爾夫球業務包含子公司明揚國際。複材業務提供碳纖維預浸材、Tailorpreg®熱塑性材料、機器人手臂配件及碳纖維汽車輪圈；精鑄業務涵蓋航太內裝、自行車與工業五金零件。製造子公司另有越南明安及間接持有的東莞明安。
