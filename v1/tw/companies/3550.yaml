summary_short: 研發、製造及銷售訊號傳輸線材、線組與塑膠粒。
summary_long: 聯穎以訊號傳輸線材及線組的研發、製造與銷售為主，2025年該類產品占合併營收63.97%，塑膠粒占16.20%，其他產品占19.83%。主要產品包括HDMI、USB線材及主動式光纜AOC，後者供資料中心與高效能運算連接使用。工業產品涵蓋耐扭曲多關節機器人與水下機器人專用電纜；新能源電纜涵蓋太陽能、電動車充電、風力及儲能設備用線。
