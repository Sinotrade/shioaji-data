summary_short: 以感測半導體元件為主要收入，另銷售LED、系統與功率產品。
summary_long: 台亞製造感測與發射元件，感測產品包括光電二極體、光電晶體及光閘流體，應用於穿戴、工業、汽車與家電。2025年感測元件占合併營收58.90%，其次為系統產品20.18%及發光元件14.07%。發射產品包含彩光與紅外線LED，以及VCSEL。旗下冠亞發展氮化鎵功率元件，間接子公司積亞發展碳化矽功率元件，星亞則從事顯示系統。台亞亦開發磷化銦高速光通訊收發元件，截至2026年10月接收端已有小量出貨，發射端仍在開發與驗證。億光年報將台亞列為晶片進貨來源；台亞另與日亞化學合作開拓市場。
