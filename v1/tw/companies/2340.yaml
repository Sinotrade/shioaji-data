summary_short: 以光感測與發射元件晶粒製造為主，另有顯示系統及子公司功率半導體業務。
summary_long: 台亞從事光電半導體感測與發射元件的設計及晶粒製造，感測產品包括光電二極體、光電晶體與雙向光閘流體，發射產品涵蓋彩光、紅外線LED與VCSEL。2025年感測元件占營收58.90%，系統產品占20.18%，發光元件占14.07%，另有功率產品及其他收入。集團透過子公司積亞發展SiC功率元件，透過冠亞發展GaN功率元件，星亞視覺則經營數位顯示與視覺燈光系統。台亞亦研發HUSD健康感測平台，整合光學晶片、感測模組與演算法。
