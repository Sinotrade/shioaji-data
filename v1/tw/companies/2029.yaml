summary_short: 製造、加工及銷售鍍鋅、鍍鋁鋅與烤漆鋼捲，營收以烤漆及鍍鋅鋼捲為主。
summary_long: 盛餘以鋼捲製造、加工及銷售為主要業務，產品涵蓋鍍鋅、鍍55%鋁鋅、烤漆及冷軋鋼捲。2025年營業比重以烤漆鋼捲49.88%及鍍鋅鋼捲47.84%為主，原料鋼捲及其他占2.28%，冷軋鋼捲為0%。鍍製鋼品用於建築與家電等領域，另提供不銹鋼PVDF烤漆鋼捲及AZ300太陽能支架產品。母公司為YODOKO, Ltd.，子公司包括澱鋼國際與Sheng-Shing Worldwide Corp.，並透過後者持有東莞盛餘貿易。
