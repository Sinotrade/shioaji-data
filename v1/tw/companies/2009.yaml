summary_short: 製造與銷售銅及銅合金片材，供電子、半導體、汽車與散熱用途。
summary_long: 第一銅以銅與銅合金片材的製造、加工及銷售為主，產品包括紅銅、黃銅、磷青銅、高性能銅片與環保鍍錫銅片。2025年營業比重為高性能銅片24%、紅銅片23%、鍍錫銅片18%、黃銅片5%，其他占30%。紅銅可用於均熱片及車用電池組，磷青銅用於電子連接器，半導體銅鐵合金材料可用於引線架。公司另揭露持續供應AI伺服器所需高導電、高散熱材料，以及汽車與電動車用鍍錫銅合金材料。華榮電線電纜為其最終母公司。
