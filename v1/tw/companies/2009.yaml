summary_short: 製造及銷售銅與銅合金片材，供半導體、汽車端子、連接器及散熱用途。
summary_long: 第一銅製造及銷售銅與銅合金片材，產品涵蓋紅銅、黃銅、磷青銅、半導體用銅合金與環保鍍錫銅片。2025年營業比重為高性能銅片24%、紅銅片23%、鍍錫銅片18%、黃銅片5%，其他合計30%。半導體材料可用於引線架，端子材料可用於汽車端子及連接器，紅銅則可用作均熱片材料。公司揭露供應AI伺服器所需高導電、高散熱材料，以及汽車和電動車用銅合金鍍錫材料。華榮電線電纜為其最終母公司。
