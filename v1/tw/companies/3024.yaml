summary_short: 經營廠辦開發與倉儲租賃、車用電子，以及歌林家電品牌與售後服務。
summary_long: 憶聲集團經營資產活化、車用電子及品牌與服務三大事業。2025年資產活化占合併營收50.52%，車用電子占27.39%，品牌經營及服務占22.09%。資產業務由華憶建設推動中壢廠辦開發，上海馬新憶提供物流倉儲租賃。車用事業整合台灣、馬來西亞與深圳據點，研發製造車載智慧影音控制及ADAS相關產品。家電事業經營歌林品牌與商品授權，品項包括視聽家電、冰箱、洗衣機、冷氣及生活健康小家電；瑞林科技提供家電售後服務與排水器銷售。
