summary_short: 提供客製化ASIC設計、晶圓量產統合服務及高速介面矽智財。
summary_long: 創意電子提供客製化ASIC委託設計、量產統合服務與高速介面矽智財，設計模式包括Spec-in及Netlist-in，量產服務涵蓋封裝、測試與供應鏈管理。2025年晶圓產品占營收75.38%，NRE占23.53%，其他占1.09%。台積電及台積北美供應晶圓產品，財報另列Advanced Semiconductor Engineering, Inc.等供應商。公司提供CoWoS中介層設計，HBM4E IP已獲客戶AI ASIC採用，並與VSORA、Lightmatter、Ayar Labs及Wiwynn合作開發AI晶片與光互連整合方案。2024年向康華工業購入不動產供資料中心使用，合約總價4.2億元。
