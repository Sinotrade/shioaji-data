summary_short: 研發製造穿戴配件、筆電與顯示器樞紐，並提供MIM精密金屬零件。
summary_long: 新日興主要製造樞紐與精密金屬零組件；2026年1至7月，公司揭露穿戴及配件製品營收占比40%、筆電樞紐27%、LCD樞紐19%、3C樞紐6%、MIM產品3%。MIM為結合粉末冶金與射出成型的製程，公司亦開發AI伺服器水冷接頭、分歧管及UQD接頭。2025年年報將廣達、仁寶及鴻海列為主要客戶，另有公開資料確認蘋果供應關係。近三年公告包括增資海外及投資子公司、蘇州子公司委建廠房，以及向遠雄購買北投房地；與富士康工業互聯網新設合營企業案於2026年3月獲主管機關無條件批准。
