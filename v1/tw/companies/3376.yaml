summary_short: 研發、製造及銷售電子產品樞紐、MIM製件與精密金屬零組件。
summary_long: 新日興主要從事筆記型電腦、液晶顯示器、手機與其他3C電子產品樞紐的研發、製造及銷售。公司亦提供金屬射出成型製件，結合粉末冶金與射出成型技術，製造精密金屬零件。其他產品包括車銑製件與精密彈簧，應用涵蓋自行車、電子產品、醫療器材及機械設備。官網另列有AI伺服器精密機構件與液冷零組件，包含分歧管及UQD接頭，屬零組件製造環節。新日興於2026年8月的官方公告中，將定盈投資股份有限公司列為重要子公司。
