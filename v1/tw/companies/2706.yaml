summary_short: 以商業大樓及商場出租為主要收入，另經營旅館住宿、餐飲與會議場所。
summary_long: 第一店經營觀光旅館與商業大樓出租，主要服務包括商場出租、客房住宿、餐飲，以及社交與會議場所。2025年度營業收入為新臺幣3億7,691.5萬元，其中租賃收入2億9,044.8萬元、占77%，為最大營收來源；客房收入5,125.2萬元、占14%，餐飲收入3,323.4萬元、占9%。依最大營收來源歸類為商用不動產與資產管理，旅館住宿、餐飲與場地服務則為其餘主要營運內容。
