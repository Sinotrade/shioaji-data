summary_short: 製造銷售再生膠、橡膠粉與膠片，並經營廢輪胎處理。
summary_long: 保綠-KY的集團業務涵蓋再生橡膠產品製造銷售及廢輪胎處理。2025年再生膠及丁基再生膠占營收49.83%，廢輪胎處理占42.68%，其他業務占7.49%。再生膠可用於輪胎、輸送帶及內胎；橡膠粉由廢輪胎破碎與研磨製成，台灣廠另生產作為輔助燃料的膠片。截至2026年6月底，合併子公司包括Jeng Yuan Reclaimed Rubber Sdn. Bhd.、Greencycle Industries Sdn. Bhd.及為愷；Greencycle的清算程序尚未完成。
