summary_short: 製造雙面及多層PCB，並透過全資子公司經營飯店。
summary_long: 霖宏科技主要製造雙面及多層印刷電路板，現有產品涵蓋2至22層硬式電路板，應用包括工業電腦、伺服系統與精密機械控制。2025年合併營收中，多層板占51.55%、雙面板占17.33%，客房收入占21.17%，其他收入占9.95%。公司亦服務5G網通市場，在PCB產業鏈屬電路板製造階段。旗下全資子公司霖雲國際開發經營阿里山英迪格酒店，集團營收因而包含住宿業務。
