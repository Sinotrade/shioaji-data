summary_short: 經營預錄光碟代工、太陽能電廠、文創餐飲與樂齡照護。
summary_long: 鈺德從事預錄光碟代工，產品包含CD、DVD與Blu-ray Disc。2025年光碟產品服務約占營收29%，其他產品約占71%。能源業務由子公司厚聚能源開發提供太陽能電廠建造、營運及維護管理服務；文創業務包括陽明山美軍俱樂部的歷史建物活化經營，以及子公司大樂司文創的餐飲事業。子公司錸工場則從事樂齡照護，發展社區服務，滿足在地照顧需求。
