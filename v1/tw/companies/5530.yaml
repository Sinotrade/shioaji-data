summary_short: 以塔墓銷售、生命禮儀服務及生前契約為主，另經營不動產租賃。
summary_long: 龍巖提供生命禮儀服務、生前契約及塔墓商品，白沙灣陵園設施包括真龍殿、戶外墓園與寵物墓園。2025年塔墓銷售及生命禮儀服務合計占營收89.74%，租賃收入占2.31%，其他收入占7.95%。公司年報將國寶集團及金寶山集團列為競爭同業。集團持有進煌營造、海龍貿易、豐莉及龍巖香港等子公司。2026年7月董事會通過與子公司宇錡建設及孫公司龍富事業簡易合併，公告暫定合併基準日為同年9月1日。
