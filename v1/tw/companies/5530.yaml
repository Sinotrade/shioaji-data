summary_short: 以生前契約、生命禮儀服務及塔墓商品銷售為主要業務。
summary_long: 龍巖以生命服務為主要業務，提供生前契約、禮儀服務及塔墓商品。2025年塔墓銷售及生命禮儀服務占營收89.74%，租賃收入占2.31%，其他占7.95%。生前契約讓消費者預先約定身後事宜；禮儀服務則依逝者心願、家屬共識及宗教信仰規劃流程。白沙灣陵園的設施包括真龍殿及戶外墓園。集團的合併子公司宇錡建設經營殯葬服務，其子公司龍富事業亦經營殯葬服務。
