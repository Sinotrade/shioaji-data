summary_short: 以SAP ERP導入維運、資訊委外及客服等業務流程委外服務賺取收入。
summary_long: 東捷資訊以資訊委外與業務流程委外服務為主要業務，2025年營收占比分別為64.51%與35.49%。資訊服務涵蓋SAP ERP導入、升級與維運，以及軟體開發、雲平台建置與資訊系統管理。智慧工廠方案串接設備、MES與戰情室，提供生產資料整合與監控；資安業務透過SOC提供全天候威脅監控及事件應變。業務流程服務包括雲端客服平台訂閱、客服席次租賃與異質系統整合。東元電機為其母公司。
