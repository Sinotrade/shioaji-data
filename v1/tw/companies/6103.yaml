summary_short: 以半導體材料銷售為主，兼營光碟與聲音系統晶片及自動化技術服務。
summary_long: 合邦主要銷售半導體材料與光碟／聲音系統晶片。2024年兩項業務分占營收78.52%與21.35%，技術服務占0.13%。材料商品包括晶圓製程用擋片、控制片及測試片；晶片涵蓋CD-Discman與Boom Box系統單晶片。另提供工業4.0智慧生產與商業服務自動化技術服務。2025年第三季財報列示，全資子公司United Holdings Business Ltd.持有台合芯集成電路（深圳）有限公司全部股權。
