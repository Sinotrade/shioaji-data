summary_short: 以自有品牌記憶體模組、固態硬碟及快閃記憶體應用產品為主要業務。
summary_long: 十銓科技主要生產自有品牌記憶體模組、固態硬碟、記憶卡、隨身碟及工規記憶儲存產品。2025年營收以DRAM為主，占70.94%，NAND Flash占26.97%，其他占2.09%。旗下另有直接持有的海外子公司，以及十銓恆泰科技（深圳）有限公司孫公司。公司亦於2026年COMPUTEX展示T-FORCE LIQUID II SSD水冷散熱方案，應用於高階高速SSD平台。
