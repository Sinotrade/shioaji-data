summary_short: 以DRAM記憶體模組、SSD、隨身碟及記憶卡的製造銷售為主。
summary_long: 十銓以記憶體模組及NAND Flash儲存產品為主要業務，2025年兩者分別占營收70.94%及26.97%，其他產品占2.09%。儲存產品包括SSD、隨身碟與記憶卡，另提供工控儲存及資料保護方案。公司亦有T-FORCE SIREN CPU一體式水冷散熱器，採用Asetek水泵方案。記憶體供應來源包括三星、SK海力士、美光與南亞科，部分SSD採用群聯及慧榮控制晶片。通路方面透過Amazon平台銷售並運用FBA服務。2026年8月董事會決議以4.97億元購入中和廠辦及17個車位。
