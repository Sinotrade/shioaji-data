summary_short: 以電子書閱讀器為主，提供電子紙終端產品設計與OEM／ODM製造服務。
summary_long: 振曜以電子紙應用產品的OEM／ODM設計與製造為核心，產品包括電子書閱讀器、電子紙廣告看板、電子貨架標籤與電子行李標籤。服務涵蓋工業設計、硬體開發、軟體整合及量產，提供從產品開發到製造的整合方案。公司於2026年3月法說會揭露，電子書約占合併營收六至七成，2025年電子看板營收占比約為百分之一至二。2026年9月法說會簡報另將沛亨與台生材列於子公司營運頁面，分別說明其營運情形。
