summary_short: 以住宅、商用及工業不動產開發與房地銷售為主要業務。
summary_long: 富旺國際開發以不動產開發與房地出售為主要業務，產品涵蓋社區大樓、透天別墅、商用大型百貨商場及工業廠辦，並從事工業廠房與商業用地開發租售。2025年房地出售收入占合併營收99.89%，另有少量勞務及其他收入。集團透過全資子公司寶鑫營造經營綜合營造，並持有富旺不動產及富信全球置業全部股權。富旺房屋仲介由本公司直接持有74%，另由全資子公司蕾媞生技持有26%，截至2026年6月底仍處於停業期間。
