summary_short: 以LED與感測元件封裝為主，並提供照明燈具、組裝模組及照明工程。
summary_long: 佰鴻以發光元件與感測元件封裝為主要業務，2025年LED相關產品銷售占營收89%、照明專案工程占9%，其他占2%。可見光產品包括Lamp、Display、SMD及PLCC，另提供紅外線元件、馬達與感測器組裝，以及LED燈條組裝和照明燈具。智慧路燈可搭配控制器進行環境感測與亮度調整；UV-C LED已有初步開發成果，仍須進行效能測試。子公司涵蓋萬輝企業、高輝光電、KoBrite Corp.、利昇國際實業與晶鴻光電，並透過控股公司持有中國大陸製造子公司。
