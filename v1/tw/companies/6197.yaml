summary_short: 以高速連接器、線材、光模組及高功率電源互連產品取得營收。
summary_long: 佳必琪以高速傳輸與高功率連接產品為核心，提供連接器、線材、光收發模組、電源互連及液冷快接頭。2025年合併營收中，數據網路電信占57.98%，智能連結產業占36.98%，其餘為物聯網及其他產業。產品包含PCIe Gen6連接器與Riser線材、800G與1.6T光模組，以及ORV3電源線與Busbar系列，應用於AI伺服器和資料中心。1.6T光模組採矽光子方案，UQD04快接頭用於液冷。主要子公司包括JPCPT、衡星科技及亞培斯科技。
