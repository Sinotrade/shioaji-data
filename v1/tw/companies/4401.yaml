summary_short: 製造與銷售機能性加工紗、前染色紗及車縫線。
summary_long: 東隆興以機能性人造纖維加工紗、染色紗及車縫線的製造與銷售為主要業務。產品包括延伸假撚紗DTY、空氣複合紗ATY、特殊複合紗、前染色紗與高階車縫線。DTY具有彈性與蓬鬆手感，ATY則以空氣加工形成仿棉觸感，並保有人造纖維的機能。依2024年第一季合併財報，公司子公司包括越南SARAH紡織責任有限公司及東隆興業（越南）公司，兩者主要業務均為織造用紗製造；琦美環球股份有限公司則從事布疋紡織線類批發零售。
