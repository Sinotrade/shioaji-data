summary_short: 以醫用耗材銷售為主要收入，兼營醫療服務及手術、超音波設備。
summary_long: 明基醫以醫用耗材、醫療服務與醫療設備為主要業務。2025年合併營收中，醫用耗材占59.41%、醫療服務占30.36%、醫療設備占10.23%。公司本體研發製造手術燈、手術檯及超音波，並提供iQOR手術室整合系統；子公司怡安供應靜脈輸液耗材、廢液收集系統與呼吸麻醉產品。主要子公司另包括明基健康生活、凱圖國際、康科特、明基口腔及華鋒科技。母公司為明基電通，集團最終控制者為佳世達。
