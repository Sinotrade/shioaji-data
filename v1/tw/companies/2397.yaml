summary_short: 以工業主機板、嵌入式模組及邊緣運算系統為主要業務。
summary_long: 友通主要產品包括工業級主機板、嵌入式電腦模組、邊緣運算AI系統及工業級平板電腦。2025年合併營收中，工業用電腦板卡及系統占54.30%，工業自動化控制占17.81%，設備及耗材占12.92%，其他占14.97%。其QCS051提供自主移動機器人運算平台，QRB812模組可支援無人機影像識別與目標追蹤。佳世達為母公司；主要子公司包括其陽、羅昇及怡進工業，業務分別涵蓋工業電腦、自動化控制與捆包設備。
