summary_short: 製造及銷售太陽能模組與電池，並提供電廠興建及維運服務。
summary_long: 元晶以太陽能電池與模組的製造及銷售為主要業務，營收集中於模組產品。2025年度太陽能模組占營收93.35%，太陽能電池占3.99%，其他項目占2.66%。主要產品涵蓋PERC與TOPCon高效能太陽能電池，以及高效能太陽能模組。除產品銷售外，公司亦提供電廠興建與長期維運的系統整合服務；工程服務包含施工圖繪製、材料與設備採購管理、施工品質控制及安全衛生管理，維運則包括監控、障礙排除、定期巡檢與營運報表。
