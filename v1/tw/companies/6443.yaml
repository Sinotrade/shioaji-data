summary_short: 以太陽能模組與電池製造銷售為主，另提供電廠興建及維運服務。
summary_long: 元晶以太陽能模組與電池的研發、製造及銷售為主要業務，並提供電廠興建與長期維運服務。2025年營收以太陽能模組占93.35%為主，太陽能電池占3.99%，其他業務占2.66%。年報揭露的原料供應來源涵蓋隆基、中環的矽晶片、索特與碩禾的導電膠，以及國碩等模組輔材廠商。歷史具名報導曾揭露元晶取得Tesla屋頂型太陽能電池片訂單。集團另有厚昌能源、恆立能源及昱晶地熱開發等子公司，近三年可確認事件包括子公司增資、關聯企業減資退款及子公司取得土地使用權。
