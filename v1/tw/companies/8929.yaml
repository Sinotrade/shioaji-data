summary_short: 製造及銷售成人紙尿褲、嬰幼兒與個人衛生照護用品。
summary_long: 富堡以成人紙尿褲及相關照護用品為核心，從事加工製造、代理經銷與進出口買賣，安安系列涵蓋環保減塑與褲型紙尿褲。2025年合併營收中，成人照護系列占65.40%，嬰婦幼用品占19.68%，其他占14.92%。產品另包含嬰兒紙尿褲、衛生棉及濕紙巾，涵蓋不同年齡層的個人衛生需求。旗下泰國子公司從事紙尿褲製造及銷售，台灣子公司富森德堡生物科技從事面膜製造及銷售，兩者於2025年底均為全資子公司。
