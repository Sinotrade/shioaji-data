summary_short: 主要製造電路保護元件，另經營散熱基板與熱介面材料。
summary_long: 聚鼎以電路保護元件為主要營收來源，並經營散熱基板與熱介面材料。2025年保護元件占合併營收64.45%，散熱基板占35.55%。保護產品包括高分子正溫度係數熱敏電阻PPTC、瞬態電壓抑制二極體TVS及CLM電流限制模組，分別提供過電流或過電壓保護；散熱產品包括TCB導熱基板與TSP導熱墊片。年報另揭露電動車車載充電器絕緣材料。主要子公司包括直接持有的聚燁科技、Polytronics (B.V.I) Corporation，以及透過聚燁持有的TCLAD Inc.。
