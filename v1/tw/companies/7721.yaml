summary_short: 提供電子支付、智慧設備與半導體感測控制的軟硬體整合服務。
summary_long: 微程式提供電子支付、智慧設備與半導體感測控制相關產品及服務。電子支付整合電子票證與多元支付應用，收入方式包含系統維運、使用分潤與客製化開發。智慧設備涵蓋公共自行車租賃、停車場方案及智慧單車三電與物聯網整合，另提供電子行車紀錄平台。停車方案包含支付管理與電動車充電管理；半導體產品則包括振動感測、RFID讀取器及質量流量控制器。已核讀的2025年第一季財報中，電子支付收入高於其他服務線，並列有全資子公司微程式信息技術(常熟)有限公司。
