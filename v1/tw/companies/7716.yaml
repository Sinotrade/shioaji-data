summary_short: 以海運貨運承攬為主要收入來源，另提供空運及跨境整合物流服務。
summary_long: 昱臺國際以海運貨運承攬為主要收入來源，2025年度海運承攬營收占比超過92%，並提供空運與整合物流服務。空運服務可依貨物交期、單價及貨量安排貨機或客貨機運送。戶到戶服務結合海運或空運、拖車、卡車、報關與配送，將貨物送達指定收貨地點；複式運送則整合海空、海鐵或海陸等運輸方式。公司官網另列示三角貿易與轉口貿易服務，涵蓋第三國採購、直接運往買方目的地或經第三國轉運等貨物流向。
