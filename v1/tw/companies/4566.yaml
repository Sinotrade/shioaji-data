summary_short: 製造銷售汽車、工業與航太精密金屬零組件，另提供液冷接頭及機器人零件。
summary_long: 時碩工業以精密金屬零組件的製造與銷售為主要業務，產品涵蓋汽車、工業儀表與航太應用。2026年上半年自結營收中，燃油動力占23%、汽車安全占14%、新能源車占10%，工業應用占34%、航太應用占17%、散熱系統占1.9%。汽車產品包含渦輪增壓器、廢氣循環及傳動系統零件，工業產品涵蓋流量與壓力控制等精密零組件。另提供用於AI伺服器的UQD液冷接頭製造方案，並列有機器人旋轉關節零組件產品。主要子公司包括時碩科技、時碩無錫及天陽航太。
