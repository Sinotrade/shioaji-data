summary_short: 開發設計 NAND Flash 控制晶片，供記憶卡、隨身碟、eMMC 與 SSD 使用。
summary_long: 點序從事 NAND Flash 快閃記憶體控制晶片開發設計，2025 年 Flash Controller 占合併營收 96.65%，Packaged Controller 占 0.35%，其他占 3.00%。主要產品包括 SD 記憶卡、USB 隨身碟、內嵌式 eMMC 與 SSD 控制晶片，SSD 方案涵蓋 SATA III 及 PCIe/NVMe 介面。合併子公司包括優存科技、Innostor Technology (Samoa) Limited，以及透過後者持有的銀燦科技（深圳）。
