summary_short: 經營國內外團體旅遊、機票與訂房服務，營收以團體旅遊為主。
summary_long: 易飛網主要經營國內外旅遊服務，透過網站提供機票、訂房及旅遊商品訂購，並安排旅客食宿與交通。產品包括團體與小團體旅遊、團體自由行、航空假期及高鐵假期，另受託代辦出入境與簽證。2025年合併營收中，團體旅遊占96.20%，訂票及訂房占3.24%，商品銷售占0.44%，其他收入占0.12%。截至2026年6月底，直接子公司包括易飛翔與誠信旅行社，另透過易飛翔持有軟體服務及日本旅遊子公司。
