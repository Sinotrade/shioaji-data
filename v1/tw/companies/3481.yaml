summary_short: 以TFT-LCD面板與顯示方案為主，另經營車用、X光感測與面板級封裝。
summary_long: 群創主要營收來自TFT-LCD平面顯示器，提供電視、電腦、醫療與車用等顯示產品。2026年第2季消費性顯示器、商用顯示器及非顯示器領域群營收占比分別為47%、13%及40%。子公司CarUX經營智慧座艙顯示與整合方案，並於2025年12月完成Pioneer收購；BMW公開確認CarUX供應其車內8K觸控顯示器。子公司睿生光電經營數位X光平板感測器，並委託群創代工基板。群創亦提供已出貨的Chip First扇出型面板級封裝服務，應用包含低軌衛星零件。2024至2026年間，群創先後公告向台積電、南茂、矽品精密及日月光半導體出售南科廠房與設施。
