summary_short: 代理經銷體外診斷儀器與試劑，提供實驗室建置及數位健康服務。
summary_long: 威力德生醫主要代理經銷體外診斷儀器與檢驗試劑，並提供醫學實驗室整合規劃及建置服務。設備業務涵蓋銷售與租賃，並搭配售後服務及教育應用訓練；實驗室建置範圍包含前台報到、自動化傳輸與全自動檢體分析。旗下全資子公司優品生醫發展數位健康服務，開發醫療資訊服務平台及健康行動go應用程式。平台提供報告查詢、醫耗材採購及診所數位管理；應用程式整合檢驗數據與醫療資訊，提供個人及親屬健康管理功能。
