summary_short: 以博弈應用工業電腦為主要營收來源，另提供儲能與充電設備。
summary_long: 廣錠以博弈應用工業電腦的設計、製造與銷售為核心，提供遊戲機台、投注終端與遊戲主機，並承接 OEM、ODM 客製化開發。2025 年工業電腦占營收 98.66%，能源產品占 0.76%，其他占 0.58%。能源產品涵蓋家用與貨櫃型儲能系統、電池櫃及電動汽車充電設備，另有一體式觸控電腦。2025 年底持有 IBG Inc. 全數股權及廣錠能源 80% 股權，兩者為旗下子公司。
