summary_short: 以D-Link品牌銷售交換器、無線與寬頻網通設備及雲端應用。
summary_long: 友訊以D-Link自有品牌銷售網路產品，產品包括交換器、無線接取點與路由器、5G/LTE行動網路分享器、攝影機及mydlink雲端應用。2026年第二季，交換器與資安產品占營收72%，無線與物聯網占10%，行動與寬頻占13%，其他占5%。交換器涵蓋企業、工業與雲端網管用途，並有DQS-5000-56ZS微型資料中心交換器。合併子公司包括持股41.58%的友勁科技及全資持有的D-Link Systems；友訊與友勁另於2026年6月設立友訊機器人。
