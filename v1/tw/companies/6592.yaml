summary_short: 以車輛、設備及商品分期與租賃服務賺取利息及相關收入。
summary_long: 和潤企業主要提供汽車分期付款，涵蓋各廠牌新車、中古車與營業車，另承作機車、商品及企業設備分期。2025年合併收入中，利息收入占74.03%，融資租賃收入占13.57%。集團透過和勁企業經營商用車分期與企業金融，和潤興業提供企業融資，和潤電能經營太陽能、儲能及充電站業務。中國業務由間接子公司和運國際承作汽車及設備融資租賃；2025年12月增持柬埔寨HFC MFI至66%，取得控制力。和展投資為直接母公司，和泰汽車為最終母公司。
