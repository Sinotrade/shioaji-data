summary_short: 經營廠務工程、製鞋機械，並透過千附精密製造設備與航太零組件。
summary_long: 千附實業以廠務系統工程、製鞋機械及子公司精密製造為主要業務。2026年上半年合併營收中，千附精密占49%、廠務工程占48%、機械占3%。廠務服務涵蓋無塵室及製程排氣系統，並製造防火抗腐蝕排氣風管；機械事業以全鋒品牌提供幫機、壓底機及裁斷機。持股63%的千附精密，承作光電與半導體設備真空腔體及關鍵零組件，以及航太結構件與飛機發動機零組件的整合製造。
