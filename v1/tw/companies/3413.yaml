summary_short: 製造半導體設備關鍵零組件與模組，並提供設備組裝、自動化及維修服務。
summary_long: 京鼎主要提供半導體前段製程設備關鍵模組及零部件製造服務，產品涵蓋CVD、PVD與蝕刻設備相關製造。2025年營收以關鍵性零組件占52.00%最多，半導體設備及系統組裝占45.52%，其他占2.47%。公司另開發EUV光罩護膜貼合、移載及測試設備，並提供CMP研磨頭維修保養。公開資料確認其與應用材料具有供貨及代工合作關係，亦有台積電廠區服務往來。京鼎於2025年收購富蘭登51%股權，並於2026年公告對富蘭登及泰國子公司UniEQ的增資決議。
