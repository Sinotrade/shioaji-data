summary_short: 製造半導體製程設備、關鍵模組與零組件，並提供系統整合。
summary_long: 京鼎以半導體製程設備、關鍵模組及零組件製造服務為主要業務，並提供系統整合。2025年合併營收中，關鍵性零組件占52.00%，半導體設備及系統組裝占45.52%，其他業務占2.47%。法說會列示的設備模組涵蓋化學機械研磨、物理氣相沉積、化學氣相沉積與蝕刻。集團年報揭露開發EUV光罩護膜貼合、移載及測試設備；子公司凱諾科技亦曾展示EUV光罩自動化設備與技術。承鼎精密、凱諾科技及富蘭登科技均列於合併子公司名單。
