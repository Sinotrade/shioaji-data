summary_short: 經營多品牌亞洲料理連鎖餐廳，並銷售年菜、禮盒及即食商品。
summary_long: 豆府以連鎖餐飲服務為主要收入來源，2025年度餐飲收入占99.71%，其他收入占0.29%。公司提供現場烹調的韓式、越式、泰式及日式料理，並搭配飲品與甜點，供消費者於店內客席或外帶食用。除現場餐飲服務外，亦銷售年菜、中秋禮盒及即食商品。依2026年3月底關係企業資料，豆府直接持有策聯國際及太魯閣國際全部股權，並透過策聯國際間接持有安廚食品及多富；另透過VNT International持有VT1 International。
