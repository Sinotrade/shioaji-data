summary_short: 製造銷售不織布，並提供濕紙巾與面膜等成品代工。
summary_long: 南六製造銷售熱風熱壓不織布、水刺不織布及木漿複合布，並提供濕紙巾與面膜成品代工。熱風熱壓不織布用於紙尿褲、衛生棉表面層與導流層；水刺不織布用於濕巾、家庭清潔擦拭及面膜基布。高科技水刺木漿複合布的用途涵蓋手術衣、醫療床單、手術隔巾與無塵擦拭。濕紙巾代工涵蓋嬰兒、成人、寵物與卸妝等用途，面膜代工涵蓋保濕、美白、抗痘及抗老化產品。2025年產品銷售金額以熱風熱壓布最高，另有水針不織布與防護布、濕巾與保養品、一次性手術衣布料及醫用口罩。
