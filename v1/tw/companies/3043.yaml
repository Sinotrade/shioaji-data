summary_short: 以UPS不斷電系統的設計、製造與銷售為主，另提供穩壓器及監控配件。
summary_long: 科風主要從事UPS不斷電系統的設計、製造與銷售，2025年度UPS營收占98.37%，其他業務占1.63%。UPS產品涵蓋離線式、在線互動式、在線式與三相式，並提供自動穩壓器及SNMP遠端監控網卡。MAC系列用於電信、伺服器及企業設備的電源保護，VGDII Modular則供資料中心與伺服器機房使用。科風全資持有科風國際，中山冠虹則為透過科風國際持有的UPS製造事業。
