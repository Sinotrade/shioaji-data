summary_short: 以棉混紡針織布料製造、加工與銷售為主，另有成衣業務。
summary_long: 冠星集團以棉混紡針織布料的製造、加工與銷售為主要業務，2025年該產品占營收97.77%，成衣占2.23%。布料產品包括衛衣布料、平紋布料與空氣層布料，分別應用於運動休閒外套、T恤與內衣，以及時裝、運動和休閒服裝。集團由柬埔寨及越南子公司承擔海外布料生產，鎮江東豐制衣有限公司負責中國地區成衣製造，台巨紡織(上海)有限公司負責中國地區布匹生產及銷售，Top Star Textile Limited從事國際貿易業務。
