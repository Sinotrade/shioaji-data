summary_short: 以光纖及乙太網路交換器研發製造為主，另提供光纖網卡、轉換器與接取設備。
summary_long: 德勝以網通設備研發製造為主，2025年光纖交換器占營收85.01%，為最大收入來源；光纖網卡與光纖轉換器分別占2.30%及3.85%。產品涵蓋PoE與工業型交換器、GEPON OLT／ONU光纖接取設備，以及內建PoE管理型交換器的NVR白牌方案。產品應用包含5G基礎建設。旗下直接持有GRAND IMPACT TECHNOLOGY LIMITED，並透過該公司持有盧比鐵克科技（北京）有限公司，兩層持股均為100%。
