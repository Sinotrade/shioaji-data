summary_short: 製售飼料、糖類與玉米澱粉，合併營收另含食品業務。
summary_long: 台榮本體製造及銷售畜水產飼料、糖類與玉米澱粉；飼料涵蓋雞、豬、鴨及鰻、蝦、魚，糖類包括果糖、麥芽糖與甘蔗液糖。2025年合併產品別營收中，海產為最大單項，其次為飼料與果糖，另有澱粉及其他收入。台榮將禾榮產業與新將軍納入合併財務報告；禾榮經營農畜產品及冷凍調理食品買賣與進出口，新將軍經營廠房出租。兩家公司雖持股未過半，財報均揭露台榮對其具有人事、財務或業務控制權。
