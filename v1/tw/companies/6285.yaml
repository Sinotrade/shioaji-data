summary_short: 設計、研發與製造無線通訊設備，產品涵蓋Wi-Fi、5G、衛星終端及交換器。
summary_long: 啟碁以通訊產品設計、研發與製造為主要業務，2025年無線通訊產品占營收96.85%。產品包括Wi-Fi路由器與閘道器、5G開放式無線單元、低軌道衛星寬頻終端設備及資料中心交換器。其800G交換器採用Broadcom Trident 5-X12方案，並與聯發科進行網通及FWA生態系合作。Reuters報導啟碁向SpaceX供應零組件。2024年取得Resideo墨西哥製造事業，該廠持續生產Resideo家居舒適及安防產品；2025年決議增資越南不動產子公司，2026年越南製造子公司公告取得機器設備。
