summary_short: 透過多聯供應半導體特用化學品，另經營地震預警與環境監測。
summary_long: 三聯集團以電子材料為主要營收來源，2025年前三季該事業占合併營收90.56%，自動化監測占7.10%。電子材料由子公司多聯科技經營；多聯由三聯與日本多摩化學合資成立，提供半導體及光電產業用顯影液、TEOS薄膜形成液與CMP研磨液，另銷售進口銅電鍍液及添加劑。公司於2026年9月表示，CMP研磨液為電子材料最大產品線。三聯亦開發地震預警機，並提供廠房微振動監測方案。媒體已具名報導其向台積電供應先進製程研磨液。
