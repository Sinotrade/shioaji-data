summary_short: 以汽車、火災、工程等財產保險收取保費。
summary_long: 台產承作財產保險，商品包括汽車、商業火災、住宅火災、工程、貨物運輸及傷害保險。2025年汽車保險占簽單保費36.09%，商業火災與住宅火災分別占14.48%及11.06%。再保險往來對象包括中央再保、瑞士再保亞洲香港分行及慕尼黑再保。公司亦推出建築物結構安全保障保險，並與寶舖建設合作；2026年與台灣大車隊推出事故安心陪伴服務。2025年公告以新臺幣20億元含稅向森羅投資購買承德路不動產供自用。
