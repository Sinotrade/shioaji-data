summary_short: 經營產物保險，提供車險、火險、傷害險、工程險及責任險。
summary_long: 台產提供車體損失、商業火災、意外傷害、工程及一般責任等產物保險商品。車體損失險分為甲式、乙式與丙式，依不同契約設計承保車輛毀損風險；商業火險承保非住宅建築、機器設備與貨物等財產。意外傷害險依契約提供意外事故所致身故或失能給付。工程險涵蓋營造工程、機械設備安裝及施工機具等風險。一般責任險包含營業處所與活動事件的公共意外責任保障，承保約定事故造成第三人體傷或財物損失所生的法定賠償責任。
