summary_short: 承作高級精品店裝潢工程，並製造銷售客製化家具。
summary_long: 紅木集團主要承作全球高級精品名牌店裝潢工程，並從事客製化家具製造與銷售，工程範圍涵蓋精品品牌的室內及室外裝潢。2026年上半年合併營收全數列為工程收入。集團透過位於新加坡的全資子公司經營精品店裝潢業務，該子公司另全資持有馬來西亞家具公司，從事客製化家具設計、製造及買賣。因此，集團業務同時涵蓋門市裝潢工程與配套家具製造，財務報告則以工程收入呈現營業收入。
