summary_short: 以軟式隱形眼鏡研發、製造、品牌代工與銷售為主要業務。
summary_long: 晶碩以軟式隱形眼鏡設計、研發、製造與銷售為核心，承接國內外品牌客戶代工；2024年隱形眼鏡及相關收入占合併營收99.36%。產品包含矽水膠鏡片，生產採高度自動化製程。集團透過晶澈科技經營消費通路與會員業務，並由美彤生醫布局生技美妝。景碩科技為母公司，和碩聯合科技為最終母公司。公司擁有日本及越南子公司，並於2025年完成荷蘭全資子公司註冊。2025年董事會決議對越南子公司增資3,500萬美元；越南子公司另於2024年及2026年分別辦理廠房與宿舍委建案。
