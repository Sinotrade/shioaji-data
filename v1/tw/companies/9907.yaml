summary_short: 製造馬口鐵、金屬與塑膠包材，並提供飲料充填代工。
summary_long: 統一實以馬口鐵包材為最大營收來源，產品涵蓋底片、冷軋鋼板、馬口鐵、彩印鐵皮及鐵罐；2025年該類占合併營收53.16%，塑膠包材含充填占42.64%，其他占4.20%。飲料包裝業務提供瓶胚、瓶蓋、吹瓶及無菌充填，並生產利樂包飲料與新型鋁瓶罐。2025年中鋼占進貨淨額22.54%，廣州統一企業占銷貨淨額10.84%；統一企業亦為母公司及商品銷售對象。近三年可查證事件包括泰州子公司減少廠房承租、無錫子公司新增倉庫使用權，以及北京子公司調整不動產租約。
