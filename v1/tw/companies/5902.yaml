summary_short: 經營食品飲料進口代理與自有品牌，銷售茶飲、咖啡、燕麥飲及冰品。
summary_long: 德記洋行以快速消費品代理貿易與自有品牌銷售為主要業務，經營食品飲料，並具備產品開發、品牌經營及市場銷售能力。自有產品包括開喜凍頂烏龍茶，以及TAIT TEA德記洋行茶旗下的烏龍茶與烏龍鮮綠茶；代理銷售品項涵蓋星巴克包裝咖啡、OATLY燕麥飲與日本森永冰品。統一企業為其母公司，官網主要股東資料揭露持股64.27%；德記洋行實業(上海)有限公司則為全資轉投資子公司。
