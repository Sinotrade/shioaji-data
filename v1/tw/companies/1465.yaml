summary_short: 以長纖梭織布製造及銷售為主，另經營針織布與聚酯加工絲。
summary_long: 偉全實業從事長纖梭織布及針織布的生產製造與買賣，並經營聚酯加工絲。2025年度營業比重以長纖梭織布99.40%為主，針織布及其他分別為0.04%與0.56%。長纖梭織布主要供成衣使用，公司以自製或外購加工絲織成胚布，可直接出售，或委外印染後以成品布銷售。官網產品包括不含氨綸、單一組成且可回收的Wi-elastic 3.0，以及具保暖特性的一體梭織刷毛布Wi-Shell 3.0。
