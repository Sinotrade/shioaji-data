summary_short: 主要銷售掌上型工業電腦、條碼掃描器與資料擷取軟體。
summary_long: 欣技以掌上型工業電腦為主要業務，2025年占合併營收69.42%，另有手持式自動辨識掃描器、穿戴裝置、POS觸控式行動電腦及其他收入。產品包括支援5G的RS38行動電腦、2500系列條碼掃描器及RFID讀寫器。Pic'n Fill OCR將實體文字轉為數位資料，ReMoCloud支援裝置遠端部署與管理。旗下有CIPHERLAB USA、薩摩亞控股公司及邦頎科技等直接子公司，並透過薩摩亞公司持有上海賽弗萊。
