summary_short: 以電力電纜、漆包線及銅線製造銷售為主，集團另經營綠能與儲能。
summary_long: 大亞以電線電纜製造與銷售為核心，產品涵蓋XLPE及PVC電力電纜、漆包線、裸銅線與光纖電纜。2025年母公司個體營業比重以交連聚乙烯電力電纜56.58%最高，其次為塑膠電線電纜16.25%、漆包線12.48%及裸銅線10.50%。電力電纜涵蓋600V至345kV；漆包線則開發電動車、無人機及低軌衛星馬達應用。集團透過大亞綠能提供太陽能建置與綠電轉供服務，另有大亞儲能子公司及併網型儲能系統產品。
