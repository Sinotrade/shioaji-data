summary_short: 製造電力電纜與漆包線，並透過子公司經營太陽能、儲能及綠電服務。
summary_long: 大亞以電線電纜製造與銷售為核心，產品包含交連聚乙烯電力電纜、塑膠電線電纜及漆包線。電力電纜涵蓋低壓至345kV，並取得台電高壓電纜標案。漆包線用於電機與動力設備，與富田電機有供貨及電動車馬達線材共同開發關係，公司亦揭露無人機馬達線圈應用。能源業務透過大亞綠能、大亞儲能及協同能源等子公司布局太陽能、儲能與能源管理；綠電轉供實績由旗下博曜公司承作。近年重大投資包括參與聯合鋁業股權收購，以及對大亞儲能增資五億元。
