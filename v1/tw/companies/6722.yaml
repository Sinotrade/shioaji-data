summary_short: 以倒車雷達、車用影像、防盜及盲區偵測系統銷售為主要收入來源。
summary_long: 輝創電子的主要產品包括倒車雷達、攝影鏡頭、汽車防盜器及盲區偵測系統。2025年倒車雷達占營收69.18%，攝影鏡頭占15.62%，盲區偵測系統占5.22%，汽車防盜器占3.81%，其他占6.17%。產品技術包括超音波感測、毫米波雷達、影像與無線射頻，應用涵蓋停車輔助、盲區警示、電子後視鏡及智慧鑰匙，另提供駕駛偵測功能。主要海外製造子公司包括直接持有的泰輝創，以及透過Lothian持有的蘇州輝創。
