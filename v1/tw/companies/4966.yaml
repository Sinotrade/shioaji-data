summary_short: 設計銷售高速傳輸介面、顯示驅動與觸控控制晶片。
summary_long: 譜瑞-KY以高速傳輸介面及顯示相關積體電路為主要業務，採無晶圓廠的IC設計模式。產品涵蓋eDP時序控制器、LCD源極驅動器，以及整合觸控、時序控制與顯示驅動的TTED晶片，應用於筆電與顯示面板。高速介面產品提供訊號調理及USB4擴充基座控制功能；Ethernet線性重驅動器則支援伺服器、儲存與AI資料中心纜線。2025年營收以高速介面解決方案48.75%及DisplayPort時序控制器系列38.10%為主。
