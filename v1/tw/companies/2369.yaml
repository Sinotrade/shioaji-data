summary_short: 以積體電路、感測元件及功率元件的封裝與測試服務為主要收入來源。
summary_long: 菱生精密以積體電路及分離式半導體封裝、測試服務為主要業務，位於半導體產業鏈下游。2025年合併營收中，封裝測試服務占99%，其他業務占1%。主要技術包括堆疊技術、多晶片模組、系統封裝與MEMS元件封裝，均已成熟量產。研發成果另涵蓋環境光學感測模組封測、功率元件模組及碳化矽二極體TO封裝。截至2026年6月底，直接子公司包括美國菱生、利鑫投資、德利勤科技、鴻谷科技、迅能半導體及薩摩亞菱生。
