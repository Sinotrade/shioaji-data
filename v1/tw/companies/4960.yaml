summary_short: 主要製造銷售顯示器用偏光板，另開發光學膠材與半導體製程膜材。
summary_long: 誠美材以偏光板製造與銷售為主要業務，2025年偏光板占營收99.59%，其他化學品等占0.41%。產品應用涵蓋電視、資訊電子、行動裝置與車載顯示，另有一體黑OLED偏光板及Mini LED透明封裝膠。2024年法說具名揭露的台灣面板客戶包括群創、友達與彩晶，官網並列寧波誠美材料為全資後段製程子公司。半導體材料方面，公司開發UV系切割與研磨膠帶，並向新應材購入歐普仕股權；2026年另公告向彩源科技購置生產設備。
