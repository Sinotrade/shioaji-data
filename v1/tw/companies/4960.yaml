summary_short: 以製造與銷售顯示器偏光板為主，另提供光學膜與光學膠材。
summary_long: 誠美材料以偏光板製造與銷售為主要業務，2025年偏光板占營收99.59%，其他化學品等占0.41%。偏光板產品應用於液晶電視與桌上型顯示器，官網並揭露一體黑OLED偏光板已導入量產。公司亦提供Mini LED透明封裝膠、UOP series光學結構壓印膠，以及AR Film光學膜。集團由全資薩摩亞子公司間接持有寧波誠美材料，後者從事電子材料製造及銷售；另有全資誠輝投資與誠輝貿易子公司。
