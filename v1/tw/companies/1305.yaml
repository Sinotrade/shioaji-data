summary_short: 生產銷售PVC粉、鹼氯化學品及膠布、膠皮、管材等加工製品。
summary_long: 華夏以聚氯乙烯（PVC）原料與二次加工製品的生產銷售為主，產品涵蓋PVC粉、鹼氯化學品、膠布、膠皮及管材、防水膜。2025年合併外部收入中，PVC產品為新台幣82.72億元，VCM產品為9.49億元，營收以PVC系列為主。華夏持有華夏聚合100%股權及台灣氯乙烯工業87.31%股權，兩者均為子公司。聯聚國際投資為母公司，台灣聚合化學品為最終母公司。
