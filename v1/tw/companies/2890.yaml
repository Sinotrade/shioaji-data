summary_short: 以銀行與證券業務為主要收入來源，並經營租賃、投信及創投。
summary_long: 永豐金控以銀行與證券為主要營運來源，2025年銀行業營業比重73.46%、證券業24.32%，其他業務2.22%。旗下永豐銀行經營法人、零售、財富及數位金融，永豐金證券提供經紀、自營與承銷服務；另有租賃、投信及創投子公司。DAWHO是永豐銀行的數位整合帳戶。2025年金控取得京城銀行全部股權，永豐銀行完成Amret第一階段收購，永豐金證券吸收合併台灣匯立證券。雙銀後續合併於2026年7月獲准，與前述金控取得股權屬不同階段；同年6月金控董事會另決議對永豐金證券注資125億元。
