summary_short: 集團以功率半導體封裝測試為主要營收，另經營光通訊產品及矽光子模組。
summary_long: 聯鈞光電集團從事光資訊與光通訊產品、功率半導體封裝測試及高速傳輸光模組業務。2025年合併營收中，功率封測占62%，高速光模組（含矽光子）占21%，光資訊及光通訊產品占17%。已開發產品包括新高速增益型EML元件、400G／800G有源光纜傳感器及矽光子高速光模組，光模組用途涵蓋資料中心與5G通訊。主要直接子公司為GEM Services, Inc.及源傑科技，2025年底持股分別為51%與54.23%。
