summary_short: 設計、製造及銷售光學鏡片模具與精密金屬零組件。
summary_long: 伯特光主要從事精密光學模具與零組件的設計、製造及銷售，2025年模具及金屬零組件占營收97.94%，其他業務占2.06%。主要產品包括手機鏡片模座、VR/AR/MR鏡片模座、玻璃模造成型模仁，以及相機與車用精密金屬零組件。車用產品應用涵蓋智慧電動車的感測與控制系統。依2024年第二季財報，鎮江伯特光電從事光學鏡頭模具及零組件買賣，慶洲精密工業（廈門）從事相關產品製造及買賣，兩者均為全資子公司。
