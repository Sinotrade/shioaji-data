summary_short: 以光學鏡頭及鏡片製造為主，產品涵蓋車載、紅外線、物聯網及智慧眼鏡光學。
summary_long: 今國光的2025年營收組成為光學鏡頭79%、光學鏡片20%、其他1%。公司產品涵蓋車載鏡頭、長波紅外線鏡頭及物聯網鏡頭，並提供AR全彩波導、LCOS與MicroLED投影光機，以及VR Pancake模組。矽光子產品方面，公司提供應用於CPO的矽微透鏡製造技術，官網列有MLA產品。年報揭露的全資轉投資事業包括正國光學香港及互商光學工業，公司公告亦揭露今偉光學工業為子公司。
