summary_short: 設計製造光學鏡頭與鏡片，應用於熱成像、物聯網及車載設備。
summary_long: 今國光以光學鏡頭與鏡片的設計製造為主，具備玻璃研磨、塑膠射出、玻璃模塑及精密模具加工能力。2025年光學鏡頭、光學鏡片及其他業務占營收分別為79%、20%及1%；2025年前三季遠紅外線鏡頭占營收54%。產品涵蓋物聯網與車載鏡頭，集團紅外線產品亦應用於無人機，另開發AR光波導、光引擎及CPO矽微透鏡。具名客戶包括Amazon與Magna，並與日本電裝共同開發LiDAR鏡頭；年報亦揭露與三星合作微透鏡及奈米壓印技術。正國光學香港為全資子公司，佛山華國則為間接投資的光學製造子公司。
