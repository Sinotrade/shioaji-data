summary_short: 以家庭用紙及清潔用品的生產、銷售與品牌經營為主要業務。
summary_long: 永豐實以家庭用紙及清潔用品的生產、設計、銷售與代理為主要業務。2025年報揭露，家庭用紙約占總體銷售83%，清潔用品約7%，其他項目約10%。家庭紙品包括五月花衛生紙與廚房紙巾，清潔用品包括橘子工坊洗衣膠囊及蔬果碗盤洗碗精。母公司為永豐餘投資控股股份有限公司，旗下子公司包括永昇圃農業生物科技公司及永豐商店公司，另透過投資架構持有昆山與揚州的家庭用紙製造子公司。
