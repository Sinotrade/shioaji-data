summary_short: 以醫藥與醫材供應、健康管理及醫療設備租賃取得收入。
summary_long: 盛弘以醫藥流通、健康與醫療管理及醫療設備租賃取得收入。2025年合併營收中，藥品、醫材及科技材料供應占81.02%，健康及醫療管理占16.86%，設備租賃服務占2.12%。醫藥流通業務提供藥品、保健食品及藥妝品經銷代理；健康管理業務提供健檢及醫學檢驗實驗室的管理諮詢與委託經營服務；專科服務則提供醫療儀器設備租賃。主要直接子公司包括敏成健康科技、精準健康與方鼎資訊，並透過敏成健康科技間接控制躍獅健康。
