summary_short: 主要製造清潔劑與界面活性劑原料，集團另經營石油樹脂、農藥及糖業貿易。
summary_long: 和益以烷基苯、烷基酚及烷基苯磺酸等清潔劑、界面活性劑與潤滑油添加劑原料為主要業務。2025年烷化部門占合併營收80.88%，樹脂部門占12.45%，農藥及其他占6.67%。樹脂業務由子公司聯超實業產製銷售，和益承接氫化製造加工。英文年報列出P&G、Unilever及Kao為下游清潔劑供應對象，中文年報將台灣中油列為主要供應商，並將Sasol列為烷基苯競爭者。2024年公司認購益聯糖業現金增資2億元；2026年董事會決議視市場狀況處分雲豹能源持股，金額上限6億元。
