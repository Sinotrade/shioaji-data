summary_short: 以超高頻通信線材、原線材及電腦與醫療連接線組為主要業務。
summary_long: 金橋主要經營通信、電腦週邊及醫療設備使用的線材與連接線組。2025年營收以超高頻通信線材為最大項目，占51.88%；各類電子、電機、通訊及高速網用原線材占20.50%，電腦週邊設備線材占11.30%。其餘包括醫療儀器用連接線6.22%、消費性電子6.10%及其他產品4.00%。現有產品亦涵蓋RF同軸與極細同軸線材及組裝。公司另揭露機器人動態線材耐久性技術的研發成果，屬機器人零組件相關技術布局。
