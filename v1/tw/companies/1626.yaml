summary_short: 以家用電風扇、電暖器及其他小家電的研發、製造與銷售為主要業務。
summary_long: 艾美特-KY以集團方式從事家用電風扇、電暖器及其他小家電的研發、製造與銷售。2024年營收組成以電風扇64.01%為主，電暖器占19.59%，電工產品占6.59%，小家電占6.14%，其餘3.67%為零配件、模具及營業租賃收入。電風扇包括立扇與冰冷扇，電暖器包括對流式與石英管式；其他產品涵蓋果汁機、電磁爐、加濕與除濕設備、電鍋、空氣清淨機、集成吊頂及烘手機。集團旗下深圳與九江子公司負責家用電器生產與銷售。
