summary_short: 以AI聲學晶片、語音演算法智財授權及技術服務取得收入。
summary_long: 意騰-KY提供AI聲學處理及語音辨識的ASIC產品，以及相關演算法智財授權與技術服務。2026年第一季，兩項業務占營收比重分別為63.09%及36.91%。ASIC產品搭配自行開發的演算法，供嵌入式裝置進行語音處理；AIVC處理器以低功耗執行邊緣AI神經網路推論。智財授權內容涵蓋聲學演算法、模型與技術，用於辨識人聲及消除噪音。集團的語音辨識及合成方案亦涵蓋語音轉文字與文字轉語音，相關業務包含子公司賽微科技的技術。
