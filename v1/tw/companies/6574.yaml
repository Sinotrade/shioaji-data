summary_short: 以醫美耗材銷售、品牌授權及診所營運支援為主，兼營美容保養品。
summary_long: 霈方主要經營醫美銷售及勞務與美容保養護膚品，2025年營收比重分別為72%及28%。醫美業務涵蓋醫材銷售、品牌授權、醫美設備與經營場所租賃；官網並說明提供場地規劃、醫材採購及經營支持，形成醫師與診所的服務平台。美容保養業務則從事相關產品研發、銷售與諮詢。依2025年第三季合併財報，直接子公司包括從事醫學美容的霈曼國際、霈博生醫，以及投資控股公司SHINE STYLE LTD.；上海霈曼生物科技則由後者持有，經營化妝品批發銷售。
