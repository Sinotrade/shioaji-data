summary_short: 以 GPU 繪圖卡代理銷售為核心，另提供 AI 工作站、伺服器與管理軟體。
summary_long: 麗臺以 GPU 繪圖卡代理銷售為核心，產品涵蓋 NVIDIA RTX 專業繪圖卡與 GeForce 顯示卡。2025 年電腦產品占營收 99.66%，其他產品占 0.34%，智慧醫療產品列示為 0.00%。公司另提供 WinFast AI 工作站與伺服器，並展示從桌面到資料中心的運算產品布局。軟體方面提供 AIDMS，支援地端 AI 代理應用。依 2025 年底資料，公司直接持有 Leadtek Holding 全數股權，並透過該公司持有上海行銷服務子公司全數股權。
