summary_short: 製造與銷售汽車售後維修用散熱風扇、鼓風機及馬達。
summary_long: 金興精密研發、製造與銷售車用散熱風扇、鼓風機及無刷馬達，供應汽車售後維修市場，亦提供時規蓋等配件。2025年營收由傳統風扇占68.34%、電子風扇占20.76%，其他產品占10.90%。公司具備無刷馬達與控制器模組軟硬體設計及生產能力，結合LIN Bus與無感應器通訊技術的產品可適用電動車。年報另揭露無人機動力電機及AGV驅動馬達的原型開發布局。泰國子公司KING SHING AUTOMOBILE PARTS Co., Ltd.從事車用零組件製造與銷售。
