summary_short: 製造太陽能電池及電子印刷用精密網版，並銷售網印耗材。
summary_long: 倉和以精密印刷網版及網印耗材銷售為主要業務，核心產品用於太陽能電池製造。2024年合併營收中，太陽能電池印刷用網版占85.53%，非太陽能網版占2.16%，網印耗材買賣占12.31%。產品涵蓋CF系列3D無網結網版，並具備PI膜層開發與雷射雕刻技術；非太陽能應用包括光電觸控、精密電子元件與印刷電路板。公司另進行TOPCon、BC及HJT電池印刷研究。年報列示的子公司包括倉和精密製造（蘇州）、倉禾科技（成都）及光星（上海）國際貿易。
