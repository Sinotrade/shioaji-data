summary_short: 以電子保全、現金護送、常駐警衛及安防設備銷售取得收入。
summary_long: 新保以電子保全服務為主要收入來源，合併業務另包括現金護送、常駐警衛及保全設備等商品銷售。2025年電子服務收入為32.13億元，查核報告以約40%描述其占比；現送與常駐收入分別為11.95億元及16.61億元。公司自行開發AI智慧影像防護系統，也投入保全與服務型機器人研發。主要子公司包括誼光保全、台灣保全及新誼整合科技；新誼整合與新工光電亦供應母公司設備及服務。2025年度公司揭露向新光人壽取得使用權資產，並公告上海子公司間的內部合併規劃。2026年第二季，子公司新保投資增持漢軍科技股權。
