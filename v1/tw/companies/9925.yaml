summary_short: 以電子保全為核心，提供安全監控、機動派遣及智慧安防服務。
summary_long: 新保以電子保全服務為核心，提供全天候警備監控與異常訊號機動派遣。2025年度合併收入以電子保全為最大項目，另包括現送、常駐及其他收入。主要子公司包括誼光保全與台灣保全，母公司直接持股分別為69%與99.98%。公司另提供AI智慧影像防護，以影像辨識及遠端管制支援安全服務；Care U平台則涵蓋居家緊急通報、戶外定位與健康管理。此外，官網揭露保全巡邏及家庭服務型機器人研發，對應機器人整機與系統階段。
