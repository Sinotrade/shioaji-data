summary_short: 研發、製造與銷售人用疫苗，主要營收來自腸病毒71型及流感疫苗。
summary_long: 高端疫苗以人用疫苗研發、製造及銷售為主，主要營收來自腸病毒71型與季節性流感疫苗。2024年腸病毒71型疫苗占營收85%，四價季節流感疫苗占15%。恩穩健腸病毒71型疫苗適用於2個月至未滿6歲兒童；現行產品亦包括福喜健三價流感疫苗，用於預防季節性流感。公司竹北廠具細胞培養、抗原生產、無菌充填及品管放行能力，並持續開發第二代多價型腸病毒疫苗。基亞生物科技為最終母公司，富聿資本為全資子公司。
