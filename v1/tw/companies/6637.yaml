summary_short: 以醫療設備與藥品經銷、設備租賃管理及維修服務取得收入。
summary_long: 醫影主要從事醫療設備與藥品經銷，並提供醫院設備租賃、影像醫學科管理及設備維修服務。2025年度營收以經營銷售為主，占76.88%，租賃管理服務占23.12%。經銷設備涵蓋磁振造影儀、電腦斷層攝影儀等影像診斷設備，藥品產品包括放射線診斷顯影劑。公司亦以設備租賃及管理服務參與醫療院所的影像醫學業務。已揭露子公司包括永讚有限公司、樂誠有限公司、江蘇國贊醫療設備有限公司及義創室內裝修設計工程股份有限公司。
