summary_short: 製造中大型客製化CNC工具機，主要銷售電腦車床與切削中心機。
summary_long: 喬福從事中大型CNC工具機製造，並提供客製化機台，主要收入產品為電腦數值控制車床與切削中心機。2025年度銷貨明細中，電腦數值控制車床收入為新台幣2億3,171萬8千元，切削中心機為2億1,405萬2千元，另有維修零件收入4,971萬1千元。產品包括動柱龍門加工中心機、大型平台式車床與多軸臥式車銑複合機。動柱龍門機種可依尺寸、雙主軸、雙工作平台及W軸橫樑移動需求配置；車銑複合機則提供同動五軸加工選項。
