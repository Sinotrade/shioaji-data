summary_short: 以艦艇與商船建造、船艦維修及機械工程為主要收入來源。
summary_long: 台船以艦艇與商船建造為核心，並提供船艦維修、機械製造及其他工程服務。2025年艦艇建造占營收66.53%，機械製造占15.89%，商船建造占9.15%，船艦維修占5.68%。商船訂單的實際簽約客戶包括萬海新加坡公司與中國航運旗下專案公司；海軍及海巡署則採購艦艇。台船亦製造離岸風電水下基礎基樁，並與DEME體系共同經營台船環海合資公司。另已推出「奮進魔鬼魚」無人水面載具。
