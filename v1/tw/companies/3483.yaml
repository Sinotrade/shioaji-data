summary_short: 主要製造銷售散熱模組與風扇，並提供水冷板、CDU及浸沒式液冷產品。
summary_long: 力致科技以散熱模組及風扇為主要業務，2025年度兩者合計占營收100%。主要產品用於筆記型電腦、桌上型電腦及高階伺服器，另有熱導管與均溫板系列。液冷產品包括處理CPU與GPU熱量的水冷板、冷卻液分配裝置，以及將電子設備浸入不導電液體的浸沒式系統。官網將AI與雲端運算列為伺服器應用，並展示資料中心液冷產品。年報列有毛里求斯、越南與美國直接子公司，以及蘇州、重慶、四川與安徽的間接子公司，均為全資持有。
