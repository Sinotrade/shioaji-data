summary_short: 以泰國廠房租賃及管理服務為主要收入來源，另經營服飾配件買賣與投資管理。
summary_long: 樂威科目前以泰國廠房出租及資產管理為主要業務，2026年上半年合併營收1,279.8萬元，其中投資性不動產租金收入1,034萬元。泰國子公司Raku Innovation已退出精品金屬製造及代工，將廠房分層出租，並以租金及管理費作為主要收入來源。2026年7月起，集團另增加服飾配件買賣業務。旗下台灣子公司包括樂進科技、樂研智醫、樂富智能科技及智威智能科技，業務涵蓋生技醫療相關投資顧問、人工智慧軟硬體建置與能源技術服務。
