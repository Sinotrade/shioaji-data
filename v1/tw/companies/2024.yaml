summary_short: 製造及銷售鋼棒、鋼線，並經營盤元買賣與代工。
summary_long: 志聯工業主要經營鋼棒、鋼線等金屬材料，2025年度營業比重分別為64.3%及31.9%，其他盤元買賣及代工占3.8%。鋼棒產品包括快削鋼棒、機械構造用碳素鋼棒、特殊鋼棒、合金鋼棒、彈簧鋼棒及不銹鋼棒；鋼線涵蓋高碳、快削、軸承、低碳、冷鍛、合金與彈簧鋼線。快削鋼棒可供精密零件切削及馬達、機械軸心使用，高碳鋼線則可用於傘具、車輻、彈簧、鋼索及鋼釘等用途。
