summary_short: 德律主要銷售電路板與半導體製程的自動檢測、量測及電測設備。
summary_long: 德律以自動檢測設備銷售為主要收入來源，2025年占營收97.21%，勞務收入占2.79%。產品包括AOI自動光學檢測、SPI錫膏檢測、AXI自動X射線檢測，以及ICT組裝電路板測試設備。AOI提供3D影像與量測功能，SPI量測錫膏，AXI利用X射線檢查電路板，ICT產品結合在線電測與功能測試。公司亦提供晶圓級、面板級及半導體後段封裝的檢測與量測方案。海外子公司包括銷售支援據點，以及透過TRI INVESTMENTS LIMITED持有的中國精密測試儀器營運公司。
