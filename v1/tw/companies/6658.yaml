summary_short: 提供機器視覺檢測、濕製程設備與生產智動化整合方案。
summary_long: 聯策以機器視覺檢測、濕製程設備與生產智動化整合為主要業務。2025年合併營收中，AI機器視覺設備占41.17%，濕製程智慧化方案占29.04%，生產智動化整合占6.58%，印刷電路板表面處理占7.29%，其他占15.92%。產品包括玻璃／矽中介層自動光學檢測機、晶圓／面板槽式清洗蝕刻設備及i360智慧視覺系統。檢測設備應用涵蓋ABF載板與CoWoS先進封裝。
