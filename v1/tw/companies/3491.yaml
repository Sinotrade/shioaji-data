summary_short: 研發製造衛星與行動通訊用微波、毫米波被動元件及天線。
summary_long: 昇達科技研發及製造微波、毫米波高頻被動通訊元件與天線，產品包含濾波器、雙工器、耦合器及正交模態轉換器，應用於低軌衛星與行動通訊回傳。2026年上半年，低軌衛星占營收77%，5G／4G回傳網路占10.7%，射頻天線占12.3%。公司供應SpaceX的Starlink通訊元件，並取得Amazon低軌衛星訂單；OneWeb亦有歷史訂單揭露。2026年第一季，衛星間光鏈路通訊組件已開始量產出貨。集團持有芮特科技及越南製造子公司；2024年完成芮特反式三角合併，2025年處分正通部分股權並失去控制，2026年決議收購巨頻股權、增資越南公司及投資設立美國子公司。
