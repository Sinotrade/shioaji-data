summary_short: 華容主要製造銷售塑膠薄膜電容器，另經營電子產品代理業務。
summary_long: 華容以塑膠薄膜電容器製造與銷售為主，另經營電子產品代理業務。2025年薄膜電容器占營收85.31%，其他代理業務占14.69%。主要產品涵蓋金屬化聚酯、金屬化聚丙烯、抗電磁干擾安規及功率薄膜電容器。公司將AI伺服器電源供應器列為核心布局市場，並揭露產品已導入充電樁應用。集團透過華容國際持有華容電子（廣東），從事電子產品製造與買賣；另透過富晨科技持有富佐科技，經營電子產品買賣。
