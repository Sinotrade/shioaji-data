summary_short: 以汽車零件鍛壓製造及加工為主，兼製機械五金與其他運具鍛件。
summary_long: 江興鍛以汽車零件鍛壓製造及加工為主要業務，2025年個體營業比重96.94%；機械零件與五金工具占2.86%，自行車零件占0.18%，機車零件占0.02%。汽車產品包括前輪傳動軸件、齒輪與輸出入軸，機械五金涵蓋氣動工具與高壓接頭，機車零件包括齒輪軸及傳動主副軸，另有自行車齒輪與一般、急曲線軌道座。集團子公司包括江興(淮安)汽車部件有限公司，並間接持有江興(太倉)金屬制品有限公司。
