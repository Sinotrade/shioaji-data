summary_short: 製造與銷售乙二醇、環氧乙烷、特用化學品及工業氣體。
summary_long: 東聯主要製造與銷售乙二醇、環氧乙烷、特用化學品及工業氣體。2025年合併營收中，乙二醇事業占66%、特化事業占27%、氣體事業占7%。乙二醇產品可作為聚酯纖維、PET瓶及抗凍劑原料；環氧乙烷衍生物則應用於日化、紡織、建築與塗料等產業。溶劑產品包括乙醇胺、乙二醇丁醚及碳酸乙烯酯，其中碳酸乙烯酯可作為鋰電池電解液與聚碳酸酯原料。公司亦布局電動車電池材料應用，遠東聯石化（揚州）有限公司為其重要子公司。
