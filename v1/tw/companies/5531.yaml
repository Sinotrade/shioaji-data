summary_short: 經營住宅與商業不動產開發租售，並透過子公司經營酒店。
summary_long: 鄉林建設事業股份有限公司經營住宅及商業大樓興建、出租與出售，合併業務亦包含子公司的酒店營運。2025年度合併營收組成為酒店收入53.07%、房地收入41.34%及其他收入5.59%，酒店為該年度最大收入來源。旗下南京鼎正酒店有限公司與青島鼎林酒店有限公司均從事酒店經營及管理，太裕營造股份有限公司從事建築與土木工程；成都鼎康置業有限公司則從事房地產開發，均列入合併財報子公司範圍。
