summary_short: 設計與銷售 AC-DC 電源管理 IC、控制器及功率元件。
summary_long: 虹冠電以 AC-DC 類比電源管理 IC 設計及功率元件銷售為主要業務。2025 年前三季，功率積體電路與功率元件對外收入分別為新台幣 529,065 仟元及 285,053 仟元，前者為主要營收來源。產品包括 PFC／PWM 整合控制器、PFC 控制器、諧振控制器、超接面 MOSFET，以及氮化鎵開關驅動器。強茂為其母公司，直接子公司包含金虹冠科技、Wisdom Bright 與 Wisdom Mega。
