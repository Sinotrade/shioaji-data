summary_short: 透過集團提供海空運與鐵路貨運承攬、報關及倉儲配送服務。
summary_long: 台驊控股透過集團提供海運、空運、鐵路及內貿物流服務。2026年上半年海運營收70.06億元、空運32.78億元、內貿物流11.36億元，海運為最大營收來源。海運服務包含整櫃、併櫃及複合運輸安排；空運涵蓋航線安排、包機與倉儲配送；鐵路提供定期班列及全程通關服務。內貿物流涵蓋報關、倉儲與客製化配送，另提供跨境電子商務物流整合方案。旗下包括台灣航空貨運承攬，THI Japan於2026年上半年成為全資子公司。
