summary_short: 製造碳纖維球拍、自行車零組件、安全帽及航太醫療複材製品。
summary_long: 拓凱製造碳纖維與複合材料產品，主要收入來自運動休閒用品。2025年運動休閒產品占營收78.31%，航太醫療產品占6.96%，原物料及其他占14.73%。運動休閒產品包括碳纖維球拍、複材自行車車架及相關零組件、複材安全帽；航太醫療產品包括醫療床板及配件，以及民航客機座椅結構件。直接子公司包括New Score Holding Limited、拓凱（越南）責任有限公司與台灣新鴻洲精密股份有限公司。
