summary_short: 製造橡膠輸送帶、橡皮壩，並提供電子級熱壓緩衝墊與熱塑碳纖維複材。
summary_long: 鑫永銓以橡膠產品為主要收入來源，2025年橡膠產品占營收97.99%，其他占2.01%。KING王牌輸送帶涵蓋輕型、重型及特殊型，應用於礦業、鋼鐵、航空、農業與物流；橡皮壩用於灌溉、供水、蓄水、防洪及發電。另有SILIEET矽利特電子級熱壓緩衝墊，供PCB、軟板及銅箔基板等高溫壓合製程使用。NEWSHEET鑫複材提供熱塑碳纖維複合材料，具輕量、強韌、耐用及可回收特性，並投入無人載具與相關零組件開發。
