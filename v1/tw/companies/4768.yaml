summary_short: 以半導體特殊氣體等精密化學品為主，另提供晶圓重生與玻璃通孔基板。
summary_long: 晶呈科技以半導體製程用精密化學品為主要業務，2025年該類別占營收96.73%，其餘來自特殊材料、精密設備暨零組件及勞務等。特殊氣體產品包括C4F8、C4F6與SiF4，應用於蝕刻及製程腔體清洗，另有ArF雷射混合氣。公司提供ReBirth矽晶圓去膜重生服務，並開發LADY玻璃通孔基板及用於CPO的光纖陣列對準玻璃平台。銅磁晶片應用於Mini／Micro LED載板；子公司呈智科技則製造去光阻相關濕式化學品。
