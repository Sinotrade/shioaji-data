summary_short: 以半導體特殊氣體為主要收入，另提供TGV玻璃載板、晶圓除膜及濕式化學品。
summary_long: 晶呈科技以半導體製程用特殊氣體為主要營收來源，2026年上半年占集團營收92.73%，TGV、濕式化學品及其他業務分別占1.98%、2.14%與3.15%。特殊氣體產品包括蝕刻用C4F6與微影製程用ArF雷射氣體，另提供ReBirth矽晶圓除膜服務。公司以LADY技術發展TGV玻璃通孔載板，並與創新服務結合銅柱填孔技術，另有CPO光纖對位玻璃基座與Mini／Micro LED用銅磁晶片。濕式化學品由子公司INGEST Corporation製造。具名歷史報導確認曾供貨台積電與聯電。2026年5月另簽約向五甫科技購置竹北廠房。
