summary_short: 以連接線組製造、連接器及電子零組件銷售為主要收入來源。
summary_long: 信邦提供連接線組設計加工、連接器與電子零組件服務，並代理日本廣瀨電機產品。2026年前九月連接線組占合併營收78.24%，連接器及零組件占21.76%；應用領域以工業37.08%最大，其次為通訊及電子週邊19.91%、綠能16.76%、汽車16.46%與醫療及健康照護9.79%。公司產品包含NACS充電槍，以及機器人、商用無人機的連接器與線材。江陰信邦為Enphase製造控制線材；Philips、Vestas及GE醫療業務另有歷史客戶證據。近期事件包括睿信釋股、透過江陰信承新設投資、向進欣昱購置台中港廠房、向億光取得銅鑼土地建物，以及向昇達科出售巨頻持股。
