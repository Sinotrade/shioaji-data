summary_short: 原以玻璃薄化蝕刻代工取得營收，已結束玻璃製程並轉型開發陶瓷材料。
summary_long: 悅城2025年度主要營收來自面板薄化蝕刻代工及TGV通孔蝕刻代工。公司於2026年10月公告，已在2025年結束玻璃基板、TGV、CPO、玻璃加工與玻璃鍍膜等相關產品及製程。年報列示的轉型開發項目包括先進產業用陶瓷材料，以及先進產業用高溫共燒陶瓷基板技術。陶瓷加工方面，公司揭露具備成形、燒結及拋光等製程，提供高度客製化的製程解決方案；上述基板技術則列為計畫開發項目。
