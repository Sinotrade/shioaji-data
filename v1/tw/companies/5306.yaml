summary_short: 以自行車鏈條與傳動零組件為主，另銷售機車鏈條、汽車正時及車庫門傳動零件。
summary_long: 桂盟國際主要經營鏈條與傳動零組件，產品包括自行車鏈條、電動自行車專用鏈條與齒盤、機車鏈條及鏈輪、汽車正時系統，以及車庫門開門機傳動零部件。2025年度營收以自行車傳動產品為主，占72.5%；汽車正時系統占13.4%、車庫門開門機系統占8.2%、機車傳動產品占4.6%。集團透過桂盟企業從事鏈條及車輛零件製造銷售，凱盟提供電動自行車電控售後服務；全仕通實業為其母公司。
