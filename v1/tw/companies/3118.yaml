summary_short: 代理生醫實驗室試劑、耗材與儀器，並提供臨床前試驗服務。
summary_long: 進階以生物醫學產品代理銷售及臨床前試驗服務為主要業務，通路涵蓋細胞培養耗材、抗體試劑與生物醫學精密儀器。2024年營收組成為培養耗材32%、抗體試劑19%、儀器設備及維修服務30%、生技服務19%。細胞培養產品包括培養基、培養皿及血清，免疫相關產品包括抗體與試劑。臨床前試驗服務則提供一般毒理、安全藥理、生殖毒性及基因毒性等試驗，構成產品通路以外的生技服務業務。
