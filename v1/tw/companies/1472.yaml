summary_short: 以營建工程服務賺取收入，透過子公司上鋌營造承攬公共工程。
summary_long: 三洋實業以營建工程服務為主要業務，2024年度營建工程營業淨額為新臺幣23.35億元，占營收100%。集團透過全資子公司上鋌營造承攬政府工程標案，公共工程營造與社會住宅為官網列示的主要營收動能。上鋌營造具甲級營造廠資格，集團主要以統包方式承攬業主委辦工程。另持有泰國子公司Tri Ocean Textile (Thailand) Co., LTD全部股權；該公司於2025年10月決議清算解散，2025年度永續報告書載明清算程序已完成，待當地政府核准。
