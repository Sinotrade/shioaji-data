summary_short: 製造與銷售液態、固態及固液混合鋁質電容器。
summary_long: 金山電及子公司以鋁質電容器的製造與銷售為主，產品涵蓋液態、固態及固液混合型。2025年液態電解電容器占營收75.42%，固態電解電容器占24.58%，液態產品為主要營收來源。公司已量產固液態V-CHIP及100WV固態高壓電容，固液態產品應用包括電動車及5G通訊基礎建設，另有AI Server產品開發。集團直接子公司包括金山開曼及御呈投資，海外電容器製造子公司則包括泰國金山、廣州金立與廣州金日。
