summary_short: 研製光電與半導體測試、雷射設備，並提供晶粒測試分選及設備製造代工。
summary_long: 惠特科技以光電與半導體測試設備、雷射設備及檢測代工服務為主要業務。2025年度營收中，半導體占42.09%、LED檢測占7.42%、雷射精加工占3.28%，其他混合項目占47.21%。產品包含LED晶粒／晶圓點測機、MicroLED測試與轉移設備、功率半導體晶圓點測機，以及用於CPO與矽光子製程的耦光貼合機。公司也提供雷射二極體晶粒測試與分選代工，並布局CoWoS先進封裝雷射加工應用。2024年具名報導指出，惠特承接萬潤的設備代工訂單。
