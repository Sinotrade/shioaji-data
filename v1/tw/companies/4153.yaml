summary_short: 設計製造醫療與工控顯示器，營收以診斷及手術應用為主。
summary_long: 鈺緯以醫療及工控顯示器的設計製造為主要業務，提供OEM與ODM精密顯示器方案。2026年上半年產品應用別營收中，診斷用占66%、手術用占21%、工業用占10%，其他占3%。醫療產品涵蓋放射影像判讀、內視鏡與外科手術、醫療觸控及超音波顯示器，27吋OLED超音波顯示器已量產出貨，官網另列有32吋Mini LED手術顯示器。眾福科技為其母公司，海外子公司涵蓋美國、德國的顯示器銷售及蘇州醫療器械批發與進出口業務。
