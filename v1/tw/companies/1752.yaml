summary_short: 以西藥製劑製造與代工為主，產品涵蓋輸液、注射劑及口服藥。
summary_long: 南光以西藥製劑製造與代工為主要收入來源，2025年度西藥及代工占營收96.34%，醫療器材占3.66%。主要產品包括大型輸注液、即用型注射劑、凍乾注射劑，以及錠劑和膠囊。即用型產品涵蓋預充式注射液與預混式靜脈輸液；輸液軟袋採不含PVC的PP材質，另生產化療及癌症治療用藥。依2026年第二季合併財報，南光持有馬來西亞NANG KUANG PHARM SDN.BHD.全部股權，並持有南光醫管六成股權。
