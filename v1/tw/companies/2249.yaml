summary_short: 製造與銷售汽車售後維修用空調壓縮機、熱交換器及零部件。
summary_long: 湧盛電機以汽車空調壓縮機及熱交換器的製造與銷售為主，產品主要應用於汽車售後維修市場。2025年合併壓縮機收入為25.69億元，熱交換器為6,381.9萬元，另有其他產品收入。官網列示供應OE及AM壓縮機，熱交換器包括水箱與冷凝器，並提供零部件。公司已完成油電混合車及電動車空調壓縮機開發，且建置生產與實驗設備。日本子公司Sinlin Automotive Co., Ltd.從事汽車零件零售，2025年底持股95%。
