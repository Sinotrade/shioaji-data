summary_short: 以電力資訊新能源及電子代工為主要營收來源，兼營家電與不動產。
summary_long: 大同2025年合併營收中，電力資訊新能源占48%、電子代工占41%、消費電子占9%，不動產與其他事業各占1%。電力產品包括變壓器、配電盤、氣體絕緣開關、工業馬達及柴油發電機，另開發電動巴士馬達與驅動器。台電有供貨揭露，台積電則列於官網歷史重電實績。集團主要子公司包括精英電腦、大同世界科技、福華電子及大同智能。2024年不動產處分由資產子公司執行；2026年另成立全球控股公司，規劃以現金及海外子公司股權增資，並推出整合電力、冷卻及算力的TTG AIDC CUBE模組化資料中心方案。
