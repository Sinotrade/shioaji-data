summary_short: 研發眼科及腫瘤抗體新藥，以藥物授權及相關變動價金為收入來源。
summary_long: 圓祥生技以抗體及蛋白藥物研發與授權為業務，開發眼科及腫瘤新藥。IBI302針對濕性黃斑部病變與糖尿病黃斑部水腫，已達成第三期臨床試驗主要療效指標。AP505針對肝癌、大腸直腸癌等適應症，已在中國進入第二期臨床。AP203開發非小細胞肺癌等實體瘤療法；AP402針對既有HER2標靶治療後復發或無效的乳癌與胃癌；AP601則針對三陰性乳癌等實體瘤。全資子公司APBIO PTY LTD執行AP601澳洲臨床試驗。
