summary_short: 新藥研發公司，收入來自銷貨、授權及勞務服務。
summary_long: 順藥的主要藥物及研發專案涵蓋術後止痛、急性缺血性中風、神經損傷相關疾病及實質腫瘤。LT1001為已在台灣上市的納疼解長效止痛針劑；LT3001為中風新藥，官網載明已完成兩項2b期臨床試驗。研發專案另包括神經疾病外泌體LT6001及實質腫瘤專案CS028。2025年上半年合併營收包含銷貨、授權、勞務收入及其他。集團子公司包括開曼Lumosa Therapeutics與顥晟生醫，並透過開曼公司持有上海晟順。
