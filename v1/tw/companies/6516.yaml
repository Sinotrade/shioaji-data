summary_short: 以電子地圖、導航軟體、車載系統及自駕營運提供智慧交通服務。
summary_long: 勤崴國際以電子地圖、導航軟體及車載系統提供智慧交通資訊服務。2025年度營收以導航軟體及車載系統占52%為主，其餘為電商服務及其他23%、電子地圖12%、自駕營運10%及系統整合服務3%。產品包括地圖與路徑規劃API、導航王手機及車機導航、車聯網平台與商業車隊管理服務，提供定位、路況資訊及車隊監控。自駕方案整合感測辨識、決策、車輛控制與車隊管理，應用於接駁及廠內物流運輸。
