summary_short: 以音訊IC設計為主，提供USB音效晶片、DSP及聲學軟體技術。
summary_long: 驊訊以音訊IC設計與聲學軟體技術為核心，2025年度合併營收以IC部門為主，另有文創部門。主要產品包括USB音效編解碼器、Audio DSP及無線遊戲耳機音訊方案，應用涵蓋耳機、麥克風與電腦周邊。Xear音效技術提供AI音訊及語音處理；2025年發布Xear 3D Sound Anchor無線遊戲耳機方案。集團直接子公司包括驊訊投資與驊訊文創，並透過驊訊文創間接控制全球好音樂多媒體。
