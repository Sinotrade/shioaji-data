summary_short: 透過美國子公司提供化合物半導體晶圓代工，並銷售PD等自有光電元件。
summary_long: 環宇-KY透過美國全資子公司GCS,USA經營射頻晶圓代工、光電晶圓代工及自有光電元件。2026年第二季自有品牌光電元件AOC占營收61%，射頻晶圓代工約23%，光電晶圓代工約10%。產品涵蓋資料中心高速光通訊用PD，另有70mW CW Laser量產並小量出貨。具名客戶包括中際旭創、AAOI、Lumentum及Coherent，其中中際旭創被公司稱為最大客戶。2024年董事會通過由美國子公司向晶成購置設備，並於同年8月出售全部晶成股權予晶元光電。2026年另公告增資美國子公司，以及處分部分常州承芯股權。
