summary_short: 以智慧聯網系統整合及寬頻網路傳輸設備為主要收入來源。
summary_long: 達運光電以智慧聯網與寬頻網路設備為兩大業務，2025年營收占比分別為69.02%及28.15%，其他業務占2.83%。智慧聯網提供物聯網智慧監測服務平台及複雜系統建置，寬頻產品涵蓋GaN射頻放大器、頭端光傳輸設備、光纖節點工作站，以及GPON光纖到戶設備。官網另列無人機偵測與反制系統，整合多感測器、光學追蹤與定向干擾。艾斯特物聯科技為旗下子公司，專注智慧聯網應用與國防工業。
