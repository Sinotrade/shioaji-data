summary_short: 主要銷售幹細胞分泌物，並提供細胞製劑服務及研發幹細胞新藥。
summary_long: 向榮生技主要銷售幹細胞分泌物，並提供細胞製劑相關勞務。2026年上半年營收為新台幣1,087.3萬元，其中幹細胞分泌物銷貨860.1萬元，為最大收入來源；另有其他銷貨、細胞製劑及其他勞務收入。公司研發幹細胞產品ELIXCYTE，涵蓋膝骨關節炎與慢性腎臟病臨床研究，並提供製程開發、GMP生產及法規支持的CDMO服務。其他主要產品與服務包括膝骨關節炎自體脂肪幹細胞治療、化粧品用人源外泌體原料，以及UnicoVial超低溫生物製劑儲存容器。
