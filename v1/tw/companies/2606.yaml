summary_short: 以散裝船承運鐵礦砂、煤礦、穀物及水泥，主要收入來自航運。
summary_long: 裕民以乾散貨海上運輸為主要業務，承運鐵礦砂、煤礦、穀物及水泥等大宗物資。2026年上半年合併損益表揭露，航運收入占營收99%，其他營業收入占1%，比例為報表整數呈現。公司另提供船員管理服務，涵蓋招募、派遣及培訓；船舶管理則由全資子公司裕民（廈門）國際船舶管理有限公司經營。其營運子公司包括裕民航運新加坡私人有限公司、裕民航運香港有限公司與裕民風能航運股份有限公司，2026年6月底直接持股均為100%。
