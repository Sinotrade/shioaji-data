summary_short: 以散裝乾貨海運為主，承運礦砂、煤炭、穀物及水泥。
summary_long: 裕民主要提供鐵礦砂、煤炭、穀物及水泥等散裝物資海運服務，2026年上半年航運收入占合併營收99%。2024年度具名客戶包括Rio Tinto Shipping、Anglo American Marketing及BHP Billiton Freight Singapore；另有Vale鐵礦石長約、亞洲水泥銷貨及台電燃煤運輸與船舶代管業務。主要營運子公司包括新加坡、香港及裕民風能。公司與川崎汽船合作投資LNG運輸，裕民風能則與Purus合資拓展離岸風電運維服務。新加坡子公司於2024至2026年間，向新大洋、大島、恆力、青島北海及江蘇韓通等船廠簽訂散裝船建造合約。
