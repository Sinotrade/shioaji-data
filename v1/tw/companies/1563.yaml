summary_short: 以鍛造鋁合金輪圈為主要收入來源，另提供懸吊零件與再生鋁材。
summary_long: 巧新以鍛造鋁合金輪圈為主要收入來源，產品應用涵蓋轎車、豪華車、跑車、休旅車、油電混合車與電動車。2025年鍛造鋁圈占營收90.88%，鋁材占4.52%，其餘懸吊件、配件及模具設計開發等收入占4.60%。主要產品另包括汽車懸吊系統鍛造零件與RESAICAL®回收再生鋁，並投入半導體設備關鍵零組件與耗材的原料研發及製程優化。集團子公司包括德國SuperAlloy Manufaktur GmbH及伽億股份有限公司。
