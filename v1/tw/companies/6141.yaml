summary_short: 製造與銷售印刷電路板，產品包括半導體測試板、HDI及軟硬結合板。
summary_long: 柏承科技以印刷電路板製造與銷售為核心，2025年印刷電路板占營收100%。台灣廠提供半導體測試板及全製程自製服務，可承接急件樣品與小量生產。集團產品包含HDI高階電路板及HDI軟硬結合板，應用涵蓋5G通訊模組、物聯網與Mini／Micro LED直顯屏。零件封裝載板列為樣品階段。昆山與南通營運公司為間接子公司，業務均為印刷電路板生產及銷售。
