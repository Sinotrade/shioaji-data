summary_short: 透過加盟與線上線下通路提供團體旅遊、自由行及客製化旅遊服務。
summary_long: 旅天下經營旅遊商品與服務，產品包括國外團體、國外自由行及客製化旅遊方案，並以加盟模式整合線上與實體通路。其旅遊服務涵蓋不同出遊形式，客製化方案則依消費者需求規劃。依2025年前三季合併財報，旅遊部門為主要收入來源，其他部門為子公司旅報傳媒的雜誌出版業務。截至2025年9月底，合併子公司包括雙獅聯合國際旅行社、旅報傳媒及澳洲Unitiger Pty. Ltd.；其中Unitiger持股49%，財報依實質控制力將其納入合併。
