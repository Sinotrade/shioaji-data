summary_short: 經銷半導體零組件，以DRAM與Flash記憶體銷售為主。
summary_long: 至上電子經銷半導體零組件，並提供整合與應用諮詢服務。2026年1至7月合併銷售組成為DRAM占63%、Flash占25%、AP/PA占7%、Driver IC占2%、LED/OT占2%及TFT/LCD占1%。記憶體產品包含DRAM、SSD、MCP與eStorage，應用於手機、PC、伺服器及車載裝置；法說會亦明列AI伺服器與5G網通應用。高達能源科技股份有限公司為其子公司。
