summary_short: 以聚酯纖維加工絲為主要業務，另經營不動產租賃。
summary_long: 聯發紡織纖維的主要業務為聚酯纖維加工絲及不動產租賃。2025年度年報列示，聚酯纖維加工絲占營業比重82.74%，不動產租賃占17.26%，整體業務仍以紡織纖維為主。公司揭露的產品包括環保纖維、易拉絲及吸濕排汗纖維。集團子公司包括杭州聯發纖維有限公司、金聯發實業股份有限公司及LAN FA HOLDING LIMITED。其中杭州聯發於2007年正式投產；年報列示聯發對LAN FA HOLDING LIMITED持股100%。
