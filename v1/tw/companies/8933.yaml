summary_short: 以自行車整車OEM／ODM代工為主，並銷售半成品與零組件。
summary_long: 愛地雅以自行車整車OEM／ODM代工為主要業務，並提供客製化設計及整車規劃服務。2025年度營收組成為自行車成車85.90%、半成品與零組件12.65%、其他1.45%，收入以整車為主。商品涵蓋登山車、城市車、跑車及電動輔助自行車。依114年度年報，子公司包括愛地雅（東莞）自行車有限公司及Ideal Europe Sp Zo. O.；前者由公司直接持股33.45%，加計間接持股後為100%，後者由公司直接全資持有。
