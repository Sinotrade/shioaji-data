summary_short: 以注射劑製造銷售為主，另有血液透析製劑、外用藥及代工業務。
summary_long: 濟生從事西藥製劑研發與生產，主要產品包括大型輸液、小型注射劑及血液透析濃縮液系列。2025年度營收以注射劑為最大來源，占60.84%；代工及其他占23.43%，外用藥占10.28%，口服製劑占3.43%，醫療器材占2.02%。血液透析製劑包含濃縮液、透析用粉劑與腹膜透析液；外用藥包括沖洗用食鹽水，醫療器材包括隱形眼鏡沖洗液與保存液，產品組合涵蓋注射、透析及沖洗相關用途。
