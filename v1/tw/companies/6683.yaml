summary_short: 以IC測試載板、老化測試載板及晶圓探針卡測試載板的設計製造與銷售為主。
summary_long: 雍智科技主要提供半導體測試載板，產品包括IC測試載板、老化測試載板及晶圓探針卡測試載板。2025年後段測試載板占營收61.58%，前段測試載板占36.46%，其他業務占1.96%。具名報導指出聯發科為第一大客戶，歷史客戶名單亦包含瑞昱、世芯、創意、日月光與京元電子。海外布局包括美國子公司KSMT USA CORPORATION、薩摩亞投資子公司及上海芯埕科技孫公司。2024年董事會另通過向保樂資產管理購置竹北不動產，公告交易金額為新台幣433,750,000元，用途為自用辦公室。
