summary_short: 以手機、電腦及消費性電子的設計製造服務為主，並提供AI伺服器與網通設備。
summary_long: 和碩提供資訊、通訊及消費性電子產品的設計與製造服務，產品涵蓋筆電、桌機、主機板、伺服器、智慧型手機、遊戲機及平板。2025年3C產品占合併營收91.27%，其他產品占8.73%。Apple為iPhone組裝客戶；墨西哥廠供應Tesla車用電子。公司開發NVIDIA GB300 NVL72機櫃及自製CDU，並提供5G專網設備，與Intel、Qualcomm、Together AI及5C有具名合作。景碩、鎧勝及華擎列入合併子公司。2025年印度PTI增資後持股降至40%並失去控制，同年公告向宏達電買廠、出售新店廠，以及透過子公司取得德州廠房；2026年再取得墨西哥廠房。
