summary_short: 製造及銷售調製應用顏料、合成有機顏料與塑膠著色用色母。
summary_long: 大恭主要製造及銷售合成有機顏料與調製應用顏料，2025年營收比重分別為30%與67%，其他占3%。合成有機顏料包含顏料色粉與濕式色餅，可供油墨、塑膠、橡膠及塗料等製品著色。調製應用產品包括PVC用色餅、色砂、色膏，聚烯烴用色母與色母粉，以及PU合成皮革用色片與色膏；水性顏料則用於印花、壓染及水性塗料。海外透過間接子公司大恭精細化工（昆山）有限公司，從事加工顏料製造及銷售。
