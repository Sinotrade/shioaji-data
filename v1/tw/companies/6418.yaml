summary_short: 製造銷售訊號連接器與傳輸線，兼營PCBA及金屬端子加工。
summary_long: 詠昇主要製造及銷售訊號連接器與訊號傳輸線，亦提供PCBA及金屬端子加工。2025年營收組成為連接器50%、連接線35%、電子產品4%、其他產品11%。產品包含USB Type-C連接器、連接線與轉接器，應用於電腦資訊、電信、醫療及汽車配件等領域。截至2025年9月底，集團設有直接子公司Bravo Tech Holdings Limited，並透過海外控股公司持有東莞伸東電子有限公司等間接子公司。
