summary_short: 透過子公司經營醫療設備經銷、出租維修及藥品與保健食品通路。
summary_long: 承業醫透過子公司經營醫療通路與服務，集團業務涵蓋醫療儀器經銷、出租、維修，以及藥品與保健食品銷售。2025年營收組成中，藥品及保健食品等銷售及其他占37.11%，醫療儀器設備銷售占29.30%，出租收入占25.35%，勞務收入占8.24%。醫療產品涵蓋放射腫瘤、神經醫學、影像醫學、眼科及外科設備，另提供整合性放射腫瘤資訊系統iROIS與輻照服務。旗下包括久和醫療、九和科技、新和生物科技及富康活力醫藥等子公司。
