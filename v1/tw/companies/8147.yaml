summary_short: 以高速高頻與圓形連接器、電子構裝及散熱相關產品取得收入。
summary_long: 正淩以連接器及電子構裝為主要收入，2026年前八月營收分別占69%與26%，其他產品占5%。公司設計、製造與銷售高速高頻及圓形連接器，並提供背板、機箱零組件、散熱模組與壓接設備。高速互連產品用於交換機、通訊設備與網路卡，圓形連接器及客製化線束則支援射頻等非侵入式醫療應用。公司亦提供AI伺服器與資料中心相關連接及散熱方案，推出無人機電源連接器，並供應採用冷板的ATR液冷機箱。
