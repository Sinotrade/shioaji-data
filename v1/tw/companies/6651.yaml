summary_short: 研發與供應MOSFET、電晶體、二極體等功率半導體元件。
summary_long: 全宇昕從事功率元件的設計研發與供應，產品應用涵蓋電腦、消費性電子、通訊及工業領域。主要產品包括MOSFET、電晶體與二極體，官網也列有積體電路產品分類。寬能隙半導體方面，公司列有碳化矽蕭特基二極體，產品清單包含SCD06065BJ2N與SCD06065BFT兩款料號，作為其碳化矽元件業務的直接產品證據。
