summary_short: 以KTV包廂歡唱及囍宴餐飲服務為主要收入，另經營火鍋與鐵板燒品牌。
summary_long: 享溫馨以KTV視聽歌唱及囍宴餐飲服務為主要業務，設置包廂與視聽伴唱設備，並提供現場烹調的中式料理、飲品、甜點及宴席，供消費者內用或外帶。2025年度視聽歌唱營收占74.65%，囍宴餐飲占25.35%，前者為最大收入來源。依2026年4月刊印年報，公司在臺灣經營16家視聽歌唱據點及4家大型宴會餐廳，另有3家「打享野鍋」與1家「御享鐵板燒」，提供歌唱娛樂及多種餐飲服務。
