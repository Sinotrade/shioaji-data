summary_short: 製造汽車、醫療、硬碟及半導體設備精密金屬零件，並供應AI液冷接頭零組件。
summary_long: 智伸科技從事精密金屬零組件製造與加工，汽車產品涵蓋煞車安全、燃油噴嘴及溫控系統，非車用產品包括外科手術與骨科醫療零件、硬碟精密零件、自行車避震系統及半導體設備零組件。2025年汽車營收占55.19%，電子占15.16%、醫療占11.03%、運動占8.26%，其他占10.36%。年報揭露的客戶包括Continental、Bosch、Delphi及Seagate，其中Seagate於2025年占銷貨淨額14.16%。公司另量產AI伺服器液冷快速接頭關鍵零組件，媒體具體報導其供應ASML微影設備自動化套筒與滑軌。集團並透過子公司執行嘉興廠房買賣及越南廠房租賃、設備取得。
