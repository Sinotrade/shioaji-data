summary_short: 承作石化化工廠房、高科技機電及公共工程的規劃、設計與施工。
summary_long: 擎邦以產業廠房與公共工程的規劃、設計及建造服務為主要業務。2025年石化及化工工程占營收55.50%，捷運、發電廠、空調機電系統及公共工程占42.51%，其他占1.98%。服務涵蓋石化化工廠、半導體與資料中心的整廠機電整合，以及特高壓電纜洞道等公共工程，並提供無塵室、空調、消防、給排水等系統工程。公司亦協助導入能源管理與工廠智慧化系統；2025年底全資子公司包括誠新建設及美國德州公司。
