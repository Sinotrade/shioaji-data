summary_short: 研發、製造居家醫療器材，以紅外線溫度計及電子血壓計為主要營收來源。
summary_long: 豪展以居家醫療器材的研發、製造及行銷為主要業務，歐美市場以OEM、ODM模式為主。2025年紅外線溫度計與電子血壓計產品線的營收比重各為40%，其他產品占20%。溫度量測產品包括非接觸式額溫槍及紅外線額耳溫槍，其他主要產品涵蓋電動吸鼻器、霧化器與血氧機。集團直接持有模里西斯投資子公司及Double Harvest Inc.，並透過後者持有吳江、蘇州與泰國三家孫公司。
