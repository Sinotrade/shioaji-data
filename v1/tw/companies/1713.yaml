summary_short: 製造氧化鋅、吊白塊、重亞硫酸鈉等特用化學品。
summary_long: 國化主要製造氧化鋅、吊白塊、重亞硫酸鈉、保險粉及鋅粉等特用化學品。2025年度氧化鋅占營收41.51%，吊白塊占28.87%，重亞硫酸鈉占19.69%，保險粉占9.31%，其他占0.62%。氧化鋅用於橡膠、陶瓷及電子材料；吊白塊可作還原漂白劑及合成橡膠製造助劑。重亞硫酸鈉可用於造紙漂白、紡織脫氯與水處理，保險粉用於染整及漂白，鋅粉則用於防鏽塗料與化學還原用途。
