summary_short: 以西藥口服液劑及子公司豐華的益生菌產品、代工服務取得營收。
summary_long: 晟德的營收業務涵蓋西藥製劑及子公司豐華生技的益生菌產品與代工服務。晟德本體專精多元疾病類別口服液劑與特殊藥物開發，官網將產品分為一般用藥及中樞神經作用劑，年報亦揭露持續開發學名藥。2024年合併營收中，西藥占60.06%，益生菌占39.94%。豐華為晟德全資子公司，提供菌粉研發製造與ODM整合服務；公司另揭露，豐華於2026年第一季約貢獻集團53%營收，該季占比與全年營收組成採不同期間。
