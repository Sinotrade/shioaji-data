summary_short: 開發、製造及銷售DRAM記憶體產品、記憶體模組與SSD等儲存產品。
summary_long: 凌航科技以記憶體與儲存方案開發及銷售為主，核心產品包括DRAM IC、NAND Flash IC、記憶體模組及SSD。模組涵蓋DDR4與DDR5，應用於電腦、電競、工控及伺服器，並提供寬溫與ECC規格。SSD涵蓋NVMe與SATA介面，以及AI運算用企業級儲存產品。2025年DRAM記憶體產品占營收80.9%，快閃記憶體產品占19.0%，其他占0.1%。官網亦列有經資料中心驗證的PowerEdge系列相容記憶體。
