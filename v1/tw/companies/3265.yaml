summary_short: 以晶圓凸塊、覆晶封裝及晶圓測試服務取得營收。
summary_long: 台星科提供晶圓凸塊、覆晶封裝與晶圓測試服務，公開報導指出封裝營收比重高於測試，測試則以CP晶圓測試為主。2026年公司表示FCBGA已進入量產，並與客戶合作建立2.5D及CoWoS製程能力；矽光子相關業務以凸塊技術延伸至PIC、EIC光學引擎封裝，持續開發CPO與NPO產品。媒體具名列出的客戶包括聯發科、超微、博通及邁威爾。格星為直接母公司，台星測企業為子公司。近三年重大事件包括當時子公司台星科企業購置竹科廠房、公告與該子公司的簡易合併安排，以及向愛德萬測試、東京威力科創與致茂電子採購設備。
