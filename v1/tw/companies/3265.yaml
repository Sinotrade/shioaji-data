summary_short: 提供半導體晶圓級封裝、凸塊封裝與晶圓及積體電路測試服務。
summary_long: 台星科以半導體封裝及測試服務為主業，2025年晶圓級封裝服務占營收60.06%，測試服務占38.98%，其他占0.96%。主要服務包括晶圓與積體電路測試、晶圓級晶粒尺寸封裝、銅柱無鉛銲錫凸塊與覆晶封裝，並提供晶圓薄化、切割及挑揀服務。晶圓級晶粒尺寸封裝可採植球或電鍍球製程；覆晶封裝亦提供多晶片整合。依2026年第二季財報，直接母公司為格星，最終母公司為矽格；台星測企業為全資子公司，從事工業廠房開發租售。
