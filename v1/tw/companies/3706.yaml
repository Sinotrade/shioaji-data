summary_short: 以神雲伺服器設計製造為主要營收，另經營車用電子與智能服務。
summary_long: 神達控股透過神雲科技、神達數位及神達電腦經營相關事業。2026年第一季，神雲科技占合併營收90.1%，神達數位占7.8%，神達電腦占2.1%。神雲提供伺服器ODM與機櫃整合服務，並展示52U AI液冷整機櫃；其TYAN伺服器品牌於2024年10月整合至MiTAC。神雲與AMD共同開發伺服器平台，並與Intel、NVIDIA、Samsung及Micron有具名技術或產品合作。神達數位提供Mio行車記錄器。近年事件包括越南子公司增資建廠、神雲投資設立美國子公司、取得楊梅土地使用權，以及神達電腦公告擬處分新聚思持股。
