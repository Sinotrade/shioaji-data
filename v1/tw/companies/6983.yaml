summary_short: 設計、製造及銷售半導體光罩與晶圓影像檢測設備及模組。
summary_long: 華洋精機主要從事視覺影像檢測設備、自動化系統及客製化影像模組的設計、開發、製造與銷售。2025年營收以影像檢測設備為主，占72.05%，影像檢測模組占16.30%，其他業務占11.65%。主要產品包括EUV光罩檢測機Aurora-E、DUV光罩檢測機Aurora-D，以及用於晶圓刮傷檢出的IWIA-CMP線上檢測模組。公司另已開發14吋光罩檢查機，應用於CoWoS製程；依其檢測產品用途，可歸入半導體設備產業及EUV、CoWoS設備題材。
