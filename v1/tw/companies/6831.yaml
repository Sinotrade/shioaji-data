summary_short: 以均溫板、熱導管及氣冷、液冷散熱模組研發製造與銷售為主。
summary_long: 邁科主要從事散熱模組研發、製造與銷售，2025年度散熱模組占營收99.95%。產品包括均溫板、3DVC、熱導管、水冷板、冷卻液分配裝置及浸沒式水冷槽，應用涵蓋AI伺服器、筆電、顯示卡與5G基地台。公司與Intel共同開發浸沒式散熱方案；2024年具名報導的客戶包括華碩、智邦及神達。主要關係企業包括薩摩亞、越南子公司，以及間接投資的惠州惠立勤。公司於2024年向德林資訊電子購入土地及建物，惠州孫公司同年取得廠房使用權；2025年底與2026年10月另決議增資越南子公司。
