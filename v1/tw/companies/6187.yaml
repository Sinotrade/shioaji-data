summary_short: 以半導體封裝用點膠、貼合、AOI及自動化設備為主要業務。
summary_long: 萬潤以半導體後段封裝設備為主要業務，2025年6月報導指出該類設備營收比重逾九成。產品涵蓋精密點膠、高精度貼合、AOI外觀檢測及自動化整線設備，另提供光耦合與面板底部填膠設備，應用於先進封裝及CPO製程。具名客戶包括台積電、日月光半導體與矽品精密。已確認的子公司包括美國及日本萬潤、聯潤科技、三雄精密及鉑潤投資。近三年公告事件包括楠梓、竹南與臺中不動產取得、三雄股權投資，以及美國、日本與鉑潤子公司的新增投資額度。
