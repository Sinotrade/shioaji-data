summary_short: 製造與銷售PVC塑膠布，以一般塑膠布為主要營收來源。
summary_long: 世坤主要從事PVC塑膠布製造與銷售，產品包含一般、加壓、貼合及半硬質塑膠布。2025年營收以一般塑膠布為主，占71.52%；半硬質塑膠布占13.72%，加壓及貼合塑膠布分別占9.33%與5.43%。加壓產品包含透明PVC膠布，公司另提供可客製顏色與紋路的不透明壓紋膠布。貼合PVC厚膠布採多層緊密貼合技術，最多一次結合六層，以增加材料的耐用性。
