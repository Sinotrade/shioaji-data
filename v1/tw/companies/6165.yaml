summary_short: 集團以浪LIVE直播平台虛擬貨幣銷售及打賞服務為主要收入來源。
summary_long: 浪凡網路科技集團主要經營網路娛樂平台，透過全資子公司旭瑞文化傳媒營運浪LIVE，提供才藝直播與即時互動，並透過平台虛擬貨幣銷售及打賞模式取得收入。集團官網另列示PLAYONE，提供遊戲陪玩與語音社群服務。2026年上半年合併營收為17.22724億元，其中直播平台營運收入15.40661億元，為最大收入來源；商品銷售收入1.62859億元，其他收入0.19204億元。
