summary_short: 製造雷射設備與SMD捲裝材料，並代理半導體及SMT量測設備。
summary_long: 雷科以自製雷射設備、代理設備及SMD捲裝材料為主要業務。2025年度，自製雷射設備及代理設備占合併營收59%，捲裝材料占40.05%，能源及其他占0.95%。捲裝材料包括紙帶、上下膠帶與元件封裝載帶；設備產品涵蓋晶片電阻加工機、晶圓雷射修整機及採用飛秒雷射的TSV晶圓鑽孔機。公司代理的SMT檢測設備已用於CoWoS製程，屬先進封裝設備供應環節。具名公開報導確認，雷科向台積電銷售代理的CoWoS封裝量測設備，設備原廠為Cyber Technologies GmbH。
