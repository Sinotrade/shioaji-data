summary_short: 研發、製造及銷售LED磊晶片與晶粒，以晶粒為主要營收來源。
summary_long: 光鋐科技以LED磊晶片及晶粒的研發、設計、製造與銷售為主要業務，產品涵蓋藍、綠、紅、黃、不可見光、紫外光及深紫外光。官網列有高亮度四元晶片與InGaN藍綠光大功率晶片，應用涵蓋照明、監控及醫療設備。2025年合併產品收入中，晶粒約占90.92%，其他約占9.08%。2024年年報列有高壓Mini LED及微型Micro LED等開發成果。集團透過卓佳有限公司持有蘇州興光宏光電有限公司，後者從事LED晶片、晶粒及藍寶石基板買賣。
