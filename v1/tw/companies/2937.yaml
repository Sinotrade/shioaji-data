summary_short: 透過百貨專櫃、門市及電商銷售影音家電，提供影音與空調工程服務。
summary_long: 集雅社以影音家電銷售與整合為主要業務，透過百貨專櫃、門市零售及電子商務等通路經營。依114年度年報揭露，影音家電占營業收入98.96%，非影音家電占1.04%。銷售商品亦涵蓋電冰箱、洗衣機及乾衣機等生活與廚房家電。服務項目包括依居家空間需求規劃影音系統、安排器材配置與佈線施工，以及商用空間的影音規劃與安裝。另提供空調工程規劃及安裝服務。集盛股份有限公司為其全資子公司。
