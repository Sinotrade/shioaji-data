summary_short: 製造天線、天線模組與壓電陶瓷元件，並提供超音波感測及電路保護產品。
summary_long: 詠業的主要產品包括無線通訊用天線與天線模組、壓電陶瓷元件，另提供超音波感測器及過電壓、過電流保護元件。2026年第二季營收組成以電子陶瓷元件占65%最高，模組與系統產品占28%，其他電子零組件占7%。公司官網列有結合5G NR、4G LTE及GNSS的多合一天線產品，可歸入5G通訊零組件題材。達方電子為其母公司；子公司包括Unicom Technologies、越南公司及間接持股的詠業科技（深圳）有限公司。
