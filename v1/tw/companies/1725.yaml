summary_short: 經銷工業化學品、溶劑、塑膠原料與油品。
summary_long: 元禎以工業用化學品、溶劑、塑膠原料與油品的經銷貿易為主要業務。2025年合併營收以化學品占39%最多，其次為塑膠35%、油品25%，其他占1%。化學品涵蓋溶劑與特用化學品；塑膠品項包含PVC及POM工程塑膠，油品則有基礎油與食品級白油。集團在上海、廣州及越南設有間接子公司，並直接持有元欣投資與泰國子公司；泰國公司的年報正式名稱為元禎化工貿易(泰國)股份有限公司。
