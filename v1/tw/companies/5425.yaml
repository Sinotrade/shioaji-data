summary_short: 經營功率半導體，並透過鼎翰銷售條碼印表機；合併營收以印表機為主。
summary_long: 台半集團經營整流器與條碼印表機兩項事業，條碼印表機由子公司鼎翰科技經營。2025年合併營收中，條碼印表機占64.21%，整流器占35.79%，依最大營收來源歸入周邊與輸入裝置。台半半導體產品涵蓋整流二極體、MOSFET、TVS保護元件及電源管理IC，其中電源管理產品包括LED驅動器與類比IC。公司另推出1200V碳化矽蕭特基二極體，官方列示應用包含電動車快速充電站，可對應碳化矽元件及電動車功率元件題材。
