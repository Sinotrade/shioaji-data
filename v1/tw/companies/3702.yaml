summary_short: 透過旗下通路事業代理經銷半導體零組件，並提供採購與設計整合服務。
summary_long: 大聯大透過旗下通路事業代理經銷半導體零組件，並提供採購與設計整合服務。2025年營業比重以核心元件37.45%及記憶元件27.68%為主，其餘包括類比及混合訊號、離散及邏輯、光學與被動及連接器元件。官方代理頁列有Infineon、NXP、Intel、Alliance Memory、旺宏與群聯，承接業務的集團成員各有不同。集團架構調整後由世平與詮鼎構成通路雙核心，友尚與品佳轉為詮鼎旗下公司。近三年公告包括投資零壹、公開收購華經、參與鑫聯大增資及內部物流股權整合；另有電動車與機器人應用方案。
