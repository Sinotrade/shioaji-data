summary_short: 以中式餐飲、婚宴及外燴為主，另經營自助百匯與精緻餐飲。
summary_long: 新天地主要經營中式餐飲與宴席，提供套餐、宴席及外燴服務。2025年度中式餐飲及宴席占營收79.60%，其他餐飲等占20.40%。其他餐飲服務涵蓋自助百匯、精緻鐵板燒、火鍋與團膳，並提供室內外證婚及包套式婚房服務。公司亦提供商務活動場地租借，可供產品發表會、企業年會及大型會議使用，場地配置可依活動需求調整。公司直接持有新薇股份有限公司70%股權。
