summary_short: 主要製造與銷售不鏽鋼冷、熱軋鋼捲，另提供抗菌鋼材與硬板。
summary_long: 唐榮以不鏽鋼冷、熱軋鋼捲為主要產品，2025年度年報營業收入比重表列不鏽鋼等銷貨收入占100%，勞務收入占0%。鋼捲產品涵蓋200系、300系與430鋼種；200系用於室內裝潢與餐具，300系可用於室外管線、儲水塔、工業設備及儲油槽，430則用於建築裝飾、家庭用器具與家電零件。公司另提供202、304、316抗菌不鏽鋼捲及製品，以及301、304、316L硬板，硬板可供扣件、彈簧片與電腦、手機零組件使用。
