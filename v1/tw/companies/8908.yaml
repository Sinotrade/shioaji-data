summary_short: 以高雄地區天然氣供應為主，兼營管線設計裝置與太陽光電售電。
summary_long: 欣雄主要透過導管供應高雄地區天然氣，服務鳳山、大寮等十六個行政區的家庭與工商用戶，供氣範圍亦涵蓋多處產業園區。114年度年報列示天然氣收入占95%，裝置及其他收入占5%。除天然氣銷售外，公司提供供氣管線設計與裝置服務，並經營太陽光電發電售電。依115年第一季合併財報，雄緯投資為直接子公司；集團另透過子公司持有開泰、欣雄建設實業、欣亞電能、日耀能源科技與欣雄營造，分別經營太陽光電、不動產開發、汽電共生、能源技術服務與綜合營造。
