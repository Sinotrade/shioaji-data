summary_short: 以攝影機、影像處理器、車載錄影設備及工業電腦銷售為主要業務。
summary_long: 慧友電子以影像監控設備、網路影音傳輸系統及工業電腦為主要產品。2025年營收組成以CCD電子攝影機31.06%最高，其次為影像處理器27.43%與工業電腦26.16%，網路音視訊傳輸系統占3.04%，其他占12.30%。產品涵蓋車載數位錄影主機、邊緣AI運算平台，以及採用NVIDIA Jetson Orin NX的EAR-30N3機器人控制器。主要海外子公司包括慧友電子美國、日本公司及慧友安控電子深圳公司，年報列示均由慧友全資持有。
