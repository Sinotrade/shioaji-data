summary_short: 經營LINE Pay支付平台，主要賺取交易手續費，另提供金融推廣與系統服務。
summary_long: 連加網路商業透過 LINE Pay 提供第三方支付與交易款項清分，以手續費為主要收入。2025年手續費收入占81.90%，金融推廣合作占14.06%，系統管理服務占1.70%，其他收入占2.34%，並提供廣告行銷商品。全資子公司 LINE Pay Plus Corporation 從事系統平台開發與維護；連加電子支付則經營電子支付業務，LINE Pay Money 已正式上線。直接母公司為 LINE Financial Corporation。
