summary_short: 製造銷售尼龍與聚酯加工絲、原絲、尼龍粒及複合材料。
summary_long: 集盛主要製造與銷售尼龍及聚酯加工絲、原絲、尼龍粒與複合材料。2025年度營收以加工絲占43.4%最高，其次為尼龍粒36.1%、尼龍絲10.3%、複材7.3%，其他業務占2.9%。公司從尼龍粒聚合延伸至抽絲及加工絲，提供機能性與回收再生紗線；尼龍粒應用涵蓋紡絲、工程塑料及薄膜。複合材料包含改質尼龍，另有用於家庭淨水及工業廢水處理的中空纖維膜產品。
