summary_short: 製造及銷售ABF、BT載板與印刷電路板，以ABF載板為最大營收來源。
summary_long: 欣興以製造及銷售IC載板與印刷電路板為主要業務。2026年第二季ABF載板占營收52%、BT載板9%、HDI27%、PCB9%、FPC2%，其他1%；AI資料中心應用占61%。具名供應關係包括NVIDIA高階ABF載板及AMD先進載板；Intel供應商獎名單亦列有欣興。公司是台積電3DFabric聯盟載板夥伴，Apple2023財年供應商名單也列有欣興。2026年重大交易包括購入台灣普利司通湖口廠區、出售湖口廠給矽格，以及投資尖點私募可轉債。子公司包括旭興電子、UNIMICRON (THAILAND)及間接持有的蘇州群策；軟板事業分割予旭興的公告基準日為2026年1月1日。
