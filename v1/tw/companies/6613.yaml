summary_short: 銷售高科技廠化學品、氣體供應設備，並承作製程供應系統整合工程。
summary_long: 朋億以高科技產業製程供應系統設備銷售及系統整合工程為主，2025年營收占比分別為49.32%與46.63%，其餘業務占4.05%。核心產品為高潔淨度化學品供應與分裝系統，並提供特殊氣體供應、濕製程清洗、剝離液再生及綠能環保系統整合。濕製程設備涵蓋晶圓清洗、蝕刻、顯影與剝離，環保系統包括海水淡化與中水回收。母公司為聖暉工程科技，子公司包括寶韻科技、蘇州冠禮、銳澤實業、達德設計及理海技研。
