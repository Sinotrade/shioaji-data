summary_short: 以CCL與PCB自動化設備為主要收入，並提供貼合、塗佈與智慧工廠整合系統。
summary_long: 陽程科技以自動化設備與系統整合為主要業務，供應CCL／PCB製程設備、觸控顯示貼合設備、精密薄膜塗佈設備及客製化產線。2025年CCL及PCB自動化設備占合併營收74.30%，FPD及觸控面板設備占5.35%，其他自動化設備占8.56%。公司亦開發AMR中控與車載系統，以及結合工業型機器人的玻纖物料搬運方案。主要營運子公司包括陽程光電、程瀚科技，以及透過投資公司持有的上海陽程、陽程（佛山）與泰國設備維護公司。
