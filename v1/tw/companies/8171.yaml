summary_short: 提供工程建置服務，並銷售儲能設備與電池模組。
summary_long: 天宇工業從事電池模組、儲能系統與設備，以及再生能源案場開發、系統整合與工程建置。2026年上半年工程收入為新台幣1億1,428.8萬元，高於銷貨收入的1億717.4萬元，另有售電及勞務收入。產品涵蓋工商儲能、AGV鋰電池組及通訊與伺服器機房用BBU備援電池；工商儲能支援備援供電、離峰充電與需量反應。夸克能源為納入合併財報的子公司，天宇持股40.44%，並透過過半數董事席次取得實質控制力。
