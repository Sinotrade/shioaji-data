summary_short: 製造銷售自黏標籤、離型材料、保護膜與工業及電子膠帶。
summary_long: 冠好製造銷售自黏標籤、離型材料、表面保護膜及工業與電子膠帶。2025年產品營收組成為自黏商標74.1%、膠帶10.2%、原紙及離型紙7.02%、其他8.68%。自黏標籤應用於商品包裝與工業用途；離型材料包括離型紙、離型膜及淋膜材料。PI與PET保護膜以薄膜為基材，供電子零件或工業製程保護使用。電子膠帶用於印刷電路板及被動元件製造，QFN膠帶則分為前貼與後貼，用於打線前製程及防止封裝膠溢出。
