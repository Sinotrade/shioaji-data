summary_short: 主要經營加油站油品銷售與汽車運輸，另提供倉儲物流及報關服務。
summary_long: 山隆通運以加油站油品銷售與汽車運輸為主要業務，2025年度年報營業比重表列示，加油站業務占79%，汽車運輸業占21%。運輸服務涵蓋貨物、散裝、油品及危險物品承運，並提供倉儲、配送、訂單處理及庫存管理。合併集團另提供船務報關與汽車維修服務，其中山隆船務報關為全資子公司。2026年6月底，山隆亦全資持有山隆投資與山隆資訊科技；後者原名山隆汽車，於同年6月25日更名。
