summary_short: 承攬住宅商辦、科技廠房與公共土木工程，以綜合營造服務取得收入。
summary_long: 根基營造以綜合營造工程承攬為核心，服務涵蓋住宅商辦、公共及醫療建築、交通與土木橋梁，以及科技廠辦。依2025年度年報揭露，合併營收分為建設工程20.17%、土建工程19.69%及其它工程60.14%，其中其它工程包含高科技與民間廠房等工程。母公司為冠德建設；直接控制的公司包括冠慶機電與捷群投資，年報列示根基對兩家公司持股分別為99.97%與99.98%。
