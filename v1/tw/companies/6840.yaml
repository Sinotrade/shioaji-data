summary_short: 提供電子產品電磁相容、無線通訊、安規檢測與國際認證服務。
summary_long: 東研信超以電子產品檢測與認證服務為主，提供電磁相容、無線射頻與行動通訊、電氣安全及國際市場准入服務。2025年測試及報告收入占63.15%，安規占24.46%，國際市場准入認證占12.16%，其他勞務占0.23%。公司提供5G終端設備測試，並提供AI伺服器、機櫃、電力及液冷設備檢測，涵蓋電磁相容、電氣安全與市場准入驗證。主要營運子公司包括東莞信寶電子產品檢測有限公司及上海信寶檢測有限公司。
