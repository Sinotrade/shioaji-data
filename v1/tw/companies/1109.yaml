summary_short: 以水泥及熟料產銷為主，集團另經營混凝土與乾拌水泥砂。
summary_long: 信大水泥主要從事水泥及熟料產銷，2025年占集團營業比重62.71%，混凝土占12.52%。水泥產品包括卜特蘭水泥、低鹼水泥、平熱水泥，以及高爐與石灰石混合水泥，另有勁好乾拌水泥砂。集團透過Soaring Power Corp.持有江蘇信寧新型建材有限公司，經營水泥與熟料等建材業務。子公司信一預拌混凝土股份有限公司從事混凝土產銷，信泥開發股份有限公司從事房屋租售介紹等業務。
