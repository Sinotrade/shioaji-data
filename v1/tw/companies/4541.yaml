summary_short: 以航太發動機、起落架及半導體設備精密零組件加工賺取營收。
summary_long: 晟田主要從事航太及精密機械零組件加工。2025年航太客供料與自購料業務分別占營收48.60%及19.69%，合計68.29%；半導體設備零組件占25.36%，其他食品與精密機械加工占6.35%。航太產品包括發動機葉片、懸塊與機匣、起落架連桿及活塞，以及致動器氣缸與液壓缸。半導體產品涵蓋設備腔體及真空泵浦精密組件，食品機械產品則包括填充閥體、凸輪及輸送機。
