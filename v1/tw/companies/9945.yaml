summary_short: 以工程承攬、房地銷售、商用不動產及商場經營取得收入。
summary_long: 潤泰新經營工程承攬、房地開發銷售及商用不動產。2025年合併工程合約收入223.65億元，房地銷售收入84.12億元，工程為最大收入來源。子公司潤弘精密承攬建案施工並運用預鑄技術，潤泰精材供應泥作建材。商場採CITYLINK品牌經營，書店業務曾由子公司力勝開發加盟TSUTAYA BOOKSTORE。2025年完成向三菱地所收購開發子公司剩餘30%股權；2026年公告由該子公司向凱基人壽處分玉成廣場，並安排部分標的售後租回。
