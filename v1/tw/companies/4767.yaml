summary_short: 研發、生產及銷售熱熔膠接著劑與建築防水材料。
summary_long: 誠泰科技以熱熔膠接著劑與建築防水材料的研發、生產及銷售為主要業務。熱熔膠應用涵蓋食品包裝、書本裝訂、工業組裝與鞋材貼合；建築材料包括自黏式防水膜、防水底油及防水膠。2025年上半年合併熱熔膠收入為新台幣477,346仟元，防水膜收入為39,593仟元，熱熔膠為主要收入來源。集團透過薩摩亞誠盈持有中山誠泰，並有印度、印尼及越南黏著劑銷售子公司。
