summary_short: 以軟性印刷電路板製造與銷售為主，另提供薄硬板及組裝服務。
summary_long: 旭軟以軟性印刷電路板製造與銷售為主要業務，提供一至七層軟板及一至二層薄硬板，另具軟硬結合板與表面黏著組裝能力。產品應用涵蓋消費電子、車載電子、工業控制及醫療設備，並開發無人機相關應用。2025年合併營收中，軟板收入為新臺幣7億7,215萬4千元，其他營業收入為2,010萬6千元。旭軟全資持有投資公司GOLDEN IMPRESSION L.L.C.，並透過該公司全資持有旭軟電子(深圳)有限公司；深圳子公司從事軟性電路板組裝及加工。
