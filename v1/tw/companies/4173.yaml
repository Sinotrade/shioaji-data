summary_short: 以藥品銷售推廣、經銷物流及醫藥倉儲加工服務取得收入。
summary_long: 久裕以藥品銷售推廣及經銷物流服務為主要業務，2025年合併營收中，銷售推廣占70.75%，經銷物流服務占29.25%。其經銷物流整合客服、招投標、資訊流、金流與物流，提供藥品及醫療器材倉儲物流服務。倉儲業務涵蓋GDP管理、溫控配送及冷鏈超低溫倉儲，包含負20℃與負80℃溫層；公司亦提供GMP醫藥加工服務。佳醫健康事業為其母公司，久裕於2025年底持有裕康國際醫藥100%股權。
