summary_short: 開發住宅及商業大樓，以房地出租、出售取得收入。
summary_long: 潤隆建設主要從事住宅及商業大樓開發，委託營造廠興建後出租或出售，2025年度營建收入占營業比重100%。公司亦辦理都市更新，官網列有新北市中和區圓通段案件。金駿營造為潤隆持股100%的子公司，主要承攬建設營造工程。依2026年第二季合併財報，潤隆的直接母公司為廣陽投資，齊裕營造則為廣陽投資的母公司，構成間接母公司關係；興富發建設為潤隆所屬集團的最終母公司。
