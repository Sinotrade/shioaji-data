summary_short: 以住宅及商業大樓開發、興建與租售為主要業務。
summary_long: 潤隆以住宅與商業大樓的開發、興建及租售為主要業務，2025年營建收入占營業比重100%。土地來源包括自購、與地主合建及都市更新開發。廣陽投資為直接母公司，興富發建設為最終母公司；全資子公司金駿營造承攬潤隆工程。2025年日商華大成台灣分公司占合併進貨淨額10%。近三年交易包括向京城建設購入高雄土地、透過金駿購入台南土地，以及向文鋒實業等購回國賓大苑房地與車位；2026年另公告擬購入台中文商段土地。
