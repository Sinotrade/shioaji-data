summary_short: 從事高階電源管理IC設計與銷售，營收以資訊通訊應用為主。
summary_long: 來頡科技以高階電源管理IC設計與銷售為主要業務。2025年度營收以資訊通訊類產品為主，占75.38%，消費性及其他產品占24.62%。主要產品包括直流轉換器、充放電管理IC、負載開關及線性低壓差轉換器；直流轉換器涵蓋降壓、升壓與升降壓。依2025年第二季合併財報，直接子公司包括從事控股的Blink Electronic及產品研發的M3 Dallas，並透過Blink持有西安與深圳子公司，分別負責產品研發及銷售。
