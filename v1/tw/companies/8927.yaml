summary_short: 以加油站汽柴油零售為主，另經營不動產開發及綠能業務。
summary_long: 北基以加油站汽柴油零售為主要業務，另銷售車用機油，並提供洗車及打蠟服務。2025年汽柴油營收占70.47%，營建業占16.64%，太陽能占8.78%，儲能占0.51%，其他占3.61%。集團透過子公司北基國際開發實業經營不動產開發，並透過三地能源布局太陽光電與AFC儲能服務。加油站亦設置電動車充電設備，延伸能源補給服務。2026年第一季合併財報列高雄汽車客運為母公司，三地能源與北基國際開發實業為子公司。
