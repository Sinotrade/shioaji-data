summary_short: 以電聲元件、光纖線材、電源管理IC及POS／廣告機銷售取得收入。
summary_long: 沛亨的合併業務涵蓋電源管理IC、POS與廣告機、電聲元件及光纖線材。2026年第一季，電腦周邊部門占營收70%，網通產品部門占30%；前者包含電聲與光纖，後者包含電源管理IC及POS／廣告機。電源管理產品涵蓋穩壓、電壓轉換與電池管理；子公司西伯提供揚聲器設計製造，超昱生產光纖跳接線線材與室內光纜，光纖事業應用於AI資料中心。振曜為母公司，東荃、西伯與超昱為主要子公司，邑鋒由東荃間接持有。近三年集團進行股權架構調整及西伯增資，另由西伯增資越南子公司擴充產能。
