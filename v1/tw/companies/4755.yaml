summary_short: 供應電子製程化學品、TMAH回收服務及基礎化學品。
summary_long: 三福化以電子製程用精密化學品為主要營收來源，2025年占71.97%，基礎化學品占28.03%。產品包括TMAH顯影液、蝕刻液、光阻剝離劑，並提供TMAH顯影劑廢液回收服務。基礎產品涵蓋液晶聚合物原料、防腐劑與食品原料、添加物。年報具名客戶包括台積電、聯電、世界先進、力成，以及友達、群創、瀚宇彩晶與晶元光電。公司永續文件揭露CoWoS製程清洗劑已有使用，媒體另記錄InFO光阻剝離液產品。供應端，東聯提供MEA，兆聯提供TMAH工程。
