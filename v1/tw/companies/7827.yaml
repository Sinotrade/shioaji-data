summary_short: 研發免疫治療融合蛋白新藥，2025年營收全數來自HCB101授權金。
summary_long: 漢康-KY創以集團架構研發癌症及自體免疫疾病生物新藥，核心為自有FBDB融合蛋白平台。2025年營收為新臺幣3.12223億元，全數來自HCB101授權金；授權契約由子公司FBD Biologics Limited與復宏漢霖簽署。產品包括阻斷CD47–SIRPα的HCB101、三特異性候選藥HCB301與HCB303，以及CD20 × SIRPα雙特異性候選藥HCB206。集團委託藥明生物與台康製造臨床用藥，並透過應世生物、Aston Sci及陽明交大的研究合作，進行聯合療法或藥物設計研究。2026年上市前增資亦引進OrbiMed策略投資。
