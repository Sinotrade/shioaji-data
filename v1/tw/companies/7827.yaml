summary_short: 研發免疫融合蛋白新藥，2025年收入全為HCB101授權金。
summary_long: 漢康-KY創以FBDB平台研發融合蛋白生物新藥，聚焦腫瘤免疫與自體免疫疾病；2025年營收全數來自HCB101授權金。FBDB以抗體Fc區域為骨架，結合多種功能分子。HCB101阻斷CD47-SIRPα訊號，正進行單藥及聯合治療臨床評估。HCB301為臨床階段三功能融合蛋白藥物；HCB303整合SIRPα/CD47、PD-L1/PD-1與TIGIT/PVR機制，已獲准進行臨床試驗。HCB206為自體免疫疾病候選藥物，初期鎖定全身性紅斑性狼瘡。
