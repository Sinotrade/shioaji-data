summary_short: 研製模擬光源、光電轉換效率測試及晶圓級光電檢測設備。
summary_long: 光焱科技研發、製造及銷售模擬光源、半導體光電轉換測試與晶圓級光電檢測設備。2025年營收以半導體光電轉換測試為主，占51.26%，其次為模擬光源30.26%、晶圓級光電檢測10.75%，其餘為耗材及維修。產品涵蓋太陽能電池量子效率量測，以及NightJar矽光子晶圓測試系統，後者支援CPO封裝前的合格晶粒篩選。子公司包括Molly Ltd.、IRIS Tek Limited及勝焱電子科技(上海)有限公司。
