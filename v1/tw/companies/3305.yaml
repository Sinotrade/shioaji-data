summary_short: 製造銷售電子組裝與半導體封裝用錫棒、錫絲、錫膏及錫球。
summary_long: 昇貿主要製造及銷售電子焊錫材料，包括錫棒、錫球、錫絲、錫膏及BGA錫球。2024年錫棒、錫球及錫絲合計占營收72%，錫膏占20%，鍍錫銅帶占1%。低溫無鉛錫膏用於SMT焊接，BGA錫球則用於半導體封裝。具名報導確認其高階錫膏供應廣達、緯創及英業達的AI伺服器組裝製程；公司新聞稿另揭露與Intel開發低溫錫膏，以及與Apple合作手機充電器用回收錫膏。公司於2025年3月完成大瑞科技全部股權收購，並持有半導體材料檢測子公司承測科技。
