summary_short: 製造與銷售電子組裝及半導體封裝用錫棒、錫絲、錫膏與錫球。
summary_long: 昇貿科技主要開發、製造及銷售電子組裝與半導體封裝用銲錫材料，產品包括錫棒、錫絲、錫膏、BGA錫球及助焊劑。2025年前三季產品別營收以錫棒、錫球與錫絲為最大宗，其次為錫膏。公司供應SMT低溫錫膏與晶圓封裝用Bumping錫膏，並布局AI及高效能運算用高可靠度錫膏與散熱模組組裝材料；另於2025年揭露代理HBM三維堆疊製程用回焊爐。旗下子公司包括大瑞科技、承測科技與嘉貿光電。
