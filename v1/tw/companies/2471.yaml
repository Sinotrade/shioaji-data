summary_short: 以企業應用軟體為主，提供製造、人資與金融系統及系統整合。
summary_long: 資通以企業應用軟體為主，2024年應用軟體占合併營收93%，系統整合占7%。ciMes製造執行系統支援生產資訊可視化與追溯；HCP人力資源管理系統涵蓋人事、差勤、薪資與保險管理。金融產品包括AFEIS外匯系統，支援交易文件與帳務自動產生；eAresBank海外分行核心系統整合企金與消金業務；AML洗錢防制系統提供客戶盡職調查與風險評級。另透過WELJOIN間接持有艾加軟件（蘇州）95.88%股權。
