summary_short: 以自動化設備、倉儲物流系統及PCB微型鑽頭為主要營收來源。
summary_long: 高僑以自動化設備及微型鑽頭為兩大業務，2024年營收占比分別為58.40%及41.60%。設備業務涵蓋整廠自動化、倉儲物流與半導體專用倉儲，並以無人搬運車等設備整合全廠物流。鑽頭業務提供PCB微型鑽頭及銑刀，2025年法說會另揭露用於AI伺服器電路板鑽孔的高長徑比微型鑽頭。其他業務包括CNC加工、真空腔體製造及三次元量測。集團透過Gold Honest及Honest Union逐層持有泰州敏晶機電，三層持股比例均為100%。
