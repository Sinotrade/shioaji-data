summary_short: 以嬰幼童服飾及用品銷售為主，另有租賃業務收入。
summary_long: 麗嬰房以嬰幼童服飾與用品銷售為主要業務，產品涵蓋 les enphants 品牌服飾及 nac nac 嬰童用品。2025年嬰童服飾用品營收為新台幣22.71億元，占全年營收97.3%；租賃業務占2.7%，是另一項揭露的營收來源。les enphants 服飾設計考量孩童的活動需求，nac nac 產品涵蓋清潔保養、哺育、寢具織品與居家護理。麗翔股份有限公司為麗嬰房的子公司。
