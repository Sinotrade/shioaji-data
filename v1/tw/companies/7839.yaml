summary_short: 經營PRO360專業服務媒合平台，以平台資訊服務取得營收。
summary_long: 達人網經營PRO360專業服務媒合平台，串連需求者與專業人士，提供即時報價與透明評價，並以智慧配對協助雙方聯繫。平台涵蓋居家水電、家教、寵物美容等上千種專業服務，協助使用者降低搜尋與獲客成本。2026年第一季營收以平台資訊服務為主，占99.33%，其他收入占0.67%。旗下子公司包括預約達人有限公司、PRO360 Tech. Limited及PRO360 SDN.BHD.。
