summary_short: 主要經營鍵盤導電薄膜、車用攝影機與特種電動車。
summary_long: 淳安電子主要經營導電薄膜、車用電子及特種車。2025年營收以導電薄膜占46.12%最多，車電與特種車分別占32.70%及21.18%。集團旗下淳祥電子從事電腦鍵盤薄膜開關製造，淳敏電子研製車載攝影機與ECU，應用涵蓋倒車影像、環景及輔助駕駛系統；領鹿特種車產品包括電動高爾夫球車、觀光車、工具車與PTV。2026年另成立全資子公司淳臻科技，專注不鏽鋼無縫波紋管的研發、生產與銷售，布局AI伺服器液冷零組件。
