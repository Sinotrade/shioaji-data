summary_short: 以汽機車連接器及新能源連接器製造銷售為主，並提供線束與配電模組。
summary_long: 胡連主要製造銷售連接器，2024年連接器與新能源連接器分別占營收80.27%及19.73%。產品包括車用高頻連接器、高壓連接器、線束及智慧配電模組，應用涵蓋電動車、先進駕駛輔助與車載影音系統。公開報導列名的客戶包括比亞迪、長安、吉利、奇瑞及上汽；廣益電子則曾承接台北廠電鍍外包。集團透過越南、南京、東莞、印尼及歐洲子公司營運。2026年完成印尼子公司股權架構調整；歐洲子公司收購LA PUNTA八成股權案已簽約，公告預定2027年交割。與廣益電子的合作備忘錄已於2026年5月解除。
