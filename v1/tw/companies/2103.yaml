summary_short: 製造與銷售合成橡膠及熱可塑性彈性體，供輪胎、鞋材與醫療材料使用。
summary_long: 台橡以合成橡膠及彈性體材料製造銷售為主，2025年合成橡膠類營收占98%，非合成橡膠類占2%。產品包括SBR、BR、SSBR、NBR、TPE與SEBS，應用涵蓋輪胎、鞋底、塑膠改質及醫療材料；醫療用VECTOR SEBS可用於輸液袋膜、管材與膠塞。丁二烯的國內供應來源包括台灣中油與台塑石化。子公司申華化學於2025年啟用搬遷後新廠，年產能由17萬噸增至22萬噸；台橡亦與阿朗新科合作經營南通NBR合資工廠。部分具名輪胎客戶僅有早期報導可確認，相關關係依來源日期記錄。
