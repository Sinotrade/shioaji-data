summary_short: 代理銷售半導體零組件與儲存產品，並提供整體解決方案及參考設計服務。
summary_long: 增你強經營半導體零組件代理銷售，產品包含積體電路、功率場效應電晶體、二極體與功率模組，另經營記憶卡、固態硬碟及隨身碟等儲存產品通路。公司亦提供整體解決方案及參考設計，協助客戶整合資源並縮短產品開發時程。2024年合併營收中，記憶卡占24.55%、線性積體電路占16.53%、功率場效應電晶體占13.80%。截至2025年底，主要直接子公司包括睿強實業、增你強香港及Supertronic。
