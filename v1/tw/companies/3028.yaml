summary_short: 代理銷售半導體零組件與記憶卡，並提供整體解決方案及參考設計服務。
summary_long: 增你強代理銷售積體電路、電晶體、二極體與功率模組等半導體元件，並經營記憶卡及3C零售商品。公司同時提供整體解決方案與參考設計服務。2024年合併營收中，記憶卡占24.55%、線性積體電路占16.53%、功率場效應電晶體占13.80%。代理供應來源包括英飛凌、富士電機、羅姆、達爾及微芯相關法人；2024年報具名客戶包括廣達、仁寶與英業達。公司亦布局AI伺服器電源相關解決方案，並有200V GaN音訊應用導入紀錄。
