summary_short: 研發、製造及銷售外科與牙科用膠原蛋白植入物醫療器材。
summary_long: 海昌生技從事膠原蛋白醫療器材的生產與銷售，產品應用於外科及牙科。外科產品包括膠原蛋白基質與人工骨替代物；基質由豬筋組織萃取，人工骨替代物結合膠原與三鈣磷酸鹽。牙科產品包括牙創保護材、膠原再生薄膜及膠原蛋白骨填料。牙創保護材採多孔海綿狀結構；再生薄膜取自豬小腸黏膜下層；骨填料用於骨缺損重建及組織修復。2025年膠原蛋白植入物相關產品占營收91.38%，其他項目占8.62%。
