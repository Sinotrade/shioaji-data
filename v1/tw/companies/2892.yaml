summary_short: 以銀行業務為核心，透過子公司經營證券、投信及人壽保險。
summary_long: 第一金控以第一銀行為核心，透過銀行、證券、投信及人壽子公司提供金融服務。2025年銀行業務占合併淨收益85.0%，保險9.3%、證券4.1%、投信1.1%，其他0.5%。子公司第一銀行提供iLEO數位帳戶，並與Visa結合Visa Direct推出小額跨境匯款服務，另與萬事達卡合作消費碳足跡查詢。重大交易包括第一銀行於2025年決議投資台北金融大樓，以及孫公司一銀租賃於2026年公告取得兩架客機，採售後租回方式出租予星宇航空。
