summary_short: 以MOSFET為主，從事功率半導體元件設計、應用服務與銷售。
summary_long: 博盛半導體以MOSFET功率元件的設計與供應為主要業務，公司揭露本身沒有生產線。產品範圍涵蓋消費性中低壓MOSFET與工業用高壓高功率IGBT，官網亦列有1200V SiC MOSFET，並揭露已開發第一代650V GaN HEMT。另提供DrMOS與SPS產品資訊，其中SPS型號PID3190A標示為工程樣品。依2026年3月法說揭露，2025年應用營收以其他類別33%最高，其次為交換式電源18%及車用16.5%，伺服器占4.5%。
