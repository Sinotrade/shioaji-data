summary_short: 製造光通訊、矽光子及感測用III-V族化合物半導體磊晶片。
summary_long: 聯亞以MOCVD技術製造磷化銦與砷化鎵等III-V族化合物半導體磊晶片，2025年磊晶片及加工品製造銷售占營收99.21%。產品涵蓋EML、VCSEL、矽光子及高功率CW雷射磊晶片，也提供APD、GaAs LED與工業醫療用磊晶產品。公司供應可用於矽光子及CPO架構的雷射磊晶材料，與華星光合作CW Laser後段製程，並規劃向住友電工採購InP基板。2026年公告向AIXTRON及台灣艾司摩爾取得設備，另向漢科與帆宣取得無塵室或廠務工程。
