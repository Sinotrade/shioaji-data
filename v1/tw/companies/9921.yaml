summary_short: 以自行車整車製造與自有品牌銷售為主，另經營合金材料業務。
summary_long: 巨大以自行車整車製造與銷售為主，2025年自行車占營收87.29%，材料占6.95%，其他占5.76%。公司經營GIANT與女性自行車品牌Liv，並提供電動輔助自行車與碳纖維車架產品；部分車款搭載Shimano變速零件及Yamaha動力系統。材料業務由鼎鎂新材料科技股份有限公司經營。2024年透過美國子公司SPIA Cycling Inc.收購Stages品牌資產，2026年公告透過捷安特投資有限公司向眾御公司收購鼎鎂股權，完成後持股預計提高至96.63%，公告仍列有投審許可等交割條件。另由鼎鎂越南子公司委託ALC興建廠房，英國子公司則收購Thomas's Cycle Revolution的業務及部分資產。
