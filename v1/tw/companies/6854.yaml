summary_short: 提供MicroLED CoC晶片產品、顯示技術與巨量轉移設備。
summary_long: 錼創科技以MicroLED顯示技術為核心，提供紅、綠、藍光CoC產品與巨量轉移設備，並有技術服務收入。2026年上半年，CoC為合併營收最大項目，收入另包括技術服務、設備銷售及其他。顯示產品涵蓋採TFT驅動的PixeLED Display、採PCB驅動的PixeLED Matrix，以及用於AR眼鏡與投影式HUD的μ-PixeLED。全資子公司錼創顯示從事MicroLED元件、模組及面板業務，Lumiode亦已列入全資子公司。
