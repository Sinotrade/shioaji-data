summary_short: 以汽車金屬沖壓焊接件、車用光學產品及太陽能工程取得營收。
summary_long: 元創精密以集團方式經營汽車零組件，主要產品涵蓋車身金屬沖壓焊接件、車用導光板、膠框、透鏡及相關模具，並提供車用照明與自行車LED燈具。2026年上半年以金屬沖壓為最大外部營收部門，其次為光學射出與太陽能事業。汽車金屬件業務透過襄陽元創、湖南寶元及河南寶合元等子公司營運，光學產品由坦德科技承作，太陽能案場設計、施工與維運則由元傑光電等子公司經營。公司雖僅持有坦德科技36.91%股權，仍因董事會控制安排將其納入合併報表。
