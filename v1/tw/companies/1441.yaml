summary_short: 以紗線與布料產銷為主，布部門為主要營收來源。
summary_long: 大東紡織以紗線與布料產銷為主要業務，產品涵蓋棉紗、T/C混紡紗、化纖紗及針織、梭織面料。2025年度合併營收約15.15億元，其中布部門約占72.88%，紗部門約占27.12%，以布料為主要收入來源。布品包括戶外運動用機能性針織布、平織布，以及休閒用途的棉混紡刷毛布、羅紋布及魚鱗布。紗線另涵蓋吸濕排汗、保暖、防火防燃等功能性紗種及工業用水溶絲；越南紗布產銷業務由間接子公司經營。
