summary_short: 以伺服器與筆電設計製造為主，並提供資料中心設備及液冷整合方案。
summary_long: 廣達以伺服器及筆記型電腦設計製造為主要業務，並提供儲存設備與網路交換機。2026年8月法說揭露，伺服器占營收約八成；2026年上半年AI伺服器占伺服器營收75%至80%。全資子公司雲達科技提供QuantaGrid AI伺服器與QoolRack液冷機櫃整合方案。公開說明書列示NVIDIA、INTEL與AMD為CPU/GPU供應商，Samsung、Micron與Hynix則供應SSD。公司於2025年投資Rigetti與Quantinuum，並於2026年董事會通過以新台幣197億元購買友達華亞廠相關資產。
