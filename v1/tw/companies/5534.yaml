summary_short: 以住宅、商業及廠辦大樓開發銷售為主，另有不動產出租與子公司營造業務。
summary_long: 長虹建設主要開發銷售住宅、商業及廠辦大樓，並提供辦公室、店面及停車位出租服務。住宅產品包含住宅、店面與停車位，工商業產品則涵蓋辦公室及廠辦大樓。2025年合併財報分為建設及營造兩個部門，外部收入分別為74.31億元及10.59億元，以建設部門為主要收入來源。依2026年第一季合併財報，子公司包括從事營造與大樓開發的宏林營造廠、從事住宅與大樓開發的虹欣建設，以及業務性質列為百貨零售的新時代廣場實業。
