summary_short: 透過旗下集團生產銷售精品包袋、旅行箱及運動裝備。
summary_long: 威宏控股透過威保、宏盛、德御與廣泰集團，經營運動裝備及精品包袋的生產與銷售。威保負責運動手套、護具等產品，德御生產運動包袋及高爾夫球袋；宏盛經營精品包袋，廣泰經營旅行箱與商務包。2025年以尼龍包款及配件為最大單項，占營收27.92%，其次為運動包袋22.69%、旅行箱及商務包等16.19%及真皮包款與配件14.90%。其餘營收來自運動護具、運動手套及束套與運動周邊商品。
