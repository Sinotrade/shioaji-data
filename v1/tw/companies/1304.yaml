summary_short: 製造及銷售聚乙烯、EVA與CBC塑膠原料，合併營收以塑膠原料為主。
summary_long: 台聚主要從事聚乙烯塑膠原料製造與銷售，產品包括LDPE、HDPE、LLDPE、EVA與ViviOn™環狀嵌段共聚物（CBC）。EVA用途涵蓋電線電纜、熱熔膠、鞋材發泡及太陽能電池封裝膜；CBC可用於管材、小藥瓶與預充填針筒。2024年合併營收組成為塑膠原料92%、電子材料5%、其他3%。2025年第三季合併財報將華夏、亞聚、台達化、越峯、順昶及台聚光電列入子公司，其中華夏、亞聚與台達化經由轉投資公司間接控制。
