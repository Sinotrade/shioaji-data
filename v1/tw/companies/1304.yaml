summary_short: 製造與銷售聚乙烯、EVA及CBC塑膠原料，並透過子公司經營塑化與電子材料。
summary_long: 台聚製造與銷售LDPE、HDPE、LLDPE及EVA等塑膠原料，2025年合併營業比重為塑膠原料91%、電子材料6%、其他3%。EVA牌號UE2828可應用於太陽能電池封裝膜；CBC品牌ViviOn™可應用於醫材，但截至2026年8月，其半導體與醫材高階應用仍處送樣及驗證階段。原料供應關係包括中油與福建古雷石化供應乙烯，以及大連化學、HELM與Sipchem供應醋酸乙烯酯。主要合併子公司包括華夏、亞聚、台達化、越峯與順昶。重大交易包括2025年林口研發中心工程採購、處分達慧全部股權，以及2026年參與中鼎私募。
