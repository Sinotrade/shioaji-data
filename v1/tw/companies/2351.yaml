summary_short: 以半導體導線架及電子沖壓件為主，另製造五金文具。
summary_long: 順德工業以半導體導線架及電子沖壓件為主要業務，2025年營收比重為85%，五金文具事務用品占13%，其他占2%。電子產品包括功率及分離式導線架、積體電路導線架與LED導線架，製程涵蓋蝕刻、沖壓及電鍍。法說資料列出導線架應用於電動車動力，以及AI伺服器電源供應、功率級與備援電池。五金文具產品包括修正帶、訂書機與剪刀。子公司德輝科技製造精密蝕刻產品與音圈馬達彈片。
