summary_short: 以半導體導線架及電子沖壓件為主，另製造銷售五金文具。
summary_long: 順德主要製造半導體導線架及電子沖壓件，2025年占營業比重85%，五金文具事務用品占13%。產品包括LED導線架、IGBT電源模組導線架，以及用於AI伺服器電源管理的導線架，應用亦涵蓋電動車。英飛凌是其導線架客戶，雙方於2025年簽署產品優先開發權合作協議，開發AI加速器導線架並布局SiC與GaN應用。子公司德輝科技製造蝕刻導線架及音圈馬達彈片。順德於2025年完成朝新金屬剩餘股權收購，年底將其吸收合併，另簽訂彰化新A棟廠房工程合約。
