summary_short: 透過銀行、壽險、證券與投信子公司經營金融服務的金融控股公司。
summary_long: 台新新光金以金融控股及被投資事業管理為主，旗下主要事業涵蓋銀行、壽險、證券與資產管理。主要子公司包括台新銀行、新光銀行、新光人壽、台新證券及台新投信。台新銀行經營Richart數位存款、外幣及信用卡服務，並與國際支付品牌及財金公司進行具名合作。金控於2025年7月完成與新光金控的換股合併；投信於同年11月、壽險於2026年1月、證券於同年4月完成子公司整併。近三年另有子公司不動產取得、處分、工程契約修訂及股權投資公告。
