summary_short: 開發製造數位機上盒、寬頻閘道器與衛星通訊設備，並提供軟體整合服務。
summary_long: 百一電子開發及製造數位機上盒、家庭網路與衛星通訊器材。機上盒以Google Android TV純IP與雙模產品為主力開發方向，並提供軟體開發、系統整合及維護服務。寬頻產品包括GPON／Wi-Fi 7閘道器，相關機種已於2025年量產交貨，另持續投入低軌衛星設備與平板天線技術研發。公司也自主開發運用自然語言處理的AI智慧總機系統；子公司成一電子則提供數位語音廣播方案。
