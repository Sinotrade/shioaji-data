summary_short: 以連接線與連接器製造銷售為主，另透過子公司經營企業AI應用。
summary_long: 今皓主要製造與銷售連接線，2025年連接線占營收93%，其他業務占7%。產品包括電線電纜組合件、連接器、車用線束，以及筆電、電視與顯示器使用的軟性排線和極細同軸線。伺服器產品涵蓋內部與外部高速線，公司於2024年揭露100G、200G外部線及PCIe5.0內部線已出貨。公司另提供AI系統設計與全場域解決方案；旗下勤天科技、湧現智庫及晧飛思科技為子公司，其中湧現智庫經營Agatha企業AI平台。
