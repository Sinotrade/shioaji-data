summary_short: 製造銷售防火塗料、防火填塞材料與阻燃劑，並承作防火工程。
summary_long: 國碳科以防火塗料、防火填塞材料及阻燃劑為主要產品，並提供防火工程。2025年營收以防火塗料占48.88%最高，其次為防火材料23.39%；防火工程、阻燃劑及其他產品分別占12.07%、9.77%及5.89%。產品包括鋼構用水性膨脹型防火塗料、用於隔間接縫及貫穿結構縫隙的壓克力防火填縫膠，以及泡棉用無鹵阻燃劑。集團另透過直接與間接持有的投資、室內裝修及中國防火產品產銷子公司營運。
