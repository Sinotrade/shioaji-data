summary_short: 設計人機介面晶片並銷售模組，主要營收來自筆電輸入裝置。
summary_long: 義隆以人機介面晶片設計與模組銷售為主要業務。2025年營收中，筆電輸入裝置模組占69.92%，消費性觸控積體電路占27.72%，其他占2.36%。主要產品包括觸控板模組、支援主動筆的觸控螢幕晶片、指紋辨識晶片、指向裝置及微控制器，應用於筆電、平板與其他電子裝置。公司亦提供無人機AI影像辨識及遙控器顯示方案，並開發電動巴士AI緊急轉向防護系統。合併子公司包括義晶科技、義碩智能、義明科技、奇美車電與達盛電子。
