summary_short: 設計人機介面晶片及模組，以筆電觸控板為主要營收來源。
summary_long: 義隆自行設計晶片，產品包括觸控板模組、觸控螢幕晶片、指紋辨識及指向裝置。2026年9月觸控板模組占營收39%，為最大單一產品線；指紋辨識、觸控螢幕晶片及人工智慧產品分別占17%、13%與16%。年報列示的晶圓供應商包括台積電、聯電及世界先進，銷貨客戶另有奇普仕與品佳。公司提供無人機AI影像辨識方案，並與微軟合作開發觸覺回饋技術。近年投資包括增加奇美車電持股、參與達盛電子增資取得控制，以及策略投資PETA Optronics並合作研發光電整合方案。
