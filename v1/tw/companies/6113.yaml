summary_short: 代理銷售半導體零組件，以核心邏輯晶片與網路通訊產品為主要營收來源。
summary_long: 亞矽從事半導體零組件代理銷售，產品涵蓋MCU、網路通訊、線性類比、記憶體及感測器，並提供產品設計支援與測試服務。2025年度營收以處理器／核心邏輯晶片41.12%及網路通訊40.55%為主，其次為線性類比13.49%與記憶體3.89%，另有邏輯線路及其他產品。公司代理產品包含5G晶片，亦已導入SiC產品線並提供整合應用與技術支援。集團直接全資持有長兆投資與Idea Success，金青科技則由長兆投資全資持有。
