summary_short: 以ATV／UTV整車製造為主要營收，另銷售燃油機車、電動機車及零件。
summary_long: 宏佳騰主要開發與製造全地形車、越野多功能車、燃油機車及智慧電動車。2025年營收以ATV／UTV為主，占71.35%；摩托車占13.07%、電動機車占8.10%，零件及其他占7.48%。產品涵蓋二輪速可達、三輪與四輪重型機車，並推出CROXERA車聯網智慧系統。公司旗下包括名成車業、華成車業、宏佳騰創新科技、Asia Energy及越南子公司，另透過Asia Energy持有佛山子公司。
