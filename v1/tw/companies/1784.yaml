summary_short: 以細胞儲存與應用、產前檢測及外泌體製備等服務取得收入。
summary_long: 訊聯以細胞儲存及應用為重點營收來源，另一主要收入來源為產前檢測與續約業務。細胞服務涵蓋臍帶血與成人周邊血造血幹細胞、臍帶及脂肪等間質幹細胞，以及NK與CIK免疫細胞儲存應用。公司另提供外泌體客製化、細胞製備與CRDMO委託開發製造服務，並有非侵入性胎兒染色體檢測。合併子公司包括訊聯基因數位、訊聯細胞智藥與生萊；前兩者直接持股未達半數，仍因實質控制納入合併。
