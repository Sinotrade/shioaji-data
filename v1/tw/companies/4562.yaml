summary_short: 製造金屬彎管機、管件加工設備及自動化工作站。
summary_long: 穎漢科技以金屬彎管機與管件加工設備製造為主，產品涵蓋CNC全自動、NC半自動與傳統型彎管機，並提供切管機及端末成型機。其CNC操控軟體由內部自行開發，具管件座標轉換與3D模擬功能，可配合機械客製化需求調整。公司亦提供智慧型全自動工作站，整合單機控制程式及周邊設備；六軸垂直關節型機械手臂可連結彎管機與工具機，執行自動上下料，亦應用於拋光、焊接及搬運。
