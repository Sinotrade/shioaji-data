summary_short: 銷售記憶體模組、SSD、隨身碟、記憶卡及外接式硬碟。
summary_long: 廣穎電通主要銷售記憶體模組與儲存裝置，產品涵蓋SSD、DRAM模組、隨身碟、記憶卡及外接式硬碟。記憶體產品包含工業級DRAM與XPOWER Cyclone R DDR5電競系列；SSD亦有工業級產品。公司在2026年COMPUTEX展示工控SSD用於AMR自主移動機器人平台，將儲存產品延伸至機器人應用。依公司2026年7月公布的營收結構說明，當年6月工控產品占整體營收超過五成。
