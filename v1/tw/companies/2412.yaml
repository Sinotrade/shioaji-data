summary_short: 以行動通訊、固網寬頻及語音服務取得收入，並提供企業雲端、IDC與資通訊服務。
summary_long: 中華電信以行動通訊、固網寬頻及語音服務取得收入，並提供企業雲端、IDC與資通訊服務。2025年個人家庭、企業客戶及國際電信部門營收占比分別為60.7%、32.7%及4.0%。5G網路設備供應商包括愛立信及Nokia；IDC災難備援服務採用HPE技術。中華電信與AWS、Microsoft及Google Cloud有具名合作，旗下子公司包括是方電訊、資拓宏宇、中華資安國際及中華創智國際。2025年出售KKBOX台灣公司權益並增資KKCompany，2026年投資集集創造娛樂。
