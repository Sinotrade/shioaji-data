summary_short: 以半導體CMP研磨墊與耗材為主，另經營醫療運動產品及PU材料。
summary_long: 頌勝科技的合併業務以半導體研磨墊與耗材為主，另有醫療與運動產品、綠色環保黏著劑及PU彈性體材料。2025年三類業務營收占比分別為61.74%、30.52%及7.74%。半導體產品由子公司智勝科技生產銷售，醫療與運動產品由久陞昌經營。公司簡報列有CoWoS封裝製程研磨墊，2026年上半年半導體業務營收占比為66%。集團近年投資包括智勝購置中科在建廠房、追加相關工程及核准Soft Pad不織布產線設備計畫；頌勝另投資德鑫貳半導體控股，持股7%。
