summary_short: 提供汽機車電子控制模組的軟硬體開發與量產方案。
summary_long: 威力暘提供車用電子控制單元的軟硬體開發與量產方案。2026年上半年機車電子營收約1.65億元、汽車電子約1.49億元，另有電動輔助自行車電控板及其他收入。主要產品涵蓋LED照明電控模組、智慧座艙人機介面、電子換檔器與多功能方向盤，電池熱管理ECU已於2025年量產。2026年法說另揭露AI伺服器液冷控制應用，相關技術已完成驗證。集團直接持有WellySun Limited，並透過該公司持有滁州子公司。
