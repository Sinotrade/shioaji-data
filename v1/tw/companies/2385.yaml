summary_short: 群光以鍵盤、影像模組與攝影機，以及子公司電源事業取得收入。
summary_long: 群光主要以鍵盤、影像產品及電源事業取得收入。2025年第二季，鍵盤、影像與電源分別占合併營收35%、26%及34%，鍵盤為最大單一產品線。鍵盤產品涵蓋LED背光筆電鍵盤及平板、二合一裝置鍵盤，影像產品包括筆電影像模組與商用監控攝影機。電源產品由子公司群光電能經營，展達通訊亦為其上市子公司。群光發展Edge AI Vision Solution，應用範圍涵蓋智慧安防、智慧工廠與智慧車隊管理。重大交易包括2025年向潤泰全球購入觀音物流倉儲不動產，以及2026年董事會通過對全資子公司有康電子現金增資21億元。
