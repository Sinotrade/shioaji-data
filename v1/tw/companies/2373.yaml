summary_short: 以辦公設備銷售、租賃、耗材維修及自有品牌辦公家具為主要業務。
summary_long: 震旦行以辦公設備銷售、租賃、耗材與維修服務，以及自有品牌辦公家具為主要業務。2025年營收組成為影印機19%、事務機11%、周邊與供服29%、辦公家具41%。產品涵蓋數位複合機、門禁考勤與視訊設備，家具則包含辦公桌椅、檔案櫃與靜音艙，並提供空間規劃及搬遷服務。另提供人資、電子簽核與流程自動化等辦公雲服務；3D設計、掃描與列印設備及解決方案由子公司通業技研經營。主要子公司另有金儀、康鈦及震旦百慕達投資控股公司。
