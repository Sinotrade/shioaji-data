summary_short: 研發、製造與銷售培南類抗生素無菌原料藥及製劑。
summary_long: 松瑞藥主要提供培南類抗生素原料藥及製劑，產品包括厄他培南無菌原料藥、美洛培南製劑、厄他培南製劑，以及亞胺培南／西司他丁製劑。公司具備從無菌原料到製劑成品的一貫化生產能力，採用無菌結晶與無菌粉末滅菌處理技術。2025年前三季，合併抗生素收入為新台幣8.30億元，其他收入為0.52億元。依同季合併財報，子公司包括松瑞生技、瑞澤生技及朋瑞建設，業務分別涉及生技研發與西藥批發、醫療器材貿易，以及都市更新重建與投資顧問。
