summary_short: 製造銷售便當、飯糰等鮮食，以及零食、堅果、海苔與冷凍食品。
summary_long: 聯華食品以鮮食與休閒食品的製造銷售為主要業務，2025年營業比重分別為53.09%與46.91%。鮮食產品包括便當、飯糰、麵類、壽司手捲、漢堡及三明治，另有冷凍微波食品。休閒食品涵蓋薯條、洋芋片、萬歲牌堅果及烘培調味海苔，產品組合橫跨即食餐點與包裝零食。依2025年底持股資料，公司全資持有成吉股份有限公司、聯華鮮食股份有限公司及LIAN HWA INVESTMENT CO., LTD.。
