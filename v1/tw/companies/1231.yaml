summary_short: 製造銷售超商鮮食與休閒食品，鮮食為最大營收來源。
summary_long: 聯華食以鮮食與休閒食品加工製造及銷售為主要業務，2025年鮮食類占營收53.09%，休閒類占46.91%。鮮食涵蓋便當、飯糰、麵類、壽司手捲、漢堡與三明治，具名客戶包括統一超商。休閒類包含休閒食品、海苔、堅果及沖調產品，另提供冷凍料理與客製化代工服務。依2025年第一季財報，成吉、LIAN HWA INVESTMENT及聯華鮮食均為其百分之百持有的子公司。2024年公司委由永聯物流建置觀音廠自動化系統，並與旭源營造簽訂廠房新建工程契約。
