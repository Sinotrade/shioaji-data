summary_short: 製造橡塑膠皮與膠布，並經營倉儲物流及不動產開發租售。
summary_long: 厚生主要製造銷售橡膠、塑膠及環保綠塑膠皮與膠布，材質包括天然與合成橡膠、PVC、PU及TPU，亦提供醫療用品加工用材料。2025年橡膠皮占營收37.02%，塑膠10.18%、環保合成皮10.35%；另有倉儲22.77%、營建17.75%及其他1.93%。倉儲業務為物流倉儲管理，營建業務為住商大樓租售。旗下全資子公司包括板建開發公司及FRG US Corp.。
