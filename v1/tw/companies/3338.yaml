summary_short: 以散熱模組為主要營收，提供液冷模組、CDU及電子零組件。
summary_long: 泰碩以散熱模組及電子零組件的製造與銷售為主要業務，2025年散熱模組營收占85.37%，其他電子零組件占14.63%。液冷相關研發涵蓋冷卻液分配裝置、GPU直接液冷模組與AI伺服器直接液冷技術，並提供整機散熱系統及機構整合服務，涉及冷板、快速接頭、冷卻管路及分液器等部件。集團製造布局包括泗陽、東莞、蘇州及泰國子公司；其中東莞與蘇州公司分別由香港控股子公司持有，泰國公司則由泰碩與世窗電子共同持有。
