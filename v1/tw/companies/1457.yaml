summary_short: 以聚酯原絲、加工絲、聚酯粒、工業用織帶及不動產租賃取得收入。
summary_long: 宜進以合併子公司的聚酯原絲、加工絲及聚酯粒銷售，加上母公司的工業用織帶與租賃收入為主要業務。宏洲纖維工業生產聚酯原絲與聚酯粒，光明絲織廠生產加工絲；母公司工業用化纖織帶採委外加工，應用於航空、運輸設備。2025年合併營收中，加工絲占37.27%、聚酯絲占35.26%，另有平織布11.66%、聚酯粒9.68%、租賃收入6.10%及其他0.02%。
