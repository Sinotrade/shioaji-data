summary_short: 主要提供PCB與IC載板雷射加工、設備維護，並產銷鑽孔及成型設備。
summary_long: 達航科技主要提供電路板與IC載板製程的雷射加工、設備保養維護，以及自有設備產銷。2025年營收中，專業服務占75.10%、設備產銷占21.79%，其他收入占3.11%。公司自行開發CO2與UV雷射加工機、高精密鑽孔機、成型設備及高速主軸，並提供ABF載板精密加工及ABF專用雷射設備。其雷射加工解決方案亦已應用於探針卡基板。年報揭露的海外子公司包括CHINA EXPO LIMITED、MEGA TRADER INTERNATIONAL LIMITED、上海達航實業有限公司及大船企業日本株式會社。
