summary_short: 收入來自營造工程、住宅與商辦開發及購物中心營運。
summary_long: 冠德建設的合併業務涵蓋住宅與商業大樓開發、營造工程及百貨商場經營。2025年營造部門對外營收約171.57億元，為最大收入來源；建設及百貨部門分別約38.61億元與18.55億元。主要子公司包括根基營造、環球購物中心及大埕，分別經營綜合營造、百貨零售及不動產開發。冠德持有根基營造34.18%股權，並取得過半數董事席位，將其納入合併財報。官網另設都市更新與聯合開發專區，介紹土地開發評估及相關業務。
