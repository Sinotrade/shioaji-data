summary_short: 以MOCVD製造化合物半導體磊晶片，收入來自無線通訊、光通訊及感測用途。
summary_long: 全新以MOCVD製造砷化鎵、磷化銦及氮化鎵磊晶片，微電子產品包括HBT、PHEMT磊晶片，光電子產品包括光偵測器與VCSEL用磊晶片。2026年第三季微電子、光電子營收占比分別為57.5%、42.5%，微電子仍為較大收入來源。公司法說簡報列有800G用PD及400G、800G用VCSEL產品方向，涉及資料中心高速光通訊。年報具名列示AXT、Freiberger及香港商住友電工為基板供應商，並將IQE列為光電子磊晶競爭者。2026年7月公告向AIXTRON取得一批生產設備，累積交易金額約新台幣6.53億元。
