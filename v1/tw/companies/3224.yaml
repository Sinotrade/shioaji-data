summary_short: 以連接器等電子零組件代理銷售為主，另經營細胞治療與細胞製造服務。
summary_long: 三顧主要經營電子零組件代理銷售，產品包括電路板連接元件。2025年合併電子材料批發及零售收入為14.62億元，生醫相關收入為5,198.7萬元，電子業務為主要收入來源。生醫事業涵蓋自主研發的M Cell自體纖維母細胞療法、膝軟骨細胞層片與iPSC家族細胞儲存服務。2026年法說會另揭露以GMP製造能力承接人類血小板裂解液培養添加劑製造。樂迦再生為合併子公司，從事細胞治療產品委託開發與製造服務。
