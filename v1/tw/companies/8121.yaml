summary_short: 主要製造及銷售軟性鐵氧磁粉、鐵芯與碳化矽粉體。
summary_long: 越峰主要製造及銷售錳鋅、鎳鋅軟性鐵氧磁粉與鐵芯，屬電感類被動元件材料供應商。2025年軟性鐵氧磁鐵粉及鐵芯占營收86%，碳化矽粉占14%。磁性材料可作為濾波器、電源供應器及變壓器的上游原料，公司亦開發電動車、AI伺服器及5G電源相關材料。碳化矽產品包括N型、半絕緣與精細粉體，可供晶圓製造、燒結及複合材料整合使用；另提供高純度碳化矽陶瓷塊材與精密零件，應用於半導體製程設備等領域。
