summary_short: 以抗癌原料藥為主要營收來源，並經營自有製劑及委託研製服務。
summary_long: 神隆以自有原料藥、自有製劑及委託研製服務為主要業務。2026上半年營收以自有原料藥占79%為主，委託研製占17%，自有製劑占4%。原料藥以抗癌用藥為大宗，亦涵蓋中樞神經與心血管領域；製劑業務延伸至針劑及複雜製劑。委託研製提供胜肽合成、原料藥製程開發、無菌注射劑生產及分析檢測服務。自有製劑包括治療多發性骨髓瘤的Bortezomib，以及治療多發性硬化症的Glatiramer Acetate Injection。
