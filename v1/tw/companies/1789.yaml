summary_short: 以自有原料藥開發製造為主，兼營委託研製與針劑製劑。
summary_long: 神隆以高技術門檻原料藥開發製造為主，產品涵蓋抗癌、中樞神經及心血管領域。2026年上半年，自有原料藥、委託研製及自有製劑分別占營收79%、17%及4%。委託研製提供胜肽合成、原料藥製程開發、無菌注射劑生產與分析檢測服務。Glatiramer Acetate針劑於2026年3月出貨美國。公司於2025年完成漢達私募投資，雙方合作範圍涵蓋改良型新藥研究、臨床、上市註冊與銷售。統一企業為最終母公司，常熟原料藥廠為間接全資子公司。
