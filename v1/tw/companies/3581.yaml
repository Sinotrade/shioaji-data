summary_short: 製造半導體封裝切割、清洗與植球設備，並提供測試治具及介面產品。
summary_long: 博磊提供半導體封裝測試設備與治具，主要設備包括晶圓及基板切割機、清洗機與BGA／CSP自動植球機。測試產品包括Probe Card PCB、Load Board、Socket，以及HIFIX與Change Kit。2025年度合併營收以設備產品為主，占65.07%；測試產品占22.23%，維修收入占10.85%，其他占1.85%。截至2026年3月底，博磊直接持有科榮股份有限公司65.68%股權，並間接全資持有博磊精密設備（蘇州）有限公司。
