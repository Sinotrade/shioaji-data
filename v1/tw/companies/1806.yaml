summary_short: 以石板磚、拋光磚及外牆磚等磁磚製造與銷售為主。
summary_long: 冠軍建材以磁磚製造與銷售為主要業務，2025年磁磚收入占年報列示營收約九成，其他收入包括營建、木地板及其他項目。主要產品包括石板磚、拋光磚與外牆磚，分別用於建築物室內外地面、室內地壁面及外牆鋪設。產品亦涵蓋2公分厚的科技節能石，以及90×180公分瓷藝中板，提供不同厚度與尺寸的磁磚選擇。年報列示的直接全資子公司包括Swanview International, Ltd.、冠仲貿易、冠軍欣業及冠利投資。
