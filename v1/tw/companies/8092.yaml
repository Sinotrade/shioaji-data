summary_short: 研製精密磨床、量測儀器、IC封裝模具與精密零組件。
summary_long: 建暐精密科技以精密加工與設備產品為主要業務，產品涵蓋治具研磨機、立式磨床、三次元量測儀器、IC封裝模具及精密零組件。官網揭露的RV減速機零件應用於工業機器人與精密設備。2025年上半年合併財報將營運區分為設備及模具、新能源兩個事業部，當期外部收入均來自設備及模具事業部。集團直接持有NEW HONOR GLOBAL GROUP LTD.及建業永旭能源，並透過兩者分別持有昆山長豐精密儀器與雙子星能源。
