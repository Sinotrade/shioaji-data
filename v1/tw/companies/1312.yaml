summary_short: 製造銷售苯乙烯、ABS與尼龍，子公司生產丙烯及聚丙烯。
summary_long: 國喬以苯乙烯及塑膠原料的製造與銷售為核心，主要產品包括SM、ABS與尼龍66，子公司國亨化學生產PS，泉州國亨則生產丙烯與聚丙烯。2025年合併營收中，塑膠銷貨占39.56%，石化銷貨占39.51%，廣告、視訊及頻道經營占6.64%，其他業務占14.29%。集團子公司另包括緯來電視網、高冠企業及英屬維京群島海陸投資公司，營運涵蓋石化塑膠與媒體等業務。
