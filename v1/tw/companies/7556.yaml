summary_short: 供應半導體製程設備精密零組件、密封材料，並提供再生製造與維修服務。
summary_long: 意德士科技主要供應半導體製程設備所用的精密陶瓷零組件、全氟化橡膠密封材與精密加工真空吸盤，並提供精密零組件再生製造、維修校正及高溫電漿熔射覆膜服務。產品應用涵蓋薄膜、蝕刻、擴散及黃光等製程設備，其中真空吸盤亦用於晶圓檢查機台。2025年營收組成以半導體零組件占88.13%為主，維修收入占11.72%，其他占0.15%。截至2026年6月底，公司全資持有大鐿先端科技及德鐿投資，並透過德鐿投資持有TSS株式會社51%股權。
