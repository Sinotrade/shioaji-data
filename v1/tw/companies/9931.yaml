summary_short: 主要收入來自高雄地區天然氣銷售及瓦斯導管裝置服務。
summary_long: 欣高以天然氣供銷及瓦斯導管裝置為主要業務，透過管線向住宅與商業用戶供應燃料，並服務高雄市三民、前金、新興、苓雅、前鎮、鼓山、左營、楠梓及鹽埕九個行政區的家庭與工商業用戶。114年度年報揭露，天然氣營業比重為78%，導管裝置為22%。導管服務涵蓋設計、施工、維護保養及供氣系統定期檢查。子公司和欣國際股份有限公司則經營住宅及大樓開發租售、國際貿易與一般投資業務。
