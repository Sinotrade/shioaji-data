summary_short: 主要製造硬碟與汽機車精密金屬零組件，另經營沖壓設備及機器人業務。
summary_long: 百達-KY以精密零組件製造為主要業務，旗下BIGL製造硬碟致動臂，並提供磁線圈繞線等次組裝服務。集團另供應汽機車引擎傳輸、排氣、煞車與安全系統零件，以及高精密機械沖壓機。機器人業務由Kabam體系提供，應用於保全、設施管理與智慧建築，涵蓋自主解決方案及連結技術。已查證的集團架構包括直接持有的PATEC PTE. LTD.，以及間接持有的BIGL與Kabam，產品說明依各子公司的實際業務區分。
