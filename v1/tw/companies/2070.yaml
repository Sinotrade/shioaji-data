summary_short: 以光學影像篩選設備的製造、銷售與維修為主，另有扣件成型機及周邊業務。
summary_long: 精湛主要從事光學影像檢測設備的生產、銷售與維修，2025年光學影像篩選機占營收83.28%，扣件成型機占0.57%，加工收入、周邊配備與零件合計占16.15%。其篩選設備包含分度盤及玻璃盤機型，另提供製程監控系統與藥錠異檢機。子公司先聯科技的晶片型電子元件外觀檢查機，適用於電阻、電感、電容、半導體及LED等元件。2026年第二季合併財報列入的子公司另包括全盈自動化、昆山全盈、CHING CHAN (Samoa) Corp.及松鶴健康休閒。
