summary_short: 營運包含太陽能售電、不動產出租及防疫口罩銷售。
summary_long: 淳紳的營運包含房屋出租及太陽能發電。依公司2024年永續報告，該年度售電收入約占47%，防疫口罩銷售約占13%，其餘為租賃投資；公司並維護屋頂型太陽能發電設施，提供綠色電力。官網另說明，由子公司明水推展太陽能電力業務。電動車方面，公司曾投入研發，Thunder Power品牌於2015年法蘭克福車展展示電動概念車；官網記載昶洧電動車於2017年獨立為旗下投資公司，專注電動車研發與商業販售。
