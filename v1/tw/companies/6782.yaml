summary_short: 主要從事拋棄式隱形眼鏡的製造與銷售，產品涵蓋矽水膠與水膠鏡片。
summary_long: 視陽光學的營收主要來自拋棄式隱形眼鏡，2025年度隱形眼鏡占營收99.95%，其他收入占0.05%。產品包括矽水膠球面鏡、漸進多焦點鏡片、散光與彩色鏡片，以及水膠球面鏡，均有日拋與月拋規格。主要子公司包括全資持有的Visco Technology Sdn. Bhd.與From-eyes Co., Ltd.，以及持股55%的川揚視康股份有限公司。
