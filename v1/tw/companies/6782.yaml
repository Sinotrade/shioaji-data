summary_short: 以拋棄式隱形眼鏡的設計、製造及銷售為主要收入來源。
summary_long: 視陽主要從事拋棄式隱形眼鏡的設計、生產與銷售，2025年隱形眼鏡收入占99.95%。產品包含矽水膠球面鏡、漸進多焦點鏡片、散光鏡片與彩色鏡片，另提供水膠球面鏡，均有日拋與月拋規格。明基材料同時為客戶與供應商，2025年分別占銷貨10.25%與進貨20.01%。集團透過Visco Technology從事隱形眼鏡製造，並由From-eyes及川揚商貿從事銷售。2026年3月另向東原防蝕工業簽約取得中壢土地及建物，交易總額4.68億元。
