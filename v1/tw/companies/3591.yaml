summary_short: 以LED照明、車用照明及傳感器元件的設計製造與銷售為主要業務。
summary_long: 艾笛森主要研發、製造及銷售LED照明、車用照明與傳感器元件。2025年合併營收中，LED照明占47.94%、LED車用產品占46.44%、傳感器元件占4.53%，其他占1.09%。照明與車用產品均涵蓋元件、模組及成品，並提供LDMS照明設計製造整合服務。公司另有支援三維感測、飛行時間與結構光應用的VCSEL產品。集團製造子公司包括艾特光電、東莞艾笛森、揚州艾笛森及揚州艾特。
