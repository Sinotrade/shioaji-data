summary_short: 以倉儲理貨、CRM與票務系統服務及電商商品銷售取得營收。
summary_long: 台鋼新零售的營收來自勞務服務與商品銷售；2025年勞務收入占78.03%，商品銷售占21.97%。勞務項目包含CRM軟體服務及倉儲理貨，倉儲業務由子公司久新新物流經營。商品涵蓋服飾、運動周邊、保健食品及運動賽事門票；公司另提供電商會員與票務系統開發、維運服務。2026年上半年法說指出，營運著重票券與倉儲服務。最新法說列示的子公司包括台鋼數位資產管理、久新新物流及水噹噹服飾。
