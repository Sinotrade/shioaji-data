summary_short: 研發與銷售醫學美容保養品，主要產品包括杏仁酸及玻尿酸系列。
summary_long: 達爾膚從事醫學美容保養品的研發與銷售，2025年營收全數歸入化妝保養品。主要產品包括杏仁酸煥膚系列的杏仁酸亮白煥膚精華18%，以及玻尿酸保濕系列的玻尿酸保濕精華液。另提供美妍保健食品，包括雙膠原蛋白胜肽粉及水光雙膠原胜肽飲。集團持有Wclinic Biotechnology Corporation及東爾生醫股份有限公司各百分之百股權，前者從事專業投資，後者經營化妝保養品買賣。
