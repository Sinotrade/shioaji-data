summary_short: 以MEMS麥克風、音訊控制晶片及快閃記憶體控制IC取得營收。
summary_long: 鑫創從事音訊與儲存控制晶片業務，主要產品包括MEMS微機電麥克風、USB Audio控制晶片及NAND Flash控制IC。2025年營收以音訊IC及其他為主，占85.27%，NAND Flash控制IC占14.43%，設計服務占0.30%。USB控制產品用於隨身碟，提供USB 3.2 Gen 1介面方案；MEMS麥克風則結合自行開發的微機電感測器與ASIC晶片。
