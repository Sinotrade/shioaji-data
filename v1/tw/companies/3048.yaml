summary_short: 以積體電路、記憶體等半導體零組件代理銷售及技術支援為主要業務。
summary_long: 益登科技經營半導體零組件通路，提供產品銷售、技術支援及整合服務。2025年度營收中，積體電路占87.11%、記憶體占7.39%、其他占2.59%、電子組件占2.21%，CPU占0.70%。已確認的授權代理線包括NVIDIA、STMicroelectronics、Skyworks與Silicon Labs，產品涵蓋GPU及微控制器。益登另提供Edge AI平台導入與系統最佳化服務，以及電動二輪車的智慧電池管理及驅動逆變器解決方案。近三年事件包括投資與處分蜜望實股票，以及全資子公司鑫隆電子、彥陽科技分別公告與商杰、大志科技合併。
