summary_short: 以包裝印刷為主要收入，並製作商業、文化及特殊印刷品。
summary_long: 花王企業主要製作包裝、商業、文化及特殊印刷品。2025年度包裝印刷占營收75.93%，產品包括包裝紙、包裝盒與禮盒，是最大收入來源。商業印刷占17.7%，涵蓋海報、說明書、型錄、DM與卡片；文化印刷占2.6%，包括書籍、雜誌、畫冊、紀念冊與月曆。特殊印刷占3.77%，提供標籤、貼紙、條碼及UV上光印刷。四類印刷產品合計構成公司當年度全部營收。
