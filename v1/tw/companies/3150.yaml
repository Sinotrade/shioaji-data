summary_short: 設計並銷售低延遲無線音訊傳輸晶片與模組。
summary_long: 鈺寶科技以無線音訊傳輸晶片及模組為主要業務，專注低延遲無線技術與客製化傳輸方案。2025年度營收組成為模組58%、晶片42%，定位為半導體產業鏈上游的IC設計公司。產品涵蓋SYNIC IA3、IA9、IA11與IA12系列；IA3用於2.4GHz低耗能音訊傳輸，IA9涵蓋2.4GHz及5.2／5.8GHz頻段。IA11與IA12分別面向2.4GHz及5.2／5.8GHz高資料量傳輸，支援多聲道無線家庭劇院。
