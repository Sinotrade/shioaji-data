summary_short: 主要銷售電動二輪整車，另經營連接器及電池整合服務。
summary_long: 台端主要經營微型電動二輪車、電動輔助自行車與電動機車等整車銷售，並保留連接器產品。2025年前三季，電動二輪車事業群占合併營收87%，電子零組件事業群占13%，電動二輪車已是主要營收來源。官網亦列有鋰電池模組設計與電池整合服務。集團透過全資子公司TAI TWUN GROUP LIMITED持有東莞台端電子有限公司，後者從事連接器、零件及五金模具製造與銷售。
