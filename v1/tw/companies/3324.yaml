summary_short: 研發與供應伺服器、電腦用氣冷散熱模組及液冷零組件、CDU。
summary_long: 雙鴻以液冷與氣冷散熱產品為主要業務，2024年散熱模組占營收100%。產品包括水冷板、泵浦、分歧管、快接頭、冷水分配裝置，以及伺服器與電腦使用的氣冷散熱模組。已披露的供應關係包括向鴻海、廣達提供水冷板，美超微亦為客戶；公司另取得AWS與Meta的ASIC散熱訂單。NVIDIA將Auras列為MGX合作夥伴，雙鴻亦與AMD合作提供伺服器散熱方案。雙鴻在2025及2026年認購濱川私募普通股，並將部分液冷快接頭交由濱川生產；泰國廠房工程及購地則由泰鴻子公司執行。
