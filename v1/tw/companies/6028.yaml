summary_short: 提供人身與財產保險經紀服務，以經紀銷售保險契約收取佣金。
summary_long: 公勝保經以人身保險與財產保險經紀服務為主要業務，透過經紀銷售保險契約收取佣金。2025年營收組成以壽險首年經紀收入53.65%為最大項，獎金及其他收入占25.24%，壽險續年經紀收入占14.08%，產險經紀收入占6.90%，其他業務收入占0.13%。公司另設有GOGOBO網路投保管道及保險規劃平台，提供線上投保與保險規劃服務。截至2026年6月底，持有公勝財富管理顧問全部股權，該子公司從事投資、管理及其他顧問與仲介服務。
