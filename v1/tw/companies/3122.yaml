summary_short: 設計與銷售微控制器IC，產品涵蓋8051、32位元、USB及馬達控制晶片。
summary_long: 笙泉為微控制器IC設計公司，2025年微控制器營業額占比為100%，位於半導體產業鏈上游。產品涵蓋8051微控制器、Arm核心32位元微控制器與USB微控制器，並提供無刷直流馬達控制晶片。CGF062A以無感測器FOC技術驅動無人機馬達；MLT1021則為LIN實體層通訊晶片，提供MCU與LIN匯流排之間的訊號傳輸。公司另直接持有香港子公司，並透過香港公司持有深圳子公司。
