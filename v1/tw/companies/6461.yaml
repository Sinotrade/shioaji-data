summary_short: 研發與製造呼吸道吸入藥，並提供處方開發與生產服務。
summary_long: 益得以呼吸道用藥為核心，研發與製造定量噴霧吸入劑，並具備低酒精配方及乾粉吸入劑技術。主要產品包括帝舒滿、Synvent及複方吸入劑Synbufo，另提供處方開發與生產服務。2025年前三季商品銷貨收入為新台幣3,451.1萬元，勞務收入為6,819.2萬元，後者主要來自產品研究服務，因此當期收入以勞務為主。公司的母公司為健喬信元醫藥生技股份有限公司。
