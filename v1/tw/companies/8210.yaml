summary_short: 勤誠以伺服器機殼、機構件及共同設計製造服務為主要業務。
summary_long: 勤誠主要設計、製造伺服器機殼及週邊產品，2025年占營收99%，個人電腦機殼占1%。公司提供OTS標準品、JDM/ODM共同開發及OEM Plus代工加值服務，產品涵蓋NVIDIA MGX機殼、ASIC平台機箱、液冷機殼與機櫃機構整合方案。勤誠與NVIDIA合作MGX平台，具名媒體列出亞馬遜、微軟、谷歌及Meta為AI伺服器機殼客戶。近三年，勤鋒及海外子公司辦理樹林購廠、馬來西亞購地與委建廠房，以及德州不動產契約；勤誠另公告增資馬來西亞子公司，並授權投資設立越南子公司。
