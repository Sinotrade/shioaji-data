summary_short: 以記憶體IC封裝及測試代工服務為主要收入來源。
summary_long: 華東科技以記憶體IC封裝與測試代工為主要業務，提供封裝、成品測試至直接出貨的一元化服務。2025年合併營收中，封裝占64%、測試占36%；封裝服務涵蓋導線架、BGA及MCP／SiP，測試服務包括晶圓偵測、預燒與功能測試。2026年第一季，華邦與新唐分別占銷貨35%與22%，另有具名媒體報導南亞科為客戶。2025年完成訊憶科技增資並納入合併，持股74%；同年蘇州子公司出售鑫豐科技19.81%股權予合肥新匯成微電子。公司亦於2025及2026年分別公告向ADVANTEST TAIWAN採購測試生產設備。
