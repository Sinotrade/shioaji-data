summary_short: 以記憶體IC封裝與測試代工服務為主要收入來源。
summary_long: 華東科技以記憶體IC元件為核心，提供IC封裝、成品測試至直接出貨的一元化代工服務。封裝型態涵蓋導線架、BGA及MCP／SiP；測試服務包含晶圓偵測、預燒、功能測試與後段包裝。依2024年年報，封裝與測試營收比重分別為63%及37%。截至2026年6月底，直接子公司包括Walton Holding Universal Ltd.與訊憶科技；華東科技（蘇州）、華昕科技（蘇州）及Walton Holding (Hong Kong) Ltd.則為間接子公司。
