summary_short: 主要研發、製造及銷售半導體自動光學檢測與量測設備。
summary_long: 倍利科以半導體自動光學檢測與量測設備為主要業務，2025年該類產品占合併營收95.03%，智慧影像數據分析系統占2.57%，AI智慧醫療系統占0.68%，其他占1.72%。主要設備V5300 PRO具備全自動巨觀檢測、微觀檢測及微觀量測功能；V5ADC提供智慧影像分析服務。公司設備應用於CoWoS先進封裝檢測，另投入CPO相關檢測設備驗證。智慧醫療業務由子公司倍智醫電經營，產品包括肺部影像判讀系統。
