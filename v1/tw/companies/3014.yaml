summary_short: 研發設計與銷售電腦控制、影音介面、系統單晶片及電子紙控制IC。
summary_long: 聯陽從事IC研發設計與銷售，2025年IC營收占99.92%，其他收入占0.08%。主要產品為桌上型電腦Super I/O控制晶片、筆電嵌入式控制器，以及高速影音介面、USB-C電力傳輸控制、系統單晶片與電子紙時序控制器。系統單晶片應用涵蓋智慧家電、車用儀表與抬頭顯示器；電子紙產品應用包括閱讀器與電子筆記。2026年上半年合併財報列有全資子公司ITE Tech. (Shenzhen) Inc.。
