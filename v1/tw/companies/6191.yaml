summary_short: 主要營收來自PCB製造及EMS基板與系統組裝服務。
summary_long: 精成科以印刷電路板（PCB）產銷及電子製造服務（EMS）為主要業務，2025年營收比重分別為74.93%與24.28%。PCB技術包含厚銅及高階HDI，透過子公司Lincstech納入高層板及探針卡應用；EMS提供基板加工與系統組裝，已導入AI伺服器組裝量產線。母公司為瀚宇博德，直接子公司包括Lincstech、Lincstech EPC及GBM Electronics (M)。Lincstech EPC原名ELNA Printed Circuits。
