summary_short: 以客製化磁性元件為主，製造銷售變壓器、電感與線路保護元件。
summary_long: 百徽以客製化磁性元件的設計、生產與銷售為主要業務。2025年11月法說揭露，當時超過七成銷售來自此類產品。公司製造的產品另包括變壓器、車用高信賴性磁性元件及標準型電感，並提供電感器與線路保護等電子零組件。其產品同時涵蓋客製化元件與標準型元件，業務包含磁性元件製造及電子零組件銷售。公司於2025年設立海外子公司Bullwill Global Ltd.，拓展海外組織布局。
