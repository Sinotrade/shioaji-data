summary_short: 以太陽能電池與模組銷售為主，兼營電廠開發維運、售電與儲能系統。
summary_long: 聯合再生以太陽能電池與模組製造銷售為主要業務，並提供太陽能電廠開發、工程採購施工與維運服務。2026年上半年太陽能部門對外收入8.51億元，其他部門為4.28億元。儲能業務涵蓋商品銷售、案場建置與系統整合，曾承攬台電南鹽田儲能建置案，2024年財報亦揭露與台電簽有售電合約。公司於2024年收購鼎日能源科技，後續持有其全部股權。2026年1月公告以28.01億元出售竹南廠及附屬設備予矽品，同年與中美矽晶宣布合資模組廠投資案，並於8月調整為先在台灣合資再轉投資美國。
