summary_short: 以土木、建築及機電工程承攬為主，兼營工業區與房地產開發。
summary_long: 中工以工程承攬為主要收入來源，2025年度營建工程收入占合併營收87.42%，其他營業收入占12.58%。業務涵蓋公共工程、住宅、辦公及商場等民間工程，並辦理工業區開發租售與都市更新。台北雙子星大樓由中工與華熊營造、久年營造聯合承攬。2024年主要鋼筋供應商包括東和鋼鐵及豐興鋼鐵。子公司包括中華城、中工投資及華鼎事業。近年交易包括認購亞太工商聯公司債，以及出售陶朱隱園房地與車位；鴻運科園區案截至2026年8月所見資料仍待簽訂正式買賣契約。
