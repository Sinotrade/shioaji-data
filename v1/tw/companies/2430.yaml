summary_short: 以3C百貨零售為主，主要銷售家庭電器用品與資訊類產品。
summary_long: 燦坤主要經營3C百貨零售，銷售家庭電器用品與資訊類產品。2025年合併客戶合約收入中，家庭電器用品為102.09億元，資訊類產品為71.62億元，家庭電器用品是較大的收入類別。旗下直接全資子公司包括大力投資股份有限公司、永益國際投資股份有限公司、PROWORLD INTERNATIONAL LIMITED及安盛保險代理人股份有限公司，分別從事一般投資、控股與保險代理業務。
