summary_short: 以網路安全與白牌電信硬體設備銷售為主，另提供邊緣AI伺服器。
summary_long: 立端科技以網路安全設備與白牌電信設備為主要產品，提供硬體平台及設備銷售。2024年營收組成為NC占94.3%、IEC占5.3%、其他占0.4%。邊緣運算產品包括ECA-6050 AI伺服器；ECA-6051採用NVIDIA MGX架構，ECA-6710支援分散式5G／6G電信機房的網路安全與資源調度應用。依產品技術，可歸入AI伺服器、NVIDIA系統及5G設備題材。2024年底，美國與模里西斯兩家子公司均由立端全資持有。
