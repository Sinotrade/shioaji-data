summary_short: 以ODM/OEM模式設計製造擴充基座、集線器與轉接器等電腦周邊設備。
summary_long: 東碩資訊以電腦周邊設備的ODM/OEM設計與製造為主，2025年度電腦週邊產品占營收100%。主要產品包括擴充基座、USB集線器及影像與乙太網路轉接器；擴充基座支援USB4與Thunderbolt等技術。公司亦拓展氮化鎵充電器，並於2026年CES推出外接GPU擴充基座，支援本地端AI與大型語言模型運算。主要子公司包括GWC Technology Inc.、東碩電子（昆山）有限公司與越南公司，後兩者為間接持有的孫公司。
