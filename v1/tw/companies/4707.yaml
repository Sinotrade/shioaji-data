summary_short: 製造及銷售非離子界面活性劑、環氧乙烷衍生物與酯化產品。
summary_long: 磐亞主要經營非離子界面活性劑，產品分為環氧乙烷衍生物與酯化產品。2025年EOD廠營收約11.56億元，酯化廠約1.87億元，以EOD廠為主要營收來源。主要產品包括聚乙二醇及工業潤滑油酯類；聚乙二醇可用於電子、造紙及酯化反應，工業潤滑油酯類可用於金屬加工及潤滑油。依產品用途與官網產業定位，公司屬連結石化原料與民生、工業用品的中游特用化學品製造商。2025年度財報列中國人造纖維為母公司。
