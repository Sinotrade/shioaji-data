summary_short: 以顯示器與投影機設計製造為主，並經營醫療、智能方案及網通事業。
summary_long: 佳世達以顯示器與投影機設計製造為主要產品線，並透過集團經營醫療、智慧解決方案與網路通訊業務。顯示器涵蓋家用、商用、專業及醫療用途，投影機涵蓋商用、教育、家用與行動應用。2025年醫療、智慧解決方案與網通事業分別占合併營收15%、17%及11%。品牌產品由子公司明基電通經營，友通資訊與拍檔科技分別提供工業電腦板卡及端點銷售系統，明泰科技從事寬頻、無線網路及網路系統設備。智能方案並規劃客製化AI伺服器與邊緣運算產品。
