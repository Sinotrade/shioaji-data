summary_short: 以分散性染料等染整用化學品的貿易銷售取得營收。
summary_long: 中美實主要透過染料買賣取得營業收入，2025年度染料收入為新臺幣6,897.9萬元，占全年營收100%。核心銷售項目是分散性染料，另外供應反應性染料、酸性染料及染整加工使用的助劑，並提供相關應用技術服務。公司旗下持有兩家全資子公司，分別為Loyal Pacific International Limited與Pt. Allied Industrial Indonesia。
