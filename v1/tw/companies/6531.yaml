summary_short: 設計與銷售客製化記憶體、矽電容及IP方案，主要營收來自IoTRAM。
summary_long: 愛普科技是無晶圓廠的客製化記憶體與IP解決方案設計公司。IoTRAM提供PSRAM及LPDDR，應用於物聯網、穿戴裝置、顯示器及連網設備。2026年第二季，IoTRAM、S-SiCap及VHM營收占比分別約為71%、27%及2%，VHM收入主要來自NRE。S-SiCap採用DRAM堆疊式電容技術，產品涵蓋矽電容與中介層，IPC用於CoWoS-S封裝，IPD已於2026年第二季量產出貨。力積電提供晶圓代工；台積電的已揭露關係是3D整合合作，Intel則參與Z-Angle Memory共同研究。
