summary_short: 以銀行存放款、信用卡及信託服務經營，收入主要來自利息淨收益與手續費。
summary_long: 遠東銀經營銀行存放款業務，提供臺幣與外幣存款、個人信用貸款及房屋貸款。2026年上半年利息淨收益占淨收益50.95%，手續費淨收益占23.72%。Bankee為遠東銀推出的數位銀行品牌，提供數位存款帳戶服務。信用卡產品包括遠東快樂信用卡及遠東HAPPY GO頂級卡，另提供由銀行擔任受託人的信託服務。2025年年報列示的子公司包括Far Eastern Asset Management Corp.、Far Eastern International Securities及FEIB Financial Leasing Co., Ltd.。
