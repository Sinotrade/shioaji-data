summary_short: 主要製造及銷售包裝與印刷裝飾用燙金箔，另提供光電材料及塗佈代工。
summary_long: 岱稜主要製造及銷售燙金箔，供包裝、標籤與印刷裝飾使用。2026年第一季集團營收中，燙金箔占95%，光電材料占5%；燙金箔內部以冷燙箔占61%。主要箔材涵蓋熱燙箔、窄幅及平版冷燙箔、雷射箔與數位燙金箔，可用於紙張、紙板、標籤及少量數位印刷。光電材料業務則提供保護膜、醫療膠帶、自黏式封裝膠帶及薄膜塗佈代工服務。
