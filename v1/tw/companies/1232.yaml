summary_short: 從事豆粉、食用植物油及代加工，並透過子公司經營食材批發。
summary_long: 大統益從事豆粉、食用植物油生產銷售與大豆代加工，並透過子公司美食家經營食品批發。2025年合併營收中，黃豆粉占29.71%、精製沙拉油占16.35%、加工收入占2.24%，其他及商品銷售收入占51.70%。豆粉產品供畜禽及水產飼料使用，大豆沙拉油用於烹調與食品加工，另銷售芥花油、葵花油及棕櫚油等植物油。具名代加工客戶包括美藍雷及泰華油脂。2026年6月底，公司持有美食家80.27%股權；該子公司於2024年委託上裕開發興建五股發貨倉庫。
