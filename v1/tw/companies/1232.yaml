summary_short: 以大豆加工、豆粉與植物油脂製造銷售為主，並透過子公司經營食材批發。
summary_long: 大統益主要產品包括高蛋白豆粉、全脂豆粉、大豆沙拉油、芥花油、葵花油及精選大豆。高蛋白與全脂豆粉可作為畜禽及水產飼料原料，大豆沙拉油用於烹調及食品加工，精選大豆則用於豆漿、豆腐等豆製品。2025年合併營收以其他及商品銷售收入占51.70%最多，黃豆粉占29.71%、精製沙拉油占16.35%、加工收入占2.24%。子公司美食家食材通路從事食品批發，截至2026年6月底，大統益持股80.27%。
