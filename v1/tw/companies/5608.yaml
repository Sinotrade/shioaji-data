summary_short: 以散裝船舶租賃與海上運送為主，另透過子公司經營觀光飯店。
summary_long: 四維航主要經營散裝船舶租賃與海上運送，並提供船務代理服務。承運貨物包括穀物、鋼材、煤炭與精礦，採不定期航班及航線，依貨物運送地點與承租人安排航程及靠泊港口。2025年合併營業收入中，租金收入占94%，其他營業收入占6%。旗下全資子公司Dong Lien Maritime S.A. Panama及Fortunate Maritime S.A. Panama經營國際航運與船務代理；另透過子公司綠舞觀光飯店股份有限公司經營飯店餐旅服務。
