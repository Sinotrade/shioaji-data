summary_short: 易發集團銷售自動化製程設備、設備代工及鋁擠型機械架構。
summary_long: 易發集團的營收涵蓋鋁擠型機械架構、設備代工及跨產業自動化設備。2025年合併營收中，鋁擠型機械架構占31.89%，半導體設備占20.54%，設備代工占18.97%；鋁擠型設計製造及設備代工業務涉及子公司東野精機。易發本身的產品包括全自動晶圓檢查機、ILB內引線鍵合機及AI伺服器自動化組裝線。公司與南亞科技合作導入晶圓檢測專利及AI軟體技術，並與美超微、群光電能等業者參與貨櫃式超級算力櫃的概念驗證。官網亦揭露曾切入CoWoS先進封裝製程供應鏈。
