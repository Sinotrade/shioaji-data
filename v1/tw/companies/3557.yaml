summary_short: 設計、生產及銷售餐具等家居用品，並經營Prepara廚具品牌。
summary_long: 嘉威生活主要從事家居用品的設計、生產及銷售，2025年此項業務占營收100%。產品範圍包括餐具與廚具，並推出以回收寶特瓶再生聚酯原料製成的Ecoluxe系列。旗下Prepara為自有廚具品牌。集團的Achieve Goal Limited為投資公司，並持有政星塑料與政鑫美耐皿兩家家居產品製造子公司；另有越南家居用品子公司，以及從事國際貿易的First Design Global, Inc.。
