summary_short: 以生物藥委託開發製造服務、藥品銷售及授權開發取得收入。
summary_long: 台康生技經營生物藥委託開發與製造（CDMO）及生物相似藥開發，服務涵蓋製程開發、分析測試與GMP生產。2023年營收以勞務收入59.26%為最大項，另有銷貨收入26.91%及授權合作開發收入13.83%。主要藥品包括EG12014（Trastuzumab生物相似藥）、EG1206A（Pertuzumab生物相似藥），研發產品另有ADC生物相似藥EG12043及皮下注射複方EG13084。2024年刊印年報列示德國與美國兩家子公司。
