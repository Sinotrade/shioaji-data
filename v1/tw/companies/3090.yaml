summary_short: 以電容器為主的電子零組件代理經銷商。
summary_long: 日電貿以電子零組件代理經銷為主要業務，集團銷售產品包括陶瓷電容、固態電容、電解電容、半導體及發光二極體。2025年度合併營收中，陶瓷電容占45.44%、固態電容占26.31%、電解電容占9.60%，其餘由半導體、發光二極體及其他產品構成。公司銷售及代理的零組件應用於AI伺服器，屬相關元件通路。主要子公司包括力禾科技、力垣企業及健略，均經營電子零組件進出口貿易業務。
