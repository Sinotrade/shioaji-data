summary_short: 以塑膠射出成型機的研發、製造與銷售為主，另提供智慧製造系統。
summary_long: 富強鑫主要從事塑膠射出成型機的研發、生產與銷售，設備涵蓋多組分及單組分成型。2026年第一季，多組分與單組分射出機分別占營收60%及31%。產品與技術包括全電式射出機、MuCell微發泡成型，以及iMF 4.0智慧製造工廠系統；後者可將生產設備聯網，提供品質監控與預警養護，法說簡報另列示導入AI技術。集團亦經營漆包線業務。已確認的子公司包括BVI富強鑫、東莞富強鑫及越南富強鑫。
