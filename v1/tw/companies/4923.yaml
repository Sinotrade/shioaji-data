summary_short: 以功率MOSFET設計與銷售為核心，另銷售晶圓及其他分離式元件。
summary_long: 力士科技從事MOSFET設計與銷售，製程涵蓋0.25、0.18與0.13微米，應用於低壓及中高電壓領域。2026年上半年揭露的營收產品包括溝槽式MOSFET、晶圓、二極體、電晶體及ESD。MOSFET技術包含ETG-1分離式閘極與RTG30V／40V N通道製程，另有針對手機鋰電池充放電保護開發的CSP設計。公司持有力仕半導體（深圳）有限公司全部股權，該子公司經營電子零組件買賣業務。
