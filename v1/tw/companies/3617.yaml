summary_short: 以CyberPower品牌設計、製造及銷售不斷電系統與電源管理產品。
summary_long: 碩天科技以自有品牌CyberPower經營電源保護與管理產品，主要從事不斷電系統的設計、製造與銷售。2025年營收以不斷電系統占55.98%為主，資料中心電源管理占33.52%，電源保護及管理設備占8.35%，電源轉換器及電腦週邊設備與配件占2.15%。產品另涵蓋配電裝置、突波保護器、太陽能混和型逆變器及PowerPanel管理軟體，並提供資料中心備援與配電方案。美國Cyber Power Systems(USA),Inc.為其直接持有100%股權的子公司。
