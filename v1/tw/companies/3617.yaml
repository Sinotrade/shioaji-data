summary_short: 以CyberPower品牌設計、製造及銷售不斷電系統與電源管理設備。
summary_long: 碩天以自有品牌CyberPower設計、製造及銷售不斷電系統與電源管理產品。2025年不斷電系統占營收55.98%，資料中心電源管理占33.52%，其餘為電源保護及管理設備8.35%，以及電源轉換器、電腦週邊設備與配件2.15%。品牌銷售通路包括Best Buy、Wal-mart及Ingram Micro，資料中心產品提供電源分配與管理功能。集團於2024年決議透過菲律賓合資架構購置土地及廠房，2026年另決議增加購置既有廠房與土地，並通過對百分之百持股子公司Neu Grant增資2,500萬美元。
