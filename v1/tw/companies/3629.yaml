summary_short: 以整合行銷、活動執行、媒體公關及商業設計提供文創服務。
summary_long: 地心引力以整合行銷與文創服務為主要業務，目前專注整合行銷、活動專案及政府機關標案。2024年文創勞務收入占營收100%；2025年上半年財報亦將收入列為文創勞務，金額為新臺幣7.1萬元。服務項目包括大型活動、商業設計、媒體公關，以及網站建置與社群行銷，涵蓋實體活動與數位宣傳。截至2025年6月底，公司持有香港子公司GAMESWORD CO., LIMITED全部股權，該財報登載其主要業務為遊戲代理及發行。
