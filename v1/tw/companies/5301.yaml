summary_short: 主要經營珠寶精品設計銷售及菸酒、美妝、3C產品批發零售。
summary_long: 寶得利以珠寶精品設計與銷售，以及菸酒、美妝與3C產品批發零售為主要業務，珠寶商品包括鑽石、台灣玉石及珊瑚飾品。2025年前三季，批發及零售部門對外收入為新台幣150,115仟元，餐飲部門為3,954仟元，其他部門為6,007仟元，合併收入為160,076仟元。餐飲部門提供特色餐點與外帶服務。依2025年9月底財報，集團旗下另有興隆旅行社、駘翔旅行社、完美比例、馬來西亞BODLY及黑潮數位金融等子公司。
