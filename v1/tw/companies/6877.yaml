summary_short: 供應半導體晶圓光學檢查、三維量測及自動化設備。
summary_long: 鏵友益供應半導體晶圓檢查及自動化設備，2026年前三季產品組合中，AOI占68.3%，自動化裝置占31%。晶圓檢測產品涵蓋2D與3D檢查、巨觀與微觀自動光學檢查，以及Carrier wafer檢測。封裝測試產品包括3D Bump檢平機，可量測凸塊高度、直徑與共面度；晶圓暫存緩衝設備則可連接物料搬運與製造執行系統。公司官網沿革另揭露，2024年成立上海子公司鏵友立半導體科技(上海)有限公司。
