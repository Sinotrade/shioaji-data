summary_short: 以工業用不動產出租取得租金收入。
summary_long: 中連誠主要從事工業用不動產租賃，透過出租土地及既有不動產取得租金收入。2025年度租金收入為新台幣1億5,939萬6千元，占營收100%；出租土地面積為31,123坪，年底出租率約77%。公司持有Chung Lien Gas-Station Co.,Ltd全部股權，該子公司主要從事不動產租賃及資訊軟硬體維護修繕服務；上述資訊服務由子公司經營，並非直接歸屬母公司的主要租賃產品。
