summary_short: 製造工業製程用球閥、蝶閥及控制閥，並提供維修服務。
summary_long: 進典以工業製程用球閥、蝶閥及相關維修服務為主要業務，2025年球閥及蝶閥占合併營收94.48%，維修占5.41%，其他占0.11%。球閥以金屬密封技術為核心，應用於電廠、鋼鐵、半導體及石化製程；蝶閥採金屬塗層密封設計，另有適用含纖維、微粒及漿料的V型閥。公司亦提供閥門零配件換修與定期保養，並揭露AI算力中心液冷、資料中心自然冷卻及能源側系統的閥門應用。2026年半年報列有台灣、薩摩亞、新加坡、日本、美國與中國的合併子公司。
