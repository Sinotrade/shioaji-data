summary_short: 以靜電防護晶片為主要收入，另提供 EMI 濾波器及介面 IC。
summary_long: 晶焱科技以靜電防護晶片與解決方案為主要業務，採無晶圓廠的 IC 設計模式，著重低電容與高速傳輸介面的保護技術。2025 年營收中，ESD 產品占 95.50%，ESD 設計開發占 0.35%，其他收入占 4.15%。產品亦涵蓋整合靜電保護的 EMI 濾波器、RS 系列收發器、HDMI 切換 IC 及 CAN Bus 收發器。公司年報將 AI 伺服器列入防護方案應用，官網另列有電動車直流充電站應用。晶神醫創及英屬開曼群島商晶旭科技為其子公司。
