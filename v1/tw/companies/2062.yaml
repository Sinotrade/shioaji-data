summary_short: 製造水龍頭金屬零配件與組裝件，並提供特殊外觀表面處理服務。
summary_long: 橋椿金屬主要製造水龍頭金屬零配件與組裝件，並提供各種特殊外觀表面處理服務。2025年度合併營收組成為水龍頭金屬零配件56%、水龍頭金屬組裝件33%、其他11%，主要收入來自廚衛水龍頭相關產品。公司具備鋅、銅裝飾與功能性零組件製造技術，以及水龍頭成品設計、驗證、組裝與測試能力。集團旗下橋智自動化從事自動控制設備安裝及買賣；Sunspring America、橋椿金屬（珠海）與肇慶市寶信金屬實業則從事衛生、建築器材及相關金屬零件的生產與銷售。
