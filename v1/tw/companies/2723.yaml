summary_short: 透過85度C直營與加盟體系，販售麵包、西點及咖啡茶飲。
summary_long: 美食-KY為85度C品牌控股公司，透過集團直營與加盟體系經營咖啡烘焙連鎖業務。2025年營收以麵包占42.3%為最大宗，西點占35.1%、飲料占22.2%，其他商品占0.5%。主要子公司包括台灣美食達人股份有限公司、美國Perfect 85 Degrees C, Inc.及百悅貿易有限公司。美國市場的資產布局包括2024年紐澤西州及2025年德州不動產購置授權。2026年台灣85度C另與三麗鷗合作推出角色蛋糕，並與啤酒肚釀製合作，將可食用麵包角料再製為中秋啤酒禮盒。
