summary_short: 以85度C品牌經營咖啡烘焙連鎖門市，主要銷售麵包、西點及飲料。
summary_long: 美食-KY為85度C咖啡烘焙連鎖品牌的控股公司，集團採直營與加盟模式經營門市，提供麵包、西點及飲料。2025年度產品營收中，麵包占42.3%，西點占35.1%，飲料占22.2%，其他占0.5%，麵包為最大收入來源。產品涵蓋菠蘿與芋頭麵包、生日與長條蛋糕，以及咖啡、茶飲等。主要子公司包括美食達人股份有限公司，其由集團透過85 Degree Co., Ltd.間接持有，從事烘焙食品製造及銷售。
