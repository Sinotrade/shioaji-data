summary_short: 以車用電子為主要收入來源，產品包含HUD、車載影音娛樂及駕駛輔助系統。
summary_long: 怡利電主要經營車用電子，2025年車用電子占合併營收93.93%，其他業務占6.07%。主要產品包含擋風玻璃型HUD、AR HUD及3D AR HUD，提供行車資訊、導航與警示顯示，另有車載影音導航主機、後座娛樂及先進駕駛輔助系統。依其電子模組業務，歸屬汽車產業鏈中游的零組件與模組階段。2025年底集團子公司包括泰國怡利、印度怡利、遠視界科技及透過英屬維京群島公司持有的江蘇怡利；遠視界科技經營遠距視界護眼產品。
