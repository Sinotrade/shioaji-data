summary_short: 經營商用筆電通路，並製造與銷售強固型電腦。
summary_long: 茂訊經營商用筆記型電腦及周邊商品銷售，並製造與銷售強固型電腦。2025年商用筆電占營收48.99%，強固型筆電占48.17%，商用維修服務及其他占2.84%。強固型產品涵蓋筆記型、平板與手持式電腦；DP10A平板面向工業環境與現場服務應用。年報另將RC08無人機控制器及GCS17地面控制站列入未來研發計畫。旗下子公司包括訊志精密與澳洲MilDef Crete Australasia。
