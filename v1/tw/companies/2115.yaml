summary_short: 以輪胎氣門嘴及配件製造銷售為主，另有精密加工零件與手工具業務。
summary_long: 六暉控股以集團氣門嘴及相關配件製造銷售為核心，產品應用涵蓋自行車、機車、電動摩托車、汽車、卡車及非道路用車。2025年營收組成中，汽車、卡車及非道路用車類占35.73%，機車與電動摩托車類占26.01%，腳踏車類占17.56%，配件及其他占20.70%。產品另包括胎壓偵測氣門嘴與精密加工零件。集團旗下廈門廈暉及印尼六暉從事氣門嘴與零配件產銷，昆山六暉從事精密加工產品產銷；印尼六暉另持有PT SHEDA七成股權，由該子公司經營手工具產品。
