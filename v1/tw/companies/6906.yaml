summary_short: 以電信網路分析與定位軟體服務為主，另提供定向廣告服務。
summary_long: 現觀科技以電信數據分析軟體及定向廣告服務取得營收，2025年兩者占比分別為97.20%與2.80%。主要產品CovMo行動網路優化定位平台分析電信即時資料，協助檢視網路覆蓋與效能瓶頸，並支援5G網路布建。Mobility Intelligence包含數據分析及即時競價廣告功能，供電信業者進行數據變現；RealMotion則將行動數據用於人流分析、觀光、交通與公共安全。產品用途涵蓋電信網路管理、行動廣告與群體移動分析。
