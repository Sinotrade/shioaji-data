summary_short: 以印刷服務為主要收入，另透過子公司經營廣告、能源與資訊服務。
summary_long: 秋雨以印刷服務為主要業務，2024年印刷、廣告及其他收入分別占68.5%、27.7%及3.8%。廣告業務由子公司廣豐國際媒體經營，涵蓋桃園機場與台北車站商圈的媒體場域及廣告版位服務。子公司旭日富能源從事購電協議售電及節能服務投資，新巨合科技提供能源管理系統、即時監控與分析服務。秋雨開發亦列入合併子公司，業務性質為住宅及大樓開發租賃。公司官方法說將核心業務列為高端印刷、智慧媒體、綠能投資與數據科技。
