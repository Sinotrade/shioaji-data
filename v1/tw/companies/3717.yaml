summary_short: 透過子公司研製車用LED燈模組與元件，另經營交通號誌、路燈及顯示產品。
summary_long: 聯嘉投控透過百分之百持股子公司聯嘉光電經營LED相關業務，核心收入來自車用燈模組與元件。2025年車用LED燈模組及元件占合併營收93%，交通號誌燈及路燈占5%，其他占2%。子公司提供車內外照明LED元件與模組的OEM／ODM服務，並供應高功率LED、交通號誌、路燈及小間距顯示產品。集團具有電動車照明與Mini LED顯示應用，另於2026年公告拓展VCSEL、Micro VCSEL及Micro-LED光通訊模組，此項列為布局階段。
