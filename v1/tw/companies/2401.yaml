summary_short: 以車用資訊娛樂、駕駛輔助、聲學及智慧運算晶片的設計與銷售為主。
summary_long: 凌陽以 IC 設計與銷售為主要業務，2025 年合併營收中，IC 收入占 93.72%，其他收入占 6.28%。母公司產品涵蓋車用資訊娛樂、先進駕駛輔助、智能聲學、數位影音播放機及 Plus1 智慧運算晶片。SPHE8368 支援 CarPlay 與 Android Auto，SPHE6702 為 ADAS 平台，SP7350 為 AI 視覺 SoC。主要營運子公司包括凌通科技、凌陽創新科技及景相科技；官網另列 Plus1 晶片的自走機器人與無人機應用。
