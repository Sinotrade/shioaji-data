summary_short: 正文以無線網路閘道器、網路卡及通訊模組的研發製造與銷售為主。
summary_long: 正文科技主要產品包括無線網路閘道器、無線網路卡及無線通訊模組。2025年營收以無線網路閘道器占72.42%為主，網路卡占10.91%，無線通訊模組占0.73%，其他占15.94%。公司亦開發固定無線接取設備，其WoMT方案將Wi-Fi 7技術延伸至5G毫米波頻段；另推出400G與800G高速光模組，拓展資料中心應用。研發規劃包含低軌衛星主動陣列天線與無人機長距離通訊裝置。主要子公司包括Gemtek Vietnam、普羅通信及G-Technology Investment。
