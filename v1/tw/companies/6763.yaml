summary_short: 提供第三方支付、金物流代收付及電子發票等服務，收取服務費。
summary_long: 綠界科技以第三方支付及金物流代收付服務為主，依賣家身分收取服務手續費；金流工具涵蓋信用卡、銀行轉帳、超商代收、行動支付與無卡分期。公司另提供超商取貨、宅配與低溫配送整合、電子發票加值服務、ECTicket票券發行管理及企業網站資安檢測。2026年上半年，第三方支付部門對外收入為9.2197億元，廣告營運部門為1,280.5萬元。母公司為茂為歐買尬，並控制綠界大數據及其子公司福利免費開店平台。
