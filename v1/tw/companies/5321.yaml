summary_short: 以服飾電商、品牌孵化及UR Living實體商場取得營收。
summary_long: 美而快以服飾電商與品牌孵化為主要業務，透過網紅自媒體流量進行服飾商品設計及銷售，並經營線上線下零售通路。2025年電商事業占合併營收61.87%，實體商場占34.34%，其他業務占3.79%。子公司美而快實業旗下PAZZO提供快時尚日常衣著，MEIER.Q主打簡約女性衣飾，集團並以UR Living發展實體零售。美而快實業、美而快生活美學與美而快餐飲均為全資子公司。
