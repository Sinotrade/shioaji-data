summary_short: 透過子公司銷售化學纖維、塑膠回收設備工程及再生聚酯原料。
summary_long: 寶綠特透過子公司經營化學纖維、塑膠回收設備工程與再生塑料三項業務。2025年化學纖維營收約21.76億元，高於設備部門約17.52億元及再生塑料部門約8.61億元，為最大營收來源。浙江安順生產再生聚酯短纖與衛生用複合纖維；浙江寶綠特提供塑膠回收清洗設備及食品級瓶到瓶工程。台灣寶綠特生產再生聚酯瓶片與酯粒，酯粒可用於食品包裝、片材與射出成型。集團另持有印度設備子公司。
