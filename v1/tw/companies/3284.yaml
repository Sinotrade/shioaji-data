summary_short: 以印刷版材為主要營收來源，集團另有不動產代銷業務。
summary_long: 太普高以印刷版材為主要營收來源，2025年印刷版材占合併營收61.16%，不動產代銷占29.92%，其他業務占8.92%。官網列示環保版T-20、熱敏CTP版TUV及UV CTP（CTcP）版HS-920等產品。集團子公司包括上嘉行銷、太普高投資及泰品生活事業；2026年官網亦明列普興與TOP HIGH IMAGE BRASIL LTDA為子公司。依2026年3月底資料，上嘉行銷為太普高直接持股100%的公司。
