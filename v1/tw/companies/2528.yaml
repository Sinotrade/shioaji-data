summary_short: 委託營造廠興建住宅與商業大樓，以房地銷售及出租取得收入。
summary_long: 皇普建設以不動產開發及房地租售為主要業務，委託營造廠商興建住宅與商業大樓，商品包括住宅大樓、商業大樓、停車場及透天別墅。2025年度營業收入中，皇普莊園建案認列房地收入新台幣8,441,989仟元，另有租賃收入774仟元，收入組成涵蓋建案房地銷售及不動產出租。依2026年10月2日公告，築遠營造已列為皇普的重要子公司。
