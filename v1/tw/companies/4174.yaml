summary_short: 合併收入以潤雅子公司CDMO服務為主，另從事抗癌新藥與ADC平台研發。
summary_long: 浩鼎從事抗癌新藥與ADC技術研發，合併收入另包含子公司潤雅的委託開發暨製造服務。2025年合併營收5,857.5萬元，其中CDMO收入5,000.7萬元，專利技術授權856.8萬元；依最大收入來源歸入生技代工。研發產品包括以TROP2為標靶的OBI-902、OBI-992，以及以Nectin-4為標靶的OBI-904，均屬研發中藥物。自有Obrion平台整合醣鍵結與連接子技術，支援ADC開發。
