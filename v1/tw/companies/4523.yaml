summary_short: 以真空斷路器等電力設備為主，兼營熱管理、智慧生活及機電工程。
summary_long: 永彰2025年度營收以能源科技為主，占53.48%，熱管理、智慧生活及機電工程分別占27.56%、10.48%及8.48%。電力設備產品包括真空斷路器、配電盤與C-GIS開關；熱管理業務涵蓋伺服器散熱模組與液冷材料，車用熱管理已於2025年4月停止生產。2025年度主要銷貨客戶為明電舍及MEIDEN AMERICA SWITCHGEAR。永彰亦透過子公司永雋科技布局儲能，並於2026年決議再增資。資產方面，2025年完成觀音土地出售及青埔辦公室購置。
