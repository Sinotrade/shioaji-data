summary_short: 以砷化鎵及氮化鎵晶圓代工為主，提供射頻與光電元件製造服務。
summary_long: 穩懋以三五族化合物半導體晶圓代工為主要業務，2025年晶圓代工占營收95.73%。公司提供HBT、pHEMT、BiHEMT及GaN製程，應用於無線通訊、5G基地台與低軌衛星。光電服務涵蓋VCSEL，並開發InP製程；2025年光電應用占營收11%。具名報導列Broadcom、Qorvo及Skyworks為客戶，歷史報導亦記載Qualcomm代工支援及Lumentum客戶關係。2025年公司公告出售高雄路竹廠房予日月光半導體，交易金額65億元。
