summary_short: 以胎壓偵測器、強固型工業電腦及能源管理產品為主要營收來源。
summary_long: 系統電主要產品涵蓋胎壓偵測器、強固型工業電腦及能源管理產品。2026年上半年，TPMS占營收46%、工業電腦占38%、AI資料中心能源系統及其他占16%，TPMS仍為最大來源。公司自行研發採用Qualcomm平台的邊緣運算工業電腦，能源產品包含集中式UPS電池及伺服器機櫃式BBU；子公司電統能源從事能源管理產品製造與銷售。公司透過私募引進和碩投資，合作範圍包括美國製造、聯合採購與市場開發，另與加百裕合作電池相關技術及供應鏈，與岱宇合作電動輔助自行車。無人機業務則結合台灣在地製造、地面控制系統研發，以及Quantum Systems與Vantage Robotics的產品合作。
