summary_short: 以電力系統設計、整合與工程統包為主，提供發電、不斷電及儲能設備。
summary_long: 安葆以電力系統的設計、安裝與整合為主業，提供發電機組、不斷電系統、儲能設備及PLTC控制系統，並承攬電力系統EPC工程。2025年營收以機電工程為最大來源，占86.22%，銷貨占7.44%，勞務服務占6.34%。其PLTC系統支援發電機組併聯、電源切換與跨廠區供電；儲能方案涵蓋飛輪裝置與電池櫃。公司亦為Tier III與Tier IV資料中心建置電力系統，並將發電、儲能及關鍵電力防護整合為微電網方案。
