summary_short: 研發與銷售電信接取、寬頻及光傳輸設備。
summary_long: 榮群電訊以電信接取網路與光傳輸設備為主要業務，產品涵蓋DLC、IP DSLAM、MSAN、G.SHDSL、VoIP語音閘道器及GPON設備。2025年度營收組成為接取網路設備及寬頻產品76%、傳輸設備1%、其他23%。光傳輸產品包括CWDM／ROADM、光多工機及NG-SDH。公司另提供CSXP電信級伺服器與100G乙太網路交換平台，官網列有5G專網核心網路應用，可作為相關網路系統的硬體平台。
