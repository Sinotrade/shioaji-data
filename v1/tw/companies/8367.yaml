summary_short: 提供報關、運輸、碼頭裝卸、倉儲及貨櫃場等整合物流服務。
summary_long: 建新國際經營整合物流服務，業務涵蓋報關、運輸、碼頭裝卸、倉儲與貨櫃場，串接進出口貨物的通關、運送及儲轉流程。報關服務包含一般及保稅進出口；運輸服務涵蓋貨櫃、平板貨物與化學品。倉儲服務包括一般倉庫、保稅倉庫與自由貿易港區，貨櫃場則提供貨物裝卸、空重櫃儲存及查驗等服務。依2023年永續報告書，子公司包括中科國際物流、安順裝卸、建通國際及新科智慧物流。
