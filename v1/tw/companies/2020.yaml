summary_short: 以碳鋼與不鏽鋼鋼管製造銷售為主，另提供液冷機櫃分歧管。
summary_long: 美亞以鋼管製造與銷售為主要業務，產品包括鍍鋅碳鋼鋼管、不鏽鋼管及機械結構用碳鋼鋼管。鍍鋅鋼管應用於瓦斯、冷凍與溫室配管，不鏽鋼管用於耐腐蝕、耐高低溫及消防給水，機械結構管則包括油壓與避震器用管。官網另列液冷機櫃分歧管，供AI伺服器與高效能運算機櫃分配冷卻液。依一一三年度年報，合併子公司包括越南美亞責任有限公司及美亞商旅股份有限公司，分別經營鋼管製造與旅館業務。
