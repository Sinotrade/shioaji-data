summary_short: 代理電子材料與零組件並提供模切加工，產品涵蓋光學材料及液冷零組件。
summary_long: 久威以電子材料與電子零組件代理銷售、模切加工為業務。官網的觸控光學材料包括光學膠，用於顯示器、鏡頭、觸控螢幕與面板等透明元件貼合。AI伺服器產品列有快速接頭及散熱模組，前者應用於AI／GPU伺服器液冷系統，後者支援高功率GPU／CPU水冷散熱。因此可歸入AI伺服器零組件與液冷零件、模組題材。公司組織另列有美國子公司JUIC GLOBAL CORPORATION，重大訊息亦具名揭露兩家重要子公司。
