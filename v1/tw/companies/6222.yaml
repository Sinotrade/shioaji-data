summary_short: 主要銷售商用與家用照明設備，另經營小家電貿易。
summary_long: 立軒主要從事照明設備銷售，產品涵蓋商用與一般家用LED照明，並經營小家電貿易。照明產品包括工作燈、天井燈及戶外燈等燈具，以及LED燈泡、PL燈及鹵素燈等光源。2025年照明設備營收為新臺幣276.7萬元，占全年營收100%，同年度銷售地區全部為國內。公司2023至2025年的銷售均集中於國內市場。截至2026年3月底，持有邦丞電子科技99%股權；該公司已於2025年決議解散，年報記載清算程序仍在進行。
