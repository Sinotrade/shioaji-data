summary_short: 以55688平台經營叫車、生活服務媒合及廣告業務。
summary_long: 大車隊以55688 APP提供叫車與生活服務媒合，透過數位平台連結乘車需求與駕駛。集團服務延伸至即時快遞、代駕與居家清潔；即時快遞可在APP下單並追蹤配送，酒後代駕則由駕手駕駛使用者自有車輛。生活服務提供一般清潔、深度打掃與裝潢後清潔等預約項目，廣告業務則整合計程車、影城、貨卡與APP媒體。歷史董事會資料另揭露台灣大車隊投資控股及台灣智慧生活網為子公司。
