summary_short: 以沖壓、蝕刻與電鍍製程製造半導體IC與LED封裝導線架。
summary_long: 長華科技以半導體封裝導線架製造與銷售為主，2024年IC導線架占合併營收72.09%，LED導線架占7.14%，另有環氧樹脂業務占18.61%。公司採用沖壓、蝕刻與電鍍製程，提供QFN、Pre-Mold及功率元件封裝用導線架，服務IDM與封裝測試客戶。具名客戶包含Texas Instruments、Infineon及STMicroelectronics；母公司長華電材亦為通路客戶，2024年占合併營收18.42%。集團透過馬來西亞MSHE及蘇州興勝科等子公司經營海外業務，並有馬來西亞購地委建、威海新廠投資及上市公司股票交易。
