summary_short: 以微生物發酵技術生產保健食品原料，提供發酵及成品代工服務。
summary_long: 金穎生技以微生物發酵技術從事食品原料研發、生產與專業代工，並提供保健食品配方、劑型及包裝整合服務。2025年營收以微生物發酵為主，占64.31%，主要產品包括益生菌、乳酸菌、納豆激酶及紅麴；草木本植物功能性產品占18.21%，食藥用菇蕈類發酵占10.76%，果蔬發酵濃縮物及蛋白質產品占4.00%。截至2026年3月底，公司直接持有東莞金穎全部股權，並透過東莞金穎間接持有江蘇金穎全部股權。
