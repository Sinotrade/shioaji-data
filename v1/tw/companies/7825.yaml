summary_short: 提供光學影像檢測、精密對位設備與智慧製造軟體。
summary_long: 和亞智慧提供光學影像檢測、精密對位設備及智慧製造軟體。2024年自動化方案占營收46.95%，軟體、技術勞務及系統整合占43.22%，其他占9.83%。產品包括晶圓2D加3D檢測量測系統、攝像頭模組影像品質檢測系統、AR模組AA系統、AI自動瑕疵分類平台及CIM系統整合，功能涵蓋凸塊量測、影像清晰度檢測、光學對位與設備資訊串接。2026年第一季財報列示全資子公司NS VISION，並透過該公司持有深圳創兆智能科技有限公司全部股權。
