summary_short: 製造光通訊與感測用雷射、檢光元件及光電轉換組件，並提供磊晶與代工服務。
summary_long: 光環科技研發、生產及銷售光通訊與感測用光電產品，核心產品包括VCSEL、FP／DFB雷射及PIN／PINTIA檢光二極體，產品形式涵蓋元件、次模組及光引擎。2025年度晶粒及其零組件占營業比重63%，光電轉換組件占28%，其他占9%。公司具備GaAs／InP光電半導體製程與封裝平台，並開發VCSEL磊晶技術。矽光子方面已開發整合矽光晶片與光纖陣列的COB封裝平台，CW Laser代工亦已有營收貢獻；CPO業務定位包含雷射光源與封裝整合服務。
