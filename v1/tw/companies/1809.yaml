summary_short: 以陶瓷色釉料製造銷售為核心，並提供玉晶石建材與先進陶瓷材料。
summary_long: 中釉以陶瓷釉料為核心，製造與銷售熔塊釉、成釉、乾式釉料及陶瓷色料。建材產品包括經高溫結晶化處理的玉晶石，可用於建築裝飾。新材料產品涵蓋用於車燈與高功率照明的螢光玻璃PiG、螢光陶瓷，以及全固態電池用固態電解質材料。公司另開發高階晶片封裝用類晶玻璃陶瓷中介層材料，著重低介電與高機械強度，持續推進研發、驗證及商品化。該封裝材料的研發方向包括因應AI伺服器晶片對高速、高密度傳輸的需求。
