summary_short: 製造客製化精密機構件，以伺服器機櫃、電源櫃及航太零組件為主。
summary_long: 經寶精密製造客製化精密機構件，產品涵蓋AI伺服器機櫃、電源櫃、水冷分歧管及CDU冷卻模組，航太產品包括飛行控制電腦機殼與航電機構件。公司2025年11月說明，通訊類業績占比約六成多，航太類約兩成多。集團旗下有泰國經寶及法國歐洲經寶，後者為透過泰國經寶持有的間接子公司。2025年歐洲經寶完成收購法國Segnere，擴充航太鈑金與結構組裝業務；同年泰國經寶與Amazon Data Services (Thailand) Limited簽約出售四筆土地。母公司另於2026年9月公告對泰國經寶的增資投資案。
