summary_short: 設計製造電動車逆變器散熱模組與零組件，另開發伺服器及光通訊散熱產品。
summary_long: 艾姆勒設計製造逆變器與 IGBT 功率模組散熱零組件，應用於電動車及油電混合車，亦提供 ADAS 散熱模組。2025 年逆變器散熱模組占營收 91.85%，其他業務占 8.15%。製程技術涵蓋粉末冶金及金屬射出成型，可製作複雜散熱鰭片。公司另開發 AI 伺服器散熱模組與次系統；2026 年 8 月法說會揭露浸沒式冷卻模組仍在送樣驗證，800G OSFP 外殼與散熱組件亦處送樣認證階段。
