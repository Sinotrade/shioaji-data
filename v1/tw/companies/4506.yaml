summary_short: 以電梯、電扶梯製造銷售及維保、舊梯更新為主要業務。
summary_long: 崇友以電梯、電扶梯製造銷售及維護保養、舊梯更新為主要業務。2024年電梯與電扶梯占營業收入53.69%，勞務占43.61%，發電機占2.70%。產品包含堅尼西斯高速電梯、電扶梯與自動走道，服務涵蓋原廠維保、緊急搶修及舊梯機能更新。公司亦開發AGV／AMR智慧電梯整合系統，讓搬運機器人自動搭乘電梯跨樓層移動。2026年第二季財報列入合併的子公司包括開曼崇友、好厝邊科技與日本V.T. SYSTEMS，上海崇友電梯則由開曼崇友持有。
