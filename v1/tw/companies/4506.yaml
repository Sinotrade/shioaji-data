summary_short: 主要銷售電梯與電扶梯，並提供維修保養服務，另經營發電機。
summary_long: 崇友主要銷售電梯與電扶梯，並提供維修保養服務，另經營發電機。2024年電梯、電扶梯占營收53.69%，勞務占43.61%，發電機占2.70%。堅尼西斯系列為其國產高速電梯產品，另與東芝電梯簽有技術合作及台灣代理契約。2026年第一季維修保養台數為45,365台。具名工程與服務實績包括台北101、台北捷運及高雄捷運；國泰建設與遠雄建設亦有歷史供貨紀錄。公司另開發AGV／AMR智慧電梯整合系統，支援機器人跨樓層運行，並與亞福儲能合作推動電梯儲能減量方法與示範案。
