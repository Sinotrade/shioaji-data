summary_short: 以美容美體保養品銷售及SPA課程服務為主要收入來源。
summary_long: 佐登-KY主要經營美容美體產品與SPA課程服務。2025年度產品銷售占營收47.67%，課程服務占43.80%，其他收入占8.53%。美容美體產品包括清潔用品、化妝水、精華液、乳液乳霜、面膜、精油及保健食品；課程涵蓋臉部、身體、局部、儀器及深度護理。其他業務包括管理諮詢與觀光工廠。主要子公司包括佐登妮絲國際、佐登微爾生醫，以及佐登妮絲（廣州）美容化妝品有限公司。
