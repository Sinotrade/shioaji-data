summary_short: 以散裝乾貨與原油海運為主，另提供船舶管理服務。
summary_long: 新興航運集團主要提供乾散貨與原油海上運輸，另有船舶管理收入。2025年散裝輪占營收64.71%、油輪占34.84%、船舶管理占0.45%，以散裝輪為最大營收來源。依2026年8月法說會揭露的6月底基準，集團自有船隊共13艘，包括4艘Kamsarmax、6艘Capesize、1艘VLOC及2艘VLCC。乾散貨船承運礦砂、煤炭等大宗物資，油輪則承運原油，營運涵蓋乾散貨與能源運輸。
