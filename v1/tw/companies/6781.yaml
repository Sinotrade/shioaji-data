summary_short: 透過子公司製造銷售鋰電池模組，應用於伺服器備援電力及輕量型電動載具。
summary_long: AES-KY透過子公司經營鋰電池模組，2025年該產品占合併營收99.7%。產品包括電動自行車、電動摩托車等輕量型電動載具電池，以及資料中心與工業儲能電池模組；2025年前三季伺服器BBU占營收約七成。公司透過太普動力新能源（常熟）及嘉普科技從事生產、銷售與售後服務，新普科技為其最終母公司。具名媒體報導AWS與Meta的BBU供貨關係，以及與光寶科的相關合作。年報列示Bosch、BMZ與Panasonic為輕量型電動載具市場競爭者。2025年新加坡子公司另公告投資新設Precision Technology Holding Limited。
