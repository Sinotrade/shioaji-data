summary_short: 設計與製造電源傳輸線、訊號連接線，涵蓋電腦、家電及特殊應用。
summary_long: 良得電以電源傳輸線及訊號連接線的設計與製造為主要業務，產品應用於個人電腦、筆記型電腦、家電、雲端運算、智慧裝置及遊戲機。2025年度資訊及電腦電器電源傳輸線占營收98.40%，其他業務占1.60%。年報列示開發成功的產品包括電動車旅行用充電線組，以及具防水、阻燃特性的低軌衛星室內外電源線。子公司包括怡富萬電業、良得日本與良得電業（越南）；怡富萬電業（惠州）為透過怡富萬電業持有的間接子公司。
