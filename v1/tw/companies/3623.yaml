summary_short: 設計、製造及銷售觸控面板，並提供觸控顯示貼合與客製服務。
summary_long: 富晶通以電阻式及電容式觸控面板的設計、製造與銷售為主要業務，2025年觸控面板占營收99.84%，其他業務占0.16%。產品涵蓋薄膜式與純玻璃式投射電容觸控面板，另提供觸控面板與LCM貼合及整合方案，也可依需求訂製觸控面板。中環股份有限公司為其最終母公司。翊光電子為其持股66.67%的子公司，自2026年8月起納入合併財務報表。
