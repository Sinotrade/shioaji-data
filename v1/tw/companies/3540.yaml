summary_short: 銷售電競整機、電源供應器、機殼與散熱產品。
summary_long: 曜越的產品涵蓋電競桌上型電腦、電源供應器、機殼及散熱設備。依2026年1至9月產品別營收統計，電競整機占35%、電源供應器占33%、機殼占14%、散熱器占13%，其他產品占5%。公司並展示A550個人AI工作站，以及配置於工作站的一體式水冷散熱器，產品範圍由零組件延伸至完整電腦系統。截至2026年6月底，直接子公司包括全資持有的Thermaltake Holding Co.,Ltd.及曜越電競股份有限公司。
