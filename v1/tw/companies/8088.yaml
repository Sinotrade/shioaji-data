summary_short: 研發、製造及銷售記憶體模組與快閃儲存產品，並提供電子製造代工服務。
summary_long: 品安主要從事記憶體模組及快閃記憶體相關產品的設計、製造與銷售，並提供電子製造服務。2025年度營收以記憶體模組相關產品為主，占61.71%，代工占35.91%，其他占2.38%。產品涵蓋DDR5記憶體模組、2.5吋SATA SSD、SD與microSD記憶卡，以及Mini PCI-e工業電腦擴充卡。電子製造服務包含硬體設計、SMT與DIP製程、IC測試與分類等作業，亦提供OEM及ODM客製化設計與代工服務。
