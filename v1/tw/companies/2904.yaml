summary_short: 以臺中港油品、化學品儲槽租賃與儲轉服務為主，兼營太陽光電售電。
summary_long: 匯僑以化學品與油品儲槽出租、港埠倉儲儲轉服務為主要業務，於臺中港設有兩座槽區，官網揭露共51座儲槽，總容量約30萬公秉。2025年度個體營收中，儲槽租賃約占90.2%，能源事業售電約占9.8%。能源事業以投資太陽光電系統，取得長期售電或設備租賃收入為營運模式。子公司和震豐從事商用不動產投資與租賃；另有常富豐、宇豐綠能及寬泰綠能等太陽能發電子公司。
