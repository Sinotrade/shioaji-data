summary_short: 以事業廢棄物焚化處理、資源回收及銅粉銷售為主要收入來源。
summary_long: 中台以事業廢棄物處理與資源回收服務為主要業務，透過焚化處理回收熱能發電，並處理廢光源與含汞廢棄物。公司亦將廢印刷電路板資源化，生產銅粉產品，另提供環境整治工程服務。依2026年9月法說簡報，2026年上半年營收組成為焚化處理等54%、回收處理26%、銷售銅粉等19%、環境工程1%，焚化處理等為最大來源。新技術方面，廢鋰電池前處理與材料回收列為研發項目，尚處技術成熟度驗證階段。
