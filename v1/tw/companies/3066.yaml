summary_short: 以LED元件、顯示器與照明產品為主，另提供半導體零組件及製造服務。
summary_long: 李洲科技主要經營LED元件與顯示器，產品涵蓋數位顯示器、貼片型顯示器、點陣顯示器、SMD LED及插件型LED。依2024年度年報，發光二極體光電產品占營業比重93.51%，磊晶占6.32%，其他占0.17%。官網另列有LED吊燈、線型燈與面板燈，以及記憶卡、隨身碟、固態硬碟，並提供電子專業製造及半導體設計製造服務。依2025年第三季合併財報，子公司包括洲磊科技、LORBITS及綠洲醫藥生技，並透過海外控股公司持有東莞李洲。
