summary_short: 主要銷售微米與奈米級定位系統、精密馬達及運動控制元件。
summary_long: 大銀微系統以微米與奈米級定位系統及精密運動控制元件為主要營收來源，2025年營收占比分別為52.58%與46.56%。產品涵蓋線性馬達定位平台、線性馬達、力矩馬達、控制器與驅動器，以及整合伺服馬達與驅動器的單軸機器人模組。定位平台可用於光學檢測、雷射加工與自動化生產設備；控制器與驅動器亦應用於機器人系統。公司持有以色列Mega-Fabs Motion Systems Ltd.六成股權，該子公司從事驅動器與控制器研發及產銷。
