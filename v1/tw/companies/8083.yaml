summary_short: 以自動倉儲軸承為主要收入，另銷售車庫門、手推車及休旅車拉門軸承。
summary_long: 瑞穎的主要產品為設備用軸承，涵蓋自動倉儲、車庫門、手推車及休旅車拉門等用途。2025年度，自動倉儲使用之軸承占營收74.15%，為最大收入來源；車庫門使用之軸承占12.56%，手推車使用之軸承占7.51%，休旅車拉門軸承占0.78%，其他占5.00%。車庫門軸承應用於北美住宅車庫門，手推車軸承則用於賣場、機場及各類營運場域，涵蓋民生設備與商業服務設備的應用。
