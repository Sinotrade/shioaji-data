summary_short: 承攬整廠EPC統包、無塵室、機電及製程管路工程。
summary_long: 亞翔以整廠EPC統包、無塵室、機電及製程管路工程承攬為主要業務，統包服務涵蓋規劃、設計、採購、施工與系統整合。2025年其他含統包工程營業比重為63.38%，機電工程25.01%，無塵室工程7.80%，製程管路工程3.81%；2026年上半年半導體產業工程占總營收82%。已查證的工程客戶包括台積電、南亞科與美光集團，群創則有歷史無塵室承攬實績。主要子公司包括榮工工程、亞翔蘇州與新加坡亞翔。近三年事件包括認購榮工增資、設立新加坡子公司及合資企業，以及母公司、分公司與榮工各自的不動產交易。
