summary_short: 經銷半導體測試、封裝與檢測設備，提供技術服務並開發自有光學檢測設備。
summary_long: 蔚華科技以半導體設備經銷與技術服務為主要業務，2024年半導體設備占合併營收95.44%，其餘為勞務、維修與其他收入。經銷產品涵蓋NI測試系統、ShibaSoku功率半導體測試設備、Toray Engineering覆晶與光學檢測設備，以及SEMICS、AFORE等晶圓或微機電測試設備。公司亦開發SP8000S非破壞性TSV檢測系統，2026年已完成首套交付。2025年與NI宣布共同建置功率半導體動態可靠度驗證實驗室，並於同年一月增持南方科技及日昌光電。
