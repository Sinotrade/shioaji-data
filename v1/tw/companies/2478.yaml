summary_short: 以晶片電阻製造與銷售為主，並提供電流感測及電路保護元件。
summary_long: 大毅以晶片電阻製造與銷售為主要業務，2025年晶片電阻占合併營收88.86%，其他產品占11.14%。產品涵蓋厚膜晶片電阻與排阻、高精密薄膜電阻、電流感測元件、晶片保險絲及靜電抑制器，提供電阻、電流量測與電路保護用途。公司已針對5G及電動車推出被動元件方案，並將產品應用於AI伺服器。集團透過大毅控股及大毅國際分別持有蘇州與東莞生產子公司，另直接持有越南海陽大毅，形成跨區域製造布局。
