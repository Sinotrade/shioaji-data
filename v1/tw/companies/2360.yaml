summary_short: 以Chroma品牌銷售電子量測、自動化及半導體測試設備。
summary_long: 致茂以自有品牌Chroma提供精密量測與自動化測試解決方案，2025年合併部門收入以量測儀器為最大來源。產品涵蓋SoC／類比測試、系統級測試（SLT）、7980晶圓量測、PIC可靠度測試，以及伺服器電源與BBU測試。7980對應CoWoS等先進封裝的關鍵尺寸量測，公司亦提供CPO相關測試方案。公開報導確認NVIDIA、AMD及Google採用其SLT設備；宏致導入Sajet MES，台星科公告向其購買機器設備與零配件。威光、太奇智聯及匯宏為子公司。近年交易包括取得Chroma Systems Solutions股權、購置廠辦監控工程、處分員工住宅及凌華股票；2026年董事會另通過橋頭園區租地委建廠房計畫。
