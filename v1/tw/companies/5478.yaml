summary_short: 以MyCard遊戲點數通路為主，並經營遊戲、數位行銷與支付服務。
summary_long: 智冠以遊戲點數通路與相關服務為核心，MyCard提供遊戲及數位內容點數，並搭配客製化行銷活動。集團由子公司中華網龍從事遊戲自製研發及IP經營，遊戲新幹線提供線上與手機遊戲代理營運。網路行銷由一帆數位提供廣告投放及整合行銷，金融科技則由藍新科技提供NewebPay金流服務。2024年合併營收按收入性質區分，勞務收入占79.92%，遊戲營運占8.87%，商品銷售占8.75%，授權收入占2.46%。
