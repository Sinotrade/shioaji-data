summary_short: 研發、製造與銷售透明質酸醫療器材，產品涵蓋關節注射與醫美填補等領域。
summary_long: 科妍以透明質酸高階醫療器材研發與製造為核心，2025年度透明質酸醫療器材占營收96.32%，其他業務占3.68%。主要產品包括海捷特系列關節腔注射劑、海德密絲與法思麗皮下填補劑、玻達癒與德撫癒可吸收防沾黏凝膠，以及海優樂膀胱灌注液。核心技術包括透明質酸交聯平台CHAP與透明質酸自體交聯技術。年報列有四家全資子公司，分別為UNI-PROFIT、程澤醫療器械、紳詠生技顧問及肯笛絲生醫。
