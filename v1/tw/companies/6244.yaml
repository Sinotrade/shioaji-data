summary_short: 製造銷售太陽能電池與模組，提供光電系統整合並經營發電售電。
summary_long: 茂迪主要製造與銷售太陽能電池及模組，並提供太陽能發電系統整合服務。電池產品包含XN184BP單晶TOPCon雙面系列，雙玻雙面TOPCon模組則列有460W、510W及605W規格。系統服務涵蓋諮詢評估、場址勘查與設計、工程統籌及營運維護。2024年光電事業部占營收91.39%，電力事業部占8.54%。集團透過茂盛電業與東元茂迪等子公司經營發電售電，並由Power Islands持有茂迪蘇州子公司。
