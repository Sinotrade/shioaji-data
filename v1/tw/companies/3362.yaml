summary_short: 以光學鏡頭、鏡片及集團指紋辨識模組業務取得營收。
summary_long: 先進光主要產品為光學鏡頭與鏡片，應用包含筆記型電腦及平板電腦，鏡片材質涵蓋塑膠與玻璃。2024年光學產品占營收68.90%，電子零組件占31.10%。官網另列行車紀錄器CCM及數位監控應用產品。集團旗下科雅光電經營指紋辨識模組，耀崴科技從事車用產品，越南子公司製造光學鏡頭鏡片，鎮江子公司負責鏡頭組裝，智匯創新從事產品設計。年報亦揭露朝無人空拍機鏡頭應用拓展，此項列為應用布局。
