summary_short: 以企業文件辨識、協同管理軟體與系統服務為主，另有通路業務。
summary_long: 力新以企業軟體與數位化服務為主要業務，2025年軟體暨系統服務收入占53.6%，通路業務占46.4%。產品包含GenAI-OCR企業單據辨識、智慧證件辨識，以及Pro OA的ISO文件管理、BPM電子簽核與HR人資考勤系統，涵蓋資料擷取、證件辨識及行政流程管理。直接子公司包括Gold Gleam Holdings Limited、網星資訊與力新創新科技，另透過海外控股架構持有力新西安及牙得安南寧。
