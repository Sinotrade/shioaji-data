summary_short: 主要提供電腦軟硬體系統整合、維修維運及軟體服務，另有少量遊戲收入。
summary_long: 天剛資訊主要提供電腦軟硬體系統整合、維修與維運服務，並從事軟體銷售規劃、開發建置及顧問諮詢。2025年度系統整合及維修收入占營收97%，線上遊戲收入占3%，營收結構仍以資訊服務為主。官網展示天剛造字系統，協助企業處理中文造字、字碼一致性與更新管理，另提供CBMR及TBMR備份復原軟體。依年報2026年4月14日持股資料，天鑫投資開發、鈦飛科創與兆邦開發建設均為天剛全資子公司。
