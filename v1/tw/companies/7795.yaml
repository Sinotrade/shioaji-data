summary_short: 以ABF載板用真空壓膜設備為主要收入來源，另銷售膜材及提供勞務。
summary_long: 長廣精機以ABF載板用真空壓膜設備為主要業務，產品涵蓋單段、二段及三段式機型，並銷售膜材及提供勞務。2025年營收中，設備占93.74%、膜材占5.76%、勞務占0.50%。母公司為長興材料工業，旗下全資子公司包括日本Nikko-Materials與長廣精機（廣州）。最新法說揭露日本子公司占2025年營收85%。公司亦開發玻璃基板與承載玻璃用真空壓膜設備，以及晶圓ABF真空貼膜設備。
