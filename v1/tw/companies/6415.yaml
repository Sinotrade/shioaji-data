summary_short: 研發設計及銷售電源管理與類比IC，服務消費、工業、車用等市場。
summary_long: 矽力杰主要從事類比及數位混合IC的研發設計與銷售，主要產品為電源管理IC，另有直流轉換、交直流轉換、LED照明及電池管理系統晶片。2025年營收按終端應用區分，消費性電子占37%、工業占30%、車用占14%、資訊占12%、網路通訊占7%。公司向LG電子供應IC，並布局人工智慧資料中心核心供電晶片及電動車晶片方案。主要子公司包括杭州矽力杰及Silergy Technology。近三年交易包括投資英諾賽科、杭州子公司投資加特蘭與矽至天成，以及2026年公告收購Yuntu Semiconductor。
