summary_short: 研發、製造與銷售車載、嵌入式及邊緣人工智慧電腦。
summary_long: 鑫創電子以車載電腦、嵌入式電腦與邊緣人工智慧運算平台的研發、製造及銷售為主。2025年合併營收中，車載電腦約占90.46%、嵌入式電腦占4.63%，其他產品占4.91%。產品涵蓋工業自動化運算、車載資訊顯示與人機介面，以及無人機用邊緣運算電腦。公司另提供AGV與AMR自主導航控制器，並開發電動車充電站解決方案。美國全資子公司負責工業電腦與周邊產品銷售及售後服務。
