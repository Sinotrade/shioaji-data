summary_short: 主要透過子公司經營餐飲與婚宴，另有生技醫療及IC應用產品業務。
summary_long: 巨虹電子以餐飲與婚宴服務為主要收入來源，2025年餐飲營收占87.48%，生技醫療占12.24%，IC應用產品占0.28%。餐飲相關子公司包括吉品海鮮與幸運，官網列有吉品海鮮、吉品初筵與翡麗詩莊園。公司另提供AI助聽器及RM6.4智慧戒指，年報亦列有IC應用相關電子產品，業務涵蓋餐飲服務、生技醫療及電子應用領域。吉慶為透過吉品海鮮持有的間接子公司，從事食品批發。
