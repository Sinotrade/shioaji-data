summary_short: 委託營造廠興建住宅及大樓，以房地產出售與出租取得收入。
summary_long: 理銘主要委託營造廠興建住宅及大樓，透過出售與出租取得收入，114年度此業務營收占比為100%。產品包括住宅大樓、辦公大樓及停車位，主要銷售區域為新竹與臺南。臺南仁德「東都綠學」於113年底完工，114年度持續銷售交屋。其他開發產品包括仁德二空段A1、A2自地自建案，以及新竹市光武段合建分售案；年報刊印時，A1案已取得使用執照。公司的主要業務集中於住宅及大樓開發租售，個別建案的營收占比未另行揭露。
