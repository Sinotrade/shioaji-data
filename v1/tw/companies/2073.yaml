summary_short: 以盤元線材酸洗、球化退火與伸線加工服務為主要收入來源。
summary_long: 雄順金屬主要提供盤元線材加工服務，位於鋼鐵產業鏈中游。2024年金屬線製品加工占營收98.27%，其他業務占1.73%，收入以線材加工為主。加工服務涵蓋酸洗、球化與退火熱處理，以及粗抽、精抽等伸線製程。官網列示的線材種類包括冷打級線材、低碳鋼線材、中高碳鋼線材及低合金鋼線材，線徑規範為2至34毫米。加工線材應用於扣件、手工具、汽車零件與電子零件等製造領域。
