summary_short: 以車用螺絲、螺帽等扣件的製造與銷售為主要業務。
summary_long: 恆耀國際以車用扣件為核心，主要經營螺絲、螺帽及金屬零組件的製造與銷售。2025年合併營收以外牙扣件為主，占78.49%，內牙扣件占18.83%，其他零組件占2.68%。集團產品涵蓋輕量化鋁螺栓與超高強度鋼扣件，公司亦開發車用電子微型扣件，並已通過測試及陸續量產。官網另揭露開發電動車用新一代扣件。主要子公司包括BOLTUN BVI、恆德投資及越南BOLTUN INTERNATIONAL，德國ESKA則透過恆德投資體系間接控制，從事汽車扣件製造與銷售。
