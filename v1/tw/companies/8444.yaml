summary_short: 透過集團子公司製造及銷售塑合板、橡膠實木板材與飾面板。
summary_long: 綠河-KY以集團子公司製造及銷售塑合板、橡膠實木板材為主要業務。2025年塑合板占營收92.01%，實木板材占7.94%，膠合劑占0.05%。產品另包括三聚氰胺飾面板，貼面種類涵蓋木紋、麻面及珍珠面。集團透過泰國的GP、GPT及GRW經營板材製造，其中GP兼營塑合板及三聚氰胺板；薩摩亞子公司HM負責投資及資金調度，並透過其持有85%股權的TDICS經營膠合劑業務。
