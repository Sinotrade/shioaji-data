summary_short: 設計製造液晶顯示模組、專業影音設備，並提供警用設備及醫療器材代工。
summary_long: 微端科技提供液晶顯示模組設計製造，產品包含字型、圖形與TFT模組，應用於工業控制、通訊及醫療設備。數位音效產品包括音效測試機、多音軌混音器、喇叭擴大機與效果處理器，另提供專業影音產品設計組裝服務。公司也將軍警保全用隨身攝影機列為產品，並提供血液加溫器產品代工服務。在智慧製造相關服務方面，公司協助生產設備結合智慧機上盒，提供生產資料開發及收集服務，支援舊有設備的製造資訊可視化。
