summary_short: 研發製造連接器、連接線組與金屬沖壓件，應用於伺服器、車用及電子設備。
summary_long: 宏致主要經營連接器、連接線組及金屬沖壓件。2025年連接器占營收61.62%，連接線組占16.88%，金屬沖壓件占16.07%，其他營業收入占5.43%。MCIO系列提供高密度、低高度的高速連接方案，可用於伺服器與網通設備。公司開發GB200至GB300架構所需的高速連接器，也提供電動車充電器、充電器插座及高電壓連接器。集團的MEC龍翰事業群製造高速傳輸線材、模組與車用線束，KYN廣迎新事業群製造金屬結構件。
