summary_short: 以連接器為主要收入，另製造連接線組、金屬沖壓件及高速互連產品。
summary_long: 宏致研發、製造及銷售連接器、連接線組與金屬沖壓件，產品應用涵蓋筆電與電腦周邊、消費電子、汽車電子、雲端伺服器、網通及工業設備。2025年連接器占營收61.62%，連接線組占16.88%，金屬沖壓件占16.07%。高速產品包括MCIO連接器，公司亦布局AI伺服器機櫃用連接線。2026年具名報導指出，亞馬遜AWS與Meta為雲端服務客戶，並向Bloom Energy供應電廠系統高功率線束。集團子公司包括Genesis兩家公司及龍翰科技；近年另有珠海廠工程、廣迎新股權買回及南通大地部分持股處分。
