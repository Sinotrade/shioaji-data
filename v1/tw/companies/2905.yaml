summary_short: 透過子公司經營民生零售、餐飲、資訊服務與製藥的投資控股公司。
summary_long: 三商投控以一般投資業為本業，透過三商家購、三商餐飲、三商電腦及旭富製藥等子公司，經營民生用品零售、連鎖餐飲、金融自動化與系統整合、原料藥等業務。2025年壽險部門收入占77.86%，民生用品與餐飲零售占16.44%，此為股權轉換前資料。公司以三商美邦人壽全部持股參與玉山金控股份轉換，併購於2026年9月1日完成。旗下三商家購亦於2026年3月完成收購來來超商，現名富達零售。
