summary_short: 經營證券承銷、股務代理、經紀、自營及企業財務顧問服務。
summary_long: 福邦證券以證券承銷、股務代理、經紀及自營等業務取得收入。承銷服務涵蓋公開發行、興櫃與上市櫃輔導，並提供企業併購、籌資及股權價值評估等財務顧問服務。股務代理處理股東資料、股票過戶、股東會及股利發放等作業。2025年合併收益中，承銷業務占28%、股務代理占16%、經紀手續費占10%。旗下全資子公司包括福邦證券投資顧問、福邦創業投資管理顧問及福邦創業投資，分別經營證券投顧、投資管理顧問及一般投資業務。
