summary_short: 以住宅及商業大樓開發租售為主，並透過子公司經營營造、飯店與顧問服務。
summary_long: 國泰建設主要從事住宅及商業大樓開發、出售與出租。2025年房地銷售占合併營收54.72%，工程合約及勞務提供分別占20.13%與21.26%，另有租賃及其他營業收入。公司參與都市更新，並與台灣三井不動產合作推動南港玉成段公辦都更。三井工程為其子公司及營造供應商，2025年占母公司進貨淨額60.50%；國泰商旅、國泰飯店管理顧問事業及國泰健康管理顧問亦為旗下子公司。2025年投資向陽置業取得49%股權，2026年另公告購入新北市泰山區營建用地。
