summary_short: 以DC直流馬達吊扇設計製造與銷售為主，另有無人機動力模組及子公司機械手臂業務。
summary_long: 昶瑞機電以DC直流馬達吊扇的設計、研發、製造與銷售為主要業務，可設計製造30至120吋、室內及戶外使用的吊扇。2025年度DC吊扇占營收93.47%，其他產品占6.53%，包括吊扇馬達、無人機動力模組、電控、燈具及相關零配件。公司另提供無人機馬達與電子調速器，屬無人機動力零組件業務。旗下全資子公司昶制科技從事機械手臂相關設備整合規劃，開發RAE手臂編輯應用系統，結合機械手臂控制與3D視覺技術，提供跨品牌的手臂整合平台。
