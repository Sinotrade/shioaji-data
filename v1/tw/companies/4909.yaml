summary_short: 製造與銷售高頻微波通訊及一般資訊用印刷電路板。
summary_long: 新復興以高頻微波通訊及一般資訊用印刷電路板的製造與銷售為主。2025年高頻微波通訊基板占營收90.655%，一般資訊產品電路板占9.004%，加工收入占0.341%。產品應用涵蓋5G、衛星發送器、衛星降頻器、基地台天線及車用射頻雷達；官網另列高效能散熱、特殊複合材料與特殊車用基板。公司年報說明低軌衛星相關產品與5G射頻高密度互連技術開發，並列有喬虹投資、DYNALOGIC LIMITED及NEE International LLC(Phoenix)三家全資子公司。
