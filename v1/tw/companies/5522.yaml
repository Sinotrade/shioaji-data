summary_short: 以住宅開發銷售為主，另經營商廠辦開發、出租及售地。
summary_long: 遠雄建設以一般住宅開發、興建與出售為主要收入來源，2025年占營收77.94%；廠辦大樓及其他商業設施占19.89%，另有出租、售地及其他收入。公司全資持有遠雄營造，由其承攬營建工程；2026年上半年向遠雄營造進貨占本公司總進貨56%，另向東源營造採購。信宇投資為最終母公司。近三年公告交易包括向中石化及林商號合板取得高雄土地、出售遠雄商舟房地予新日興，以及與盛竹建設合作開發桃園龜山土地；2026年另公告擬參與遠雄營造現金增資。
