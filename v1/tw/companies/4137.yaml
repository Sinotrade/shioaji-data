summary_short: 研發製造克麗緹娜美容保養品，主要透過美容連鎖加盟通路銷售。
summary_long: 麗豐-KY集團研發、生產並銷售自有品牌「克麗緹娜」護膚美容產品，主要經由美容連鎖加盟通路銷售。2025年臉部護理產品占合併營收89.65%，身體產品占1.90%，醫美及抗衰老服務占2.78%，其餘收入占5.67%。年報列示的重要子公司包括克麗緹娜集團有限公司、克麗緹娜國際有限公司、克麗緹娜行銷有限公司、克麗緹娜（中國）貿易有限公司與微碩（上海）日用品有限公司。
