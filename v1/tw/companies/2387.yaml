summary_short: 主要製造與銷售筆電鍵盤，另供應桌機鍵鼠、平板鍵盤及觸控輸入裝置。
summary_long: 精元主要製造與銷售筆記型電腦鍵盤，2025年筆電鍵盤占總營收73%，其他產品占27%。產品線另有桌上型鍵盤與滑鼠、平板專用皮套鍵盤；年報亦列示筆記型電腦觸控板及觸控筆已完成研發與量產。集團重要製造子公司包括精元電腦（江蘇）、常熟精元電腦與精元（重慶）電腦，均屬間接持有。直接持有的Excellent Global及間接持有的Leading Growth、Best Elite為集團投資子公司。
