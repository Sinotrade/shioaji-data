summary_short: 以無塵室、機電與二次配工程等廠務系統整合為主要收入來源。
summary_long: 漢唐集成提供高科技廠房的無塵室、空調、電力、監控與二次配工程整合，並提供維護服務。2025年度系統整合占營收99.54%，維護服務占0.04%，勞務業務與產品銷售占0.42%；年報表示近五年半導體相關業務占營收九成以上。具名工程客戶包括台積電、台灣美光及VSMC；聯發科線索則為江西子公司在2015年承攬聯發科合肥子公司的辦公大樓工程。海外主要子公司包括美國與新加坡漢唐。2026年美國子公司董事會通過擬以約4,100萬美元取得亞利桑那州土地，作為未來廠房及倉儲用地。
