summary_short: 以細胞製備、儲存服務及合併集團保健產品銷售取得營收。
summary_long: 長聖提供醫療機構細胞產品委託製造服務，並開發細胞治療新藥。2025年合併營收中，儲存業務占41.69%、細胞製備占34.18%、保健產品占24.01%、基因檢測占0.12%。研發產品包括治療實體腫瘤的CAR001、多形性膠質母細胞瘤的ADCV01，以及急性心肌梗塞的UMSC01；CAR001於2026年7月公告啟動第二期a臨床試驗。中國醫藥大學附設醫院為具名客戶，2025年占長聖個體銷貨收入71.03%。公司直接持有聖陽生醫國際，並透過聖陽持有學鼎生技；2026年另以股份轉換取得聖展生技全部股權。
