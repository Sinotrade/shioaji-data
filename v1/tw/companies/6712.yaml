summary_short: 以細胞製備、儲存及保健產品取得收入，並研發細胞治療產品。
summary_long: 長聖以細胞製備與儲存等再生醫療相關業務取得收入。2025年合併營收中，儲存業務占41.69%、細胞製備占34.18%、保健產品占24.01%、基因檢測占0.12%。官網列示的技術產品包括CAR001、EXO-001活體內CAR-T、UMSC01臍帶間質幹細胞、DCV樹突細胞疫苗與GDT免疫細胞。2026年6月底，直接持有聖陽生醫、聖展生技及長博生物科技全部股權，並透過聖陽間接持有學鼎生技全部股權。
