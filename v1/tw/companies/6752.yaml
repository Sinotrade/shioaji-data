summary_short: 以企業軟體、雲端訂閱、系統開發維護及資安服務取得收入。
summary_long: 叡揚提供企業資訊軟體，涵蓋人力資源、公文管理及知識協作。Vital 雲端服務家族採 SaaS 模式，提供客戶關係管理與智慧表單等企業應用；C.ai 提供企業 AI 對話與代理人平台，另有 NLP、AI 與機器學習研發。Vital NetZero 零碳雲提供碳盤查與能源管理工具，資安業務則提供檢測、防禦及培訓服務。2026 年上半年穩定收入占68.5%，包含期間授權、維護及委外服務；專業服務與產品銷貨分別占26.9%及4.6%。
