summary_short: 研發製造車用冷卻風扇、鼓風機總成及直流馬達。
summary_long: 謚源主要研發與製造車用冷卻風扇、鼓風機，以及直流有刷與無刷馬達，業務屬汽車零組件製造。冷卻風扇與鼓風機產品提供適用不同車廠與車型的總成，並包含電子控制無刷及有刷馬達款式。有刷馬達用於汽車散熱風扇與鼓風機，無刷馬達則採三相電路驅動模組，提供多種功率及客製化設計製造服務。公司於2025年法說會展示純電車用散熱風扇與鼓風機研發成果，涵蓋車輛散熱與送風應用。
