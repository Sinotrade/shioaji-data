summary_short: 提供工業主機板、嵌入式電腦、邊緣AI系統及網路通訊設備。
summary_long: 廣積主要提供工業電腦主機板、嵌入式系統、觸控電腦、數位看板及網路通訊產品。2026年上半年應用別銷售組成，網路通訊占51.62%、工業自動化28.11%、智慧零售15.78%，另有智慧交通、醫療及AIoT。邊緣AI產品包括EC3100電腦及ES1002伺服器，前者適用於機器人應用；INA8505則用於5G Open vRAN與MEC。2025年第三季合併財報列有廣錠、速博康、威視、IBASE INC.及IBASE JAPAN等子公司。
