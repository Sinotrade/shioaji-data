summary_short: 以植物保護劑為主要收入來源，另生產HUITEX地工膜與地工格穴。
summary_long: 惠光主要經營農業科學與環境科技兩大事業群，以植物保護劑及地工合成材料為產品主軸。依2025年合併財報收入計算，農業科學約占76.36%，環境科技約占23.64%，主要收入來自農業科學。植物保護產品包括殺蟲劑、殺菌劑與除草劑，提供作物病蟲害及雜草防治用途。環境科技以HUITEX品牌提供聚乙烯地工膜與地工格穴，應用於垃圾掩埋場防滲、土壤穩定、侵蝕控制及邊坡防護等工程。
