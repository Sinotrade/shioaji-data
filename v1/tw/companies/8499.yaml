summary_short: 透過子公司研發、生產及銷售電子材料與電子衡器。
summary_long: 鼎炫-KY透過子公司經營電子材料與電子衡器，2025年營收占比分別為75.47%與24.53%。材料事業由隆揚電子等公司執行，產品包括電磁遮蔽與導熱材料、導電膠帶及鐵氧體，應用涵蓋消費電子與新能源車電子。隆揚旗下聚赫新材開發高頻低損耗銅箔，面向AI伺服器等用途，年報仍載有客戶驗證及量產條件。衡器事業由台衡等公司經營，提供電子衡器及智慧秤重系統，應用於商業、工業、實驗室與醫療保健領域。
