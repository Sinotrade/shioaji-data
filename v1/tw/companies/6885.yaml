summary_short: 營收來自新藥開發相關服務及子公司基因檢測服務。
summary_long: 全福生技的業務涵蓋新藥轉譯開發服務，以及子公司康百事的基因定序檢測技術服務。2026年上半年合併收入中，康百事及其子公司占約65.64%，全福部門占約34.36%。全福的主要研發產品包括乾眼症候選藥BRM421、神經營養性角膜炎候選藥BRM424、青光眼候選藥BRM411、濕式黃斑部病變眼滴劑BRM412，以及退化性關節炎候選藥BRM521。全福對康百事具有實質控制能力，將其納入合併財務報告。
