summary_short: 製造銷售捕撈漁網、養殖箱網、運動用網、線材及繩索。
summary_long: 金洲主要製造及銷售漁網、線材與繩索，捕撈產品包括大型鮪魚圍網、三層網、定置網及拖網，另提供養殖箱網與客製化組合規格。陸地應用有高爾夫球練習網等運動用網，線材及繩索產品包括尼隆單絲線與尼隆三股繩。2024年營收以網類占73%為主，線占9%、繩占4%、原絲買賣占8%、其他占6%。集團生產子公司包括越南金洲海洋科技責任有限公司，以及間接持有的印尼金大有限公司。
