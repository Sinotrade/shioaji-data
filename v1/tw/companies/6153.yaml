summary_short: 以軟性電路板的設計、開發、製造、加工及銷售為主要業務。
summary_long: 嘉聯益以軟性電路板的設計、開發、製造、加工及銷售為主要業務，產品應用於智慧型手機、筆記型電腦及顯示器。技術包括MPI軟板、LCP軟板與氟素基板，涵蓋中高頻寬、毫米波及高速傳輸應用，另具備高密度細線路能力。公司亦揭露CPO多層封裝軟板方案與機器人感測模組用軟板的研發，兩項題材均以開發階段描述。集團透過新加坡子公司及Conduct Investments分別持有昆山、蘇州營運公司，兩者均納入合併財務報告。
