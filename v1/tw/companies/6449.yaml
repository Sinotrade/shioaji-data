summary_short: 主要製造與銷售捲繞型、晶片型導電高分子固態電容。
summary_long: 鈺邦主要產品為捲繞型及晶片型導電高分子固態電容，2024年營收占比分別為70.01%與29.99%，以捲繞型為最大來源。官網另列貼片型固液混合電容，具低漏電流、低阻抗、耐高紋波與長壽命等特性。公司在2025年營業計畫中列出V-Chip、CAP及Hybrid導入AI伺服器的方向，並將電動車應用的高信賴性電容列入研發項目。2024年報列示的子公司包括鈺邦電子（無錫）、鈺邦電子（湖北）與旭積科技。
