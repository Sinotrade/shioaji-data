summary_short: 主要製造銷售LED光源條、背光與LCD模組，另提供車用主板、AI系統服務及建材。
summary_long: 臺龍以顯示器零部件為主要業務，產品包括LED光源條、背光與LCD模組，並提供全貼合加工。光源條應用涵蓋消費電子、工控、醫療及車載等領域，顯示模組則涵蓋車用與工控顯示。公司亦供應汽車開關、車門鎖及充電指示相關主板，並引進販售ASA科技塑鋼浪板與屋瓦。另提供AI虛擬客服、數字人互動應用及專業智慧助理等系統服務。主要製造子公司包括台龍電子(昆山)有限公司及東莞華龍電子有限公司，分別從事光源組與背光模組等產品產銷。
