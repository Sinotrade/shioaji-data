summary_short: 經營短期票券承銷、交易與保證，以及債券自營與投資。
summary_long: 華票以短期票券及債券金融業務為核心，提供短期票券簽證、承銷、經紀、自營與保證背書服務。債券業務涵蓋金融債券簽證承銷及交易，以及政府債券、公司債自營，另經營外幣債券自營與投資及股權相關商品投資。2025年度收入組成以票券業務77.44%為主，債券業務24.16%、股權投資8.43%，其他項目為負10.03%。年報將王道商業銀行列為控制公司，揭露持股28.36%，控制原因為直接或間接控制華票人事及業務經營。
