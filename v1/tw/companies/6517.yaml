summary_short: 以光學鏡頭、鏡片的設計製造及客製化代工賺取收入。
summary_long: 保勝光學以光學鏡頭與鏡片的設計、製造及OEM／ODM服務為業，鏡頭應用涵蓋高階投影機、數位家庭劇院、瞄準鏡、賞鳥鏡、半導體與AOI設備。2024年度營收中，光學鏡頭占60.10%、光學鏡片占35.37%，其他產品占4.53%，以鏡頭為主要收入來源。公司於2024年開發半導體光學元件、高倍率自動化光學檢測鏡頭及低軌衛星鏡頭，具低軌衛星光學零組件題材。依2024年底年報資料，公司持有保得士光學股份有限公司全部股權。
