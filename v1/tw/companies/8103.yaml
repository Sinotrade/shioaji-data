summary_short: 以連接器、軟性排線與線纜組件製造銷售為核心。
summary_long: 瀚荃以連接器、FFC軟性排線與線纜組件製造銷售為核心，線纜組件供電子設備傳輸訊號或電源。2024年度連接器占營收67.75%，線纜組件占27.92%，電子配件占3.22%。連接器產品包含連接液晶顯示器與驅動電路的FPC系列，亦推出CPFx儲能與電動車連接器。集團官網另列藍牙、Wi-Fi與NFC無線模組。子公司瀚雲科技提供物聯網及軟硬體系統整合服務；瀚荃另於2024年增設越南子公司。
