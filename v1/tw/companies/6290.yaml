summary_short: 製造電源傳輸線組、訊號線與充電零組件，電源線組為主要營收來源。
summary_long: 良維科技以電源傳輸線組、訊號線組、充電器轉接頭及線材的製造銷售為主要業務。2025年各類電源傳輸線組占營收91%，訊號傳輸線組6%，充電器轉接頭與一體式充電器2%，電源、訊號傳輸及車用線材1%。產品應用涵蓋家電、電腦周邊、資料中心與電動車充電，提供雲端伺服器用Hi-Amp大電流電源線、車用充電線及充電槍。訊號線產品包含USB 3.0、USB 3.1 Type C與資訊通訊用連接線。
