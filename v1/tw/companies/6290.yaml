summary_short: 主要製造電源傳輸線組，並供應資料中心大電流線材與電動車充電線。
summary_long: 良維主要製造電源與訊號傳輸線組，2025年各類電源傳輸線組占營收91%，訊號傳輸線組占6%，充電器轉接頭與一體式充電器占2%，其餘電源、訊號傳輸及車用線材占1%。產品應用涵蓋資料中心與AI伺服器、消費性電子，以及電動車與充電站。具名客戶包括亞馬遜、蘋果、聯想、戴爾、HPE與IBM，供應產品包含大電流線材及消費性電子電源線。公司透過泰國與印度子公司布局海外製造，並於2026年5月決議對泰國子公司現金增資6億泰銖。
