summary_short: 以房產資料與3D建模資訊服務、辨識軟硬體及雲端電子簽名為主要業務。
summary_long: 蒙恬主要提供智慧型人機介面產品與資訊服務，最大營收來源為 Asteroom 房產資訊服務。Asteroom, Inc. 為其子公司，業務涵蓋美國房產資料蒐集、3D 建模、2D 平面圖及物件狀況報告。其他產品包括蒙恬筆手寫輸入、名片王名片管理與掃譯筆；AI 掃譯產品結合雲端應用提供閱讀輔助、字彙練習與閱讀理解功能。BreezySign 好好簽則將電子簽名技術延伸為雲端服務，提供企業商業文件的線上簽署流程。
