summary_short: 研發製造紅外線測溫儀、醫療體溫計及氣體監測儀，以精密溫度儀為主要營收來源。
summary_long: 熱映光電以紅外線量測技術為核心，研發及製造非接觸式紅外線測溫儀、醫療用耳溫槍與額溫槍，以及二氧化碳偵測儀。2025年合併營收以紅外線精密溫度儀為主，占60.96%；體溫量測產品占21.70%，紅外線精密氣體監測儀占17.34%。產品業務涵蓋精密溫度量測、人體體溫量測與氣體濃度監測。依2025年底合併財報，公司直接持有熱映（模里西斯）公司全部股權，並透過該公司持有昆山熱映公司全部股權。
