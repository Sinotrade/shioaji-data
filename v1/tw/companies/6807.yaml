summary_short: 以沙發為主要產品，從事室內家具研發、製造與銷售。
summary_long: 峰源-KY主要從事室內家具的研發、製造及銷售，產品包括沙發（含電動系列）、沙發床、休閒椅、床，以及腳蹬與椅類。2025年度年報將營收列為室內家具單一項目，收入為新臺幣42.63406億元，未分別列出各類家具的營收占比。集團直接投資子公司為Green Enterprises Limited，另有多家間接投資子公司，包括恩龍實業（嘉興）有限公司、嘉興恩捷實業有限公司、浙江華勝鋼塑製品有限公司及泰國恩泰公司。依家具研發與製造業務，歸類於家具與居家用品，產業位置判定為中游。
