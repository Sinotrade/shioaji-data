summary_short: 以電子遊戲軟硬體及相關勞務服務為主，另提供智慧排隊系統。
summary_long: 泰偉以電子遊戲軟硬體及相關服務為主要業務。2025年前三季合併營收以勞務收入為主，占92%，銷貨收入占8%，另有其他營業收入。官網列示產品包括老虎機、電子棋牌與魚機等電子遊戲、以彩球模擬開牌的商用浮球機，以及具中央控制與監控功能的遊戲管理系統。公司另提供「叫叫我」智慧排隊系統，使用者可掃描QR Code加入LINE官方帳號接收叫號通知。截至2025年9月底，直接子公司包括香港娛樂科技有限公司及泰偉開發顧問股份有限公司。
