summary_short: 以一貫煉鋼及軋延製造、銷售鋼板、棒線、鋼捲與電磁鋼。
summary_long: 中鋼採高爐煉鐵、轉爐煉鋼及軋延製程，主要銷售鋼板、棒線、熱軋、冷軋與塗鍍鋼品，亦生產馬達用電磁鋼。2025年合併營收中，商品銷貨占87.95%，工程、勞務及其他收入占12.05%，鋼鐵產品營收逾七成。原料契約揭露Vale S.A.及BHP Billiton Marketing AG供應鐵礦；具名鋼材客戶包括國瑞汽車、中鋼構與長榮鋼。中龍、中鋼運通及中鋼鋁業為全資子公司，中鋼構亦納入合併範圍。公司已開發並供應電動車馬達用極薄板電磁鋼，2025至2026年另公告設備取得、股權收購及合資事項。
