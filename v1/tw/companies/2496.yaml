summary_short: 以國小至高中補習課程、師資與課程管理及數位教學服務取得收入。
summary_long: 卓越成功主要提供補習師資、課程管理及國小至高中補習教育服務，2025年教育服務占營收100.00%，為年報四捨五入後的揭露值。課程涵蓋高中全科與升學複習、國中全科及國小STEM科學數學，另提供高中數學、高職數學與大學微積分影音課程及線上解題。集團直接子公司包括陳立教育事業、易禾事業、陳立小學堂及禮仁教育，並透過陳立教育持有經營線上教育平台的卓越全球。
